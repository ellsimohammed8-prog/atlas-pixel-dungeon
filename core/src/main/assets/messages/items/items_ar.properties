items.wands.wand.ac_zap=اصعق
items.wands.wand.fizzles=عصاك تخفت؛ لا بد أنها لا تملك شحنة كافية.
items.wands.wand.no_magic=عصاك تخفت؛ لا تستطيع استعمال العصي بينما أنت محصن سحريا.
items.wands.wand.self_target=لا تستطيع استهداف نفسك!
items.wands.wand.identify=أنت الآن مألوف بما يكفي مع عصاك لتعريفها.
items.wands.wand.resin_one=هذه العصا كسبت _مستوى واحدا_ من الراتنج الغامض.
items.wands.wand.resin_many=هذه العصا كسبت _%d مستويات_ من الراتنج الغامض.
items.wands.wand.cursed=هذه العصا ملعونة، تجعل سحرها فوضويا وعشوائيا.
items.wands.wand.not_cursed=هذه العصا خالية من السحر الخبيث.
