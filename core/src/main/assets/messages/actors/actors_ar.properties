actors.blobs.corrosivegas.name=غاز آكل
actors.blobs.corrosivegas.desc=سحابة من غاز كاوٍ قاتل تدور هنا.
actors.blobs.waterofawareness.name=ماء الوعي
actors.blobs.waterofawareness.procced=بينما تأخذ رشفة، تشعر بالمعرفة تفيض إلى عقلك.
actors.blobs.waterofawareness.desc=قوة المعرفة تشع من ماء هذه البئر. الشرب من البئر سيعرف بالكامل كل الأغراض المجهزة، ويعرف اللعنات على كل الأغراض في مخزونك، ويكشف كل الأغراض في الطابق الحالي.
actors.blobs.waterofhealth.name=ماء الصحة
actors.blobs.waterofhealth.procced=بينما تأخذ رشفة، تشعر بجراحك تلتئم بالكامل.
actors.blobs.waterofhealth.desc=قوة الصحة تشع من ماء هذه البئر. الشرب من هذه البئر سيشفي جراحك، ويشبع الجوع، ويطهر اللعنات على أي أغراض ملبوسة.
actors.blobs.web.name=شبكة عنكبوت
actors.blobs.web.desc=شبكة كثيفة تغطي كل شيء هنا. أي شيء يلمس الشبكة أو يُرمى عبرها سيكسرها، لكنه سيعلق في مكانه أيضا.
actors.buffs.adrenaline.name=أدرينالين
actors.buffs.adrenaline.desc=دفعة من القوة الجسدية، الأدرينالين يعزز سرعة الهجوم والحركة معا.\n\nالأدرينالين يتيح لهدفه الركض بسرعة ×2، والهجوم بسرعة ×1.5.\n\nالأدوار المتبقية: %s.
actors.buffs.adrenalinesurge.name=تعزيز القوة
actors.buffs.adrenalinesurge.desc=دفعة من جبروت عظيم، لكنها للأسف غير دائمة.\n\nتعزيز القوة: +%d.\nالأدوار حتى يضعف التعزيز: %s.
actors.buffs.amok.name=هيجان
actors.buffs.amok.desc=الهيجان يسبب حالة من الغضب والارتباك العظيمين في هدفه.\n\nعندما يكون مخلوق مهتاجا، سيهاجم أي شيء قريب منه، سواء كان صديقا أو عدوا.\n\nأدوار الهيجان المتبقية: %s.
actors.buffs.arcanearmor.name=درع غامض
actors.buffs.arcanearmor.desc=درع رقيق يحيط بك، يصد بعض الضرر من الهجمات السحرية.\n\nدرعك السحري معزز حاليا بمقدار: 0-%d.\n\nالأدوار حتى يضعف الدرع الغامض: %s.
actors.buffs.artifactrecharge.name=إعادة شحن الأثر
actors.buffs.artifactrecharge.desc=الطاقة تسري فيك، تزيد معدل شحن آثارك المجهزة.\n\nكل أثر يتأثر بشكل مختلف قليلا، لكنها كلها ستكسب الشحن أسرع بكثير من المعتاد.\n\nالأدوار المتبقية: %s.
actors.buffs.ascensionchallenge.name=لعنة التاج
actors.buffs.ascensionchallenge.desc=بطريقة ما يحافظ الظلام المختوم على نفوذ في هذا العالم عبر التاج، ويحاول إيقاف صعودك!\n\nقوة الظلام تجعل السراديب أخطر بكثير، تزيد عدد الأعداء وتجعلهم أقوى! هذه القوة ستستمر في التزايد إن تُركت دون رقابة، يمكن إضعافها بهزيمة الأعداء الذين عززتهم قوة الظلام.
actors.buffs.ascensionchallenge.desc_clear=الطاقة المظلمة المشعة من التاج أُضعفت قدر الإمكان في الوقت الحالي.
actors.buffs.ascensionchallenge.desc_beckon=التاج _ينادي حاليا أعداء بعيدين،_ ينبههم إلى موقعك.
actors.buffs.ascensionchallenge.desc_haste=التاج _يسرّع حاليا أعداء بعيدين،_ يتيح لهم الوصول إليك أسرع!
actors.buffs.ascensionchallenge.desc_slow=التاج _يبطل بك حاليا،_ ويلغي آثار تعزيز السرعة!
actors.buffs.ascensionchallenge.desc_damage=طاقة التاج أصبحت قوية جدا بحيث _تضرك مباشرة!_
actors.buffs.ascensionchallenge.beckon=التاج يبدأ مناداة أعداء بعيدين.
actors.buffs.ascensionchallenge.haste=التاج يبدأ تسريع أعداء بعيدين!
actors.buffs.ascensionchallenge.slow=التاج يبدأ بالإحساس كوزن رصاص في مخزونك!
actors.buffs.ascensionchallenge.damage=التاج يبدأ إشعاع طاقة مظلمة. إنه يحرق!
actors.buffs.ascensionchallenge.weaken_info=يمكن إضعاف لعنة التاج بهزيمة أعداء أكثر.
actors.buffs.ascensionchallenge.weaken_info_no_kills=إن هزمت أعداء ستضعف لعنة التاج!
actors.buffs.ascensionchallenge.weaken=تشعر بلعنة التاج تضعف قليلا.
actors.buffs.ascensionchallenge.break=تأخذ لحظة لالتقاط أنفاسك وتشعر بجراحك تبدأ بالانغلاق!
actors.buffs.ascensionchallenge.almost=تشعر بقبضة الظلام على التاج تبدأ بالضعف، أنت على وشك الوصول!
actors.buffs.ascensionchallenge.on_kill=الطاقة المظلمة تستهلكك...
actors.buffs.barkskin.name=جلد اللحاء
actors.buffs.barkskin.desc=جلدك مقسّى، يبدو خشنًا وصلبا كاللحاء.\n\nالجلد المقسّى يزيد درعك الفعلي، ما يتيح لك الدفاع بشكل أفضل ضد الهجمات الجسدية.\n\nدرعك متزايد حاليا بمقدار: 0-%d.\nالأدوار حتى يضعف جلد اللحاء: %s.\n\nإن تلقيت جلد اللحاء من مصادر متعددة، سيتطبق الأقوى فقط.
actors.buffs.barrier.name=حاجز
actors.buffs.barrier.desc=فقاعة قوة متينة تصد كل الضرر.\n\nالحاجز سيتلقى الضرر نيابة عما يحميه طالما تبقى دروع. الدروع ستتناقص ببطء مع الوقت أيضا.\n\nالدروع المتبقية: %d.
actors.buffs.berserk.angered=مغضب
actors.buffs.berserk.berserk=هيجان محموم
actors.buffs.berserk.exhausted=منهك
actors.buffs.berserk.recovering=يتعافى
actors.buffs.berserk.angered_desc=حدة إصابات غضب الجبل تعزز ضرباته. بينما يتلقى المحموم ضررا جسديا، سيتراكم غضبه، ما يمنحه ضررا إضافيا. الضرر الذي يصده الدرع يحتسب أيضا في بناء الغضب.\n\nالغضب سيتلاشى مع الوقت. كلما انخفضت صحة المحموم، طالت مدته.\n\nعند غضب 100%%، يستطيع غضب الجبل الدخول في الهيجان المحموم، ما يمنحه دروعا بناء على مستوى درعه وصحته المفقودة. أثناء الهيجان، تتناقص دروعه مع الوقت وحين تنفد سيحتاج الراحة قبل بناء الغضب من جديد.\n\nالغضب الحالي: _%1$.0f%%_\nضرر _+%2$.0f%%_\n\nدرع الهيجان عند الدرع والصحة الحالية: _%3$d_
actors.buffs.berserk.berserk_desc=الخوف وعدم اليقين يتلاشيان، تاركين الغضب فقط. في هذه الحالة غضب الجبل قوي للغاية، _يسبب ضررا +50%% ويكسب دروعا إضافية،_ لكنه يخسر دروعا كل دور أيضا.\n\nعندما تُخفَّض كل دروعه إلى 0، سينتهي الهيجان المحموم.\n\nبعد الهيجان، سيحتاج غضب الجبل التعافي قبل أن يستطيع بناء الغضب من جديد.\n\nالدروع المتبقية: %d
actors.buffs.berserk.recovering_desc=القوة الداخلية لها حدودها. يجب على غضب الجبل الراحة قبل استعمال غضبه من جديد.\n\nأثناء التعافي لا يبني غضب الجبل أي غضب من تلقي الضرر.
actors.buffs.berserk.recovering_desc_turns=الأدوار حتى التعافي: _%d_
actors.buffs.berserk.recovering_desc_levels=المستويات حتى التعافي: _%.2f_
actors.buffs.berserk.rankings_desc=هاج حتى الموت
actors.buffs.berserk.action_name=اهجُم بجنون
actors.buffs.berserk.no_seal=تحتاج ختمك المكسور لتهيج بجنون!
actors.buffs.bleeding.name=نزيف
actors.buffs.bleeding.ondeath=نزفت حتى الموت...
actors.buffs.bleeding.heromsg=أنت تنزف!
actors.buffs.bleeding.rankings_desc=نزف حتى الموت
actors.buffs.bleeding.desc=ذلك الجرح يسرب كمية مقلقة من الدم.\n\nالنزيف يسبب ضررا كل دور. كل دور ينقص الضرر بمقدار عشوائي، حتى يتوقف النزيف أخيرا.\n\nضرر النزيف الحالي: %d.
actors.buffs.bless.name=مبارك
actors.buffs.bless.desc=دفعة تركيز عظيمة، يقول البعض إنها مستوحاة من السماء.\n\nالبركة تزيد الدقة والمراوغة بنسبة 25%%، ما يجعل المبارك أكثر فعالية في القتال.\n\nأدوار البركة المتبقية: %s.
actors.buffs.blindness.name=معمى
actors.buffs.blindness.heromsg=أنت معمّى!
actors.buffs.blindness.desc=الإعماء يحول العالم المحيط إلى ضباب مظلم.\n\nبينما هو معمى، مدى رؤية الشخصية ينخفض إلى مربع واحد، ما يجعل الهجمات بعيدة المدى عديمة الفائدة ويسهّل جدا فقدان أثر الأعداء البعيدين. بالإضافة إلى ذلك، البطل المعمى غير قادر على قراءة المخطوطات أو الكتب.\n\nأدوار العمى المتبقية: %s.
actors.buffs.buff.heromsg=
actors.buffs.burning.name=احتراق
actors.buffs.burning.heromsg=تشتعل بالنار!
actors.buffs.burning.burnsup=%s يحترق بالكامل!
actors.buffs.burning.ondeath=احترقت حتى الموت...
actors.buffs.burning.rankings_desc=احترق حتى الرماد
actors.buffs.burning.desc=قليل من الأشياء أكثر إزعاجا من أن تلتهمك النيران.\n\nالنار ستسبب ضررا كل دور حتى تُطفأ بالماء أو تنتهي. يمكن إطفاء النار بالخطو في الماء، أو من رشاش جرعة منفجرة.\n\nبالإضافة إلى ذلك، قد تشعل النار التضاريس أو الأغراض القابلة للاشتعال التي تلامسها.\n\nأدوار الاحتراق المتبقية: %s.
actors.buffs.chained.name=مكبَّل
actors.buffs.chained.heromsg=تشدّ السلسلة بإحكام — لا تستطيع التحرك!
actors.buffs.chained.desc=سلسلة قذفها سجّان السلاسل قد شبكت بك وثبّتك في مكانك.\n\nالسلسلة تقفل هدفا في مكانه، وتجعل الحركة ومعظم قدرات الحركة مستحيلة. الإجراءات الأخرى غير متأثرة، بما فيها آثار النقل الآني.\n\nأدوار السلسلة المتبقية: %s.

actors.buffs.championenemy.warn=تشعر بوجود قاتل.
actors.buffs.championenemy$blazing.name=بطل ملتهب
actors.buffs.championenemy$blazing.desc=الأبطال الملتهبون يسببون ضرر اشتباك أكثر بنسبة 25%، ويشعلون الأعداء الذين يهاجمونهم، ومحصنون ضد النار، وينشرون النار حولهم عند موتهم. لا يستطيعون نشر النار على الماء رغم ذلك.
actors.buffs.championenemy$projecting.name=بطل ممتد
actors.buffs.championenemy$projecting.desc=الأبطال الممتدون يسببون ضرر اشتباك أكثر بنسبة 25% وعندهم مدى هجوم +3.
actors.buffs.championenemy$antimagic.name=بطل ضد السحر
actors.buffs.championenemy$antimagic.desc=الأبطال ضد السحر يتلقون ضررا أقل بنسبة 50% ومحصنون بالكامل ضد الآثار السحرية.
actors.buffs.championenemy$giant.name=بطل عملاق
actors.buffs.championenemy$giant.desc=الأبطال العمالقة يتلقون ضررا أقل بنسبة 80% وعندهم مدى هجوم +1، لكنهم لا يستطيعون التحرك عبر الأماكن المغلقة.
actors.buffs.championenemy$blessed.name=بطل مبارك
actors.buffs.championenemy$blessed.desc=الأبطال المباركون عندهم دقة ومراوغة ×4.
actors.buffs.championenemy$growing.name=بطل نامٍ
actors.buffs.championenemy$growing.desc=الأبطال النامون يكسبون مكافأة متزايدة باطراد في الدقة والمراوغة والضرر الجسدي، وتخفيضا للضرر المتلقى.\n\nتعزيز الدقة/المراوغة/الضرر الحالي: %1$d%%\nتخفيض الضرر الحالي: %2$d%%
actors.buffs.charm.name=مفتون
actors.buffs.charm.heromsg=أنت مفتون!
actors.buffs.charm.cant_attack=أنت مفتون بذلك العدو ولا تستطيع مهاجمته.
actors.buffs.charm.desc=الفتنة سحر متلاعب يستطيع جعل الأعداء يعشقون بعضهم مؤقتا.\n\nالشخصيات المتأثرة بالفتنة غير قادرة على مهاجمة العدو الذي فتنها مباشرة. مهاجمة أهداف أخرى ما زالت ممكنة رغم ذلك. صدمة الألم ستقلل مدة الفتنة.\n\nأدوار الفتنة المتبقية: %s.
actors.buffs.chill.name=مبرد
actors.buffs.chill.freezes=%s يتجمد!
actors.buffs.chill.desc=ليس مجمدا تماما، لكنه بارد جدا مع ذلك.\n\nالأهداف المبردة تؤدي كل الإجراءات بشكل أبطأ، اعتمادا على عدد الأدوار المتبقية في الأثر. في أسوئه، هذا يعادل الإبطاء.\n\nأدوار التبريد المتبقية: %1$s.\nالسرعة مخفضة بمقدار: %2$s%%
actors.buffs.combo.name=سلسلة
actors.buffs.combo.action_name=هجوم مركب
actors.buffs.combo.combo=سلسلة %d ضربات!
actors.buffs.combo.bad_target=يجب أن تستهدف عدوا في مدى الهجوم.
actors.buffs.combo.prompt=اختر هدفا للهجوم.
actors.buffs.combo.desc=المصارع يبني الزخم بينما يصيب ضربات ناجحة. كل هجوم يزيد عداد السلسلة بواحد، لكن أخذ وقت طويل بين الضربات سيعيد عداد السلسلة إلى 0. بينما عند المصارع سلسلة، أي دروع عنده من ختمه المكسور لن تبدأ بالتلاشي.\n\nبناء السلسلة يفتح هجمات مركبة خاصة لا يمكن أن تخطئ! هجوم مختلف يُفتح عند عدد سلسلة 2 و4 و6 و8 و10. بعض الحركات تعيد تعيين السلسلة وبعضها لا، لكن كل حركة يمكن استعمالها مرة واحدة فقط في كل جلسة سلسلة.\n\nالسلسلة الحالية: %1$d.\n\nالأدوار حتى تضيع السلسلة: %2$s.
actors.buffs.combo$combomove.clobber.name=ضربة ساحقة
actors.buffs.combo$combomove.clobber.desc=يدفع عدوا للخلف مربعين، لكنه لا يسبب ضررا ولا يستطيع الدفع إلى الحفر. يزيد السلسلة بمقدار 1.
actors.buffs.combo$combomove.clobber.empower_desc=يدفع عدوا للخلف _3 مربعات، ويسبب دوارا، ويستطيع الدفع إلى الحفر،_ لكنه لا يسبب ضررا. يزيد السلسلة بمقدار 1.
actors.buffs.combo$combomove.slam.name=ارتطام
actors.buffs.combo$combomove.slam.desc=يسبب %d%% (السلسلة×20%%) من قوة صد ضررك كضرر إضافي. يعيد تعيين السلسلة عند الاستعمال.
actors.buffs.combo$combomove.slam.empower_desc=_يقفز حتى %1$d مربع(ات)_ ويسبب %2$d%% (السلسلة×20%%) من قوة صد ضررك كضرر إضافي. يعيد تعيين السلسلة عند الاستعمال.
actors.buffs.combo$combomove.parry.name=صد
actors.buffs.combo$combomove.parry.desc=يصد الهجوم التالي خلال دور واحد عند التفعيل، ويرد عليه فورا. يعيد تعيين السلسلة إن لم يُصد شيء.
actors.buffs.combo$combomove.parry.empower_desc=يصد _كل الهجمات_ خلال دور واحد عند التفعيل، ويرد عليها فورا. يعيد تعيين السلسلة إن لم يُصد شيء.
actors.buffs.combo$combomove.crush.name=سحق
actors.buffs.combo$combomove.crush.desc=يسبب %d%% (السلسلة×25%%) ضررا للهدف الأساسي، ونصف ذلك الضرر لكل الأعداء الآخرين في مجال 7×7. يعيد تعيين السلسلة عند الاستعمال.
actors.buffs.combo$combomove.crush.empower_desc=_يقفز حتى %1$d مربع(ات)_ ويسبب %2$d%% (السلسلة×25%%) ضررا للهدف الأساسي، ونصف ذلك الضرر لكل الأعداء الآخرين في مجال 7×7. يعيد تعيين السلسلة عند الاستعمال.
actors.buffs.combo$combomove.fury.name=غضب
actors.buffs.combo$combomove.fury.desc=يضرب عدوا مرة لكل سلسلة عندك، كل ضربة تسبب 60% ضررا وتستطيع إطلاق المسحورات. يعيد تعيين السلسلة عند الاستعمال.
actors.buffs.combo$combomove.fury.empower_desc=_يقفز حتى %d مربع(ات)_ ويضرب عدوا مرة لكل سلسلة عندك، كل ضربة تسبب 60%% ضررا وتستطيع إطلاق المسحورات. يعيد تعيين السلسلة عند الاستعمال.
actors.buffs.corruption.name=فاسد
actors.buffs.corruption.desc=الفساد يتسرب إلى جوهر الكائن، يلويه ضد طبيعته السابقة.\n\nالمخلوقات الفاسدة ستهاجم حلفاءها، وتتجاهل أعداءها السابقين. الفساد ضار أيضا، وسيجعل هدفه يخضع ببطء.\n\nالفساد دائم، آثاره تنتهي فقط بالموت.
actors.buffs.cripple.name=مشلول
actors.buffs.cripple.heromsg=أنت مشلول!
actors.buffs.cripple.desc=أنت متأكد تماما أن السيقان لا يجب أن تنحني هكذا.\n\nالشلل ينصف سرعة الحركة، ما يجعل التحرك مربعا يستغرق عادة دورين بدل واحد.\n\nأدوار الشلل المتبقية: %s.
actors.buffs.daze.name=مدوخ
actors.buffs.daze.heromsg=أنت مدوخ!
actors.buffs.daze.desc=طنين الآذان والرؤية الضبابية يجعلان القتال صعبا.\n\nأثناء الدوخة، الدقة والمراوغة مخفضة بنسبة 50%%، ما يجعل إصابة الضربات وتفاديها أصعب بكثير.\n\nأدوار الدوخة المتبقية: %s.
actors.buffs.degrade.name=متدهور
actors.buffs.degrade.heromsg=معداتك تبدو أضعف!
actors.buffs.degrade.desc=سحر مظلم قوي يمتص القوة التي طبقتها مخطوطات الترقية على معداتك!\n\nأثناء التدهور، ستُعامل المعدات المرقّاة كأنها مستوى أدنى مما هي عليه فعليا. _كل ترقية بعد +3 تصبح أضعف بشكل أسي من الأخيرة._ أوصاف أغراضك ستتغير لتعكس مستوى قوتها المنخفض.\n\nالتدهور لا يؤثر في متطلبات القوة، شحنات العصي، متانة الأسلحة المرماة، أو الآثار.\n\nأدوار التدهور المتبقية: %s. استعمال مخطوطة ترقية أو إزالة لعنة سينهي التدهور فورا.
actors.buffs.doom.name=محكوم بالهلاك
actors.buffs.doom.desc=من الصعب الاستمرار عندما يبدو أن الكون يريدك ميتا.\n\nالشخصيات المحكوم عليها بالهلاك ستتلقى ضررا +67% من كل المصادر.\n\nالهلاك دائم، آثاره تنتهي فقط بالموت.
actors.buffs.dread.name=رعب
actors.buffs.dread.desc=رعب عظيم جدا سيجعل هدفه يهرب من السراديب بالكامل!\n\nالمخلوقات المتأثرة بالرعب ستهرب من خصمها بسرعة عالية، وستختفي من السراديب بالكامل بمجرد خروجها عن الأنظار. الأعداء المهزومون بهذه الطريقة يمنحون نصف الخبرة ولا يسقطون أغراضا. صدمة الألم ستقلل مدة الرعب.\n\nأدوار الرعب المتبقية: %d.
actors.buffs.drowsy.name=نعسان
actors.buffs.drowsy.desc=قوة سحرية تجعل البقاء مستيقظا صعبا، بعد بضعة أدوار، سيسقط الهدف في نوم سحري عميق.\n\nالبطل يستطيع مقاومة النعاس بتلقي الضرر أو بكونه بصحة كاملة.\n\nالأدوار حتى النوم: %s.
actors.buffs.earthimbue.name=مشبع بالأرض
actors.buffs.earthimbue.desc=أنت مشبع بقوة الأرض!\n\nكل الهجمات الجسدية ستزيح الأرض تحت العدو، فتشلهم لفترة قصيرة.\n\nأدوار إشباع الأرض المتبقية: %s.
actors.buffs.enhancedrings.name=خواتم محسّنة
actors.buffs.enhancedrings.desc=أثر ظل الكثبان المستعمل مؤخرا يعزز خواتمه، فيمنحها مستوى +1.\n\nالأدوار المتبقية: %s.
actors.buffs.fireimbue.name=مشبع بالنار
actors.buffs.fireimbue.desc=أنت مشبع بقوة النار!\n\nكل الهجمات الجسدية ستحظى بفرصة لإشعال الأعداء. بالإضافة إلى ذلك، أنت محصن بالكامل ضد آثار النار.\n\nأدوار إشباع النار المتبقية: %s.
actors.buffs.foresight.name=بصيرة
actors.buffs.foresight.desc=أنت قادر بطريقة ما على رؤية تخطيط التضاريس المحيطة بعقلك.\n\nبينما أنت تحت أثر البصيرة كل المربعات في نطاق واسع مكشوفة لك، بما فيها أي فخاخ أو أبواب سرية.\n\nأدوار البصيرة المتبقية: %s.
actors.buffs.frost.name=مجمد
actors.buffs.frost.freezes=%s يتجمد!
actors.buffs.frost.desc=لا يجب الخلط بينه وبين التجمد الصلب، هذا التجمد الأكثر رفقا يغلف الهدف في الجليد فقط.\n\nالتجمد يعمل بشكل مشابه للشلل، ما يجعل عمل الهدف مستحيلا. على عكس الشلل، يلغى التجمد فورا إن تلقى الهدف ضررا، لأن الجليد سيتكسر.\n\nأدوار التجمد المتبقية: %s.
actors.buffs.frostimbue.name=مشبع بالصقيع
actors.buffs.frostimbue.desc=أنت مشبع بقوة جليدية!\n\nكل الهجمات الجسدية ستراكم التبريد على الأعداء باطراد. بالإضافة إلى ذلك، أنت محصن بالكامل ضد البرد.\n\nأدوار إشباع الصقيع المتبقية: %s.
actors.buffs.fury.name=غاضب جدا
actors.buffs.fury.heromsg=تصبح غاضبا جدا!
actors.buffs.fury.desc=أنت غاضب، الأعداء لن يحبوك عندما تكون غاضبا.\n\nغضب عظيم يحترق داخلك، يزيد الضرر الذي تسببه بالهجمات الجسدية بنسبة 50%%.\n\nهذا الغضب سيدوم طالما أنت مصاب دون 50%% صحة.
actors.buffs.blobimmunity.name=حاجز التطهير
actors.buffs.blobimmunity.desc=قوة غريبة ما تغلفك في حاجز وقائي رقيق، يصد كل الآثار الجوية الضارة.\n\nأنت محصن ضد كل الآثار ذات المساحات بينما يدوم هذا الحاجز.\n\nأدوار الحصانة المتبقية: %s.
actors.buffs.gravitychaostracker.name=فوضى الجاذبية
actors.buffs.gravitychaostracker.desc_intro=كل بضعة أدوار كل الشخصيات في طابق السراديب الحالي ستُقذف في اتجاه عشوائي.
actors.buffs.gravitychaostracker.desc_positive=يبدو أنك وحلفاءك محصنون رغم ذلك.
actors.buffs.gravitychaostracker.desc_duration=ليس واضحا كم سيدوم الأثر، لكنه لا يستطيع الدوام إلى الأبد.
actors.buffs.greaterhaste.name=سرعة عظمى
actors.buffs.greaterhaste.desc=دفعة سرعة لا تصدق، للحظة يبدو كأن كل شيء آخر ثابت.\n\nبينما أنت تحت آثار السرعة العظمى إجراءات الحركة لا تستغرق وقتا على الإطلاق، لكن الإجراءات الأخرى ما زالت تُؤدى بسرعة عادية. كل خطوة حركة تستهلك دورا من السرعة العظمى.\n\nأدوار السرعة العظمى المتبقية: %d.
actors.buffs.haste.name=سرعة
actors.buffs.haste.desc=الطاقة تسري في عضلاتك، تتيح لك الركض بسرعات لا تصدق!\n\nبينما أنت تحت آثار السرعة ستركض بسرعة ×3، لكنك ستؤدي كل الإجراءات الأخرى بسرعة عادية.\n\nأدوار السرعة المتبقية: %s.
actors.buffs.healing.name=شفاء
actors.buffs.healing.desc=علاج سحري يجعل الجراح تنغلق واللحم يلتئم.\n\nكل دور ستتجدد الصحة باطراد حتى ينتهي أثر الشفاء. كمية الشفاء قد تتلاشى مع الوقت.\n\nالشفاء التالي: %d.\n\nالشفاء المتبقي: %d.
actors.buffs.herodisguise.name=تنكر
actors.buffs.herodisguise.desc=سحر وهمي غيّر مظهرك الجسدي! الأثر تجميلي بحت، لكنه يبدو غريبا جدا رغم ذلك.\n\nأدوار التنكر المتبقية: %s.
actors.buffs.hex.name=ملعون بالسداسي
actors.buffs.hex.heromsg=لقد لُعنت!
actors.buffs.hex.desc=سحر مظلم يمتص التركيز، يجعل الهدف مرتبكا قليلا.\n\nاللعنة تخفض الدقة والمراوغة بنسبة 20%%، ما يجعل الهدف أقل فعالية في القتال.\n\nأدوار اللعنة المتبقية: %s.
actors.buffs.holdfast.name=ثبات
actors.buffs.holdfast.desc=الملك أطلس ثابت في موقعه، يزيد درعه بمقدار %1$d-%2$d ويبطئ معدل تلاشي بعض التعزيزات بنسبة %3$d%%. هذا سيدوم حتى يتحرك.
actors.buffs.hunger.hungry=جائع
actors.buffs.hunger.starving=متضور
actors.buffs.hunger.onhungry=أنت جائع.
actors.buffs.hunger.onstarving=أنت متضور!
actors.buffs.hunger.ondeath=تضورت حتى الموت...
actors.buffs.hunger.cursedhorn=القرن الملعون يسرق بعض طاقة الطعام بينما تأكل.
actors.buffs.hunger.rankings_desc=تضور حتى الموت
actors.buffs.hunger.desc_intro_hungry=تشعر بمعدتك تنادي طلبا للطعام، لكنه ليس عاجلا جدا بعد.
actors.buffs.hunger.desc_intro_starving=أنت جائع جدا بحيث يؤلم.
actors.buffs.hunger.desc=\n\nالجوع يزداد ببطء بينما تقضي الوقت في السراديب، في النهاية ستبدأ بالتضور. أثناء التضور ستخسر الصحة ببطء بدل تجديدها.\n\nالتقنين مهم! إن كان عندك صحة احتياطية فالتضور ليس فكرة سيئة إن كان يعني أن طعاما أكثر سيتوفر لاحقا. التقنين الفعال يستطيع جعل الطعام يدوم أطول بكثير!
actors.buffs.invisibility.name=غير مرئي
actors.buffs.invisibility.desc=أنت مندمج بالكامل في التضاريس المحيطة، ما يجعل رؤيتك مستحيلة.\n\nبينما أنت غير مرئي الأعداء غير قادرين على مهاجمتك أو تتبعك. الهجمات الجسدية والآثار السحرية (كالمخطوطات والعصي) ستلغي الاختفاء فورا.\n\nأدوار الاختفاء المتبقية: %s.
actors.buffs.invulnerability.name=محصن تماما
actors.buffs.invulnerability.desc=هذه الشخصية مشبعة بقوة وقائية عظيمة، تمنحها فترة وجيزة من الحصانة الكاملة!\n\nالأدوار المتبقية: %s.
actors.buffs.levitation.name=تحليق
actors.buffs.levitation.desc=قوة سحرية تحلّق بك فوق الأرض، تجعلك تشعر بانعدام الوزن.\n\nالشخصيات المحلقة تتحرك بصمت وتتجاهل كل الآثار الأرضية. الفخاخ لن تُطلق، الماء لن يطفئ النار، النباتات لن تُداس، الجذور ستخطئ، والحفر سيُحلّق فوقها. كن حذرا، فكل هذه الأشياء قد تدخل حيز التطبيق في الثانية التي ينتهي فيها التحليق!\n\nأدوار التحليق المتبقية: %s.
actors.buffs.lifelink.name=رابط الحياة
actors.buffs.lifelink.ondeath=ضرر رابط الحياة قتلك...
actors.buffs.lifelink.desc=القوة الحيوية لهذه الشخصية مرتبطة بشخصية أخرى قريبة. أي ضرر يُتلقى يُقاسم بينهما.\n\nكلما تلقت هذه الشخصية ضررا، نصفه سيُسبب لهدف رابط الحياة بدل ذلك.\n\nأدوار رابط الحياة المتبقية: %s.
actors.buffs.light.name=مضاء
actors.buffs.light.desc=حتى في أحلك السراديب، ضوء ثابت بجانبك مريح دائما.\n\nالضوء يساعد في إبعاد الظلام، يتيح لك الرؤية لمسافة معقولة رغم البيئة.\n\nأدوار الإضاءة المتبقية: %s.
actors.buffs.lockedfloor.name=الطابق مقفل
actors.buffs.lockedfloor.desc=الطابق الحالي مقفل، وأنت غير قادر على مغادرته!\n\nبينما الطابق مقفل، لن تكسب الجوع أو تتلقى ضررا من التضور. بالإضافة إلى ذلك، إن لم تعمل نحو هزيمة زعيم هذا الطابق، ستتوقف آثار التجديد السلبي أيضا.\n\nإضافة إلى ذلك، إن أُحييت بعنخ غير مبارك بينما الطابق مقفل، فسيعيد تعيين نفسه.\n\nاقتل زعيم هذا الطابق لكسر القفل.
actors.buffs.lostinventory.name=مخزون ضائع
actors.buffs.lostinventory.desc=مخزونك ضاع في مكان ما في السراديب! لن تستطيع التقاط أو استعمال معظم الأغراض حتى تسترجعه.
actors.buffs.magicalsight.name=بصر سحري
actors.buffs.magicalsight.desc=بطريقة ما أنت قادر على الرؤية بعقلك، بدل عينيك.\n\nبينما البصر السحري نشط ستستطيع الرؤية عبر كل التضاريس في نطاق 12 مربعا.\n\nأدوار البصر السحري المتبقية: %s.
actors.buffs.magicalsleep.name=نوم سحري
actors.buffs.magicalsleep.toohealthy=أنت بصحة جيدة جدا، وتقاوم الرغبة في النوم.
actors.buffs.magicalsleep.fallasleep=تسقط في نوم سحري عميق.
actors.buffs.magicalsleep.wakeup=تستيقظ شاعرا بالانتعاش والصحة.
actors.buffs.magicalsleep.desc=هذه الشخصية سقطت في نوم سحري عميق لن تستيقظ منه طبيعيا.\n\nالنوم السحري مشابه للنوم العادي، عدا أن الضرر فقط سيسبب استيقاظ الهدف.\n\nللبطل وحلفائه، النوم السحري عنده بعض خواص الاستعادة، يتيح لهم الشفاء بسرعة أثناء الراحة.
actors.buffs.magicimmune.name=محصن ضد السحر
actors.buffs.magicimmune.desc=كل الآثار السحرية فقدت قبضتها عليك، أنت منيع لها بالكامل.\n\nبينما أنت محصن ضد السحر كل الآثار السحرية الضارة والمفيدة لن تتطبق عليك، بما فيها اللعنات والمسحورات والعصي والمخطوطات والخواتم والآثار... قدرات درع البطل قوية كفاية لتعمل رغم هذا الأثر.\n\nأدوار حصانة السحر المتبقية: %s.
actors.buffs.mindvision.name=رؤية العقل
actors.buffs.mindvision.desc=بطريقة ما أنت قادر على رؤية كل المخلوقات في هذا الطابق عبر عقلك. إنه شعور غريب.\n\nكل الشخصيات في هذا الطابق مرئية لك طالما عندك رؤية العقل. رؤية مخلوق عبر رؤية العقل تحتسب كأنه مرئي أو قريب لأغراض آثار سحرية كثيرة.\n\nأدوار رؤية العقل المتبقية: %s.
actors.buffs.momentum.momentum=يبني الزخم
actors.buffs.momentum.running=ركض حر
actors.buffs.momentum.resting=يتعافى
actors.buffs.momentum.action_name=اركض حرا
actors.buffs.momentum.momentum_desc=بينما يتحرك، عدّاء الكثبان يبني الزخم، الذي يستطيع إنفاقه لبدء الركض الحر.\n\nكل شحنة زخم تمنح دورين من الركض الحر، وعدّاء الكثبان يستطيع بناء حتى 10 شحنات. الزخم يضيع بسرعة عندما يتوقف عدّاء الكثبان عن الحركة.\n\nشحنة الزخم الحالية: %d.
actors.buffs.momentum.running_desc=بينما يتحرك، عدّاء الكثبان يبني الزخم، الذي يستطيع إنفاقه لبدء الركض الحر.\n\nأثناء الركض الحر، يتحرك عدّاء الكثبان بسرعة مضاعفة ويكسب مراوغة إضافية بناء على مستواه.\n\nالأدوار المتبقية: %d.
actors.buffs.momentum.resting_desc=بينما يتحرك، عدّاء الكثبان يبني الزخم، الذي يستطيع إنفاقه لبدء الركض الحر.\n\nعدّاء الكثبان يحتاج وقتا لاستعادة قدرته على التحمل قبل بناء الزخم من جديد.\n\nالأدوار المتبقية: %d.
actors.buffs.monkenergy.name=طاقة
actors.buffs.monkenergy.action=قدرات قبضة الزفير
actors.buffs.monkenergy.desc=بينما تهزم الأعداء، تكسب قبضة الزفير طاقة تستطيع استعمالها في قدرات متنوعة. معظم الأعداء يمنحون طاقة واحدة عند الهزيمة، وقبضة الزفير لا تخسر الطاقة مع الوقت.\n\nالطاقة الحالية: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=قبضة الزفير استعملت قدرة مؤخرا، ويجب أن تنتظر قبل استعمال أخرى.\n\nالتبريد الحالي: %d أدوار.
actors.buffs.monkenergy$monkability$flurry.name=وابل ضربات
actors.buffs.monkenergy$monkability$flurry.desc=ضربتان فوريتان تسببان ضررا %1$d-%2$d وتتجاهلان الدرع. لا يمكن استعمال هذه القدرة بشكل متكرر.
actors.buffs.monkenergy$monkability$flurry.empower_desc=ضربتان فوريتان تسببان ضررا %1$d-%2$d، وتتجاهلان الدرع، _وتستعملان مسحورة سلاحك._ لا يمكن استعمال هذه القدرة بشكل متكرر.
actors.buffs.monkenergy$monkability$focus.name=تركيز
actors.buffs.monkenergy$monkability$focus.desc=قبضة الزفير تأخذ دورا للتركيز، ما يتيح لها صد الهجوم التالي الموجه ضدها.
actors.buffs.monkenergy$monkability$focus.empower_desc=قبضة الزفير _تتركز فورا،_ ما يتيح لها صد الهجوم التالي الموجه ضدها.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=مركزة
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=قبضة الزفير مركزة على محيطها، تتوقع الهجوم التالي الموجه ضدها. أثناء التركيز، مضمون لها صد الهجوم القادم التالي.
actors.buffs.monkenergy$monkability$dash.name=اندفاع
actors.buffs.monkenergy$monkability$dash.prompt=اختر موقعا
actors.buffs.monkenergy$monkability$dash.desc=اندفاع فوري حتى 4 مربعات بعيدا. هذه القدرة تستطيع تجاوز المخاطر، لكن ليس عبر الأعداء أو التضاريس الصلبة.
actors.buffs.monkenergy$monkability$dash.empower_desc=اندفاع فوري حتى _8 مربعات_ بعيدا. هذه القدرة تستطيع تجاوز المخاطر، لكن ليس عبر الأعداء أو التضاريس الصلبة.
actors.buffs.monkenergy$monkability$dragonkick.name=ركلة التنين
actors.buffs.monkenergy$monkability$dragonkick.desc=ركلة مدمرة تسبب ضررا %1$d-%2$d وتتجاهل الدرع. الركلة تدفع الهدف بعيدا وتشله لكل مربع يسافره.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=ركلة مدمرة تسبب ضررا _%1$d-%2$d_ وتتجاهل الدرع. الركلة تدفع _كل الأهداف المجاورة_ بعيدا وتشلهم لكل مربع يسافرونه.
actors.buffs.monkenergy$monkability$meditate.name=تأمل
actors.buffs.monkenergy$monkability$meditate.desc=قبضة الزفير تركز الطاقة في جسدها لـ 5 أدوار. هذا يزيل معظم الآثار السلبية ويمنحها 8 أدوار من إعادة شحن العصي والآثار.
actors.buffs.monkenergy$monkability$meditate.empower_desc=قبضة الزفير تركز الطاقة في جسدها لـ 5 أدوار. هذا يزيل معظم الآثار السلبية ويمنحها 8 أدوار من إعادة شحن العصي والآثار. _تكسب أيضا مقاومة ضرر 80% أثناء التأمل، وتشفى ببطء بنسبة 20% من صحتها المفقودة._
actors.buffs.ooze.name=وحل كاوٍ
actors.buffs.ooze.heromsg=الوحل الكاوي يأكل لحمك. اغسله بعيدا!
actors.buffs.ooze.ondeath=تذوب بعيدا...
actors.buffs.ooze.rankings_desc=مذاب
actors.buffs.ooze.desc=هذا الحمض اللزج يلتصق باللحم، يذيبه ببطء.\n\nالوحل سيسبب ضررا ثابتا مع الوقت، لكن يمكن غسله فورا في الماء.\n\nأدوار الوحل المتبقية: %s.
actors.buffs.paralysis.name=مشلول
actors.buffs.paralysis.heromsg=أنت مشلول!
actors.buffs.paralysis.out=قاوم الشلل
actors.buffs.paralysis.desc=غالبا أسوأ شيء فعله هو لا شيء على الإطلاق.\n\nالشلل يوقف كل الإجراءات بالكامل، يجبر الهدف على الانتظار حتى يزول الأثر. ألم تلقي الضرر يستطيع جعل الشخصيات تقاوم الشلل، فتخرج منه.\n\nأدوار الشلل المتبقية: %s.
actors.buffs.physicalempower.name=معزز جسديا
actors.buffs.physicalempower.desc=ضرباتك عُزّزت، تزيد كمية الضرر التي تستطيع سببه عندما تصيب الأعداء بهجمات جسدية.\n\nضرر إضافي: %1$d.\nالضربات المتبقية: %2$d.
actors.buffs.pincushion.name=وسادة دبابيس
actors.buffs.pincushion.desc=الأسلحة المرماة التي استعملتها ضد هذه الشخصية عالقة فيها حاليا وستسقط إلى الأرض بعد هزيمتها.\n\nالأغراض التالية ملتصقة حاليا:
actors.buffs.poison.name=مسموم
actors.buffs.poison.heromsg=أنت مسموم!
actors.buffs.poison.ondeath=مُت من السم...
actors.buffs.poison.rankings_desc=خضع للسم
actors.buffs.poison.desc=السم يعمل في طريقه عبر الجسد، يضعف عمله الداخلي ببطء.\n\nالسم يسبب ضررا كل دور يتناسب مع كم متبقٍّ حتى انتهائه.\n\nأدوار السم المتبقية: %s.
actors.buffs.preparation.name=استعداد
actors.buffs.preparation.action_name=ضربة مستعدة
actors.buffs.preparation.desc=الخنجر الصامت ينتظر بصبر، يستعد للضرب من الظلال.
actors.buffs.preparation.desc_dmg=هجومه التالي سيسبب ضررا إضافيا _%1$d%%_، وسينفذ الأعداء العاديين دون _%2$d%%_ صحة، أو الزعماء دون _%3$d%%_ صحة.
actors.buffs.preparation.desc_dmg_likely=الهجوم سيكون أكثر احتمالا أيضا لسبب كمية ضرر أكبر.
actors.buffs.preparation.desc_blink=إنه قادر على الخطف نحو عدو قبل ضربهم، بمسافة قصوى _%d._
actors.buffs.preparation.desc_invis_time=الأدوار المقضية غير مرئي: _%d._
actors.buffs.preparation.desc_invis_next=الأدوار لهجوم أقوى: _%d._
actors.buffs.preparation.prompt=اختر هدفا للهجوم!\nمسافة الخطف القصوى: %d
actors.buffs.preparation.no_target=لا يوجد شيء للهجوم هناك.
actors.buffs.preparation.out_of_reach=ذلك الهدف خارج المدى.
actors.buffs.preparation.assassinated=اغتيل
actors.buffs.prismaticguard.name=حارس موشوري
actors.buffs.prismaticguard.desc=أنت محروس بصورة موشورية غير نشطة حاليا. عندما يحضر الأعداء ستنطلق الصورة الموشورية إلى العمل وتحميك!\n\nأثناء عدم النشاط، ستتعافى الصورة الموشورية باطراد من أي ضرر تلقته.\n\nالصحة الحالية: %d/%d.
actors.buffs.prismaticguard.desc_many=هذه الصورة الموشورية تستفيد من قوة الكثيرين أيضا. الأدوار المتبقية: %d.
actors.buffs.recharging.name=يُعاد شحنه
actors.buffs.recharging.desc=الطاقة تسري فيك، تحسن معدل شحن عصيك وعصيك السحرية.\n\nكل دور سيزيد هذا التعزيز الشحن الحالي بربع، بالإضافة إلى إعادة الشحن العادية.\n\nأدوار إعادة الشحن المتبقية: %s.
actors.buffs.revealedarea.name=منطقة مكشوفة
actors.buffs.revealedarea.desc=منطقة من السراديب كُشفت مؤقتا للبطل، سيرونها أينما كانوا.\n\nالأدوار المتبقية: %s.
actors.buffs.revealedchar.name=مكشوف
actors.buffs.revealedchar.desc=هذه الشخصية مكشوفة للبطل، ستكون مرئية أينما كانت.\n\nالأدوار المتبقية: %s.
actors.buffs.roots.name=متجذر
actors.buffs.roots.heromsg=لا تستطيع التحرك!
actors.buffs.roots.desc=الجذور (سحرية أو طبيعية) تقبض على الأقدام، تجبرها على النزول إلى الأرض.\n\nالجذور تقفل هدفا في مكانه، تجعل الحركة ومعظم قدرات الحركة مستحيلة. الإجراءات الأخرى غير متأثرة، بما فيها آثار النقل الآني.\n\nأدوار التجذر المتبقية: %s.
actors.buffs.scrollempower.name=تعزيز المخطوطة
actors.buffs.scrollempower.desc=الطاقة من مخطوطة حكيم النجوم المقروءة مؤخرا تعزز عصيه!\n\nتعزيز المستوى: +%1$d.\nالصعقات المتبقية: %2$d.
actors.buffs.shadows.name=مندمج في الظلال
actors.buffs.shadows.desc=أنت مندمج في الظلال حولك، ما يمنحك الاختفاء ويبطئ أيضك.\n\nبينما أنت غير مرئي الأعداء غير قادرين على مهاجمتك أو تتبعك. معظم الهجمات الجسدية والآثار السحرية (كالمخطوطات والعصي) ستلغي الاختفاء فورا. بالإضافة إلى ذلك، أثناء اندماجك في الظلال، معدل جوعك مبطأ.\n\nستبقى مندمجا في الظلال حتى تغادر الظلال أو يلامسك عدو.
actors.buffs.slow.name=مبطأ
actors.buffs.slow.desc=سحر الإبطاء يؤثر في معدل زمن الهدف، بالنسبة إليهم كل شيء يتحرك بسرعة فائقة.\n\nالشخصية المبطأة تؤدي كل الإجراءات في ضعف الوقت الذي تستغرقه عادة.\n\nأدوار الإبطاء المتبقية: %s.
actors.buffs.snipersmark.name=علامة القناصة
actors.buffs.snipersmark.action_name_snapshot=لقطة سريعة
actors.buffs.snipersmark.action_name_volley=وابل
actors.buffs.snipersmark.action_name_sniper=طلقة قناصة
actors.buffs.snipersmark.desc=صيادة الأرز مركزة على الهدف الذي هاجمته مؤخرا. إنها قادرة على أداء هجوم خاص بقوسها سيختلف بناء على كيفية تعزيز القوس.\n\nقوس غير معزز سيطلق _لقطة سريعة،_ تسبب ضررا منخفضا لكنها لا تستغرق وقتا للإطلاق.\n\nقوس معزز للسرعة سيطلق _وابلا_ من ثلاثة أسهم. كل سهم سيسبب ضررا منخفضا، لكنه ما زال يستطيع تفعيل المسحورة. هذا الوابل يستغرق دورا واحدا للإطلاق.\n\nقوس معزز للضرر سيطلق _طلقة قناصة._ هذه الطلقة مضمونة الإصابة، تسبب ضررا إضافيا بناء على المسافة من الهدف، وتستغرق دورين للإطلاق.\n\nالأدوار المتبقية: %s.
actors.buffs.stamina.name=قدرة التحمل
actors.buffs.stamina.desc=عندك قدرة تحمل لا تنتهي، ما يتيح حركة أسرع!\n\nبينما أنت تحت آثار قدرة التحمل ستركض بسرعة +50%%، لكنك ستؤدي كل الإجراءات الأخرى بسرعة عادية.\n\nأدوار قدرة التحمل المتبقية: %s.
actors.buffs.swarminteltracker.name=ذكاء السرب
actors.buffs.swarminteltracker.desc=ذكاء السرب يجعل الأعداء يجذبون أعداء آخرين إلى موقعك عندما يرونك أو يرون حلفاءك.\n\nهذا الجذب عنده مدى محدود، لكن كلما طالت رؤيتك ارتفع هذا المدى، حتى حد أقصى 12. كسر الرؤية ولو للحظة يعيد تعيين المدى.\n\nأكبر مدى جذب حالي: %d.
actors.buffs.vulnerable.name=هش
actors.buffs.vulnerable.heromsg=تشعر بالهشاشة!
actors.buffs.vulnerable.desc=سحر الهشاشة يزيد كل الضرر الجسدي الذي تتلقاه شخصية بنسبة 33%%، بعد تخفيض ذلك الضرر بالدرع.\n\nأدوار الهشاشة المتبقية: %s.
actors.buffs.terror.name=مرعوب
actors.buffs.terror.desc=الرعب سحر متلاعب يجبر هدفه على ذعر لا يمكن التحكم فيه.\n\nالشخصيات المرعوبة مجبرة على الهرب من خصمها، تحاول وضع أكبر عدد من الأبواب والجدران بينهم. صدمة الألم ستقلل مدة الرعب رغم ذلك.\n\nأدوار الرعب المتبقية: %s.
actors.buffs.toxicimbue.name=مشبع بالسمية
actors.buffs.toxicimbue.desc=أنت مشبع بطاقة سامة!\n\nبينما تتحرك، غاز سام سيتموج منك باستمرار، يضر أعداءك. أنت محصن ضد الغاز السام والسم طوال مدة الأثر، وكذلك لبضعة أدوار بعدها.\n\nأدوار إشباع السمية المتبقية: %s.
actors.buffs.corrosion.name=تآكل
actors.buffs.corrosion.heromsg=أنت تذوب!
actors.buffs.corrosion.ondeath=تذوب بعيدا...
actors.buffs.corrosion.rankings_desc=مذاب
actors.buffs.corrosion.desc=حمض قوي يذيب اللحم والمعدن والعظم بمعدل مفزع.\n\nضرر التآكل يزداد مع الوقت، بينما يستمر الهدف في الذوبان.\n\nأدوار التآكل المتبقية: %1$s.\nضرر التآكل الحالي: %2$d.
actors.buffs.vertigo.name=دوار
actors.buffs.vertigo.desc=المشي في خط مستقيم قد يكون صعبا عندما يدور العالم كله.\n\nبينما هم تحت آثار الدوار، الشخصيات التي تحاول التحرك ستذهب في اتجاه عشوائي، بدل الاتجاه الذي قصدته.\n\nأدوار الدوار المتبقية: %s.
actors.buffs.wandempower.name=عصي معززة
actors.buffs.wandempower.desc=عصيك المسببة للضرر عُزّزت، تزيد كمية الضرر التي تسببه لبضعة ضربات.\n\nضرر إضافي: %1$d.\nالضربات المتبقية: %2$d.
actors.buffs.weakness.name=مضعف
actors.buffs.weakness.heromsg=تشعر بالإضعاف!
actors.buffs.weakness.desc=كل شيء يبدو فجأة أثقل بكثير.\n\nسحر الإضعاف يخفض القوة الجسدية لشخصية، فيجعلها تسبب ضررا منخفضا بنسبة 33%%.\n\nأدوار الضعف المتبقية: %s.
actors.buffs.wellfed.name=مشبع جيدا
actors.buffs.wellfed.desc=تشعر بالرضا والامتلاء.\n\nبينما أنت مشبع جيدا، لن يزداد جوعك، وستشفى كمية إضافية من الصحة مع الوقت.\n\nالأدوار المتبقية: %d.
actors.hero.abilities.armorability.self_target=لا تستطيع استهداف نفسك!
actors.hero.abilities.armorability.no_target=لا يوجد شيء للاستهداف هناك!
actors.hero.abilities.armorability.prompt=اختر موقعا للاستهداف
actors.hero.abilities.armorability.cost=تكلفة الشحن: _%d_
actors.hero.abilities.warrior.heroicleap.name=قفزة بطولية
actors.hero.abilities.warrior.heroicleap.prompt=اختر اتجاه القفز
actors.hero.abilities.warrior.heroicleap.short_desc=الملك أطلس يؤدي _قفزة بطولية_ نحو موقع مستهدف، يحلق فوق الأعداء والمخاطر.
actors.hero.abilities.warrior.heroicleap.desc=الملك أطلس يقفز نحو موقع مستهدف، يمر فوق أي أعداء أو مخاطر في الطريق. لا يستطيع القفز فوق الجدران أو التضاريس الصلبة الأخرى رغم ذلك.
actors.hero.abilities.warrior.shockwave.name=موجة صدمة
actors.hero.abilities.warrior.shockwave.short_desc=الملك أطلس يطلق _موجة صدمة_ في منطقة مخروطية بضرب الأرض. الأعداء العالقون في موجة الصدمة يتضررون ويُشلّون.
actors.hero.abilities.warrior.shockwave.desc=الملك أطلس يضرب الأرض، فينتج موجة صدمة تسافر حتى 5 مربعات في مخروط 60 درجة.\n\nالأعداء العالقون في موجة الصدمة هذه يُشلّون لـ 5 أدوار. يتلقون أيضا ضررا 5-10، بالإضافة إلى ضرر إضافي 1-2 لكل نقطة قوة عند الملك أطلس فوق 10.
actors.hero.abilities.warrior.endure.name=تحمل
actors.hero.abilities.warrior.endure$enduretracker.name=تحمل
actors.hero.abilities.warrior.endure$enduretracker.desc=الملك أطلس يسبب الآن ضررا إضافيا بناء على الضرر الذي تحمله.\n\nضرر إضافي: %1$d\nالضربات المتبقية: %2$d
actors.hero.abilities.warrior.endure.short_desc=الملك أطلس _يتحمل،_ يتخطى عدة أدوار لكنه يكسب مقاومة ضرر عالية. ثم يسبب ضررا إضافيا بناء على ما تحمله.
actors.hero.abilities.warrior.endure.desc=الملك أطلس يتحمل لـ 3 أدوار، يتلقى نصف الضرر من كل المصادر. هذا التخفيض يتم قبل آثار مقاومة الضرر كالدرع.\n\nبعد التحمل، ضربة الملك أطلس التالية خلال 10 أدوار تكسب ضررا إضافيا. هذا الضرر الإضافي يعادل نصف كل الضرر الذي أصابه أثناء التحمل، قبل أي آثار تخفيض ضرر!\n\nإن كان عند الملك أطلس أي سلسلة، استعمال هذه القدرة يزيد وقتها المتبقي بمقدار 3 أدوار.
actors.hero.abilities.mage.elementalblast.name=انفجار عنصري
actors.hero.abilities.mage.elementalblast.no_staff=لا تستطيع استعمال هذه القدرة دون عصاك.
actors.hero.abilities.mage.elementalblast.short_desc=حكيم النجوم يبث _انفجارا عنصريا_ من عصاه، يغطي منطقة كبيرة حوله بأثر يختلف بناء على العصا في عصاه.
actors.hero.abilities.mage.elementalblast.desc=حكيم النجوم يبث انفجار سحر، يغطي منطقة دائرية حتى 4 مربعات بعيدا ويسبب ضررا حتى 15-25. الأثر المعين للانفجار العنصري سيختلف حسب العصا المشبعة في عصا حكيم النجوم.
actors.hero.abilities.mage.elementalblast.generic_desc=أثر الانفجار العنصري سيكون مشابها لأثر العصا عند صعقها على عدو أو حليف.
actors.hero.abilities.mage.wildmagic.name=سحر بري
actors.hero.abilities.mage.wildmagic.no_wands=ليس عندك عصي للصعق بها!
actors.hero.abilities.mage.wildmagic.short_desc=حكيم النجوم يطلق _السحر البري_ المحتوى في عصيه، يطلقها عشوائيا عدة مرات على هدف مختار خلال دور واحد.
actors.hero.abilities.mage.wildmagic.desc=حكيم النجوم يطلق القوة في عصيه، يطلقها عشوائيا حتى 4 مرات في دور واحد. عصا حكيم النجوم ليست مشمولة في هذا الأثر.\n\nكل عصا مستوىها معزز بمقدار 2 أيضا، حتى +3. هذه القدرة تستعمل نصف شحنة عصا لكل صعقة، ولا عصا واحدة يمكن إطلاقها أكثر من مرتين.
actors.hero.abilities.mage.warpbeacon.name=منارة الالتواء
actors.hero.abilities.mage.warpbeacon.depths=لا تستطيع الالتواء بين الأعماق!
actors.hero.abilities.mage.warpbeacon.locked_floor=لا تستطيع مغادرة طابق مقفل!
actors.hero.abilities.mage.warpbeacon.too_far=ذلك الموقع بعيد جدا!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=لا تستطيع وضع منارة هناك!
actors.hero.abilities.mage.warpbeacon.window_desc=منارتك موضوعة حاليا في الطابق %d.
actors.hero.abilities.mage.warpbeacon.window_tele=انتقل آنيا إلى المنارة
actors.hero.abilities.mage.warpbeacon.window_clear=امسح المنارة
actors.hero.abilities.mage.warpbeacon.window_cancel=إلغاء
actors.hero.abilities.mage.warpbeacon.short_desc=حكيم النجوم يضع _منارة التواء_ في موقعه الحالي، يستطيع الانتقال آنيا عودة إليها فورا.
actors.hero.abilities.mage.warpbeacon.desc=حكيم النجوم يضع منارة، يمكن الالتواء إليها عند الإرادة بعد ذلك. وضع المنارة يستغرق دورا واحدا، لكن الالتواء إليها فوري.\n\nحكيم النجوم لا يستطيع الالتواء بين الطوابق افتراضيا، أو استعمال المنارة للوصول إلى أماكن لا يمكن الوصول إليها كالغرف المقفلة. حكيم النجوم يستطيع الانتقال آنيا إلى الأعداء، ما سيدفعهم جانبا.
actors.hero.abilities.rogue.smokebomb.name=قنبلة دخان
actors.hero.abilities.rogue.smokebomb.fov=تستطيع القفز فقط إلى موقع فارغ في مجال رؤيتك.
actors.hero.abilities.rogue.smokebomb.prompt=اختر موقعا للقفز إليه
actors.hero.abilities.rogue.smokebomb$ninjalog.name=طعم خشبي
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=بطريقة ما، الأعداء مقتنعون بسهولة أن هذا الطعم الخشبي هو ظل الكثبان الحقيقي!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=يمكنك إيجاد هذه الشخصية بقدرة درع بطل معينة.
actors.hero.abilities.rogue.smokebomb.short_desc=ظل الكثبان يرمي _قنبلة دخان_ بينما يختطف بعيدا. يعمي الأعداء قرب موقعه القديم.
actors.hero.abilities.rogue.smokebomb.desc=ظل الكثبان يرمي قنبلة دخان ويختطف حتى 6 مربعات بعيدا. يستطيع الاختطاف عبر المخاطر والأعداء، لكن ليس عبر التضاريس الصلبة كالجدران.\n\nالأعداء المجاورون لموقع ظل الكثبان القديم سيُعمَون لـ 5 أدوار.
actors.hero.abilities.rogue.deathmark.name=علامة الموت
actors.hero.abilities.rogue.deathmark.ally_target=تستطيع وضع علامة على الأعداء فقط
actors.hero.abilities.rogue.deathmark.short_desc=ظل الكثبان يضع _علامة موت_ على عدو مختار. الأعداء المعلمون يتلقون ضررا إضافيا، لكنهم لا يستطيعون الموت حتى تنتهي العلامة.
actors.hero.abilities.rogue.deathmark.desc=ظل الكثبان يضع علامة على عدو مختار، ما يجعله يتلقى ضررا إضافيا بنسبة 25%. العلامة تُطبق فورا وتدوم 5 أدوار.\n\nالأعداء المعلمون يتلقون ضررا إضافيا لكنهم غير قادرين على الموت حتى تنتهي العلامة. إن كان عند عدو 0 صحة عندما تنتهي العلامة، سيموت فورا.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=معلم للموت
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=هذا العدو تم تعليمه، ما يجعله يتلقى ضررا إضافيا بنسبة 25%%، لكنه يجعله أيضا غير قادر على الموت حتى تنتهي العلامة.\n\nالأدوار المتبقية: %s.
actors.hero.abilities.rogue.shadowclone.name=نسخة ظل
actors.hero.abilities.rogue.shadowclone.short_desc=ظل الكثبان يستدعي _نسخة ظل،_ تستطيع توجيهها لمساعدته في القتال.
actors.hero.abilities.rogue.shadowclone.desc=ظل الكثبان يستدعي مقلدا ظليا لنفسه، يستطيع توجيهه لمساعدته في القتال. توجيه نسخة الظل لا يكلف أي شحن.\n\nالنسخة عندها 80 صحة، لا درع، وتسبب ضررا 10-20. كل هذه السمات يمكن تحسينها بالمواهب، بحيث تستفيد النسخة من الأسلحة والدروع التي عند البطل.
actors.hero.abilities.rogue.shadowclone$shadowally.name=شبح الظل
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=نسختك تتحرك إلى ذلك الموقع.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=نسختك تتحرك لتتبعك.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=نسختك تتحرك للهجوم!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=نسخة من ظل الكثبان، مصنوعة من ظلام ظلي. تقف ثابتة تماما، بعيون فارغة وخيوط صغيرة من الظلام ترتفع منها كالبخار.\n\nالنسخة ليست نسخة مثالية من ظل الكثبان، لكنها ما زالت مقاتلة جيدة، وتستطيع الاستفادة من معدات ظل الكثبان بالمواهب الصحيحة.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=يمكنك إيجاد هذه الشخصية بقدرة درع بطل معينة.
actors.hero.abilities.huntress.spectralblades.name=نصال طيفية
actors.hero.abilities.huntress.spectralblades.short_desc=صيادة الأرز ترمي _نصالا طيفية_ على هدف، تسبب ضررا اعتمادا على سلاح اشتباكها المجهز حاليا.
actors.hero.abilities.huntress.spectralblades.desc=صيادة الأرز ترمي نصلا طيفيا على عدو، يعمل كضربة بعيدة من سلاح اشتباكها. كل الآثار العادية لسلاح الاشتباك ستتفعل، بما فيها المسحورات.
actors.hero.abilities.huntress.naturespower.name=قوة الطبيعة
actors.hero.abilities.huntress.naturespower.short_desc=صيادة الأرز تستدعي _قوة الطبيعة،_ تزيد سرعة حركتها ومعدل إطلاق قوسها لفترة قصيرة.
actors.hero.abilities.huntress.naturespower.desc=صيادة الأرز تعزز نفسها وقوسها مؤقتا بقوة الطبيعة! هذا يدوم 8 أدوار.\n\nخلال هذا الوقت، تتحرك صيادة الأرز بسرعة ×2، وتهاجم أسرع بنسبة 33% بقوسها. آثار القوس الإضافية لا تتفعل إن كانت صيادة الأرز تستعمل هجماتها الخاصة.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=قوة الطبيعة
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=صيادة الأرز معززة وجيزة، تزيد سرعة حركتها وسرعة هجومها بقوسها.\n\nالأدوار المتبقية: %s.
actors.hero.abilities.huntress.spirithawk.name=صقر الروح
actors.hero.abilities.huntress.spirithawk.no_space=لا توجد مساحة حرة قربك.
actors.hero.abilities.huntress.spirithawk.short_desc=صيادة الأرز تستدعي رفيق _صقر روح،_ يستطيع مساعدتها في استكشاف المواقع وإلهاء الأعداء.
actors.hero.abilities.huntress.spirithawk.desc=صيادة الأرز تستدعي رفيق صقر روح، يمكن توجيهه باستعمال القدرة من جديد بينما هو مستدعى. الصقر يدوم 100 دور، توجيه الصقر لا يكلف أي شحن.\n\nالصقر عنده صحة وقوة هجوم ضئيلة، لكنه سريع ومراوغ ودقيق. يشارك مجال رؤيته بالكامل مع صيادة الأرز في كل الأوقات. إنه محصن ضد كل الآثار ذات المساحات، كالنار وغاز السم. لن يهاجم إلا إذا وُجّه لذلك خصيصا.
actors.hero.abilities.huntress.spirithawk$hawkally.name=صقر الروح
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=صقرك يتحرك إلى ذلك الموقع.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=صقرك يتحرك ليتبعك.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=صقرك يتحرك للهجوم!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=صقر سحري، استدعته صيادة الأرز. يتوهج بأزرق أثيري زاهٍ، رأسه يتحول باستمرار بينما يمسح المنطقة.\n\nبينما هو ليس مقاتلا قويا فإن سرعته ورؤيته تجعلانه ممتازا للاستكشاف وإلهاء الأعداء.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=الأدوار المتبقية: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=المراوغات المضمونة المتبقية: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=يمكنك إيجاد هذه الشخصية بقدرة درع بطل معينة.
actors.hero.abilities.duelist.challenge.name=تحدي
actors.hero.abilities.duelist.challenge.prompt=اختر عدوا لتحديه
actors.hero.abilities.duelist.challenge.already_dueling=تستطيع أن تكون في مبارزة واحدة فقط في كل مرة.
actors.hero.abilities.duelist.challenge.ally_target=تستطيع تحدي الأعداء فقط.
actors.hero.abilities.duelist.challenge.unreachable_target=يجب أن تستطيع الوصول إلى هدفك.
actors.hero.abilities.duelist.challenge.distant_target=ذلك العدو بعيد جدا للتحدي.
actors.hero.abilities.duelist.challenge.short_desc=نصل السموم _يتحدى_ عدوا قريبا في مبارزة، يجمد مؤقتا كل الأعداء الآخرين.
actors.hero.abilities.duelist.challenge.desc=نصل السموم يتحدى عدوا قريبا في مبارزة. ذلك العدو مجبر على قتالها بينما كل الأعداء الآخرين مجمدون مؤقتا في الزمن.\n\nالهدف يجب أن يكون قابلا للوصول وداخل 5 مربعات من نصل السموم. المبارزة تدوم حتى تمر 10 أدوار، أو يموت العدو، أو يكون نصل السموم أكثر من 5 مربعات بعيدا عن العدو.\n\nالأعداء المجمدون محصنون. حلفاء نصل السموم غير مجمدين بهذه القدرة، لكن إن استُهدف زعيم فلن يُجمّد أتباعه أيضا.
actors.hero.abilities.duelist.challenge$duelparticipant.name=مشارك في مبارزة
actors.hero.abilities.duelist.challenge$duelparticipant.desc=هذه الشخصية تشارك في مبارزة. هي، وأي من حلفائها أو أتباعها، مسموح لهم بالعمل عادة بينما الآخرون مجمدون.\n\nالمبارزة ستدوم مقدارا محددا من الوقت، حتى يموت أحد المشاركين، أو حتى يتحرك المشاركون أكثر من 5 مربعات بعيدين عن بعضهم.\n\nالأدوار المتبقية: %d.
actors.hero.abilities.duelist.elementalstrike.name=ضربة عنصرية
actors.hero.abilities.duelist.elementalstrike.short_desc=نصل السموم يؤدي _ضربة عنصرية،_ ينشر أثرا في منطقة مخروطية بناء على مسحورة سلاحها.
actors.hero.abilities.duelist.elementalstrike.desc=نصل السموم يضرب عدوا أو موقعا، يؤدي هجوما عاديا مضمون الإصابة وينشر أثرا سحريا يسافر حتى 4 مربعات في مخروط 65 درجة. هذا الأثر السحري يختلف بناء على المسحورة على سلاح نصل السموم الأساسي.
actors.hero.abilities.duelist.elementalstrike.generic_desc=ضربة عنصرية دون مسحورة ستطلق دفعة سحر صغيرة، تسبب ضررا 6-12 لكل الأعداء في المدى.
actors.hero.abilities.duelist.feint.name=خدعة
actors.hero.abilities.duelist.feint.prompt=اختر موقعا للاندفاع إليه
actors.hero.abilities.duelist.feint.too_far=ذلك الموقع ليس مجاورا لك.
actors.hero.abilities.duelist.feint.bad_location=لا تستطيع التحرك إلى ذلك الموقع.
actors.hero.abilities.duelist.feint.short_desc=نصل السموم _يخدع،_ يتظاهر بهجوم بينما يندفع إلى مربع مجاور. الأعداء سيهاجمون صورتها التالية، تاركين أنفسهم مفتوحين لهجوم مضاد.
actors.hero.abilities.duelist.feint.desc=نصل السموم يتظاهر بهجوم بينما يندفع إلى مربع مجاور، تاركا خلفه صورة تالية لحظية لنفسها. الأعداء الذين كانوا يهاجمون نصل السموم سيهاجمون صورتها التالية بدل ذلك.\n\nالأعداء الذين يهاجمون الصورة التالية يصبحون مرتبكين، ما يلغي إجراءهم التالي ويتركهم مفتوحين لهجوم مباغت.
actors.hero.abilities.cleric.ascendedform.name=شكل الصعود
actors.hero.abilities.cleric.ascendedform.short_desc=كاهن الفجر يتخذ _شكل الصعود،_ يكسب تعويذات جديدة ومدى هجوم ودروعا.
actors.hero.abilities.cleric.ascendedform.desc=كاهن الفجر يبث طاقة مقدسة من نفسه، يتخذ شكلا مشعا ممتدا لـ 10 أدوار. بينما هو في هذا الشكل يستطيع كاهن الفجر إلقاء تعويذات جديدة، يكسب مدى هجوم +2، و30 درعا، وأي تعويذات إضافية يلقيها ستمنح 10 دروع لكل شحنة مخطوط فجر مستعملة.\n\nالدروع من شكل الصعود وتعويذاته لا تتناقص عادة، لكنها ستتلاشى فورا بمجرد انتهاء شكل الصعود. يمكن إعادة استعمال القدرة لإنعاش مدة شكل الصعود.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=شكل الصعود
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=طاقة مشعة تنبعث من جسد كاهن الفجر. بينما هو في هذا الشكل يكسب كاهن الفجر مدى هجوم +2 (من الطاقة المقدسة المنبثقة منه)، و10 دروع كلما أنفق شحنة مخطوط فجر. إنه قادر أيضا على إلقاء التعويذات المفتوحة عبر مواهب شكل الصعود.\n\nالدرع الممنوح بشكل الصعود وتعويذاته لن يتناقص عادة، لكنه سيلاشى فورا عندما ينتهي شكل الصعود.\n\nالدروع الحالية: %1$d.\nالأدوار المتبقية: %2$d.
actors.hero.abilities.cleric.trinity.name=الثالوث
actors.hero.abilities.cleric.trinity.no_imbue=الثالوث ليس عنده أثر مضبوط لأي من أشكاله حاليا، استعمل إحدى تعويذاته!
actors.hero.abilities.cleric.trinity.no_duplicate=الثالوث لا يستطيع نسخ أثر عندك مجهز أصلا!
actors.hero.abilities.cleric.trinity.ench_glyph_use=الثالوث سيطبق هذا الأثر لـ _%1$d أدوار_ بتكلفة _%2$s شحن._
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=الثالوث سيطبق هذا الأثر _القوي_ لـ _%1$d أدوار_ بتكلفة _%2$s شحن._
actors.hero.abilities.cleric.trinity.wand_use=الثالوث سيصعق هذه العصا عند _+%1$d_ بتكلفة _%2$s شحن._
actors.hero.abilities.cleric.trinity.wand_multi_use=الثالوث سيصعق هذه العصا _متعددة الشحنات_ عند _+%1$d_ بتكلفة _%2$s شحن._
actors.hero.abilities.cleric.trinity.thrown_use=الثالوث سيرمي هذا السلاح عند _+%1$d_ بتكلفة _%2$s شحن._
actors.hero.abilities.cleric.trinity.ring_use=الثالوث سيطبق أثر هذا الخاتم عند _+%1$d_ لـ 20 دورا، بتكلفة _%2$s شحن._
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=الثالوث سيطبق أثر الكيمياء عن بعد لهذا الأثر، بتكلفة _%2$s شحن._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=الثالوث سيطبق أثر تجديد الصحة السلبي لهذا الأثر عند _+%1$d_ لـ 20 دورا، بتكلفة _%2$s شحن._
actors.hero.abilities.cleric.trinity.driedrose_use=الثالوث سيستعمل أثر هذا الأثر لاستدعاء خيل ودود فاسد بصحة شبح _+%1$d_، بتكلفة _%2$s شحن._
actors.hero.abilities.cleric.trinity.etherealchains_use=الثالوث سيطبق أثر إلقاء السلاسل لهذا الأثر بمدى عند _+%1$d_، بتكلفة _%2$s شحن._
actors.hero.abilities.cleric.trinity.hornofplenty_use=الثالوث سيطبق أثر الوجبات الخفيفة لهذا الأثر، بتكلفة _%2$s شحن._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=الثالوث سيطبق أثر سرقة الأعداء لهذا الأثر عند _+%1$d_، بتكلفة _%2$s شحن._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=الثالوث سيطبق أثر التجذير لهذا الأثر ببذرة ضارة عشوائية، بتكلفة _%2$s شحن._
actors.hero.abilities.cleric.trinity.skeletonkey_use=الثالوث سيطبق أثر الإدخال لهذا الأثر، بتكلفة _%2$s شحن._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=الثالوث سيطبق أثر التنبؤ لهذا الأثر عند _+%1$d_، بتكلفة _%2$s شحن._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=الثالوث سيطبق أثر تجميد الزمن لهذا الأثر بمدة _%1$d_ أدوار، بتكلفة _%2$s شحن._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=الثالوث سيطبق أثر المخطوطة العشوائية لهذا الأثر بفرصة _%1$d/10_ لتقديم النسخة الغريبة دون تكلفة إضافية، بتكلفة _%2$s شحن._
actors.hero.abilities.cleric.trinity.cost=تكلفة شحن هذه القدرة تختلف، لكنها غالبا _%d._
actors.hero.abilities.cleric.trinity.short_desc=كاهن الفجر يكسب _ثالوثا_ من القدرات، تحاكي المعدات التي رأوها ويمكن تعيينها باستعمال تعويذات جديدة.
actors.hero.abilities.cleric.trinity.desc=كاهن الفجر يكسب _ثالوثا_ من قدرات الدرع، يمكن تعيينها لآثار أغراض متنوعة باستعمال ثلاث تعويذات جديدة. كل من هذه التعويذات تركز على محاكاة آثار أنواع مختلفة من المعدات التي عرفها كاهن الفجر خلال هذه المحاولة: شكل الجسد (الأسلحة والدروع)، شكل العقل (العصي والأسلحة المرماة)، وشكل الروح (الخواتم والآثار).\n\nكل شكل ثالوث يمكن أن يُشبع بأثر واحد في كل مرة، وكاهن الفجر يختار أيها يفعل عند استعمال الثالوث. الثالوث لن ينسخ أثر شيء عندك مجهز أصلا.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=اختر أي شكل من الثالوث للاستعمال. آثار الأشكال المختلفة يمكن أن تكون نشطة في وقت واحد.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_شكل الجسد: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_شكل العقل: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_شكل الروح: %s._
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=اختر أثرا ليُشبع في الثالوث. معلومات إضافية ستُعرض قبل التأكيد.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=عيّن لشكل الجسد
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=عيّن لشكل العقل
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=عيّن لشكل الروح
actors.hero.abilities.cleric.powerofmany.name=قوة الكثيرين
actors.hero.abilities.cleric.powerofmany.prompt_default=اختر حليفا أو موقعا
actors.hero.abilities.cleric.powerofmany.prompt_ally=وجّه حليف الضوء
actors.hero.abilities.cleric.powerofmany.ally_exists=عندك حليف معزز أصلا.
actors.hero.abilities.cleric.powerofmany.no_vision=لا تستطيع استهداف موقع لا تستطيع رؤيته.
actors.hero.abilities.cleric.powerofmany.only_allies=تستطيع تعزيز الحلفاء فقط.
actors.hero.abilities.cleric.powerofmany.short_desc=كاهن الفجر يوجه _قوة الكثيرين،_ يعزز حليفا موجودا أو يخلق واحدا جديدا.
actors.hero.abilities.cleric.powerofmany.desc=كاهن الفجر يوجه _قوة الكثيرين،_ إما تعزز حليفا موجودا أو تخلق واحدا معززا جديدا لـ 100 دور. استهداف مساحة فارغة يخلق حليفا جديدا.\n\nبينما هو معزز بقوة الكثيرين، أي حليف يسبب ضررا +25%، يتلقى ضررا -25%، ويشارك رؤيته مع كاهن الفجر. يكسبون أيضا 25 درعا عند استعمال القدرة.\n\nكاهن الفجر يكسب ثلاث تعويذات جديدة أيضا لا يمكن إلقاؤها إلا بحليف معزز. قوة الكثيرين لن تنتهي بينما إحدى هذه التعويذات نشطة.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=قوة الكثيرين
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=هذا الحليف عُزّز بقوة الكثيرين، تمنحه ضررا مسببا +25%% وضررا متلقى -25%%. سيشارك أيضا مدى رؤيته مع كاهن الفجر، ويستطيع الاستفادة من تعويذات قوة الكثيرين.\n\nقوة الكثيرين ستدوم عندما يختفي حلفاء كالصور الموشورية، لكن مدتها ستستمر في العد التنازلي.\n\nالأدوار المتبقية: %s.
actors.hero.abilities.cleric.powerofmany$lightally.name=حليف الضوء
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=حليفك يتحرك إلى ذلك الموقع.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=حليفك يتحرك ليتبعك.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=حليفك يتحرك للهجوم!
actors.hero.abilities.cleric.powerofmany$lightally.desc=نسخة من أحد رفاق مغامرة كاهن الفجر، مصنوعة من ضوء صلب. بينما عندها شكل بطل آخر، ليس عندها أي من قدراتهم الفريدة. هذا الحليف سيدوم طالما قوة الكثيرين مطبقة عليهم.\n\nهذا الحليف يمكن توجيهه دون تكلفة بإعادة استعمال قدرة درع قوة الكثيرين.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=يمكنك إيجاد هذه الشخصية بقدرة درع بطل معينة.
actors.hero.abilities.ratmogrify.name=تحويل الجرذان
actors.hero.abilities.ratmogrify.cant_transform=لا تستطيع تحويل ذلك إلى جرذ!
actors.hero.abilities.ratmogrify.too_strong=ذلك العدو قوي جدا لتحويله إلى جرذ!
actors.hero.abilities.ratmogrify.short_desc=البطل _يحوّل_ عدوا إلى جرذ! هذا يحوله مؤقتا إلى جرذ دون قدرات.
actors.hero.abilities.ratmogrify.desc=البطل يحول عدوا إلى جرذ لـ 6 أدوار! الزعماء والحلفاء والجرذان لا يمكن تحويلهم إلى جرذان.\n\nالأعداء المحولون إلى جرذان يحتفظون بإحصائياتهم الأصلية، لكن ليس عندهم أي قدرات.
actors.hero.abilities.ratmogrify$transmograt.name=محول إلى جرذ %s
actors.hero.abilities.ratmogrify$transmograt.desc=هذا العدو حُوّل إلى جرذ. تحسين كبير، إن سألتني! - ملك الجرذان
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=قتله: عدو محول إلى جرذ
actors.hero.spells.auraofprotection.name=هالة الحماية
actors.hero.spells.auraofprotection.short_desc=يعزز الدفاع لفارس الفجر والحلفاء القريبين.
actors.hero.spells.auraofprotection.desc=فارس الفجر يبدأ إشعاع طاقة وقائية في هالة متلألئة حول نفسه لـ 20 دورا. أي حليف داخل مربعين من فارس الفجر (بما فيهم نفسه) يتلقى ضررا أقل بنسبة %1$d%%، ويكسب أثر رمز درع فارس الفجر بقوة +%2$d%%.\n\nهذا التخفيض للضرر يحدث قبل آثار تخفيض الضرر الأخرى (مثلا الدرع). تعزيز قوة الرمز سيتطبق دائما، لكن هذه التعويذة لا تستطيع جعل رمز فارس الفجر يتطبق أكثر من مرة إن كانت شخصية تستفيد منه أصلا (مثلا فارس الفجر نفسه، أو صورة موشورية).
actors.hero.spells.auraofprotection$aurabuff.name=هالة الحماية
actors.hero.spells.auraofprotection$aurabuff.desc=فارس الفجر يشع طاقة وقائية حول نفسه.\n\nأي حليف قريب (بما فيه فارس الفجر نفسه) يتلقى ضررا منخفضا ويكسب أثر رمز درع فارس الفجر بقوة معززة.\n\nالأدوار المتبقية: %s.
actors.hero.spells.beamingray.name=شعاع النقل
actors.hero.spells.beamingray.no_space=لا توجد مساحة ليظهر حليفك هناك.
actors.hero.spells.beamingray.out_of_range=ذلك الموقع خارج المدى.
actors.hero.spells.beamingray.short_desc=ينقل حليفك آنيا ويمنح ضررا إضافيا.
actors.hero.spells.beamingray.desc=كاهن الفجر يوجه القوة على حليفه إلى شعاع ضوء ينقلهم إلى موقع. إن اصطدم الشعاع بعدو سيضع الحليف قريبا ويوجهه نحو العدو.\n\nالشعاع عنده مدى أقصى %1$d مربعات، وسيزيد ضرر قوة الكثيرين الإضافي إلى +%2$d%% لـ 10 أدوار ضد أقرب عدو داخل 4 مربعات. شعاع النقل يستطيع حتى نقل الحلفاء غير المتحركين عادة آنيا، لكن مداه ينصف في هذه الحالات.
actors.hero.spells.beamingray$beamingrayboost.name=شعاع النقل
actors.hero.spells.beamingray$beamingrayboost.desc=هذا الحليف نُقل آنيا مؤخرا بشعاع النقل، ما يمنحه ضررا إضافيا ضد أقرب عدو بعد النقل. قوة الكثيرين لن تنتهي أيضا عندما يكون هذا التعزيز نشطا.\n\nالأدوار المتبقية: %s.
actors.hero.spells.blessspell.name=بركة
actors.hero.spells.blessspell.short_desc=يبارك ويدرع كاهن الفجر، يبارك ويشفي الآخرين.
actors.hero.spells.blessspell.desc=كاهن الفجر يضع بركة مقدسة على نفسه أو شخصية أخرى يستطيع رؤيتها.\n\nعندما تُلقي على نفسه الأثر أضعف، يمنح %1$d أدوار من البركة و%2$d حاجز.\n\nعندما تُلقي على شخصيات أخرى التعويذة أقوى، تمنح %3$d أدوار من البركة و%4$d شفاء. الشفاء الزائد يتحول إلى حاجز.
actors.hero.spells.bodyform.name=شكل الجسد
actors.hero.spells.bodyform.short_desc=يعين الثالوث لمسحورة أو رمز.
actors.hero.spells.bodyform.desc=كاهن الفجر يختار مسحورة أو رمزا عرفهم في هذه المحاولة ويشبع الثالوث بأثره.\n\nعندما يُستعمل الثالوث، يكسب كاهن الفجر أثر المسحورة أو الرمز المختار لـ %d أدوار. هذه المسحورة أو الرمز المؤقت سيعمل مع أي أثر ستعمل معه مسحورة أو رمز عادي.\n\nهذه التعويذة تستبدل أي أثر جسد آخر مشبع فيه الثالوث حاليا.
actors.hero.spells.bodyform$bodyformbuff.name=شكل الجسد
actors.hero.spells.bodyform$bodyformbuff.desc=شكل جسد الثالوث يمنحك حاليا قوة مسحورة أو رمز، كأنك جهزته على سلاحك أو درعك الحالي.\n\nلاحظ أن شكل الجسد لا يستطيع توفير نسخة أخرى من أثر تستفيد منه أصلا.\n\nالأثر الحالي: %1$s.\n\nالأدوار المتبقية: %2$s.
actors.hero.spells.cleanse.name=تطهير
actors.hero.spells.cleanse.short_desc=يزيل الإضعافات ويمنح دروعا.
actors.hero.spells.cleanse.desc=كاهن الفجر يزيل كل آثار الحالة الضارة على نفسه والحلفاء المرئيين. بعد انتهاء التعويذة كل الشخصيات المتأثرة تكسب أيضا %1$d أدوار من حصانة الإضعاف، و%2$d حاجز.
actors.hero.spells.clericspell.prompt=اختر هدفا
actors.hero.spells.clericspell.no_target=لا يوجد هدف هناك.
actors.hero.spells.clericspell.invalid_target=لا تستطيع استهداف ذلك الموقع.
actors.hero.spells.clericspell.invalid_enemy=لا تستطيع استهداف ذلك العدو.
actors.hero.spells.clericspell.charge_cost=تكلفة الشحن: %d
actors.hero.spells.divinesense.name=حس سماوي
actors.hero.spells.divinesense.short_desc=اكسب رؤية عقل مؤقتة في مدى واسع.
actors.hero.spells.divinesense.desc=كاهن الفجر يركز حواسه على محيطه، يكسب رؤية عقل بمدى %d مربعات لـ 50 دورا. هذه التعويذة لا تستغرق وقتا للإلقاء.
actors.hero.spells.divinesense$divinesensetracker.name=متعقب الحس السماوي
actors.hero.spells.divinesense$divinesensetracker.desc=هذه الشخصية قادرة مؤقتا على رؤية مخلوقات أخرى قريبة بعقلها!\n\nالأدوار المتبقية: %s.
actors.hero.spells.divineintervention.name=تدخل سماوي
actors.hero.spells.divineintervention.short_desc=تعزيز دروع ضخم لكاهن الفجر والحلفاء.
actors.hero.spells.divineintervention.desc=كاهن الفجر يسكب كمية هائلة من القوة من مخطوطهم إلى أنفسهم والحلفاء، يعزز الجميع إلى %1$d دروع ويمدد شكل الصعود بمقدار %2$d أدوار. القوة الدفاعية المذهلة لهذه التعويذة موزونة ضد تكلفتها العالية جدا من الشحن.\n\nتمامًا مثل الدروع الأخرى الممنوحة بشكل الصعود، هذه الدروع لا تتناقص عادة، لكنها ستنتهي فورا عندما ينتهي شكل الصعود.
actors.hero.spells.flash.name=وميض
actors.hero.spells.flash.prompt=اختر موقعا
actors.hero.spells.flash.short_desc=انتقل آنيا إلى موقع قريب.
actors.hero.spells.flash.desc=كاهن الفجر يوجه شكل صعوده عند موقع قريب وينتقل آنيا إلى هناك. الوميض يستطيع نقل كاهن الفجر آنيا إلى أي موقع مكتشف في المدى وغير مشغول. هذه التعويذة تكلف شحنات مخطوط أكثر كل مرة تُستعمل في نفس شكل الصعود.
actors.hero.spells.guidinglight.name=ضوء مرشد
actors.hero.spells.guidinglight.short_desc=يسبب ضررا سحريا بعيدا ويضمن إصابة.
actors.hero.spells.guidinglight.desc=كاهن الفجر يطلق صاعقة طاقة سحرية تصيب هدفا، تسبب ضررا 2-8 وتضيئه. الهجوم الجسدي غير المعاق التالي الموجه ضد عدو مضاء مضمون إصابته.
actors.hero.spells.guidinglight.desc_priest=_هذه التعويذة أقوى عندما يلقيها حارس النور._ أول إلقاء للتعويذة كل 50 دورا لا يكلف شحنات مخطوط، والإضاءة ستُستهلك بالإشعاع والعصي والشخصيات الأخرى والآثار التي تؤثر مباشرة في الأعداء. عندما تُستعمل الإضاءة بهذه الطريقة، تسبب ضررا سحريا إضافيا يعادل مستوى حارس النور + 5.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=الضوء المرشد
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=حارس النور سيستطيع إلقاء الضوء المرشد مجانا من جديد بعد مرور 50 دورا.\n\nالأدوار المتبقية: %s.
actors.hero.spells.guidinglight$illuminated.name=مضاء
actors.hero.spells.guidinglight$illuminated.desc=هذه الشخصية تتوهج نتيجة إصابتها بالضوء المرشد. بينما التوهج ليس قويا كفاية لإضاءة المنطقة المحيطة، الأثر السحري سيجعل إصابة الضربات عليهم أسهل بكثير لكاهن الفجر.
actors.hero.spells.guidinglight$illuminated.desc_priest=حارس النور يستطيع بالإضافة إلى ذلك استهلاك الإضاءة بالإشعاع، أو صعقة عصا، أو ضربة من حليف، أو آثار من بعض الآثار. استعمال الإضاءة بهذه الطريقة سيسبب ضررا سحريا إضافيا يعادل مستوى حارس النور + 5.
actors.hero.spells.guidinglight$illuminated.desc_generic=الأبطال الآخرون ما زالوا يستطيعون استعمال الإضاءة للاستفادة من موهبة الضوء الحارق، لكنهم لن يكسبوا أي دقة.
actors.hero.spells.hallowedground.name=أرض مقدسة
actors.hero.spells.hallowedground.prompt=اختر موقعا
actors.hero.spells.hallowedground.short_desc=يشفي الحلفاء، ويبطئ الأعداء، وينشر العشب في منطقة.
actors.hero.spells.hallowedground.desc=حارس النور يركز سحره المقدس في الأرض القريبة، يخلق منطقة %1$dx%1$d من التضاريس المقدسة لـ 20 دورا.\n\nعندما تُلقي، هذه التعويذة تشفي كل الحلفاء بـ 15 صحة (الحلفاء الأصحاء وحارس النور يكسبون دروعا)، وتجذر الأعداء وجيزة، وتنشر عشبا قصيرا.\n\nالتضاريس المقدسة تشفي الحلفاء بـ 1 صحة في كل دور (الحلفاء الأصحاء وحارس النور يكسبون دروعا)، وتشل الأعداء، وتسبب نمو عشب عالٍ عشوائيا.\n\nالتضاريس المقدسة تُدمر بالنار، وستنتج عشبا مخددا إن عُطّلت آثار التجديد السلبي أو لم يكسب حارس النور خبرة منذ فترة.
actors.hero.spells.hallowedground$hallowedterrain.desc=الأرض قُدّست هنا. الأرض المقدسة تبطئ الأعداء، وتشفي الحلفاء، وتسبب انتشار العشب.
actors.hero.spells.holyintuition.name=حدس مقدس
actors.hero.spells.holyintuition.prompt=اختر غرضا
actors.hero.spells.holyintuition.cursed=تشعر بسحر خبيث يتربص داخل هذا الغرض.
actors.hero.spells.holyintuition.uncursed=هذا الغرض خالٍ من السحر الخبيث.
actors.hero.spells.holyintuition.short_desc=يعرف ما إذا كان غرض ملعونا أم لا.
actors.hero.spells.holyintuition.desc=كاهن الفجر يركز حواسه على غرض ويحدد ما إذا كان ملعونا أم لا دون الحاجة إلى تجهيزه.
actors.hero.spells.holylance.name=رمح مقدس
actors.hero.spells.holylance.short_desc=يسبب ضررا سحريا بعيدا ثقيلا.
actors.hero.spells.holylance.desc=حارس النور يركز كمية كبيرة من الطاقة في رمح مرمي مدمر مصنوع من الضوء. هذا الرمح يسبب ضررا %1$d-%2$d ويسبب دائما أقصى ضرر للأموات الأحياء والأهداف المظلمة.\n\nهذه التعويذة غالية جدا، وعندها تبريد 30 دورا.
actors.hero.spells.holylance$lancecooldown.name=تبريد الرمح المقدس
actors.hero.spells.holylance$lancecooldown.desc=حارس النور ألقى الرمح المقدس مؤخرا، ويجب أن ينتظر قبل إلقائه من جديد.\n\nالأدوار المتبقية: %s.
actors.hero.spells.holyward.name=حراسة مقدسة
actors.hero.spells.holyward.glyph_name=%s النور
actors.hero.spells.holyward.glyph_desc=هذا الرمز يزيد قليلا كمية الضرر التي يستطيع الدرع صدها.
actors.hero.spells.holyward.short_desc=يتجاوز مؤقتا الرموز لتعزيز صد الدرع.
actors.hero.spells.holyward.desc=كاهن الفجر يشبع درعه الملبوس برموز من ضوء مقدس، يزيد صد ضرر الدرع بمقدار 1. هذه التعويذة لا تستغرق وقتا للإلقاء.\n\nهذا الرمز يدوم 50 دورا، وسيتجاوز أي رمز مفيد عند الدرع طوال المدة. كاهن الفجر سيستفيد من هذا الأثر حتى إن لم يكن عنده درع.
actors.hero.spells.holyward.desc_paladin=_هذه التعويذة أقوى عندما يلقيها فارس الفجر._ صد الضرر الإضافي يزداد إلى 3، التعويذة لا تتجاوز الرموز الموجودة بعد، وإلقاء تعويذات أخرى أثناء نشاط الحراسة المقدسة سيمدد مدتها بمقدار 10 أدوار لكل شحنة مستعملة.
actors.hero.spells.holyward$holyarmbuff.name=حراسة مقدسة
actors.hero.spells.holyward$holyarmbuff.desc=كاهن الفجر أشبع درعه الملبوس بطاقة مقدسة، يتجاوز مؤقتا أي رمز موجود ويجعل الدرع يصد نقطة ضرر إضافية واحدة.\n\nالأدوار المتبقية: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=فارس الفجر أشبع درعه الملبوس بطاقة مقدسة، يجعل الدرع يصد 3 نقاط ضرر إضافية.\n\nإلقاء تعويذات أخرى أثناء نشاط الحراسة المقدسة سيمدد مدتها بمقدار 10 أدوار لكل شحنة منفقة.\n\nالأدوار المتبقية: %s.
actors.hero.spells.holyweapon.name=سلاح مقدس
actors.hero.spells.holyweapon.ench_name=%s مقدس
actors.hero.spells.holyweapon.ench_desc=الأعداء الذين يضربهم سلاح مقدس سيتلقون ضررا سحريا إضافيا.
actors.hero.spells.holyweapon.short_desc=يتجاوز مؤقتا المسحورات لتعزيز الضرر.
actors.hero.spells.holyweapon.desc=كاهن الفجر يسحر سلاحه الملبوس بطاقة مقدسة، يجعل السلاح يسبب ضررا سحريا إضافيا بمقدار 2 في أي مرة يضرب عدوا به. هذه التعويذة لا تستغرق وقتا للإلقاء.\n\nهذه المسحورة تدوم 50 دورا، وستتجاوز أي مسحورة مفيدة عند السلاح طوال المدة. الضربات دون سلاح تستطيع الاستفادة من هذا الأثر أيضا.
actors.hero.spells.holyweapon.desc_paladin=_هذه التعويذة أقوى عندما يلقيها فارس الفجر._ الضرر السحري الإضافي يزداد إلى 6، التعويذة لا تتجاوز المسحورات الموجودة بعد، وإلقاء تعويذات أخرى أثناء نشاط السلاح المقدس سيمدد مدتها بمقدار 10 أدوار لكل شحنة مستعملة.
actors.hero.spells.holyweapon$holywepbuff.name=سلاح مقدس
actors.hero.spells.holyweapon$holywepbuff.desc=كاهن الفجر أشبع سلاحه الملبوس بطاقة مقدسة، يتجاوز مؤقتا أي مسحورة موجودة ويجعل السلاح يسبب ضررا سحريا إضافيا بمقدار 2 في كل هجوم.\n\nالأدوار المتبقية: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=فارس الفجر أشبع سلاحه الملبوس بطاقة مقدسة، يجعل هجماته تسبب ضررا سحريا إضافيا بمقدار 6.\n\nإلقاء تعويذات أخرى أثناء نشاط السلاح المقدس سيمدد مدتها بمقدار 10 أدوار لكل شحنة منفقة.\n\nالأدوار المتبقية: %s.
actors.hero.spells.judgement.name=حكم
actors.hero.spells.judgement.short_desc=يضر كل الأعداء المرئيين.
actors.hero.spells.judgement.desc=كاهن الفجر يضرب قبضته على الأرض، يسبب ثورة ضوء تضر كل الأعداء الذين يستطيع رؤيتهم. هذا يسبب ضررا %1$d-%2$d في الأساس، لكنه يسبب أيضا ضررا إضافيا بنسبة 33%% لكل تعويذة ألقاها كاهن الفجر منذ دخول شكل الصعود (أو منذ آخر إلقاء للحكم).\n\nحاليا الحكم سيسبب ضررا %3$d-%4$d.
actors.hero.spells.layonhands.name=وضع الأيدي
actors.hero.spells.layonhands.short_desc=يشفي فورا شخصية مجاورة أو يدرع فارس الفجر.
actors.hero.spells.layonhands.desc=فارس الفجر يوجه طاقة مقدسة عبر يديه، يشفي أو يحمي أي شيء يلمسه.\n\nفارس الفجر يستطيع إلقاء هذه التعويذة على أي شخصية مجاورة ليمنحها شفاء %1$d، أو على نفسه ليكسب دروعا %1$d. الشفاء الزائد من هذه التعويذة يتحول إلى دروع.\n\nهذه التعويذة تُلقي فورا ويمكن إلقاؤها بشكل متكرر، لكنها لا تستطيع منح أكثر من ثلاث إلقاءات من الدروع في وقت واحد.
actors.hero.spells.lifelinkspell.name=رابط الحياة
actors.hero.spells.lifelinkspell.short_desc=يشارك الضرر مع حليف، ويخفض الضرر المتلقى.
actors.hero.spells.lifelinkspell.desc=كاهن الفجر يقوي الرابط بين نفسه وحليفه المعزز. بهذا الرابط المعزز، أي ضرر يُتلقى سيُقاسم بين البطل وحليفه معا لـ %1$d أدوار، وتعزيز قوة الكثيرين الدفاعي سيزداد إلى ضرر متلقى -%2$d%%. لاحظ أن الضرر يُقاسم بعد الدرع، لكن قبل تخفيض ضرر قوة الكثيرين.\n\nبينما هذا الأثر نشط، تعويذات كاهن الفجر المفيدة من المرتبة 3 أو أقل ستتطبق على كاهن الفجر وحليفه معا إن كانت ستتطبق على أحدهما فقط.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=حماية رابط الحياة
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=كاهن الفجر ألقى رابط الحياة على هذا الحليف مؤخرا.\n\nبالإضافة إلى منافع رابط الحياة العادية، هذه الشخصية تتلقى ضررا منخفضا أيضا، أي تعويذات كاهن فجر إيجابية تُطبق على كاهن الفجر وهذا الحليف معا بدل واحد فقط، وقوة الكثيرين لن تنتهي بينما هذا التعزيز نشط.\n\nالأدوار المتبقية: %s.
actors.hero.spells.mindform.name=شكل العقل
actors.hero.spells.mindform.short_desc=يعين الثالوث لعصا أو سلاح مرمي.
actors.hero.spells.mindform.desc=كاهن الفجر يختار عصا أو أسلحة مرماة عرفوها في هذه المحاولة ويشبع الثالوث بأثرها.\n\nعندما يُستعمل الثالوث، يستطيع كاهن الفجر أداء هجوم واحد كأنه يستعمل الغرض المختار عند +%d. هذا سيطلق كل الآثار التي يطلقها استعمال ذلك النوع من الأغراض عادة.\n\nهذه التعويذة تستبدل أي أثر عقل آخر مشبع فيه الثالوث حاليا.
actors.hero.spells.mnemonicprayer.name=دعاء الذاكرة
actors.hero.spells.mnemonicprayer.short_desc=يمدد التعزيزات/الإضعافات على حليف/عدو، ويعيد تطبيق الإضاءة.
actors.hero.spells.mnemonicprayer.desc=حارس النور يتمتم بدعاء يمدد مدة كل التعزيزات أو الإضعافات على هدف معين بمقدار %1$d أدوار. هذه التعويذة لا تستغرق وقتا للإلقاء. الآثار الإيجابية ستدوم أطول على الحلفاء (بما فيهم حارس النور نفسه)، والآثار الضارة ستدوم أطول على الأعداء.\n\nدعاء الذاكرة يستطيع تمديد حالة معينة من تعزيز أو إضعاف مرة واحدة فقط، ولا يستطيع تمديد التعزيزات الممنوحة من قدرات الدرع.
actors.hero.spells.radiance.name=إشعاع
actors.hero.spells.radiance.short_desc=يضيء ويصعق وجيزة الأعداء المرئيين.
actors.hero.spells.radiance.desc=حارس النور يثور في ضوء مقدس، يصعق كل الأعداء المرئيين لـ 3 أدوار. إن كان عدو مضاء أصلا، الإشعاع سيطلق ضرر إضاءة الإضافي ثم يطبق إضعاف الإضاءة. الإشعاع سيجعل حارس النور يتوهج لـ 100 دور أيضا إن كان الطابق الحالي مظلما.
actors.hero.spells.recallinscription.name=نقش الاستدعاء
actors.hero.spells.recallinscription.short_desc=يكرر حجرا رونيا أو مخطوطة مستعملة مؤخرا.
actors.hero.spells.recallinscription.desc=كاهن الفجر يستعمل سحرا مقدسا لإعادة إلقاء أثر رونية سحرية موجودة على حجر روني أو مخطوطة استعملوها في آخر %s أدوار.\n\nنقش الاستدعاء لا يمكن استعماله لنسخ مخطوطات الترقية. تكلفة شحن هذه التعويذة تختلف بناء على الغرض المستعمل مؤخرا: 2 لحجر روني، 3 لمخطوطة، 4 لمخطوطة غريبة. هذه التكلفة تتضاعف أيضا عند نسخ مخطوطة تحويل، أو أغراض كيمياء يجب صنعها باستعمال التحويل أو الترقية.
actors.hero.spells.recallinscription$useditemtracker.name=رونية مستعملة مؤخرا
actors.hero.spells.recallinscription$useditemtracker.desc=كاهن الفجر استعمل مؤخرا غرضا يعمل مع تعويذة الاستدعاء المنقوشة. يستطيع كاهن الفجر إلقاء التعويذة لتكرار أثر الغرض.\n\nالغرض المستعمل: %1$s.\n\nالأدوار المتبقية: %2$s.
actors.hero.spells.shieldoflight.name=درع النور
actors.hero.spells.shieldoflight.short_desc=يمنح درعا مؤقتا ضد هدف.
actors.hero.spells.shieldoflight.desc=كاهن الفجر يخلق حاجزا رقيقا من الضوء بين نفسه وعدو، يزيد قوة صد درعه ضد ذلك العدو بمقدار %1$d-%2$d لـ 5 أدوار.\n\nهذه التعويذة لا تستغرق وقتا للإلقاء، لكنها لا يمكن استعمالها ضد أهداف متعددة في وقت واحد.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=درع النور
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=درع رقيق من الضوء يقف بين هذه الشخصية وعدو. ليس قويا كفاية لصد الهجمات بالكامل، لكنه سيلينها.\n\nالأدوار المتبقية: %s
actors.hero.spells.spiritform.name=شكل الروح
actors.hero.spells.spiritform.short_desc=يعين الثالوث لخاتم أو أثر.
actors.hero.spells.spiritform.desc=كاهن الفجر يختار خاتما أو أثرا عرفوه في هذه المحاولة (عدا مخطوط الفجر) ويشبع الثالوث بأثره.\n\nإن اختير خاتم، فالثالوث يمنح أثر ذلك الخاتم عند +%1$d لـ 20 دورا.\n\nإن اختير أثر، فالثالوث ينسخ أثر ذلك الأثر عند +%2$d. كل أثر عنده سلوكيات معينة وتكاليف شحن درع مختلفة عند استعماله مع الثالوث.\n\nهذه التعويذة تستبدل أي أثر روح آخر مشبع فيه الثالوث حاليا.
actors.hero.spells.spiritform$spiritformbuff.name=شكل الروح
actors.hero.spells.spiritform$spiritformbuff.desc=شكل روح الثالوث يمنحك حاليا قوة غرض ما، كأنك جهزته.\n\nلاحظ أن شكل الروح لا يستطيع توفير نسخة أخرى من أثر تستفيد منه أصلا.\n\nالأثر الحالي: %1$s.\n\nالأدوار المتبقية: %2$s.
actors.hero.spells.smite.name=ضربة قاضية مقدسة
actors.hero.spells.smite.short_desc=يضمن إصابة بضرر إضافي وقوة سحر.
actors.hero.spells.smite.desc=فارس الفجر يشبع ضربة اشتباك بقوة تدميرية صالحة.\n\nبالإضافة إلى سبب ضرر اشتباك عادي، الضربة القاضية المقدسة تجعل الهجمات غير المعاقة مضمونة الإصابة، وعندها قوة سحر +300%%، وتسبب ضررا سحريا إضافيا %1$d - %2$d.\n\nالضرر السحري الإضافي للضربة يتناسب مع مستوى فارس الفجر، وسيسبب دائما أقصى ضرر سحري إضافي ضد الأعداء الأموات الأحياء أو المظلمين.
actors.hero.spells.callwisp.name=استدعاء الوهج
actors.hero.spells.callwisp.short_desc=يستدعي وهج الفجر ليقاتل بجانبك.
actors.hero.spells.callwisp.desc=مبشّر الفجر يستدعي _وهج الفجر._ الوهج روح من النور الأول، ويمكن توجيهه للهجوم أو المتابعة أو البقاء في موضع.\n\nصحة الوهج وضرره ينموان بمستوى المبشّر وحده، لا بعدّته أبدا. لا يمكن وجود أكثر من وهج واحد في وقت واحد، وهو يتلاشى عندما يُقتل، أو ينتهي وقته، أو يسقط المبشّر.
actors.hero.spells.callwisp.no_space=لا توجد مساحة فارغة قربك.
actors.hero.spells.callwisp.prompt=اختر موقعا لتوجيه وهجك
actors.hero.spells.callwisp$wispofdawn.name=وهج الفجر
actors.hero.spells.callwisp$wispofdawn.direct_defend=وهجك ينتقل إلى ذلك الموقع.
actors.hero.spells.callwisp$wispofdawn.direct_follow=وهجك يتبعك.
actors.hero.spells.callwisp$wispofdawn.direct_attack=وهجك يهاجم!
actors.hero.spells.callwisp$wispofdawn.desc=روح من النور الأول، استدعاها مبشّر الفجر. تتوهج بلون الفجر وتطفو بهدوء في الهواء.\n\nتقاتل بجانب المبشّر ويمكن توجيهها للهجوم أو المتابعة أو البقاء في موضع. قوتها تأتي من مستوى المبشّر وحده.\n\nالأدوار المتبقية: %d.

actors.hero.spells.stasis.name=ركود
actors.hero.spells.stasis.short_desc=يزيل حليفا من السراديب ويحفظه.
actors.hero.spells.stasis.desc=كاهن الفجر يركز اتصاله بحليفه نحو نفسه، ما يجعل الحليف يُحتجز مؤقتا في نوع من ركود الطاقة داخل كاهن الفجر. سيُحفظ الحليف حتى %d أدوار، مع كل الآثار الإيجابية عليهم غير متأثرة بوقتهم في الركود.\n\nسيظهر الحليف بجانب كاهن الفجر عندما ينتهي الركود طبيعيا أو يستطيعون إعادة إلقاء التعويذة فورا دون تكلفة لإنهاء الأثر مبكرا. الركود يستطيع حتى تحريك الحلفاء غير المتحركين، لكنه لا يستطيع نقلهم بين الطوابق.
actors.hero.spells.stasis$stasisbuff.name=حليف في ركود
actors.hero.spells.stasis$stasisbuff.left_behind=حليفك غير المتحرك تُرك خلفك.
actors.hero.spells.stasis$stasisbuff.desc=كاهن الفجر عنده حاليا حليف مخزن في ركود. كل الآثار الإيجابية على هذا الحليف محفوظة، بما فيها قوة الكثيرين، وسيظهرون من جديد بجانب كاهن الفجر عندما ينتهي الأثر. يمكن إنهاء الأثر مبكرا أيضا بإعادة إلقاء الركود.\n\nالحليف في ركود: %1$s.\nالأدوار المتبقية: %2$s.
actors.hero.spells.sunray.name=شعاع الشمس
actors.hero.spells.sunray.short_desc=يسبب ضررا سحريا بعيدا ويعمي هدفا مرة واحدة.
actors.hero.spells.sunray.desc=كاهن الفجر يطلق شعاع ضوء معمٍ على هدف، يسبب ضررا %1$d-%2$d ويعميه لـ %3$d أدوار. شعاع الشمس يسبب دائما أقصى ضرر للأهداف الأموات الأحياء والمظلمة.\n\nبعد إصابة عدو بهذه التعويذة ستتكيف رؤيته، ما يمنعه من أن يُعمى بها من جديد. لكن، إن أُصيب من جديد أثناء عماه بهذه التعويذة، فالضوء ساحق ويشله بدل ذلك.
actors.hero.spells.walloflight.name=حائط النور
actors.hero.spells.walloflight.short_desc=يخلق حائطا يسد الأعداء.
actors.hero.spells.walloflight.desc=فارس الفجر يخلق حائطا مصنوعا من ألواح ضوء صلب مباشرة أمامه وهو مربع واحد سميكا، %1$d مربعات واسعا، ويدوم 20 دورا.\n\nهذا الحائط يعمل تماما كحائط عادي، عدا أنه يمكن الرؤية عبره. الأعداء العالقون في الحائط عند خلقه سيُصعقون لحظيا ويُدفعون للخلف إن أمكن. أي شيء عالق في الحائط سيستطيع الخروج منه.\n\nيمكن إلقاء الحائط في أي من الاتجاهات الأربعة الأساسية أو الأربعة القطرية. إن كان حائط نشطا أصلا، يمكن إعادة استعمال التعويذة مجانا لمسح الحائط فورا.
actors.hero.spells.walloflight.early_end=أنت تبدد حائط النور.
actors.hero.spells.walloflight$lightwall.desc=ألواح ضوء متلألئة تسد المرور هنا.
actors.hero.hero.name=أنت
actors.hero.hero.leave=لا تستطيع المغادرة بعد، بقية السراديب تنتظر في الأسفل!
actors.hero.hero.level_up=ارتقاء المستوى!
actors.hero.hero.new_level=ارتقاء المستوى! +دقة، +مراوغة، +5 صحة!
actors.hero.hero.new_talent=+1 نقطة موهبة!
actors.hero.hero.talent_auto_applied=تمت ترقية الموهبة تلقائياً: %s!
actors.hero.hero.unspent=عندك نقاط موهبة غير منفقة!
actors.hero.hero.level_cap=لا تستطيع النمو أقوى، لكن تجاربك تمنحك دفعة قوة!
actors.hero.hero.you_now_have=التقطت: %s.
actors.hero.hero.you_cant_have=لا تستطيع حمل: %s.
actors.hero.hero.locked_chest=هذا الصندوق مقفل وليس عندك مفتاح مطابق.
actors.hero.hero.locked_door=ليس عندك مفتاح مطابق.
actors.hero.hero.noticed_smth=لاحظت شيئا ما.
actors.hero.hero.wait=...
actors.hero.hero.search=ابحث
actors.hero.hero.search_distracted=من الصعب التركيز، البحث مرهق.
actors.hero.hero.key_distracted=لا تستطيع فتح القفل تماما، عليك الاستمرار في المحاولة.
actors.hero.hero.pain_resist=الألم يساعدك في مقاومة الرغبة في النوم.
actors.hero.hero.revive=العنخ ينفجر بطاقة مانحة للحياة!
actors.hero.heroclass.warrior_desc=الملك أطلس يبدأ بـ _ختم جبلي فريد_ يمنحه دفعة دروع عندما يكون دون نصف الصحة. الختم يمكن نقله بين الدروع، ويستطيع _نقل ترقية واحدة_ معه.\n\nالملك أطلس يبدأ أيضا بـ _سيف قصير بالٍ،_ _ثلاثة أحجار رمي،_ درع قماش، قربة ماء، وجراب مخمل.\n\nالملك أطلس يعرف تلقائيا:\n_-_ مخطوطات التعريف\n_-_ جرعات الشفاء\n_-_ مخطوطات الغضب
actors.hero.heroclass.mage_desc=حكيم النجوم يبدأ بـ _عصا فريدة،_ تُعاد شحنها أسرع بكثير من عصا عادية وعندها شحنة إضافية واحدة. العصا _يمكن أن تُشبع بأي عصا_ يجدها حكيم النجوم في السراديب.\n\nحكيم النجوم يبدأ أيضا بـ _عصا صاروخ سحري_ مشبعة في عصاه، درع قماش، قربة ماء، وجراب مخمل.\n\nحكيم النجوم يعرف تلقائيا:\n_-_ مخطوطات التعريف\n_-_ جرعات اللهب السائل\n_-_ مخطوطات الترقية
actors.hero.heroclass.rogue_desc=ظل الكثبان يبدأ بـ _عباءة ظلال فريدة،_ يستطيع استعمالها ليصبح غير مرئي عند الإرادة.\n\nظل الكثبان يستطيع _كشف الأسرار والفخاخ_ من مسافة أكبر.\n\nظل الكثبان يبدأ أيضا بـ _خنجر،_ _ثلاث سكاكين رمي،_ درع قماش، قربة ماء، وجراب مخمل.\n\nظل الكثبان يعرف تلقائيا:\n_-_ مخطوطات التعريف\n_-_ جرعات الاختفاء\n_-_ مخطوطات رسم الخرائط السحري
actors.hero.heroclass.huntress_desc=صيادة الأرز تبدأ بـ _قوس روح فريد،_ يستطيع إطلاق عدد لا نهائي من الأسهم المستحضرة.\n\nصيادة الأرز تستطيع السفر عبر العشب العالي _دون دوسه._\n\nصيادة الأرز تبدأ أيضا بـ _قفازات مرصعة،_ درع قماش، قربة ماء، وجراب مخمل.\n\nصيادة الأرز تعرف تلقائيا:\n_-_ مخطوطات التعريف\n_-_ جرعات رؤية العقل\n_-_ مخطوطات التهويدة
actors.hero.heroclass.duelist_desc=نصل السموم يبدأ بـ _سيف رفيع فريد_ بقدرة خاصة تُعاد شحنها مع الوقت.\n\nكل سلاح في اللعبة عنده _قدرة خاصة مختلفة_ يستطيع نصل السموم استعمالها.\n\nنصل السموم يبدأ أيضا بـ _شوكتي رمي،_ درع قماش، قربة ماء، وجراب مخمل.\n\nنصل السموم يعرف تلقائيا:\n_-_ مخطوطات التعريف\n_-_ جرعات القوة\n_-_ مخطوطات الصورة المرآتية
actors.hero.heroclass.cleric_desc=كاهن الفجر يبدأ بـ _مخطوط فجر فريد،_ يستطيعون استعماله لإلقاء تعويذات متنوعة.\n\nمعظم مواهب كاهن الفجر تركز حول تعلم أو ترقية التعويذات.\n\nكاهن الفجر يبدأ أيضا بـ _هراوة،_ درع قماش، قربة ماء، وجراب مخمل.\n\nكاهن الفجر يعرف تلقائيا:\n_-_ مخطوطات التعريف\n_-_ جرعات النقاء\n_-_ مخطوطات إزالة اللعنة
actors.hero.herosubclass.berserker_desc=غضب الجبل يكسب الغضب بينما يتلقى ضررا جسديا، بما فيه الضرر الذي يصده درعه! الغضب يتلاشى باطراد مع الوقت، لكنه يتلاشى أبطأ إن كان عند صحة منخفضة.\n\nالغضب يستطيع جعل غضب الجبل يسبب ضررا حتى +50%. عند أقصى غضب يستطيع الدخول في الهيجان المحموم، يكسب دفعة دروع ويحتفظ بغضبه طالما عنده دروع متبقية. الدروع تتناسب مع مستوى درع المحموم، ويمكن تعزيزها بشكل هائل إن كان عند صحة منخفضة. غضب الجبل يحتاج وقتا للتعافي بعد دخوله في الهيجان المحموم.
actors.hero.herosubclass.gladiator_desc=مصارع الرمال يبني نقطة سلسلة واحدة كل مرة يؤدي هجوما ناجحا بسلاح اشتباك أو مرمي. إن لم يؤدِّ مصارع الرمال هجوما ناجحا خلال 5 أدوار (15 دورا بعد قتل)، تُعاد تعيين سلسلته.\n\nبينما يبني السلسلة يستطيع مصارع الرمال استعمال قدرات متنوعة مضمونة الإصابة:\nسلسلة 2: ادفع العدو للخلف، يحفظ السلسلة\nسلسلة 4: سبب ضررا بناء على الدرع\nسلسلة 6: تصدَّ، يحفظ السلسلة\nسلسلة 8: أضر الهدف والأعداء القريبين\nسلسلة 10: هاجم مرة لكل سلسلة
actors.hero.herosubclass.battlemage_desc=حكيم المعركة يكسب أثرا إضافيا كلما ضرب في الاشتباك بعصاه، كأن عصاه عندها مسحورة إضافية. هذه الآثار تعتمد على العصا المشبعة في عصاه، كل عصا عندها أثرها الخاص. بالإضافة إلى آثار العصا، عصا حكيم المعركة ستكسب 0.5 شحنات أيضا عندما يضرب بها.
actors.hero.herosubclass.warlock_desc=رابط النجوم عنده فرصة لإلحاق علامة نجوم بالشخصيات عندما يستعمل العصي عليهم. فرصة تطبيق علامة نجوم ومدتها تزدادان مع مستوى العصا.\n\nعندما يكون عدو معلما بعلامة نجوم، سيشفى رابط النجوم 2 صحة لكل 5 ضرر يسببه لهم، لكن فقط بهجمات من أسلحة الاشتباك أو الرمي، لا من العصي!
actors.hero.herosubclass.assassin_desc=الخنجر الصامت يحضر ضربته التالية عندما يصبح غير مرئي. كلما طال تحضيره، زادت قوة هجومه التالي. الاستعداد يبنى حتى 9 أدوار.\n\nبعد الاستعداد، يسبب الخنجر الصامت ضررا إضافيا في هجومه التالي، يستطيع الخطف نحو هدفه، ويستطيع حتى قتل الأعداء فوريا إن كانوا ضعفاء كفاية.
actors.hero.herosubclass.freerunner_desc=بينما يتحرك عدّاء الكثبان يبني أكوام زخم. يستطيع كسب حتى 10 زخم بعد الركض لـ 10 أدوار، لكنه يخسره بسرعة إن توقف عن الحركة. عدّاء الكثبان يستطيع إنفاق زخمه لبدء الركض الحر، لدورين لكل نقطة زخم.\n\nعند الركض الحر يتحرك عدّاء الكثبان بسرعة ×2، ويكسب مراوغة إضافية تتناسب مع مستواه. بمجرد انتهاء الركض الحر يوجد تبريد قبل أن يُبنى الزخم من جديد.
actors.hero.herosubclass.sniper_desc=صيادة الأرز قناصة هي سيدة القتال بعيد المدى، هجماتها بعيدة المدى تخترق درع العدو. عندما تهاجم عدوا بسلاح مرمي، تضع علامة قناصة عليهم، ما يتيح لها المتابعة بهجوم خاص من قوسها. هذا الهجوم الخاص يختلف بناء على كيفية تعزيز قوسها.\n\nقوس غير معزز سيطلق لقطة سريعة تسبب ضررا منخفضا لكنها تطلق فورا. قوس سرعة سيطلق وابلا من ثلاثة أسهم تسبب ضررا منخفضا، ما زالت تستطيع تفعيل المسحورات، وتستغرق دورا واحدا للإطلاق. قوس ضرر سيطلق طلقة قناصة مضمونة الإصابة، تسبب ضررا إضافيا بناء على المسافة، وتستغرق دورين للإطلاق.
actors.hero.herosubclass.warden_desc=حارسة البستان عندها اتصال قوي بالطبيعة يمنحها آثارا إضافية متنوعة تتعلق بالعشب والنباتات. إنها قادرة على الرؤية عبر العشب العالي والمخدد كأنه مساحة فارغة.\n\nحارسة البستان تجعل العشب ينبت حول أي بذرة ترميها أو تزرعها، وتكسب آثارا خاصة عند دوس النباتات. هذه الآثار الخاصة تستبدل آثار النباتات العادية، ما يعني أن لا نبتة ضارة لها أن تخطو عليها.
actors.hero.herosubclass.champion_desc=النصلان التوأم هي سيدة أسلحة الاشتباك تستطيع تجهيز سلاح ثانوي بالإضافة إلى سلاحها الأساسي. هجماتها العادية تستعمل سلاحها الأساسي، لكنها تستطيع تبديل سلاحها الأساسي فورا واستعمال قدرة أي سلاح.\n\nتكسب أيضا شحنتي قدرة سلاح قصوى إضافيتين وسرعة إعادة شحن قدرة سلاح +50%.
actors.hero.herosubclass.monk_desc=قبضة الزفير هي سيدة التقنية الجسدية. بينما تهزم الأعداء، تكسب طاقة يمكن استعمالها في قدرات دفاعية ومساعدة متنوعة. هذه الطاقة لا تتلاشى مع الوقت، لكن عندها حد بناء على مستوى قبضة الزفير.\n\nطاقة 1: اضرب بسرعة بالقبضات\nطاقة 2: ركز لتفادي الهجوم التالي\nطاقة 3: اندفع فوريا قربا\nطاقة 4: اركل عدوا بعيدا\nطاقة 5: تأمل لإزالة الحالات واستعادة شحن العصي والآثار
actors.hero.herosubclass.priest_desc=حارسة النور تكسب تعويذات جديدة ومرقّاة متنوعة تؤكد على القتال بعيد المدى والتآزر مع الأغراض السحرية.\n\nحارسة النور تستطيع إلقاء _الضوء المرشد_ مجانا مرة كل 50 دورا، تضيء الأعداء المستهدفين مباشرة بأي من تعويذاتهم، وتستطيع استهلاك إضعاف الإضاءة بالحلفاء والعصي وبعض الآثار لضرر إضافي يعادل مستواهم + 5.\n\nحارسة النور تكسب أيضا تعويذة _الإشعاع،_ التي تبدد الظلام وتؤثر في كل الأعداء المرئيين، تطلق وتطبق الإضاءة وتصعقهم وجيزة بتكلفة شحنتين.
actors.hero.herosubclass.paladin_desc=فارسة الفجر تكسب تعويذات جديدة ومرقّاة متنوعة تؤكد على قتال الاشتباك والتآزر مع الأسلحة والدروع.\n\nتعويذتا فارسة الفجر _السلاح المقدس_ و_الحراسة المقدسة_ تمنحان مكافآت أكبر، لا تتجاوزان المسحورات والرموز الموجودة بعد، ويمكن تمديدهما بإلقاء تعويذات أخرى.\n\nفارسة الفجر تكسب أيضا تعويذة _الضربة القاضية المقدسة،_ التي تتيح لها أداء ضربة اشتباك مضمونة بضرر إضافي وقوة سحر.
actors.hero.talent$provokedangertracker.name=غضب مستفز
actors.hero.talent$provokedangertracker.desc=الملك أطلس خسر دروعه مؤخرا، هجومه الجسدي التالي سيسبب ضررا إضافيا.\n\nالأدوار المتبقية: %s.
actors.hero.talent$lingeringmagictracker.name=سحر باقٍ
actors.hero.talent$lingeringmagictracker.desc=حكيم النجوم استعمل عصا أو عصا سحرية مؤخرا، هجومه الجسدي التالي سيسبب ضررا إضافيا.\n\nالأدوار المتبقية: %s.
actors.hero.talent$followupstriketracker.name=ضربة متابعة
actors.hero.talent$followupstriketracker.desc=صيادة الأرز هاجمت عدوا مؤخرا بسلاح مرمي، هجوم اشتباكها التالي ضد نفس الهدف سيكون ضرره معززا.\n\nالأدوار المتبقية: %s.
actors.hero.talent$patientstriketracker.name=ضربة صبورة
actors.hero.talent$patientstriketracker.desc=نصل السموم قضت دورا في الانتظار للتو، هجوم اشتباكها التالي سيسبب ضررا إضافيا.
actors.hero.talent$improvisedprojectilecooldown.name=تبريد المقذوفات المرتجلة
actors.hero.talent$improvisedprojectilecooldown.desc=استعملت هذه الموهبة مؤخرا، ويجب أن تنتظر قبل استعمالها من جديد.\n\nالأدوار المتبقية: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=تبريد الخطوات المنعشة
actors.hero.talent$rejuvenatingstepscooldown.desc=استعملت هذه الموهبة مؤخرا، ويجب أن تنتظر قبل استعمالها من جديد.\n\nالأدوار المتبقية: %s.
actors.hero.talent$seershotcooldown.name=تبريد طلقة العراف
actors.hero.talent$seershotcooldown.desc=استعملت هذه الموهبة مؤخرا، ويجب أن تنتظر قبل استعمالها من جديد.\n\nالأدوار المتبقية: %s.
actors.hero.talent$aggressivebarriercooldown.name=تبريد الحاجز العدواني
actors.hero.talent$aggressivebarriercooldown.desc=استعملت هذه الموهبة مؤخرا، ويجب أن تنتظر قبل استعمالها من جديد.\n\nالأدوار المتبقية: %s.
actors.hero.talent$liquidagilacctracker.name=رشاقة سائلة
actors.hero.talent$liquidagilacctracker.desc=هجوم اشتباك نصل السموم العادي التالي سيكسب دقة إضافية.\n\nالأدوار المتبقية: %s.
actors.hero.talent$lethalhastecooldown.name=تبريد السرعة القاتلة
actors.hero.talent$lethalhastecooldown.desc=استعملت هذه الموهبة مؤخرا، ويجب أن تنتظر قبل استعمالها من جديد.\n\nالأدوار المتبقية: %s.
actors.hero.talent$swiftequipcooldown.name=تبريد التجهيز السريع
actors.hero.talent$swiftequipcooldown.desc=استعملت هذه الموهبة مؤخرا، ويجب أن تنتظر قبل استعمالها من جديد.\n\nالأدوار المتبقية: %s.
actors.hero.talent$preciseassaulttracker.name=هجوم دقيق
actors.hero.talent$preciseassaulttracker.desc=هجوم اشتباك نصل السموم العادي التالي سيكسب دقة إضافية.\n\nالأدوار المتبقية: %s.
actors.hero.talent$deadlyfollowuptracker.name=متابعة قاتلة
actors.hero.talent$deadlyfollowuptracker.desc=نصل السموم هاجم عدوا مؤخرا بسلاح مرمي، هجمات اشتباكها ضد نفس الهدف سيكون ضررها معززا.\n\nالأدوار المتبقية: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=تم التنفيذ
actors.hero.talent$satiatedspellstracker.name=تعويذة الدرع
actors.hero.talent$satiatedspellstracker.desc=التعويذة التالية التي يلقيها كاهن الفجر ستمنحهم كمية صغيرة من الدروع.
actors.hero.talent$searinglightcooldown.name=ضوء حارق
actors.hero.talent$searinglightcooldown.desc=استعملت هذه الموهبة مؤخرا، ويجب أن تنتظر قبل استعمالها من جديد.\n\nالأدوار المتبقية: %s.
actors.hero.talent.hearty_meal.title=وجبة دسمة
actors.hero.talent.hearty_meal.desc=_+1:_ أكل الطعام يشفي الملك أطلس بـ _4 صحة_ عندما يكون عند 33% صحة أو أقل.\n\n_+2:_ أكل الطعام يشفي الملك أطلس بـ _6 صحة_ عندما يكون عند 33% صحة أو أقل.
actors.hero.talent.veterans_intuition.title=حدس المخضرم
actors.hero.talent.veterans_intuition.desc=_+1:_ الملك أطلس يعرف الأسلحة _أسرع بـ 1.75 مرة_ والدروع _أسرع بـ 2.5 مرة._\n\n_+2:_ الملك أطلس يعرف الأسلحة _أسرع بـ 2.5 مرة_ والدروع _عندما يجهزها._
actors.hero.talent.provoked_anger.title=غضب مستفز
actors.hero.talent.provoked_anger.desc=_+1:_ عندما ينكسر أي تعزيز دروع مطبق على الملك أطلس بالضرر، هجومه الجسدي التالي سيسبب _3 ضرر إضافي._\n\n_+2:_ عندما ينكسر أي تعزيز دروع مطبق على الملك أطلس بالضرر، هجومه الجسدي التالي سيسبب _5 ضرر إضافي._
actors.hero.talent.iron_will.title=إرادة حديدية
actors.hero.talent.iron_will.desc=_+1:_ الدرع المقدم بختم الملك أطلس _يزداد بمقدار 1._\n\n_+2:_ الدرع المقدم بختم الملك أطلس _يزداد بمقدار 2._
actors.hero.talent.iron_will.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستمنح سلبيا نسخة درع قصوى 1 أو 2 من أثر ختم الملك أطلس المكسور.
actors.hero.talent.iron_stomach.title=معدة حديدية
actors.hero.talent.iron_stomach.desc=_+1:_ أكل الطعام يستغرق الملك أطلس دورا واحدا ويمنحه _مقاومة ضرر 75%_ أثناء الأكل.\n\n_+2:_ أكل الطعام يستغرق الملك أطلس دورا واحدا ويمنحه _مقاومة ضرر 100%_ أثناء الأكل.
actors.hero.talent.liquid_willpower.title=قوة إرادة سائلة
actors.hero.talent.liquid_willpower.desc=_+1:_ الملك أطلس يكسب _6.5% من صحته القصوى في دروع_ عند شرب أو رمي جرعة أو مزيج أو إكسير.\n\n_+2:_ الملك أطلس يكسب _10% من صحته القصوى في دروع_ عند شرب أو رمي جرعة أو مزيج أو إكسير.\n\nكمية الدرع تتضاعف عند استعمال جرعات القوة أو الخبرة، أو أغراض كيمياء يجب صنعها باستعمال تلك الجرعات.\n\nلأغراض الكيمياء ذات كميات إنتاج أعلى (مثلا مزيج الماء)، هذه الموهبة عندها فرصة للإطلاق بناء على كم من ذلك الغرض يُنتج.
actors.hero.talent.runic_transference.title=نقل روني
actors.hero.talent.runic_transference.desc=_+1:_ ختم الملك أطلس المكسور يستطيع نقل _رموز عادية_ بنفس الطريقة التي ينقل بها ترقية.\n\n_+2:_ ختم الملك أطلس المكسور يستطيع نقل _رموز عادية وقوية ولعنة_ بنفس الطريقة التي ينقل بها ترقية.\n\nالختم يستطيع نقل الرموز فقط إن طُبّقت على الدرع عندما كان الختم ملتصقا.
actors.hero.talent.runic_transference.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستساعد بدل ذلك رموز درعك على مقاومة الإزالة بمخطوطات الترقية. الرموز ستبدأ بالضياع عند الترقية من المستوى 6 (من 4) عند +1، أو المستوى 7 (من 4) عند +2. المستوى الذي تُضمن فيه خسارة الرموز لم يتغير عند +8.
actors.hero.talent.lethal_momentum.title=زخم قاتل
actors.hero.talent.lethal_momentum.desc=_+1:_ عندما يوجّه الملك أطلس ضربة قاضية لعدو بسلاح جسدي، عندها _فرصة 67%_ أن تستغرق 0 أدوار.\n\n_+2:_ عندما يوجّه الملك أطلس ضربة قاضية لعدو بسلاح جسدي، عندها _فرصة 100%_ أن تستغرق 0 أدوار.
actors.hero.talent.improvised_projectiles.title=مقذوفات مرتجلة
actors.hero.talent.improvised_projectiles.desc=_+1:_ الملك أطلس يستطيع إعماء عدو لـ _دورين_ برمي أي غرض ليس سلاحا مرميا عليه. هذا عنده تبريد 50 دورا.\n\n_+2:_ الملك أطلس يستطيع إعماء عدو لـ _3 أدوار_ برمي أي غرض ليس سلاحا مرميا عليه. هذا عنده تبريد 50 دورا.
actors.hero.talent.hold_fast.title=ثبات
actors.hero.talent.hold_fast.desc=_+1:_ عندما ينتظر الملك أطلس وختمه مجهز يكسب _درعا 1-2_ ويبطئ تلاشي تعزيزات السلسلة والدروع بنسبة _50%_ حتى يتحرك.\n\n_+2:_ عندما ينتظر الملك أطلس وختمه مجهز يكسب _درعا 2-4_ ويبطئ تلاشي تعزيزات السلسلة والدروع بنسبة _75%_ حتى يتحرك.\n\n_+3:_ عندما ينتظر الملك أطلس وختمه مجهز يكسب _درعا 3-6_ ويبطئ تلاشي تعزيزات السلسلة والدروع بنسبة _100%_ حتى يتحرك.
actors.hero.talent.hold_fast.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ لا تتطلب ختم ملك أطلس، لكنها لا تستطيع منح درع أكثر من مرتبة درعك المجهز بالإضافة إلى مستواه.
actors.hero.talent.strongman.title=رجل قوي
actors.hero.talent.strongman.desc=_+1:_ قوة الملك أطلس _تزداد بنسبة 8%،_ مقربة لأسفل.\n\n_+2:_ قوة الملك أطلس _تزداد بنسبة 13%،_ مقربة لأسفل.\n\n_+3:_ قوة الملك أطلس _تزداد بنسبة 18%،_ مقربة لأسفل.
actors.hero.talent.endless_rage.title=غضب لا نهائي
actors.hero.talent.endless_rage.desc=_+1:_ غضب الجبل يستطيع الوصول إلى حد أقصى _116% غضب._\n\n_+2:_ غضب الجبل يستطيع الوصول إلى حد أقصى _133% غضب._\n\n_+3:_ غضب الجبل يستطيع الوصول إلى حد أقصى _150% غضب._\n\nكل نقطة غضب فوق 100% تزيد دروع الهيجان بنسبة 1% وتخفض التبريد بنسبة 1%، لكنها لا تزيد مكافأة الضرر فوق +50%.
actors.hero.talent.deathless_fury.title=غضب لا يموت
actors.hero.talent.deathless_fury.desc=_+1:_ الهيجان المحموم يُطلق تلقائيا إن كان غضب الجبل على وشك الموت والغضب عند 100% أو أعلى، لكنه عنده تبريد _3 مستويات بطل_ عندما يحدث هذا.\n\n_+2:_ الهيجان المحموم يُطلق تلقائيا إن كان غضب الجبل على وشك الموت والغضب عند 100% أو أعلى، لكنه عنده تبريد _مستويي بطل_ عندما يحدث هذا.\n\n_+3:_ الهيجان المحموم يُطلق تلقائيا إن كان غضب الجبل على وشك الموت والغضب عند 100% أو أعلى، لكنه عنده تبريد _مستوى بطل واحد_ عندما يحدث هذا.\n\nلاحظ أن غضب الجبل سيظل يموت إن كان عنده 0 صحة عندما ينتهي الهيجان المحموم.
actors.hero.talent.enraged_catalyst.title=محفز مغضب
actors.hero.talent.enraged_catalyst.desc=_+1:_ مسحورات ولعنات سلاح غضب الجبل تُطلق أكثر كلما زاد غضبه، حتى حد أقصى _15% أكثر_ عند غضب 100%.\n\n_+2:_ مسحورات ولعنات سلاح غضب الجبل تُطلق أكثر كلما زاد غضبه، حتى حد أقصى _30% أكثر_ عند غضب 100%.\n\n_+3:_ مسحورات ولعنات سلاح غضب الجبل تُطلق أكثر كلما زاد غضبه، حتى حد أقصى _45% أكثر_ عند غضب 100%.
actors.hero.talent.cleave.title=شق
actors.hero.talent.cleave.desc=_+1:_ الوقت الإضافي الذي يكسبه مصارع الرمال عند قتل يزداد إلى _30 دورا،_ من 15.\n\n_+2:_ الوقت الإضافي الذي يكسبه مصارع الرمال عند قتل يزداد إلى _45 دورا،_ من 15.\n\n_+3:_ الوقت الإضافي الذي يكسبه مصارع الرمال عند قتل يزداد إلى _60 دورا،_ من 15.
actors.hero.talent.lethal_defense.title=دفاع قاتل
actors.hero.talent.lethal_defense.desc=_+1:_ عندما يقتل مصارع الرمال عدوا بحركة مركبة، تبريد دروع ختمه المكسور _يُخفَّض بمقدار 50 دورا._\n\n_+2:_ عندما يقتل مصارع الرمال عدوا بحركة مركبة، تبريد دروع ختمه المكسور _يُخفَّض بمقدار 100 دور._\n\n_+3:_ عندما يقتل مصارع الرمال عدوا بحركة مركبة، تبريد دروع ختمه المكسور _يُخفَّض بمقدار 150 دورا._\n\nتبريد الدرع يمكن تخفيضه إلى أدنى حد -150 دور بهذه الموهبة، ما يعني أنه سيكون متوفرا فورا من جديد بمجرد أن يُفعّل.
actors.hero.talent.enhanced_combo.title=سلسلة محسّنة
actors.hero.talent.enhanced_combo.desc=_+1:_ عندما تكون سلسلة مصارع الرمال 7 أو أعلى، مدى دفع الضربة الساحقة يزداد إلى 3، تسبب دوارا، وتستطيع دفع الأعداء إلى الحفر.\n\n_+2:_ بالإضافة إلى منافع +1، عندما تكون سلسلة مصارع الرمال 9 أو أعلى يعمل الصد على هجمات متعددة.\n\n_+3:_ بالإضافة إلى منافع +1 و+2، يستطيع مصارع الرمال القفز حتى سلسلة/3 مربعات عند استعمال الارتطام أو السحق أو الغضب.
actors.hero.talent.body_slam.title=ارتطام جسدي
actors.hero.talent.body_slam.desc=_+1:_ عندما يهبط الملك أطلس بعد القفز، كل الأعداء المجاورين يتلقون ضررا يعادل _1-4 بالإضافة إلى 25%_ من قوة صد ضرره.\n\n_+2:_ عندما يهبط الملك أطلس بعد القفز، كل الأعداء المجاورين يتلقون ضررا يعادل _2-8 بالإضافة إلى 50%_ من قوة صد ضرره.\n\n_+3:_ عندما يهبط الملك أطلس بعد القفز، كل الأعداء المجاورين يتلقون ضررا يعادل _3-12 بالإضافة إلى 75%_ من قوة صد ضرره.\n\n_+4:_ عندما يهبط الملك أطلس بعد القفز، كل الأعداء المجاورين يتلقون ضررا يعادل _4-16 بالإضافة إلى 100%_ من قوة صد ضرره.
actors.hero.talent.impact_wave.title=موجة ارتطام
actors.hero.talent.impact_wave.desc=_+1:_ عندما يهبط الملك أطلس بعد القفز، كل الأعداء المجاورين يُدفعون _مربعين_ للخلف وعندهم _فرصة 25%_ أن يصبحوا هشين لـ 5 أدوار.\n\n_+2:_ عندما يهبط الملك أطلس بعد القفز، كل الأعداء المجاورين يُدفعون _3 مربعات_ للخلف وعندهم _فرصة 50%_ أن يصبحوا هشين لـ 5 أدوار.\n\n_+3:_ عندما يهبط الملك أطلس بعد القفز، كل الأعداء المجاورين يُدفعون _4 مربعات_ للخلف وعندهم _فرصة 75%_ أن يصبحوا هشين لـ 5 أدوار.\n\n_+4:_ عندما يهبط الملك أطلس بعد القفز، كل الأعداء المجاورين يُدفعون _5 مربعات_ للخلف وعندهم _فرصة 100%_ أن يصبحوا هشين لـ 5 أدوار.
actors.hero.talent.double_jump.title=قفزة مزدوجة
actors.hero.talent.double_jump.desc=_+1:_ إن أدى الملك أطلس قفزة ثانية خلال 3 أدوار، تلك القفزة عندها تكلفة شحن _منخفضة بنسبة 16%._\n\n_+2:_ إن أدى الملك أطلس قفزة ثانية خلال 3 أدوار، تلك القفزة عندها تكلفة شحن _منخفضة بنسبة 30%._\n\n_+3:_ إن أدى الملك أطلس قفزة ثانية خلال 3 أدوار، تلك القفزة عندها تكلفة شحن _منخفضة بنسبة 40%._\n\n_+4:_ إن أدى الملك أطلس قفزة ثانية خلال 3 أدوار، تلك القفزة عندها تكلفة شحن _منخفضة بنسبة 50%._
actors.hero.talent.expanding_wave.title=موجة متوسعة
actors.hero.talent.expanding_wave.desc=_+1:_ مدى موجة الصدمة يزداد إلى _6 مربعات_ من 5، وعرضها يزداد إلى _75 درجة_ من 60.\n\n_+2:_ مدى موجة الصدمة يزداد إلى _7 مربعات_ من 5، وعرضها يزداد إلى _90 درجة_ من 60.\n\n_+3:_ مدى موجة الصدمة يزداد إلى _8 مربعات_ من 5، وعرضها يزداد إلى _105 درجة_ من 60.\n\n_+4:_ مدى موجة الصدمة يزداد إلى _9 مربعات_ من 5، وعرضها يزداد إلى _120 درجة_ من 60.
actors.hero.talent.striking_wave.title=موجة ضاربة
actors.hero.talent.striking_wave.desc=_+1:_ موجة الصدمة عندها _فرصة 30%_ أن تستعمل آثار عند الضرب أيضا كالمسحورات والسلسلة.\n\n_+2:_ موجة الصدمة عندها _فرصة 60%_ أن تستعمل آثار عند الضرب أيضا كالمسحورات والسلسلة.\n\n_+3:_ موجة الصدمة عندها _فرصة 90%_ أن تستعمل آثار عند الضرب أيضا كالمسحورات والسلسلة.\n\n_+4:_ موجة الصدمة عندها _فرصة 100%_ أن تستعمل آثار عند الضرب أيضا كالمسحورات والسلسلة، وتمنح المسحورات _قوة +20%_.
actors.hero.talent.shock_force.title=قوة الصدمة
actors.hero.talent.shock_force.desc=_+1:_ موجة الصدمة تسبب _ضررا أكثر بنسبة 20%_ وعندها _فرصة 25%_ أن تصعق بدل أن تشل.\n\n_+2:_ موجة الصدمة تسبب _ضررا أكثر بنسبة 40%_ وعندها _فرصة 50%_ أن تصعق بدل أن تشل.\n\n_+3:_ موجة الصدمة تسبب _ضررا أكثر بنسبة 60%_ وعندها _فرصة 75%_ أن تصعق بدل أن تشل.\n\n_+4:_ موجة الصدمة تسبب _ضررا أكثر بنسبة 80%_ وعندها _فرصة 100%_ أن تصعق بدل أن تشل.
actors.hero.talent.sustained_retribution.title=قصاص مستمر
actors.hero.talent.sustained_retribution.desc=_+1:_ الملك أطلس يسبب _ضررا إضافيا 115%_ موزعا على _ضربتين،_ بدل ضرر إضافي 100% في ضربة واحدة.\n\n_+2:_ الملك أطلس يسبب _ضررا إضافيا 130%_ موزعا على _3 ضربات،_ بدل ضرر إضافي 100% في ضربة واحدة.\n\n_+3:_ الملك أطلس يسبب _ضررا إضافيا 145%_ موزعا على _4 ضربات،_ بدل ضرر إضافي 100% في ضربة واحدة.\n\n_+4:_ الملك أطلس يسبب _ضررا إضافيا 160%_ موزعا على _5 ضربات،_ بدل ضرر إضافي 100% في ضربة واحدة.
actors.hero.talent.shrug_it_off.title=تجاهل الأمر
actors.hero.talent.shrug_it_off.desc=_+1:_ تخفيض ضرر الملك أطلس أثناء التحمل _يزداد إلى 60%،_ من 50%.\n\n_+2:_ تخفيض ضرر الملك أطلس أثناء التحمل _يزداد إلى 68%،_ من 50%.\n\n_+3:_ تخفيض ضرر الملك أطلس أثناء التحمل _يزداد إلى 74%،_ من 50%.\n\n_+4:_ تخفيض ضرر الملك أطلس أثناء التحمل _يزداد إلى 80%،_ من 50%.
actors.hero.talent.even_the_odds.title=معادلة الكفة
actors.hero.talent.even_the_odds.desc=_+1:_ الملك أطلس يسبب _ضررا إضافيا 5%_ إضافيا لكل عدو داخل مربعين عندما ينتهي التحمل.\n\n_+2:_ الملك أطلس يسبب _ضررا إضافيا 10%_ إضافيا لكل عدو داخل مربعين عندما ينتهي التحمل.\n\n_+3:_ الملك أطلس يسبب _ضررا إضافيا 15%_ إضافيا لكل عدو داخل مربعين عندما ينتهي التحمل.\n\n_+4:_ الملك أطلس يسبب _ضررا إضافيا 20%_ إضافيا لكل عدو داخل مربعين عندما ينتهي التحمل.
actors.hero.talent.empowering_meal.title=وجبة معززة
actors.hero.talent.empowering_meal.desc=_+1:_ أكل الطعام يمنح حكيم النجوم _ضررا إضافيا 2_ في المرات الثلاث التالية التي يسبب فيها ضررا بعصا.\n\n_+2:_ أكل الطعام يمنح حكيم النجوم _ضررا إضافيا 3_ في المرات الثلاث التالية التي يسبب فيها ضررا بعصا.
actors.hero.talent.scholars_intuition.title=حدس العالم
actors.hero.talent.scholars_intuition.desc=_+1:_ حكيم النجوم يعرف العصي _أسرع بـ 3 مرات._\n\n_+2:_ حكيم النجوم يعرف العصي _عندما يستعملها._
actors.hero.talent.lingering_magic.title=سحر باقٍ
actors.hero.talent.lingering_magic.desc=_+1:_ عندما يصعق حكيم النجوم بعصا أو عصاه، هجومه الجسدي التالي يسبب _ضررا إضافيا 1-2._\n\n_+2:_ عندما يصعق حكيم النجوم بعصا أو عصاه، هجومه الجسدي التالي يسبب _ضررا إضافيا 2._
actors.hero.talent.backup_barrier.title=حاجز احتياطي
actors.hero.talent.backup_barrier.desc=_+1:_ حكيم النجوم يكسب _3 دروع_ كلما أنفق الشحنة الأخيرة في عصاه.\n\n_+2:_ حكيم النجوم يكسب _5 دروع_ كلما أنفق الشحنة الأخيرة في عصاه.
actors.hero.talent.backup_barrier.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستُطلق بدل ذلك من عصا البطل الأعلى مستوى.
actors.hero.talent.energizing_meal.title=وجبة منشطة
actors.hero.talent.energizing_meal.desc=_+1:_ أكل الطعام يستغرق حكيم النجوم دورا واحدا ويمنحه _5 أدوار من إعادة شحن العصي._\n\n_+2:_ أكل الطعام يستغرق حكيم النجوم دورا واحدا ويمنحه _8 أدوار من إعادة شحن العصي._
actors.hero.talent.inscribed_power.title=قوة منقوشة
actors.hero.talent.inscribed_power.desc=_+1:_ عندما يقرأ حكيم النجوم مخطوطة أو يستعمل غرض تعويذة، _صعقات عصاه التاليتان_ تكسبان مستويين +2.\n\n_+2:_ عندما يقرأ حكيم النجوم مخطوطة أو يستعمل غرض تعويذة، _صعقات عصاه الثلاث التالية_ تكسب مستويين +2.\n\nعدد صعقات العصي المحسّنة يتضاعف عند استعمال مخطوطة ترقية أو تحويل، أو أغراض كيمياء يجب صنعها باستعمال تلك المخطوطات.\n\nلأغراض الكيمياء ذات كميات إنتاج أعلى (مثلا معظم التعويذات)، هذه الموهبة عندها فرصة للإطلاق بناء على كم من ذلك الغرض يُنتج.
actors.hero.talent.wand_preservation.title=حفظ العصي
actors.hero.talent.wand_preservation.desc=_+1:_ عندما يشبع حكيم النجوم عصا جديدة في عصاه، العصا القديمة تُرجع عند +0، _لكن هذا يمكن فعله مرة واحدة فقط._\n\n_+2:_ عندما يشبع حكيم النجوم عصا جديدة في عصاه، العصا القديمة تُرجع عند +0، _يمكن تكرار هذا بتبريد مستوى بطل واحد._
actors.hero.talent.wand_preservation.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستزيد بدل ذلك كمية الراتنج الغامض المكسوبة عند وضع عصا في قدر كيمياء بمقدار 1 عند +1، أو بمقدار 2 عند +2.
actors.hero.talent.arcane_vision.title=رؤية غامضة
actors.hero.talent.arcane_vision.desc=_+1:_ عندما يصعق حكيم النجوم عدوا، يكسب رؤية عقل عليهم لـ _10 أدوار._\n\n_+2:_ عندما يصعق حكيم النجوم عدوا، يكسب رؤية عقل عليهم لـ _15 دورا._
actors.hero.talent.shield_battery.title=بطارية الدروع
actors.hero.talent.shield_battery.desc=_+1:_ حكيم النجوم يستطيع استهداف نفسه بعصا لتحويل كل شحناتها إلى دروع بمعدل _4% صحة قصوى لكل شحنة._\n\n_+2:_ حكيم النجوم يستطيع استهداف نفسه بعصا لتحويل كل شحناتها إلى دروع بمعدل _6% صحة قصوى لكل شحنة._
actors.hero.talent.desperate_power.title=قوة يائسة
actors.hero.talent.desperate_power.desc=_+1:_ عصي حكيم النجوم وعصاه تكسب _مستوى +1_ في صعقتها الأخيرة عندما تكون عند شحنتها الأخيرة.\n\n_+2:_ عصي حكيم النجوم وعصاه تكسب _مستويين +2_ في صعقتها الأخيرة عندما تكون عند شحنتها الأخيرة.\n\n_+3:_ عصي حكيم النجوم وعصاه تكسب _مستويات +3_ في صعقتها الأخيرة عندما تكون عند شحنتها الأخيرة.
actors.hero.talent.ally_warp.title=التواء الحليف
actors.hero.talent.ally_warp.desc=_+1:_ حكيم النجوم يستطيع اختيار حليف ليتبادل الأماكن معه فورا، بمدى _مربعين._\n\n_+2:_ حكيم النجوم يستطيع اختيار حليف ليتبادل الأماكن معه فورا، بمدى _4 مربعات._\n\n_+3:_ حكيم النجوم يستطيع اختيار حليف ليتبادل الأماكن معه فورا، بمدى _6 مربعات._\n\nحكيم النجوم لا يستطيع تبادل الأماكن مع حلفاء غير متحركين.
actors.hero.talent.empowered_strike.title=ضربة معززة
actors.hero.talent.empowered_strike.desc=_+1:_ ضربة اشتباك حكيم المعركة الأولى بعصاه بعد الصعق بها تسبب _ضررا +16%_ وأثر عصاه الإضافي يكسب _قوة +50%._\n\n_+2:_ ضربة اشتباك حكيم المعركة الأولى بعصاه بعد الصعق بها تسبب _ضررا +33%_ وأثر عصاه الإضافي يكسب _قوة +100%._\n\n_+3:_ ضربة اشتباك حكيم المعركة الأولى بعصاه بعد الصعق بها تسبب _ضررا +50%_ وأثر عصاه الإضافي يكسب _قوة +150%._
actors.hero.talent.mystical_charge.title=شحنة غامضة
actors.hero.talent.mystical_charge.desc=_+1:_ الضرب بعصاه يمنح حكيم المعركة _0.5 أدوار_ من إعادة شحن الأثر.\n\n_+2:_ الضرب بعصاه يمنح حكيم المعركة _دورا واحدا_ من إعادة شحن الأثر.\n\n_+3:_ الضرب بعصاه يمنح حكيم المعركة _1.5 أدوار_ من إعادة شحن الأثر.
actors.hero.talent.excess_charge.title=شحنة زائدة
actors.hero.talent.excess_charge.desc=_+1:_ عندما تكون عصا حكيم المعركة مشحونة بالكامل، صعقتها التالية ستمنحه _0.67 دروع_ لكل مستوى من العصا.\n\n_+2:_ عندما تكون عصا حكيم المعركة مشحونة بالكامل، صعقتها التالية ستمنحه _1.33 دروع_ لكل مستوى من العصا.\n\n_+3:_ عندما تكون عصا حكيم المعركة مشحونة بالكامل، صعقتها التالية ستمنحه _2 دروع_ لكل مستوى من العصا.
actors.hero.talent.soul_siphon.title=امتصاص النجوم
actors.hero.talent.soul_siphon.desc=_+1:_ الضرر الجسدي الذي تسببه شخصيات أخرى يطلق علامة نجوم رابط النجوم عند _فعالية 13%._\n\n_+2:_ الضرر الجسدي الذي تسببه شخصيات أخرى يطلق علامة نجوم رابط النجوم عند _فعالية 27%._\n\n_+3:_ الضرر الجسدي الذي تسببه شخصيات أخرى يطلق علامة نجوم رابط النجوم عند _فعالية 40%._
actors.hero.talent.soul_eater.title=آكل النجوم
actors.hero.talent.soul_eater.desc=_+1:_ علامة النجوم تمنح _0.33 أدوار_ من الإشباع لكل ضرر جسدي مسبب. الأعداء المعلمون بعلامة النجوم عندهم _فرصة 10%_ لإطلاق آثار عند الأكل عندما يموتون.\n\n_+2:_ علامة النجوم تمنح _0.67 أدوار_ من الإشباع لكل ضرر جسدي مسبب. الأعداء المعلمون بعلامة النجوم عندهم _فرصة 20%_ لإطلاق آثار عند الأكل عندما يموتون.\n\n_+3:_ علامة النجوم تمنح _دورا واحدا_ من الإشباع لكل ضرر جسدي مسبب. الأعداء المعلمون بعلامة النجوم عندهم _فرصة 30%_ لإطلاق آثار عند الأكل عندما يموتون.
actors.hero.talent.necromancers_minions.title=أتباع ساحر الأموات
actors.hero.talent.necromancers_minions.desc=_+1:_ عندما يموت عدو معلم بعلامة نجوم، رابط النجوم عنده _فرصة 13%_ أن يرفعهم كخيل فاسد.\n\n_+2:_ عندما يموت عدو معلم بعلامة نجوم، رابط النجوم عنده _فرصة 27%_ أن يرفعهم كخيل فاسد.\n\n_+3:_ عندما يموت عدو معلم بعلامة نجوم، رابط النجوم عنده _فرصة 40%_ أن يرفعهم كخيل فاسد.
actors.hero.talent.blast_radius.title=نصف قطر الانفجار
actors.hero.talent.blast_radius.desc=_+1:_ نصف قطر الانفجار العنصري يزداد إلى _5 مربعات،_ من 4.\n\n_+2:_ نصف قطر الانفجار العنصري يزداد إلى _6 مربعات،_ من 4.\n\n_+3:_ نصف قطر الانفجار العنصري يزداد إلى _7 مربعات،_ من 4.\n\n_+4:_ نصف قطر الانفجار العنصري يزداد إلى _8 مربعات،_ من 4.
actors.hero.talent.elemental_power.title=قوة عنصرية
actors.hero.talent.elemental_power.desc=_+1:_ قوة الانفجار العنصري تزداد بنسبة _25%._\n\n_+2:_ قوة الانفجار العنصري تزداد بنسبة _50%._\n\n_+3:_ قوة الانفجار العنصري تزداد بنسبة _75%._\n\n_+4:_ قوة الانفجار العنصري تزداد بنسبة _100%._
actors.hero.talent.reactive_barrier.title=حاجز تفاعلي
actors.hero.talent.reactive_barrier.desc=_+1:_ حكيم النجوم يكسب _2.5 دروع_ لكل شخصية متأثرة بالانفجار العنصري، حتى حد أقصى 5 شخصيات.\n\n_+2:_ حكيم النجوم يكسب _5 دروع_ لكل شخصية متأثرة بالانفجار العنصري، حتى حد أقصى 6 شخصيات.\n\n_+3:_ حكيم النجوم يكسب _7.5 دروع_ لكل شخصية متأثرة بالانفجار العنصري، حتى حد أقصى 7 شخصيات.\n\n_+4:_ حكيم النجوم يكسب _10 دروع_ لكل شخصية متأثرة بالانفجار العنصري، حتى حد أقصى 8 شخصيات.
actors.hero.talent.wild_power.title=قوة برية
actors.hero.talent.wild_power.desc=_+1:_ عند استعمال السحر البري، العصي ستُعزز إما بـ _2 أو 3، حتى +4._\n\n_+2:_ عند استعمال السحر البري، العصي ستُعزز بـ _3، حتى +5._\n\n_+3:_ عند استعمال السحر البري، العصي ستُعزز إما بـ _3 أو 4، حتى +6._\n\n_+4:_ عند استعمال السحر البري، العصي ستُعزز بـ _4، حتى +7._
actors.hero.talent.fire_everything.title=أطلق كل شيء
actors.hero.talent.fire_everything.desc=_+1:_ السحر البري يطلق الآن _5 مرات_ من 4، وكل عصا عندها _فرصة 25%_ أن تكون قابلة للاستعمال 3 مرات.\n\n_+2:_ السحر البري يطلق الآن _6 مرات_ من 4، وكل عصا عندها _فرصة 50%_ أن تكون قابلة للاستعمال 3 مرات.\n\n_+3:_ السحر البري يطلق الآن _7 مرات_ من 4، وكل عصا عندها _فرصة 75%_ أن تكون قابلة للاستعمال 3 مرات.\n\n_+4:_ السحر البري يطلق الآن _8 مرات_ من 4، وكل عصا عندها _فرصة 100%_ أن تكون قابلة للاستعمال 3 مرات.
actors.hero.talent.conserved_magic.title=سحر محفوظ
actors.hero.talent.conserved_magic.desc=_+1:_ كل صعقة من السحر البري تستعمل الآن _0.33 شحنات_ بدل 0.5، والسحر البري عنده _فرصة 25%_ ألا ينفق دورا.\n\n_+2:_ كل صعقة من السحر البري تستعمل الآن _0.225 شحنات_ بدل 0.5، والسحر البري عنده _فرصة 50%_ ألا ينفق دورا.\n\n_+3:_ كل صعقة من السحر البري تستعمل الآن _0.15 شحنات_ بدل 0.5، والسحر البري عنده _فرصة 75%_ ألا ينفق دورا.\n\n_+4:_ كل صعقة من السحر البري تستعمل الآن _0.1 شحنات_ بدل 0.5، والسحر البري عنده _فرصة 100%_ ألا ينفق دورا.
actors.hero.talent.telefrag.title=قتل الالتواء
actors.hero.talent.telefrag.desc=_+1:_ إن التواء حكيم النجوم إلى شخصية أخرى يسبب لها _ضررا 10-15،_ لكنه يتلقى _5 ضرر_ أيضا.\n\n_+2:_ إن التواء حكيم النجوم إلى شخصية أخرى يسبب لها _ضررا 20-30،_ لكنه يتلقى _10 ضرر_ أيضا.\n\n_+3:_ إن التواء حكيم النجوم إلى شخصية أخرى يسبب لها _ضررا 30-45،_ لكنه يتلقى _15 ضرر_ أيضا.\n\n_+4:_ إن التواء حكيم النجوم إلى شخصية أخرى يسبب لها _ضررا 40-60،_ لكنه يتلقى _20 ضرر_ أيضا.\n\nالبطل لا يمكن أن يُقتل بهذه الموهبة، الضرر الذاتي يمكن تخفيضه بآثار مقاومة السحر.
actors.hero.talent.remote_beacon.title=منارة بعيدة
actors.hero.talent.remote_beacon.desc=_+1:_ حكيم النجوم يستطيع وضع منارة في أي موقع داخل _4 مربعات._\n\n_+2:_ حكيم النجوم يستطيع وضع منارة في أي موقع داخل _8 مربعات._\n\n_+3:_ حكيم النجوم يستطيع وضع منارة في أي موقع داخل _12 مربعا._\n\n_+4:_ حكيم النجوم يستطيع وضع منارة في أي موقع داخل _16 مربعا._\n\nحكيم النجوم لا يستطيع وضع منارات في مواقع لا يمكن الوصول إليها.
actors.hero.talent.longrange_warp.title=التواء بعيد المدى
actors.hero.talent.longrange_warp.desc=_+1:_ حكيم النجوم يستطيع الآن الالتواء بين الطوابق، بتكلفة شحن _150%._\n\n_+2:_ حكيم النجوم يستطيع الآن الالتواء بين الطوابق، بتكلفة شحن _117%._\n\n_+3:_ حكيم النجوم يستطيع الآن الالتواء بين الطوابق، بتكلفة شحن _83%._\n\n_+4:_ حكيم النجوم يستطيع الآن الالتواء بين الطوابق، بتكلفة شحن _50%._\n\nحكيم النجوم لا يستطيع استعمال الالتواء بعيد المدى لمغادرة طابق مقفل.
actors.hero.talent.cached_rations.title=حصص مخزنة
actors.hero.talent.cached_rations.desc=_+1:_ ظل الكثبان يستطيع إيجاد _حصتي إمداد_ موضوعتين في صناديق بينما يستكشف الطوابق القليلة التالية من السراديب.\n\n_+2:_ ظل الكثبان يستطيع إيجاد _3 حصص إمداد_ موضوعة في صناديق بينما يستكشف الطوابق القليلة التالية من السراديب.\n\nحصص الإمداد تُؤكل بسرعة، تستعيد كمية معتدلة من الإشباع، تشفي 5 صحة، وتستعيد شحنة واحدة لعباءة الظلال.
actors.hero.talent.thiefs_intuition.title=حدس اللص
actors.hero.talent.thiefs_intuition.desc=_+1:_ ظل الكثبان يعرف الخواتم _أسرع بـ مرتين،_ ويعرف نوع الخاتم _عندما يجهزه._\n\n_+2:_ ظل الكثبان يعرف الخواتم _عندما يجهزها،_ ويعرف نوع الخاتم _عندما يلتقطه._
actors.hero.talent.sucker_punch.title=لكمة غادرة
actors.hero.talent.sucker_punch.desc=_+1:_ ظل الكثبان يسبب _ضررا إضافيا 1-2_ أول مرة يباغت عدوا فيها.\n\n_+2:_ ظل الكثبان يسبب _ضررا إضافيا 2_ أول مرة يباغت عدوا فيها.
actors.hero.talent.protective_shadows.title=ظلال وقائية
actors.hero.talent.protective_shadows.desc=_+1:_ ظل الكثبان يكسب درعا واحدا _كل دور آخر_ هو غير مرئي، _حتى حد أقصى 3._\n\n_+2:_ ظل الكثبان يكسب درعا واحدا _كل دور_ هو غير مرئي، _حتى حد أقصى 5._
actors.hero.talent.mystical_meal.title=وجبة غامضة
actors.hero.talent.mystical_meal.desc=_+1:_ أكل الطعام يستغرق ظل الكثبان دورا واحدا (حصص الإمداد تُؤكل فورا) ويمنحه _3 أدوار من إعادة شحن الأثر._\n\n_+2:_ أكل الطعام يستغرق ظل الكثبان دورا واحدا (حصص الإمداد تُؤكل فورا) ويمنحه _5 أدوار من إعادة شحن الأثر._\n\nهذه الموهبة لا يمكن استعمالها لترك قرن الوفرة يعيد شحن نفسه.
actors.hero.talent.inscribed_stealth.title=تخفٍّ منقوش
actors.hero.talent.inscribed_stealth.desc=_+1:_ ظل الكثبان يكسب _3 أدوار_ من الاختفاء بعد قراءة مخطوطة أو استعمال غرض تعويذة.\n\n_+2:_ ظل الكثبان يكسب _5 أدوار_ من الاختفاء بعد قراءة مخطوطة أو استعمال غرض تعويذة.\n\nمدة الاختفاء تتضاعف عند استعمال مخطوطة ترقية، مخطوطة تحويل، أو أغراض كيمياء يجب صنعها باستعمال تلك المخطوطات.\n\nلأغراض الكيمياء ذات كميات إنتاج أعلى (مثلا معظم التعويذات)، هذه الموهبة عندها فرصة للإطلاق بناء على كم من ذلك الغرض يُنتج.
actors.hero.talent.wide_search.title=بحث واسع
actors.hero.talent.wide_search.desc=_+1:_ نصف قطر بحث ظل الكثبان يزداد من مربع 5x5 إلى _دائرة 7x7._\n\n_+2:_ نصف قطر بحث ظل الكثبان يزداد من مربع 5x5 إلى _مربع 7x7._
actors.hero.talent.wide_search.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستزيد بدل ذلك نصف قطر بحثهم من مربع 3x3 إلى دائرة 5x5 عند +1، أو مربع 5x5 عند +2.
actors.hero.talent.silent_steps.title=خطوات صامتة
actors.hero.talent.silent_steps.desc=_+1:_ ظل الكثبان لن يوقظ الأعداء النائمين بينما هو _على بعد 3 مربعات أو أكثر منهم._\n\n_+2:_ ظل الكثبان لن يوقظ الأعداء النائمين بينما هو _غير مجاور لهم._
actors.hero.talent.rogues_foresight.title=تنبؤ اللص
actors.hero.talent.rogues_foresight.desc=_+1:_ عندما يكون ظل الكثبان في مستوى فيه غرفة سرية، عنده _فرصة 75% أن يلاحظ_ أن المستوى يحتوي سرا.\n\n_+2:_ عندما يكون ظل الكثبان في مستوى فيه غرفة سرية، عنده _فرصة 100% أن يلاحظ_ أن المستوى يحتوي سرا.
actors.hero.talent.light_cloak.title=عباءة خفيفة
actors.hero.talent.light_cloak.desc=_+1:_ ظل الكثبان يستطيع استعمال عباءة ظلاله عندما تكون غير مجهزة، لكنها تُعاد شحنها بسرعة _25%_ عندما تكون غير مجهزة.\n\n_+2:_ ظل الكثبان يستطيع استعمال عباءة ظلاله عندما تكون غير مجهزة، لكنها تُعاد شحنها بسرعة _50%_ عندما تكون غير مجهزة.\n\n_+3:_ ظل الكثبان يستطيع استعمال عباءة ظلاله عندما تكون غير مجهزة، لكنها تُعاد شحنها بسرعة _75%_ عندما تكون غير مجهزة.
actors.hero.talent.light_cloak.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستزيد بدل ذلك سرعة شحن كل الآثار بنسبة 7/13/20% عند +1/+2/+3.
actors.hero.talent.enhanced_rings.title=خواتم محسّنة
actors.hero.talent.enhanced_rings.desc=_+1:_ عندما يستعمل ظل الكثبان أثرا، خواتمه تكسب ترقية +1 لـ _3 أدوار._\n\n_+2:_ عندما يستعمل ظل الكثبان أثرا، خواتمه تكسب ترقية +1 لـ _6 أدوار._\n\n_+3:_ عندما يستعمل ظل الكثبان أثرا، خواتمه تكسب ترقية +1 لـ _9 أدوار._
actors.hero.talent.enhanced_lethality.title=فتك محسّن
actors.hero.talent.enhanced_lethality.desc=_+1:_ الخنجر الصامت يستطيع اغتيال الأعداء المتروكين تحت _صحة 4/13/27/67%_ لكل مستوى استعداد، من 3/10/20/50%.\n\n_+2:_ الخنجر الصامت يستطيع اغتيال الأعداء المتروكين تحت _صحة 5/17/33/83%_ لكل مستوى استعداد، من 3/10/20/50%.\n\n_+3:_ الخنجر الصامت يستطيع اغتيال الأعداء المتروكين تحت _صحة 6/20/40/100%_ لكل مستوى استعداد، من 3/10/20/50%.
actors.hero.talent.assassins_reach.title=مدى القاتل
actors.hero.talent.assassins_reach.desc=_+1:_ مدى خطف الخنجر الصامت لكل مستوى استعداد يزداد إلى _مربعات 1/3/4/6،_ من 1/2/3/4.\n\n_+2:_ مدى خطف الخنجر الصامت لكل مستوى استعداد يزداد إلى _مربعات 2/4/6/8،_ من 1/2/3/4.\n\n_+3:_ مدى خطف الخنجر الصامت لكل مستوى استعداد يزداد إلى _مربعات 2/5/7/10،_ من 1/2/3/4.\n\nهذا الخطف يستطيع العبور عبر المخاطر والأعداء، لكن لا عبر التضاريس الصلبة كالحيطان.
actors.hero.talent.bounty_hunter.title=صياد المكافآت
actors.hero.talent.bounty_hunter.desc=_+1:_ عندما يقتل الخنجر الصامت عدوا بضربة مستعدة فرصة سقوط غرضهم تزداد بمقدار _2/4/8/16%،_ لكل مستوى استعداد.\n\n_+2:_ عندما يقتل الخنجر الصامت عدوا بضربة مستعدة فرصة سقوط غرضهم تزداد بمقدار _4/8/16/32%،_ لكل مستوى استعداد.\n\n_+3:_ عندما يقتل الخنجر الصامت عدوا بضربة مستعدة فرصة سقوط غرضهم تزداد بمقدار _6/12/24/48%،_ لكل مستوى استعداد.
actors.hero.talent.evasive_armor.title=درع مراوغ
actors.hero.talent.evasive_armor.desc=_+1:_ أثناء الركض الحر، عدّاء الكثبان يكسب _مراوغة +1_ إضافية لكل نقطة قوة زائدة على درعه.\n\n_+2:_ أثناء الركض الحر، عدّاء الكثبان يكسب _مراوغة +2_ إضافية لكل نقطة قوة زائدة على درعه.\n\n_+3:_ أثناء الركض الحر، عدّاء الكثبان يكسب _مراوغة +3_ إضافية لكل نقطة قوة زائدة على درعه.
actors.hero.talent.projectile_momentum.title=زخم المقذوفات
actors.hero.talent.projectile_momentum.desc=_+1:_ أثناء الركض الحر، عدّاء الكثبان يكسب _دقة +50% وضررا +15%_ بالأسلحة المرماة.\n\n_+2:_ أثناء الركض الحر، عدّاء الكثبان يكسب _دقة +100% وضررا +30%_ بالأسلحة المرماة.\n\n_+3:_ أثناء الركض الحر، عدّاء الكثبان يكسب _دقة +150% وضررا +45%_ بالأسلحة المرماة.
actors.hero.talent.speedy_stealth.title=تخفٍّ سريع
actors.hero.talent.speedy_stealth.desc=_+1:_ عدّاء الكثبان يكسب كومتي زخم في كل دور بينما هو غير مرئي.\n\n_+2:_ بالإضافة إلى منافع +1، الركض الحر لا يُعد تنازليا بعد بينما عدّاء الكثبان غير مرئي.\n\n_+3:_ بالإضافة إلى منافع +1 و+2، عدّاء الكثبان يتحرك بسرعة ×2 بينما هو غير مرئي، بغض النظر عما إذا كان يركض حرا أم لا.
actors.hero.talent.hasty_retreat.title=تراجع متعجل
actors.hero.talent.hasty_retreat.desc=_+1:_ بعد الخطف ظل الكثبان يكسب _دورا واحدا_ من السرعة والاختفاء.\n\n_+2:_ بعد الخطف ظل الكثبان يكسب _دورين_ من السرعة والاختفاء.\n\n_+3:_ بعد الخطف ظل الكثبان يكسب _3 أدوار_ من السرعة والاختفاء.\n\n_+4:_ بعد الخطف ظل الكثبان يكسب _4 أدوار_ من السرعة والاختفاء.
actors.hero.talent.body_replacement.title=استبدال الجسد
actors.hero.talent.body_replacement.desc=_+1:_ بعد الخطف، ظل الكثبان يترك خلفه طعما خشبيا عنده _20 صحة ودرع 1-3._\n\n_+2:_ بعد الخطف، ظل الكثبان يترك خلفه طعما خشبيا عنده _40 صحة ودرع 2-6._\n\n_+3:_ بعد الخطف، ظل الكثبان يترك خلفه طعما خشبيا عنده _60 صحة ودرع 3-9._\n\n_+4:_ بعد الخطف، ظل الكثبان يترك خلفه طعما خشبيا عنده _80 صحة ودرع 4-12._\n\nطعوم واحد فقط يمكن أن يكون نشطا في وقت واحد.
actors.hero.talent.shadow_step.title=خطوة الظل
actors.hero.talent.shadow_step.desc=_+1:_ إن استعمل اللص قنبلة الدخان أثناء الاختفاء، تحدث فورا وعندها تكلفة شحن _منخفضة بنسبة 16%،_ لكنها لا تعمي الأعداء ولا تطلق مواهب أخرى أيضا.\n\n_+2:_ إن استعمل اللص قنبلة الدخان أثناء الاختفاء، تحدث فورا وعندها تكلفة شحن _منخفضة بنسبة 30%،_ لكنها لا تعمي الأعداء ولا تطلق مواهب أخرى أيضا.\n\n_+3:_ إن استعمل اللص قنبلة الدخان أثناء الاختفاء، تحدث فورا وعندها تكلفة شحن _منخفضة بنسبة 41%،_ لكنها لا تعمي الأعداء ولا تطلق مواهب أخرى أيضا.\n\n_+4:_ إن استعمل اللص قنبلة الدخان أثناء الاختفاء، تحدث فورا وعندها تكلفة شحن _منخفضة بنسبة 50%،_ لكنها لا تعمي الأعداء ولا تطلق مواهب أخرى أيضا.
actors.hero.talent.fear_the_reaper.title=اخشَ الحاصد
actors.hero.talent.fear_the_reaper.desc=_+1:_ عندما يصل عدو معلم بعلامة الموت إلى 0 صحة، يصبح _مشلولا._\n\n_+2:_ عندما يصل عدو معلم بعلامة الموت إلى 0 صحة، يصبح _خائفا ومشلولا._\n\n_+3:_ عندما يصل عدو معلم بعلامة الموت إلى 0 صحة، يصبح _خائفا ومشلولا_ والأعداء داخل 3 مربعات يصبحون _مشلولين._\n\n_+4:_ عندما يصل عدو معلم بعلامة الموت إلى 0 صحة، يصبح _خائفا ومشلولا_ والأعداء داخل 3 مربعات يصبحون _خائفين ومشلولين._
actors.hero.talent.deathly_durability.title=متانة مميتة
actors.hero.talent.deathly_durability.desc=_+1:_ الأعداء الذين قتلتهم علامة الموت يمنحون ظل الكثبان دروعا تعادل _13%_ من صحتهم عندما عُلّموا.\n\n_+2:_ الأعداء الذين قتلتهم علامة الموت يمنحون ظل الكثبان دروعا تعادل _25%_ من صحتهم عندما عُلّموا.\n\n_+3:_ الأعداء الذين قتلتهم علامة الموت يمنحون ظل الكثبان دروعا تعادل _38%_ من صحتهم عندما عُلّموا.\n\n_+4:_ الأعداء الذين قتلتهم علامة الموت يمنحون ظل الكثبان دروعا تعادل _50%_ من صحتهم عندما عُلّموا.
actors.hero.talent.double_mark.title=علامة مزدوجة
actors.hero.talent.double_mark.desc=_+1:_ تعليم هدف ثانٍ في نفس وقت الأول عنده تكلفة شحن _منخفضة بنسبة 30%._\n\n_+2:_ تعليم هدف ثانٍ في نفس وقت الأول عنده تكلفة شحن _منخفضة بنسبة 50%._\n\n_+3:_ تعليم هدف ثانٍ في نفس وقت الأول عنده تكلفة شحن _منخفضة بنسبة 65%._\n\n_+4:_ تعليم هدف ثانٍ في نفس وقت الأول عنده تكلفة شحن _منخفضة بنسبة 75%._
actors.hero.talent.shadow_blade.title=نصل الظل
actors.hero.talent.shadow_blade.desc=_+1:_ نسخة الظل تكسب _8%_ من ضرر البطل في كل دور، وعندها _فرصة 25%_ أن تستعمل مسحورة سلاح البطل.\n\n_+2:_ نسخة الظل تكسب _16%_ من ضرر البطل في كل دور، وعندها _فرصة 50%_ أن تستعمل مسحورة سلاح البطل.\n\n_+3:_ نسخة الظل تكسب _24%_ من ضرر البطل في كل دور، وعندها _فرصة 75%_ أن تستعمل مسحورة سلاح البطل.\n\n_+4:_ نسخة الظل تكسب _32%_ من ضرر البطل في كل دور، وعندها _فرصة 100%_ أن تستعمل مسحورة سلاح البطل.
actors.hero.talent.cloned_armor.title=درع مستنسخ
actors.hero.talent.cloned_armor.desc=_+1:_ نسخة الظل تكسب _12%_ من قيمة درع البطل، وعندها _فرصة 25%_ أن تستعمل رمز درع البطل.\n\n_+2:_ نسخة الظل تكسب _24%_ من قيمة درع البطل، وعندها _فرصة 50%_ أن تستعمل رمز درع البطل.\n\n_+3:_ نسخة الظل تكسب _36%_ من قيمة درع البطل، وعندها _فرصة 75%_ أن تستعمل رمز درع البطل.\n\n_+4:_ نسخة الظل تكسب _48%_ من قيمة درع البطل، وعندها _فرصة 100%_ أن تستعمل رمز درع البطل.
actors.hero.talent.perfect_copy.title=نسخة كاملة
actors.hero.talent.perfect_copy.desc=_+1:_ نسخة الظل تكسب _10%_ من صحة البطل القصوى، وتستطيع تبادل الأماكن فوريا مع البطل حتى _مربع واحد_ بعيدا.\n\n_+2:_ نسخة الظل تكسب _20%_ من صحة البطل القصوى، وتستطيع تبادل الأماكن فوريا مع البطل حتى _مربعين_ بعيدا.\n\n_+3:_ نسخة الظل تكسب _30%_ من صحة البطل القصوى، وتستطيع تبادل الأماكن فوريا مع البطل حتى _3 مربعات_ بعيدا.\n\n_+4:_ نسخة الظل تكسب _40%_ من صحة البطل القصوى، وتستطيع تبادل الأماكن فوريا مع البطل حتى _4 مربعات_ بعيدا.
actors.hero.talent.natures_bounty.title=نعمة الطبيعة
actors.hero.talent.natures_bounty.desc=_+1:_ صيادة الأرز تستطيع إيجاد _4 توتات_ مخبأة في العشب العالي بينما تستكشف الطوابق القليلة التالية من السراديب.\n\n_+2:_ صيادة الأرز تستطيع إيجاد _6 توتات_ مخبأة في العشب العالي بينما تستكشف الطوابق القليلة التالية من السراديب.\n\nالتوت يُؤكل بسرعة، يستعيد كمية صغيرة من الإشباع، وقد يحتوي بذرة قابلة للاستعمال.
actors.hero.talent.survivalists_intuition.title=حدس الناجي
actors.hero.talent.survivalists_intuition.desc=_+1:_ صيادة الأرز تعرف الأسلحة المرماة _أسرع بـ 3 مرات._\n\n_+2:_ صيادة الأرز تعرف الأسلحة المرماة _عندما تصيب بها._
actors.hero.talent.followup_strike.title=ضربة متابعة
actors.hero.talent.followup_strike.desc=_+1:_ عندما تصيب صيادة الأرز عدوا بقوسها أو سلاح مرمي، هجوم اشتباكها التالي ضد ذلك العدو يسبب _ضررا إضافيا 2._\n\n_+2:_ عندما تصيب صيادة الأرز عدوا بقوسها أو سلاح مرمي، هجوم اشتباكها التالي ضد ذلك العدو يسبب _ضررا إضافيا 3._
actors.hero.talent.natures_aid.title=عون الطبيعة
actors.hero.talent.natures_aid.desc=_+1:_ صيادة الأرز تكسب درع لحاء 0-2، يتلاشى كل _3 أدوار_ عندما يُفعّل أثر نبتة في رؤيتها.\n\n_+2:_ صيادة الأرز تكسب درع لحاء 0-2، يتلاشى كل _5 أدوار_ عندما يُفعّل أثر نبتة في رؤيتها.
actors.hero.talent.invigorating_meal.title=وجبة منشطة
actors.hero.talent.invigorating_meal.desc=_+1:_ أكل الطعام يستغرق صيادة الأرز دورا واحدا (التوت يُؤكل فورا) ويمنحها _دورا واحدا من السرعة._\n\n_+2:_ أكل الطعام يستغرق صيادة الأرز دورا واحدا (التوت يُؤكل فورا) ويمنحها _دورين من السرعة._
actors.hero.talent.liquid_nature.title=طبيعة سائلة
actors.hero.talent.liquid_nature.desc=_+1:_ عندما تشرب صيادة الأرز أو ترمي جرعة أو مزيجا أو إكسيرا، _حتى 4 مربعات عشب_ تنبت في المنطقة المحيطة، والأعداء المجاورون يُجذَّرون لـ _دور واحد._\n\n_+2:_ عندما تشرب صيادة الأرز أو ترمي جرعة أو مزيجا أو إكسيرا، _حتى 6 مربعات عشب_ تنبت في المنطقة المحيطة، والأعداء المجاورون يُجذَّرون لـ _دورين._\n\nكمية العشب ومدة التجذير يتضاعفان عند استعمال جرعات القوة أو الخبرة، أو أغراض كيمياء يجب صنعها باستعمال تلك الجرعات.\n\nلأغراض الكيمياء ذات كميات إنتاج أعلى (مثلا مزيج الماء)، هذه الموهبة عندها فرصة للإطلاق بناء على كم من ذلك الغرض يُنتج.
actors.hero.talent.rejuvenating_steps.title=خطوات منعشة
actors.hero.talent.rejuvenating_steps.desc=_+1:_ عندما تخطو صيادة الأرز على عشب قصير أو جمر، ينبضان إلى عشب عالٍ تخدده صيادة الأرز فورا. هذا عنده _تبريد 10 أدوار._\n\n_+2:_ عندما تخطو صيادة الأرز على عشب قصير أو جمر، ينبضان إلى عشب عالٍ تخدده صيادة الأرز فورا. هذا عنده _تبريد 5 أدوار._\n\nهذه الموهبة ستنتج عشبا مخددا إن عُطّلت آثار التجديد السلبي أو لم يكسب البطل خبرة منذ فترة طويلة.
actors.hero.talent.heightened_senses.title=حواس مرتفعة
actors.hero.talent.heightened_senses.desc=_+1:_ صيادة الأرز تكسب رؤية عقل على الشخصيات داخل _مربعين من موقعها._\n\n_+2:_ صيادة الأرز تكسب رؤية عقل على الشخصيات داخل _3 مربعات من موقعها._
actors.hero.talent.durable_projectiles.title=مقذوفات متينة
actors.hero.talent.durable_projectiles.desc=_+1:_ الأسلحة المرماة عندها _متانة +50%_ عندما تستعملها صيادة الأرز.\n\n_+2:_ الأسلحة المرماة عندها _متانة +75%_ عندما تستعملها صيادة الأرز.
actors.hero.talent.point_blank.title=مدى قريب جدا
actors.hero.talent.point_blank.desc=_+1:_ عندما تستعمل صيادة الأرز قوسها أو سلاحا مرميا في مدى الاشتباك عنده _دقة -25%،_ بدل -50%.\n\n_+2:_ عندما تستعمل صيادة الأرز قوسها أو سلاحا مرميا في مدى الاشتباك عنده _دقة عادية،_ بدل -50%.\n\n_+3:_ عندما تستعمل صيادة الأرز قوسها أو سلاحا مرميا في مدى الاشتباك عنده _دقة +25%،_ بدل -50%.\n\nلاحظ أن الأسلحة المرماة أو قوس الروح عندها دائما دقة +50% عندما تُستعمل عن بعد.
actors.hero.talent.seer_shot.title=طلقة العراف
actors.hero.talent.seer_shot.desc=_+1:_ عندما تطلق صيادة الأرز سهما على الأرض، يمنح رؤية في منطقة 3x3 حوله لـ _5 أدوار._ هذا عنده تبريد 20 دورا.\n\n_+2:_ عندما تطلق صيادة الأرز سهما على الأرض، يمنح رؤية في منطقة 3x3 حوله لـ _10 أدوار._ هذا عنده تبريد 20 دورا.\n\n_+3:_ عندما تطلق صيادة الأرز سهما على الأرض، يمنح رؤية في منطقة 3x3 حوله لـ _15 دورا._ هذا عنده تبريد 20 دورا.
actors.hero.talent.seer_shot.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستُطلق من أي سلاح مرمي.
actors.hero.talent.farsight.title=بعد النظر
actors.hero.talent.farsight.desc=_+1:_ مدى رؤية قناصة الأرز _يزداد بنسبة 25%._\n\n_+2:_ مدى رؤية قناصة الأرز _يزداد بنسبة 50%._\n\n_+3:_ مدى رؤية قناصة الأرز _يزداد بنسبة 75%._
actors.hero.talent.shared_enchantment.title=مسحورة مشتركة
actors.hero.talent.shared_enchantment.desc=_+1:_ الأسلحة المرماة عندها _فرصة 33%_ أن تستعمل مسحورة قوس قناصة الأرز.\n\n_+2:_ الأسلحة المرماة عندها _فرصة 67%_ أن تستعمل مسحورة قوس قناصة الأرز.\n\n_+3:_ الأسلحة المرماة عندها _فرصة 100%_ أن تستعمل مسحورة قوس قناصة الأرز.\n\nمسحورة القوس تستطيع الإطلاق بالإضافة إلى أي مسحورة عند السلاح المرمي أصلا.
actors.hero.talent.shared_upgrades.title=ترقيات مشتركة
actors.hero.talent.shared_upgrades.desc=_+1:_ عندما تهاجم قناصة الأرز بسلاح مرمي مرقّى، كل مستوى يزيد مدة علامة القناصة بدور واحد وضرر هجومها الخاص بنسبة 16%، حتى حد أقصى _دورين وضرر +33% عند +2._\n\n_+2:_ عندما تهاجم قناصة الأرز بسلاح مرمي مرقّى، كل مستوى يزيد مدة علامة القناصة بدور واحد وضرر هجومها الخاص بنسبة 16%، حتى حد أقصى _4 أدوار وضرر +67% عند +4._\n\n_+3:_ عندما تهاجم قناصة الأرز بسلاح مرمي مرقّى، كل مستوى يزيد مدة علامة القناصة بدور واحد وضرر هجومها الخاص بنسبة 16%، حتى حد أقصى _6 أدوار وضرر +100% عند +6._
actors.hero.talent.durable_tips.title=رؤوس متينة
actors.hero.talent.durable_tips.desc=_+1:_ السهام ذات الرؤوس عندها _ضعف المتانة_ عندما تستعملها حارسة البستان.\n\n_+2:_ السهام ذات الرؤوس عندها _3 أضعاف المتانة_ عندما تستعملها حارسة البستان.\n\n_+3:_ السهام ذات الرؤوس عندها _4 أضعاف المتانة_ عندما تستعملها حارسة البستان.
actors.hero.talent.barkskin.title=جلد اللحاء
actors.hero.talent.barkskin.desc=_+1:_ عند الخطو على عشب عالٍ غير مخدد أو نباتات، حارسة البستان تكسب _0-33% من مستواها_ في درع جلد اللحاء يتلاشى كل دور.\n\n_+2:_ عند الخطو على عشب عالٍ غير مخدد أو نباتات، حارسة البستان تكسب _0-67% من مستواها_ في درع جلد اللحاء يتلاشى كل دور.\n\n_+3:_ عند الخطو على عشب عالٍ غير مخدد أو نباتات، حارسة البستان تكسب _0-100% من مستواها_ في درع جلد اللحاء يتلاشى كل دور.
actors.hero.talent.shielding_dew.title=ندى درعي
actors.hero.talent.shielding_dew.desc=_+1:_ قطرات الندى تستطيع درع حارسة البستان عندما تكون صحتها كاملة، حتى _20% من صحتها القصوى._\n\n_+2:_ قطرات الندى تستطيع درع حارسة البستان عندما تكون صحتها كاملة، حتى _40% من صحتها القصوى._\n\n_+3:_ قطرات الندى تستطيع درع حارسة البستان عندما تكون صحتها كاملة، حتى _60% من صحتها القصوى._
actors.hero.talent.fan_of_blades.title=مروحة الأنصال
actors.hero.talent.fan_of_blades.desc=_+1:_ الأنصال الشبحية تستطيع إصابة حتى _هدف إضافي واحد_ لضرر 50%. الهدف يجب أن يكون مرئيا وداخل منطقة مخروط _30 درجة._\n\n_+2:_ الأنصال الشبحية تستطيع إصابة حتى _هدفين إضافيين_ لضرر 50%. الأهداف يجب أن تكون مرئية وداخل منطقة مخروط _60 درجة._\n\n_+3:_ الأنصال الشبحية تستطيع إصابة حتى _3 أهداف إضافية_ لضرر 50%. الأهداف يجب أن تكون مرئية وداخل منطقة مخروط _90 درجة._\n\n_+4:_ الأنصال الشبحية تستطيع إصابة حتى _4 أهداف إضافية_ لضرر 50%. الأهداف يجب أن تكون مرئية وداخل منطقة مخروط _120 درجة._
actors.hero.talent.projecting_blades.title=أنصال مُسقِطة
actors.hero.talent.projecting_blades.desc=_+1:_ الأنصال الشبحية عندها _دقة +25%،_ وتستطيع اختراق حتى _مربعين صلبين._\n\n_+2:_ الأنصال الشبحية عندها _دقة +50%،_ وتستطيع اختراق حتى _4 مربعات صلبة._\n\n_+3:_ الأنصال الشبحية عندها _دقة +75%،_ وتستطيع اختراق حتى _6 مربعات صلبة._\n\n_+4:_ الأنصال الشبحية عندها _دقة +100%،_ وتستطيع اختراق حتى _8 مربعات صلبة._
actors.hero.talent.spirit_blades.title=أنصال الروح
actors.hero.talent.spirit_blades.desc=_+1:_ الأنصال الشبحية عندها _فرصة 30%_ أن تستعمل مسحورة قوس الروح أيضا.\n\n_+2:_ الأنصال الشبحية عندها _فرصة 60%_ أن تستعمل مسحورة قوس الروح أيضا.\n\n_+3:_ الأنصال الشبحية عندها _فرصة 90%_ أن تستعمل مسحورة قوس الروح أيضا.\n\n_+4:_ الأنصال الشبحية عندها _فرصة 100%_ أن تستعمل مسحورة قوس الروح أيضا، وتمنح كل مسحورة _قوة +10%_.
actors.hero.talent.growing_power.title=قوة نامية
actors.hero.talent.growing_power.desc=_+1:_ تعزيزات الهجوم وسرعة الحركة من قوة الطبيعة تزداد إلى _38% و125%،_ من 33% و100%.\n\n_+2:_ تعزيزات الهجوم وسرعة الحركة من قوة الطبيعة تزداد إلى _42% و150%،_ من 33% و100%.\n\n_+3:_ تعزيزات الهجوم وسرعة الحركة من قوة الطبيعة تزداد إلى _46% و175%،_ من 33% و100%.\n\n_+4:_ تعزيزات الهجوم وسرعة الحركة من قوة الطبيعة تزداد إلى _50% و200%،_ من 33% و100%.
actors.hero.talent.natures_wrath.title=غضب الطبيعة
actors.hero.talent.natures_wrath.desc=_+1:_ بينما قوة الطبيعة نشطة، طلقات قوس الروح عندها _فرصة 8%_ لإطلاق أثر نبتة ضار عشوائي.\n\n_+2:_ بينما قوة الطبيعة نشطة، طلقات قوس الروح عندها _فرصة 17%_ لإطلاق أثر نبتة ضار عشوائي.\n\n_+3:_ بينما قوة الطبيعة نشطة، طلقات قوس الروح عندها _فرصة 25%_ لإطلاق أثر نبتة ضار عشوائي.\n\n_+4:_ بينما قوة الطبيعة نشطة، طلقات قوس الروح عندها _فرصة 33%_ لإطلاق أثر نبتة ضار عشوائي.\n\nالنباتات التي يمكن إطلاقها هي: عشب العمى، زهرة النار، قبعة الجليد، طحلب الحزن، وكرمة العاصفة.
actors.hero.talent.wild_momentum.title=زخم بري
actors.hero.talent.wild_momentum.desc=_+1:_ قتل عدو بقوس الروح يطيل مدة قوة الطبيعة بمقدار _دور واحد._ المدة يمكن تمديدها بحد أقصى _دورين._\n\n_+2:_ قتل عدو بقوس الروح يطيل مدة قوة الطبيعة بمقدار _دورين._ المدة يمكن تمديدها بحد أقصى _4 أدوار._\n\n_+3:_ قتل عدو بقوس الروح يطيل مدة قوة الطبيعة بمقدار _3 أدوار._ المدة يمكن تمديدها بحد أقصى _6 أدوار._\n\n_+4:_ قتل عدو بقوس الروح يطيل مدة قوة الطبيعة بمقدار _4 أدوار._ المدة يمكن تمديدها بحد أقصى _8 أدوار._
actors.hero.talent.eagle_eye.title=عين النسر
actors.hero.talent.eagle_eye.desc=_+1:_ مدى رؤية صقر الروح يزداد إلى _7 مربعات_ من 6.\n\n_+2:_ مدى رؤية صقر الروح يزداد إلى _8 مربعات_ من 6.\n\n_+3:_ مدى رؤية صقر الروح يزداد إلى _9 مربعات_ من 6، ويكسب _مربعين_ من رؤية العقل.\n\n_+4:_ مدى رؤية صقر الروح يزداد إلى _10 مربعات_ من 6، ويكسب _3 مربعات_ من رؤية العقل.
actors.hero.talent.go_for_the_eyes.title=اصد العيون
actors.hero.talent.go_for_the_eyes.desc=_+1:_ هجمات صقر الروح تعمي الأعداء لـ _دورين._\n\n_+2:_ هجمات صقر الروح تعمي الأعداء لـ _5 أدوار._\n\n_+3:_ هجمات صقر الروح تعمي الأعداء لـ _5 أدوار_ وتشلهم لـ _دورين._\n\n_+4:_ هجمات صقر الروح تعمي الأعداء لـ _5 أدوار_ وتشلهم لـ _5 أدوار._
actors.hero.talent.swift_spirit.title=روح سريعة
actors.hero.talent.swift_spirit.desc=_+1:_ سرعة حركة صقر الروح تزداد إلى _2.5 مربعات_ من 2، ومضمون أن يتفادى أول _هجومين_ موجهين ضده.\n\n_+2:_ سرعة حركة صقر الروح تزداد إلى _3 مربعات_ من 2، ومضمون أن يتفادى أول _4 هجمات_ موجهة ضده.\n\n_+3:_ سرعة حركة صقر الروح تزداد إلى _3.5 مربعات_ من 2، ومضمون أن يتفادى أول _6 هجمات_ موجهة ضده.\n\n_+4:_ سرعة حركة صقر الروح تزداد إلى _4 مربعات_ من 2، ومضمون أن يتفادى أول _8 هجمات_ موجهة ضده.
actors.hero.talent.strengthening_meal.title=وجبة مقوية
actors.hero.talent.strengthening_meal.desc=_+1:_ أكل الطعام يمنح نصل السموم ضررا إضافيا 3 في المرات _التاليتين_ التي تصيب فيها عدوا بهجوم جسدي.\n\n_+2:_ أكل الطعام يمنح نصل السموم ضررا إضافيا 3 في المرات _الثلاث التالية_ التي تصيب فيها عدوا بهجوم جسدي.
actors.hero.talent.adventurers_intuition.title=حدس المغامرة
actors.hero.talent.adventurers_intuition.desc=_+1:_ نصل السموم يعرف الأسلحة _أسرع بـ 2.5 مرة_ والدروع _أسرع بـ 1.75 مرة._\n\n_+2:_ نصل السموم يعرف الأسلحة _عندما تجهزها_ والدروع _أسرع بـ 2.5 مرة._
actors.hero.talent.patient_strike.title=ضربة صبورة
actors.hero.talent.patient_strike.desc=_+1:_ إن انتظرت نصل السموم قبل أداء هجوم اشتباك، ستسبب _ضررا إضافيا 1-2._\n\n_+2:_ إن انتظرت نصل السموم قبل أداء هجوم اشتباك، ستسبب _ضررا إضافيا 2._
actors.hero.talent.aggressive_barrier.title=حاجز عدواني
actors.hero.talent.aggressive_barrier.desc=_+1:_ نصل السموم تكسب _3 دروع_ عندما تستعمل قدرة سلاح وتكون عند 50% صحة أو أقل.\n\n_+2:_ نصل السموم تكسب _5 دروع_ عندما تستعمل قدرة سلاح وتكون عند 50% صحة أو أقل.
actors.hero.talent.aggressive_barrier.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستمنح بدل ذلك دروعا عند أداء هجوم اشتباك عند صحة منخفضة، بتبريد 50 دورا.
actors.hero.talent.focused_meal.title=وجبة مركزة
actors.hero.talent.focused_meal.desc=_+1:_ أكل الطعام يستغرق نصل السموم دورا واحدا ويمنحها _0.67 شحنات_ على أسلحتها.\n\n_+2:_ أكل الطعام يستغرق نصل السموم دورا واحدا ويمنحها _شحنة واحدة_ على أسلحتها.
actors.hero.talent.focused_meal.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستمنح بدل ذلك ضررا إضافيا لضربتهم التالية يعادل مستواهم/3 عند +1، أو مستواهم/2 عند +2.
actors.hero.talent.liquid_agility.title=رشاقة سائلة
actors.hero.talent.liquid_agility.desc=_+1:_ عند شرب أو رمي جرعة أو مزيج أو إكسير، نصل السموم عندها _مراوغة ×3،_ وعندها _دقة ×3_ في هجوم اشتباكها التالي خلال 5 أدوار.\n\n_+2:_ عند شرب أو رمي جرعة أو مزيج أو إكسير، نصل السموم عندها _مراوغة لا نهائية،_ وعندها _دقة لا نهائية_ في هجوم اشتباكها التالي خلال 5 أدوار.\n\nهذه المكافأة تدوم دورا وهجوما إضافيين عند استعمال جرعات القوة أو الخبرة، أو أغراض كيمياء يجب صنعها باستعمال تلك الجرعات.\n\nلأغراض الكيمياء ذات كميات إنتاج أعلى (مثلا مزيج الماء)، هذه الموهبة عندها فرصة للإطلاق بناء على كم من ذلك الغرض يُنتج.
actors.hero.talent.weapon_recharging.title=إعادة شحن الأسلحة
actors.hero.talent.weapon_recharging.desc=_+1:_ نصل السموم تكسب شحنة سلاح واحدة كل _15 دورا_ عندما تكون تحت أثر تعزيزات إعادة شحن العصي أو الآثار.\n\n_+2:_ نصل السموم تكسب شحنة سلاح واحدة كل _10 أدوار_ عندما تكون تحت أثر تعزيزات إعادة شحن العصي أو الآثار.
actors.hero.talent.weapon_recharging.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستجعلهم بدل ذلك يسببون ضرر اشتباك +5% أثناء إعادة الشحن عند +1، أو ضرر اشتباك +7.5% أثناء إعادة الشحن عند +2.
actors.hero.talent.lethal_haste.title=سرعة قاتلة
actors.hero.talent.lethal_haste.desc=_+1:_ عندما توجّه نصل السموم ضربة قاضية لعدو بقدرة سلاح، تكسب _3 أدوار_ من الحركة الفورية.\n\n_+2:_ عندما توجّه نصل السموم ضربة قاضية لعدو بقدرة سلاح، تكسب _5 أدوار_ من الحركة الفورية.
actors.hero.talent.lethal_haste.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستُطلق بدل ذلك بهجمات أسلحة عادية، بتبريد 100 دور.
actors.hero.talent.swift_equip.title=تجهيز سريع
actors.hero.talent.swift_equip.desc=_+1:_ نصل السموم تستطيع تبديل سلاحها المجهز فورا _مرة واحدة_ كل 20 دورا.\n\n_+2:_ نصل السموم تستطيع تبديل سلاحها المجهز فورا _مرتين_ كل 20 دورا.\n\nإن كانت عند نصل السموم هذه الموهبة وليست في تبريد، استعمال سلاح غير مجهز بسرعة سيجهزه.
actors.hero.talent.precise_assault.title=هجوم دقيق
actors.hero.talent.precise_assault.desc=_+1:_ عندما تستعمل نصل السموم قدرة سلاح، تكسب _دقة ×2_ في هجوم اشتباكها التالي خلال 5 أدوار.\n\n_+2:_ عندما تستعمل نصل السموم قدرة سلاح، تكسب _دقة ×5_ في هجوم اشتباكها التالي خلال 5 أدوار.\n\n_+3:_ عندما تستعمل نصل السموم قدرة سلاح، تكسب _دقة لا نهائية_ في هجوم اشتباكها التالي خلال 5 أدوار.
actors.hero.talent.precise_assault.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستزيد بدل ذلك دقة الاشتباك بنسبة 10% عند +1، 20% عند +2، أو 30% عند +3.
actors.hero.talent.deadly_followup.title=متابعة قاتلة
actors.hero.talent.deadly_followup.desc=_+1:_ عندما تصيب نصل السموم عدوا بسلاح مرمي، ستسبب لهم _ضرر اشتباك أكثر بنسبة 10%_ لـ 5 أدوار.\n\n_+2:_ عندما تصيب نصل السموم عدوا بسلاح مرمي، ستسبب لهم _ضرر اشتباك أكثر بنسبة 20%_ لـ 5 أدوار.\n\n_+3:_ عندما تصيب نصل السموم عدوا بسلاح مرمي، ستسبب لهم _ضرر اشتباك أكثر بنسبة 30%_ لـ 5 أدوار.
actors.hero.talent.varied_charge.title=شحنة متنوعة
actors.hero.talent.varied_charge.desc=_+1:_ النصلان التوأم تستعيد فورا _0.17 شحنات سلاح_ عندما تستعمل قدرتي سلاح مختلفتين، دون حد زمني.\n\n_+2:_ النصلان التوأم تستعيد فورا _0.33 شحنات سلاح_ عندما تستعمل قدرتي سلاح مختلفتين، دون حد زمني.\n\n_+3:_ النصلان التوأم تستعيد فورا _0.5 شحنات سلاح_ عندما تستعمل قدرتي سلاح مختلفتين، دون حد زمني.
actors.hero.talent.twin_upgrades.title=ترقيات توأم
actors.hero.talent.twin_upgrades.desc=_+1:_ إن كان أحد سلاحي النصل التوأم المجهزين عنده مستوى أقل وهو _أدنى بمرتبتين أو أكثر_ من السلاح الآخر، سيُعزز إلى مستوى السلاح الآخر.\n\n_+2:_ إن كان أحد سلاحي النصل التوأم المجهزين عنده مستوى أقل وهو _أدنى بمرتبة أو أكثر_ من السلاح الآخر، سيُعزز إلى مستوى السلاح الآخر.\n\n_+3:_ إن كان أحد سلاحي النصل التوأم المجهزين عنده مستوى أقل وهو _نفس المرتبة أو أدنى_ من السلاح الآخر، سيُعزز إلى مستوى السلاح الآخر.
actors.hero.talent.combined_lethality.title=فتك مركّب
actors.hero.talent.combined_lethality.desc=_+1:_ إن هاجمت النصلان التوأم بسلاح اشتباك مباشرة بعد استعمال قدرة سلاح مختلف، ذلك الهجوم سيعدم أي عدو غير زعيم متروك عند _تحت 13% صحة._\n\n_+2:_ إن هاجمت النصلان التوأم بسلاح اشتباك مباشرة بعد استعمال قدرة سلاح مختلف، ذلك الهجوم سيعدم أي عدو غير زعيم متروك عند _تحت 27% صحة._\n\n_+3:_ إن هاجمت النصلان التوأم بسلاح اشتباك مباشرة بعد استعمال قدرة سلاح مختلف، ذلك الهجوم سيعدم أي عدو غير زعيم متروك عند _تحت 40% صحة._\n\nهذا الهجوم يمكن أن يكون هجوم سلاح اشتباك عاديا، أو جزءا من قدرة سلاح.
actors.hero.talent.unencumbered_spirit.title=روح غير مثقلة
actors.hero.talent.unencumbered_spirit.desc=_+1:_ قبضة الزفير تكسب _طاقة أكثر بنسبة 50%_ لكل قطعة معدات _مرتبة 3 أو أقل_ تستعملها.\n\n_+2:_ قبضة الزفير تكسب _طاقة أكثر بنسبة 75%_ لكل قطعة معدات _مرتبة 2 أو أقل_ تستعملها. منفعة المرتبة 3 لم تتغير.\n\n_+3:_ قبضة الزفير تكسب _طاقة أكثر بنسبة 100%_ لكل قطعة معدات _مرتبة 1 أو أقل_ تستعملها. منافع المرتبتين 2 و3 لم تتغير. تكسب أيضا درع قماش وقفازات مرصعة مجانا.\n\nلاحظ أن هذه الموهبة لا تمنح أي منفعة من كونها دون سلاح أو الهجوم بخاتم القوة.
actors.hero.talent.monastic_vigor.title=نشاط رهباني
actors.hero.talent.monastic_vigor.desc=_+1:_ إن كانت عند قبضة الزفير _طاقة 100%،_ قدراتها معززة.\n\n_+2:_ إن كانت عند قبضة الزفير _طاقة 80% أو أكثر،_ قدراتها معززة.\n\n_+3:_ إن كانت عند قبضة الزفير _طاقة 60% أو أكثر،_ قدراتها معززة.\n\nعندما تكون معززة:\n- الوابل يطبق مسحورة سلاحك\n- التركيز فوري\n- الاندفاع يكسب مدى +4\n- ركلة التنين تسبب ضررا +50% وتطبق أثر دفعها وصعقها على كل الأعداء المجاورين\n- التأمل يشفي ببطء 20% من الصحة المفقودة ويمنح مقاومة ضرر 80%.
actors.hero.talent.combined_energy.title=طاقة مركّبة
actors.hero.talent.combined_energy.desc=_+1:_ إن استعملت قبضة الزفير قدرة سلاح وقدرة _طاقة 4+_ خلال 5 أدوار من بعضها، تستعيد طاقة منفقة واحدة.\n\n_+2:_ إن استعملت قبضة الزفير قدرة سلاح وقدرة _طاقة 3+_ خلال 5 أدوار من بعضها، تستعيد طاقة منفقة واحدة.\n\n_+3:_ إن استعملت قبضة الزفير قدرة سلاح وقدرة _طاقة 2+_ خلال 5 أدوار من بعضها، تستعيد طاقة منفقة واحدة.
actors.hero.talent.close_the_gap.title=سد الفجوة
actors.hero.talent.close_the_gap.desc=_+1:_ نصل السموم تخطف _حتى مربعين_ نحو هدفها عند بدء مبارزة.\n\n_+2:_ نصل السموم تخطف _حتى 3 مربعات_ نحو هدفها عند بدء مبارزة.\n\n_+3:_ نصل السموم تخطف _حتى 4 مربعات_ نحو هدفها عند بدء مبارزة.\n\n_+4:_ نصل السموم تخطف _حتى 5 مربعات_ نحو هدفها عند بدء مبارزة.\n\nهذا الخطف يستطيع العبور عبر المخاطر والأعداء، لكن لا عبر تضاريس صلبة كالحيطان. الخطف يُحسب عند تحديد ما إذا كان عدو في مدى التحتدي.
actors.hero.talent.invigorating_victory.title=نصر منشط
actors.hero.talent.invigorating_victory.desc=_+1:_ إن هزمت نصل السموم هدفها قبل انتهاء المبارزة، تشفى بـ _5 صحة بالإضافة إلى 30% من الضرر_ الذي تلقته أثناء المبارزة.\n\n_+2:_ إن هزمت نصل السموم هدفها قبل انتهاء المبارزة، تشفى بـ _10 صحة بالإضافة إلى 50% من الضرر_ الذي تلقته أثناء المبارزة.\n\n_+3:_ إن هزمت نصل السموم هدفها قبل انتهاء المبارزة، تشفى بـ _15 صحة بالإضافة إلى 65% من الضرر_ الذي تلقته أثناء المبارزة.\n\n_+4:_ إن هزمت نصل السموم هدفها قبل انتهاء المبارزة، تشفى بـ _20 صحة بالإضافة إلى 75% من الضرر_ الذي تلقته أثناء المبارزة.
actors.hero.talent.elimination_match.title=مباراة إقصاء
actors.hero.talent.elimination_match.desc=_+1:_ إن تحدت نصل السموم من جديد خلال 3 أدوار من انتهاء مبارزة، ذلك التحدي عنده تكلفة شحن _منخفضة بنسبة 16%._\n\n_+2:_ إن تحدت نصل السموم من جديد خلال 3 أدوار من انتهاء مبارزة، ذلك التحدي عنده تكلفة شحن _منخفضة بنسبة 30%._\n\n_+3:_ إن تحدت نصل السموم من جديد خلال 3 أدوار من انتهاء مبارزة، ذلك التحدي عنده تكلفة شحن _منخفضة بنسبة 40%._\n\n_+4:_ إن تحدت نصل السموم من جديد خلال 3 أدوار من انتهاء مبارزة، ذلك التحدي عنده تكلفة شحن _منخفضة بنسبة 50%._
actors.hero.talent.elemental_reach.title=مدى عنصري
actors.hero.talent.elemental_reach.desc=_+1:_ مدى الضربة العنصرية يزداد إلى _5 مربعات_ من 4، وعرضها يزداد إلى _75 درجة_ من 65.\n\n_+2:_ مدى الضربة العنصرية يزداد إلى _6 مربعات_ من 4، وعرضها يزداد إلى _85 درجة_ من 65.\n\n_+3:_ مدى الضربة العنصرية يزداد إلى _7 مربعات_ من 4، وعرضها يزداد إلى _95 درجة_ من 65.\n\n_+4:_ مدى الضربة العنصرية يزداد إلى _8 مربعات_ من 4، وعرضها يزداد إلى _105 درجة_ من 65.
actors.hero.talent.striking_force.title=قوة ضاربة
actors.hero.talent.striking_force.desc=_+1:_ قوة أثر الضربة العنصرية تزداد بنسبة _30%._\n\n_+2:_ قوة أثر الضربة العنصرية تزداد بنسبة _60%._\n\n_+3:_ قوة أثر الضربة العنصرية تزداد بنسبة _90%._\n\n_+4:_ قوة أثر الضربة العنصرية تزداد بنسبة _120%._
actors.hero.talent.directed_power.title=قوة موجهة
actors.hero.talent.directed_power.desc=_+1:_ الهجوم المباشر من الضربة العنصرية يكسب _قوة سحر +30%_ لكل عدو في مدى أثر الضربة العنصرية، بما فيه هدف الهجوم.\n\n_+2:_ الهجوم المباشر من الضربة العنصرية يكسب _قوة سحر +60%_ لكل عدو في مدى أثر الضربة العنصرية، بما فيه هدف الهجوم.\n\n_+3:_ الهجوم المباشر من الضربة العنصرية يكسب _قوة سحر +90%_ لكل عدو في مدى أثر الضربة العنصرية، بما فيه هدف الهجوم.\n\n_+4:_ الهجوم المباشر من الضربة العنصرية يكسب _قوة سحر +120%_ لكل عدو في مدى أثر الضربة العنصرية، بما فيه هدف الهجوم.
actors.hero.talent.feigned_retreat.title=تراجع مموّه
actors.hero.talent.feigned_retreat.desc=_+1:_ إن هاجم عدو صورة نصل السموم اللاحقة، تكسب _دورين_ من السرعة.\n\n_+2:_ إن هاجم عدو صورة نصل السموم اللاحقة، تكسب _4 أدوار_ من السرعة.\n\n_+3:_ إن هاجم عدو صورة نصل السموم اللاحقة، تكسب _6 أدوار_ من السرعة.\n\n_+4:_ إن هاجم عدو صورة نصل السموم اللاحقة، تكسب _8 أدوار_ من السرعة.
actors.hero.talent.expose_weakness.title=كشف الضعف
actors.hero.talent.expose_weakness.desc=_+1:_ الأعداء الذين يهاجمون صورة نصل السموم اللاحقة يصبحون ضعفاء وهشين لـ _دورين._\n\n_+2:_ الأعداء الذين يهاجمون صورة نصل السموم اللاحقة يصبحون ضعفاء وهشين لـ _4 أدوار._\n\n_+3:_ الأعداء الذين يهاجمون صورة نصل السموم اللاحقة يصبحون ضعفاء وهشين لـ _6 أدوار._\n\n_+4:_ الأعداء الذين يهاجمون صورة نصل السموم اللاحقة يصبحون ضعفاء وهشين لـ _8 أدوار._
actors.hero.talent.counter_ability.title=قدرة مضادة
actors.hero.talent.counter_ability.desc=_+1:_ إن استعملت نصل السموم قدرة سلاح خلال 3 أدوار من مهاجمة صورتها اللاحقة، ستستعيد فورا _0.38 شحنات._\n\n_+2:_ إن استعملت نصل السموم قدرة سلاح خلال 3 أدوار من مهاجمة صورتها اللاحقة، ستستعيد فورا _0.77 شحنات._\n\n_+3:_ إن استعملت نصل السموم قدرة سلاح خلال 3 أدوار من مهاجمة صورتها اللاحقة، ستستعيد فورا _1.13 شحنات._\n\n_+4:_ إن استعملت نصل السموم قدرة سلاح خلال 3 أدوار من مهاجمة صورتها اللاحقة، ستستعيد فورا _1.5 شحنات._
actors.hero.talent.satiated_spells.title=تعويذات الشبع
actors.hero.talent.satiated_spells.desc=_+1:_ أكل الطعام يجعل كاهن الفجر يكسب _3 دروع_ في المرة التالية التي يلقي فيها تعويذة.\n\n_+2:_ أكل الطعام يجعل كاهن الفجر يكسب _5 دروع_ في المرة التالية التي يلقي فيها تعويذة.
actors.hero.talent.satiated_spells.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستمنح بدل ذلك دروعا فورا، ستبدأ بالتلاشي عادة بعد 10 أدوار.
actors.hero.talent.holy_intuition.title=حدس مقدس
actors.hero.talent.holy_intuition.desc=_+1:_ كاهن الفجر يستطيع إلقاء _الحدس المقدس،_ تعويذة تكشف ما إذا كان غرض ملعونا بتكلفة _3 شحنات._\n\n_+2:_ كاهن الفجر يستطيع إلقاء _الحدس المقدس،_ تعويذة تكشف ما إذا كان غرض ملعونا بتكلفة _شحنتين._
actors.hero.talent.holy_intuition.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستتيح بدل ذلك للبطل التعرف على حالة لعنة غرض ملعون قبل تجهيزه مباشرة، 15% من الوقت عند +1 أو 25% من الوقت عند +2.
actors.hero.talent.searing_light.title=ضوء حارق
actors.hero.talent.searing_light.desc=_+1:_ هجمات كاهن الفجر الجسدية على الأعداء المضاءين بـ _الضوء المرشد_ تسبب _ضررا +3._\n\n_+2:_ هجمات كاهن الفجر الجسدية على الأعداء المضاءين بـ _الضوء المرشد_ تسبب _ضررا +5._
actors.hero.talent.searing_light.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستمنح بدل ذلك ضررها الإضافي بعد استعمال عصا أو أثر على عدو، بتبريد 20 دورا.
actors.hero.talent.shield_of_light.title=درع النور
actors.hero.talent.shield_of_light.desc=_+1:_ كاهن الفجر يستطيع إلقاء _درع النور،_ تعويذة تُلقي فورا وتمنحهم _درعا 2-4_ ضد هدف لـ 5 أدوار بتكلفة شحنة واحدة.\n\n_+2:_ كاهن الفجر يستطيع إلقاء _درع النور،_ تعويذة تُلقي فورا وتمنحهم _درعا 3-6_ ضد هدف لـ 5 أدوار بتكلفة شحنة واحدة.
actors.hero.talent.shield_of_light.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستخفّض بدل ذلك الضرر الجسدي المتلقى من عدوك المستهدف بمقدار 1، 33% من الوقت عند +1 أو 50% من الوقت عند +2.
actors.hero.talent.enlightening_meal.title=وجبة منيرة
actors.hero.talent.enlightening_meal.desc=_+1:_ أكل الطعام يستغرق كاهن الفجر دورا واحدا ويمنحهم _0.67 شحنات_ على مخطوط فجرهم.\n\n_+2:_ أكل الطعام يستغرق كاهن الفجر دورا واحدا ويمنحهم _شحنة واحدة_ على مخطوط فجرهم.
actors.hero.talent.enlightening_meal.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستمنح بدل ذلك دوري إعادة شحن عصي وآثار عند +1، أو 3 أدوار عند +2. هذا لا يمكن استعماله لترك قرن الوفرة يعيد شحن نفسه.
actors.hero.talent.recall_inscription.title=نقش الاستدعاء
actors.hero.talent.recall_inscription.refunded=أُرجع غرضك!
actors.hero.talent.recall_inscription.desc=_+1:_ كاهن الفجر يستطيع إلقاء _نقش الاستدعاء،_ تعويذة تتيح لهم تكرار أثر آخر حجر روني أو مخطوطة استعملوها خلال _10 أدوار._\n\n_+2:_ كاهن الفجر يستطيع إلقاء _نقش الاستدعاء،_ تعويذة تتيح لهم تكرار أثر آخر حجر روني أو مخطوطة استعملوها خلال _300 دور._\n\nنقش الاستدعاء لا يمكن استعماله مع مخطوطات الترقية. تكلفة شحن هذه التعويذة تختلف بناء على الغرض المستعمل مؤخرا: 2 لحجر روني، 3 لمخطوطة، 4 لمخطوطة غريبة. هذه التكلفة تتضاعف أيضا عند الاستعمال مع مخطوطة تحويل، أو أغراض كيمياء يجب صنعها باستعمال التحويل أو الترقية.
actors.hero.talent.recall_inscription.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستُرجع بدل ذلك أي مخطوطة أو حجر روني 10% من الوقت عند +1 أو 15% من الوقت عند +2. مخطوطات الترقية معفاة من هذا الأثر.
actors.hero.talent.sunray.title=شعاع الشمس
actors.hero.talent.sunray.desc=_+1:_ كاهن الفجر يستطيع إلقاء _شعاع الشمس،_ تعويذة تسبب _ضررا 4-8_ وتعمي الهدف لـ _4 أدوار،_ بتكلفة شحنة واحدة.\n\n_+2:_ كاهن الفجر يستطيع إلقاء _شعاع الشمس،_ تعويذة تسبب _ضررا 6-12_ وتعمي الهدف لـ _6 أدوار،_ بتكلفة شحنة واحدة.\n\nشعاع الشمس يستطيع إعماء كل هدف مرة واحدة فقط، لكن إن كان الهدف معميا أصلا بشعاع الشمس فإنه يشل بدل ذلك. شعاع الشمس يسبب دائما أقصى ضرر للأعداء المظلمين والأموات الأحياء.
actors.hero.talent.sunray.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستجعل بدل ذلك العصي والآثار تعمي الأعداء لـ 4 أدوار، 15% من الوقت عند +1 أو 25% من الوقت عند +2.
actors.hero.talent.divine_sense.title=حس سماوي
actors.hero.talent.divine_sense.desc=_+1:_ كاهن الفجر يستطيع إلقاء _الحس السماوي،_ تعويذة تمنحهم _8 مربعات_ من رؤية العقل لـ 50 دورا ولا تستغرق وقتا للإلقاء، بتكلفة شحنتين.\n\n_+2:_ كاهن الفجر يستطيع إلقاء _الحس السماوي،_ تعويذة تمنحهم _12 مربعا_ من رؤية العقل لـ 50 دورا ولا تستغرق وقتا للإلقاء، بتكلفة شحنتين.
actors.hero.talent.divine_sense.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستمنحهم بدل ذلك رؤية عقل للحظة وجيزة بعد استعمال عصا أو أثر بمدى 3 مربعات عند +1 أو 5 مربعات عند +2.
actors.hero.talent.bless.title=بركة
actors.hero.talent.bless.desc=_+1:_ كاهن الفجر يستطيع إلقاء _بركة،_ تعويذة تمنح _6 أدوار من البركة و10 دروع_ عندما تُلقي على أنفسهم أو _10 أدوار من البركة و10 شفاء_ عندما تُلقي على شخصية أخرى، بتكلفة شحنة واحدة.\n\n_+2:_ كاهن الفجر يستطيع إلقاء _بركة،_ تعويذة تمنح _10 أدوار من البركة و15 درعا_ عندما تُلقي على أنفسهم أو _15 دورا من البركة و15 شفاء_ عندما تُلقي على شخصية أخرى، بتكلفة شحنة واحدة.\n\nالشفاء الزائد من هذه التعويذة يتحول إلى دروع.
actors.hero.talent.bless.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستعزز بدل ذلك الدقة والمراوغة للبطل وكل الحلفاء بنسبة 3% عند +1 أو 5% عند +2.
actors.hero.talent.cleanse.title=تطهير
actors.hero.talent.cleanse.desc=_+1:_ كاهن الفجر يستطيع إلقاء _تطهير،_ تعويذة _تزيل آثار الحالة السلبية_ من كاهن الفجر وأي حلفاء قريبين، وتمنحهم _10 دروع،_ بتكلفة شحنتين.\n\n_+2:_ كاهن الفجر يستطيع إلقاء _تطهير،_ تعويذة _تمنح 3 أدوار من حصانة الحالة السلبية_ لكاهن الفجر وأي حلفاء قريبين، وتمنحهم _20 درعا،_ بتكلفة شحنتين.\n\n_+3:_ كاهن الفجر يستطيع إلقاء _تطهير،_ تعويذة _تمنح 5 أدوار من حصانة الحالة السلبية_ لكاهن الفجر وأي حلفاء قريبين، وتمنحهم _30 درعا،_ بتكلفة شحنتين.
actors.hero.talent.cleanse.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستطهر بدل ذلك آثار الحالة السلبية على البطل بعد استعمال عصا أو أثر، 10/20/30% من الوقت عند +1/+2/+3.
actors.hero.talent.light_reading.title=قراءة النور
actors.hero.talent.light_reading.desc=_+1:_ كاهن الفجر يستطيع استعمال مخطوط فجرهم عندما يكون غير مجهز، لكنه يُعاد شحنه بسرعة _25%_ عندما يكون غير مجهز.\n\n_+2:_ كاهن الفجر يستطيع استعمال مخطوط فجرهم عندما يكون غير مجهز، لكنه يُعاد شحنه بسرعة _50%_ عندما يكون غير مجهز.\n\n_+3:_ كاهن الفجر يستطيع استعمال مخطوط فجرهم عندما يكون غير مجهز، لكنه يُعاد شحنه بسرعة _75%_ عندما يكون غير مجهز.
actors.hero.talent.light_reading.meta_desc=_إن كُسبت هذه الموهبة من بطل مختلف_ ستزيد بدل ذلك سرعة إعادة شحن كل العصي بنسبة 7/13/20% عند +1/+2/+3.
actors.hero.talent.holy_lance.title=رمح مقدس
actors.hero.talent.holy_lance.desc=_+1:_ حارس النور يستطيع إلقاء _الرمح المقدس،_ تعويذة مدمرة تسبب _ضررا 30-55_ بتكلفة 4 شحنات.\n\n_+2:_ حارس النور يستطيع إلقاء _الرمح المقدس،_ تعويذة مدمرة تسبب _ضررا 45-83_ بتكلفة 4 شحنات.\n\n_+3:_ حارس النور يستطيع إلقاء _الرمح المقدس،_ تعويذة مدمرة تسبب _ضررا 60-110_ بتكلفة 4 شحنات.\n\nالرمح المقدس يسبب دائما أقصى ضرر للأعداء المظلمين والأموات الأحياء. الرمح المقدس عنده تبريد 30 دورا قبل أن يمكن إلقاؤه من جديد.
actors.hero.talent.hallowed_ground.title=أرض مقدسة
actors.hero.talent.hallowed_ground.desc=_+1:_ حارس النور يستطيع إلقاء _الأرض المقدسة،_ تعويذة تقدس التضاريس في _منطقة 3x3_ لـ 20 دورا، بتكلفة شحنتين.\n\n_+2:_ حارس النور يستطيع إلقاء _الأرض المقدسة،_ تعويذة تقدس التضاريس في _منطقة 5x5_ لـ 20 دورا، بتكلفة شحنتين.\n\n_+3:_ حارس النور يستطيع إلقاء _الأرض المقدسة،_ تعويذة تقدس التضاريس في _منطقة 7x7_ لـ 20 دورا، بتكلفة شحنتين.\n\nعندما تُلقي، الأرض المقدسة تشفي الحلفاء بـ 15 صحة، تجذر الأعداء وجيزة، وتنشر عشبا قصيرا. بعد ذلك، تشفي الحلفاء ببطء، تشل الأعداء، وتجعل العشب العالي ينمو عشوائيا. الأرض المقدسة تمنح دروعا لحارس النور بدل الشفاء وتُدمر بالنار.
actors.hero.talent.mnemonic_prayer.title=دعاء الذاكرة
actors.hero.talent.mnemonic_prayer.desc=_+1:_ حارس النور يستطيع إلقاء _دعاء الذاكرة،_ تعويذة تمدد التعزيزات/الإضعافات على حليف/عدو لـ _3 أدوار_ بتكلفة شحنة واحدة.\n\n_+2:_ حارس النور يستطيع إلقاء _دعاء الذاكرة،_ تعويذة تمدد التعزيزات/الإضعافات على حليف/عدو لـ _4 أدوار_ بتكلفة شحنة واحدة.\n\n_+3:_ حارس النور يستطيع إلقاء _دعاء الذاكرة،_ تعويذة تمدد التعزيزات/الإضعافات على حليف/عدو لـ _5 أدوار_ بتكلفة شحنة واحدة.\n\nدعاء الذاكرة لا يستغرق وقتا للإلقاء. دعاء الذاكرة يستطيع تمديد حالة معينة من تعزيز/إضعاف مرة واحدة فقط، ولا يستطيع تمديد التعزيزات من قدرات الدرع.
actors.hero.talent.lay_on_hands.title=وضع الأيدي
actors.hero.talent.lay_on_hands.desc=_+1:_ فارس الفجر يستطيع إلقاء _وضع الأيدي،_ تعويذة تشفي فورا شخصية قريبة بـ _15 صحة،_ أو تمنح فارس الفجر _15 درعا،_ بتكلفة شحنة واحدة.\n\n_+2:_ فارس الفجر يستطيع إلقاء _وضع الأيدي،_ تعويذة تشفي فورا شخصية قريبة بـ _20 صحة،_ أو تمنح فارس الفجر _20 درعا،_ بتكلفة شحنة واحدة.\n\n_+3:_ فارس الفجر يستطيع إلقاء _وضع الأيدي،_ تعويذة تشفي فورا شخصية قريبة بـ _25 صحة،_ أو تمنح فارس الفجر _25 درعا،_ بتكلفة شحنة واحدة.\n\nالشفاء الزائد من هذه التعويذة يتحول إلى دروع. وضع الأيدي يمكن إلقاؤه بشكل متكرر، لكنه لا يستطيع تطبيق أكثر من ثلاث إلقاءات من الدروع في وقت واحد.
actors.hero.talent.aura_of_protection.title=هالة الحماية
actors.hero.talent.aura_of_protection.desc=_+1:_ فارس الفجر يستطيع إلقاء _هالة الحماية،_ تعويذة تمنح فارس الفجر وكل الحلفاء داخل مربعين _مقاومة ضرر 20%_ وأثر رمز درع فارس الفجر بقوة _+50%_ لـ 20 دورا، بتكلفة شحنتين.\n\n_+2:_ فارس الفجر يستطيع إلقاء _هالة الحماية،_ تعويذة تمنح فارس الفجر وكل الحلفاء داخل مربعين _مقاومة ضرر 30%_ وأثر رمز درع فارس الفجر بقوة _+75%_ لـ 20 دورا، بتكلفة شحنتين.\n\n_+3:_ فارس الفجر يستطيع إلقاء _هالة الحماية،_ تعويذة تمنح فارس الفجر وكل الحلفاء داخل مربعين _مقاومة ضرر 40%_ وأثر رمز درع فارس الفجر بقوة _+100%_ لـ 20 دورا، بتكلفة شحنتين.
actors.hero.talent.wall_of_light.title=حائط النور
actors.hero.talent.wall_of_light.desc=_+1:_ فارس الفجر يستطيع إلقاء _حائط النور،_ تعويذة تخلق حائطا صلبا _بعرض 3 مربعات_ أمام فارس الفجر يدفع الأعداء بعيدا ويدوم 20 دورا، بتكلفة 3 شحنات.\n\n_+2:_ فارس الفجر يستطيع إلقاء _حائط النور،_ تعويذة تخلق حائطا صلبا _بعرض 5 مربعات_ أمام فارس الفجر يدفع الأعداء بعيدا ويدوم 20 دورا، بتكلفة 3 شحنات.\n\n_+3:_ فارس الفجر يستطيع إلقاء _حائط النور،_ تعويذة تخلق حائطا صلبا _بعرض 7 مربعات_ أمام فارس الفجر يدفع الأعداء بعيدا ويدوم 20 دورا، بتكلفة 3 شحنات.\n\nيمكن وضع الحائط أساسيا أو قطريا، حائط واحد فقط يمكن أن يوجد في وقت واحد.
actors.hero.talent.wisp_strength.title=قوة الوهج
actors.hero.talent.wisp_strength.desc=_+1:_ _وهج الفجر_ الخاص بمبشّر الفجر يسبب _ضررا أدنى +1 وأقصى +2._\n\n_+2:_ _وهج الفجر_ الخاص بمبشّر الفجر يسبب _ضررا أدنى +2 وأقصى +4._\n\n_+3:_ _وهج الفجر_ الخاص بمبشّر الفجر يسبب _ضررا أدنى +3 وأقصى +6._\n\nتضاف هذه الزيادة إلى ضرر الوهج القائم على المستوى.
actors.hero.talent.wisp_endurance.title=تحمّل الوهج
actors.hero.talent.wisp_endurance.desc=_+1:_ _وهج الفجر_ الخاص بمبشّر الفجر عنده _+2 صحة_ ويدوم _+5 أدوار._\n\n_+2:_ _وهج الفجر_ الخاص بمبشّر الفجر عنده _+4 صحة_ ويدوم _+10 أدوار._\n\n_+3:_ _وهج الفجر_ الخاص بمبشّر الفجر عنده _+6 صحة_ ويدوم _+15 دورا._
actors.hero.talent.wisp_healing_aura.title=هالة شفاء الوهج
actors.hero.talent.wisp_healing_aura.desc=_+1:_ عندما يكون _وهج الفجر_ داخل مربعين، يستعيد مبشّر الفجر _صحة واحدة كل 5 أدوار._\n\n_+2:_ عندما يكون _وهج الفجر_ داخل مربعين، يستعيد مبشّر الفجر _صحة 2 كل 5 أدوار._\n\n_+3:_ عندما يكون _وهج الفجر_ داخل مربعين، يستعيد مبشّر الفجر _صحة 3 كل 5 أدوار._\n\nهذه الهالة تشفي مبشّر الفجر فقط.

actors.hero.talent.divine_intervention.title=تدخل سماوي
actors.hero.talent.divine_intervention.desc=_+1:_ أثناء شكل الصعود، يستطيع كاهن الفجر إلقاء _التدخل السماوي،_ الذي يعزز كاهن الفجر وكل الحلفاء حتى _150 درعا_ ويمدد شكل الصعود بمقدار _3 أدوار._\n\n_+2:_ أثناء شكل الصعود، يستطيع كاهن الفجر إلقاء _التدخل السماوي،_ الذي يعزز كاهن الفجر وكل الحلفاء حتى _200 درع_ ويمدد شكل الصعود بمقدار _4 أدوار._\n\n_+3:_ أثناء شكل الصعود، يستطيع كاهن الفجر إلقاء _التدخل السماوي،_ الذي يعزز كاهن الفجر وكل الحلفاء حتى _250 درعا_ ويمدد شكل الصعود بمقدار _5 أدوار._\n\n_+4:_ أثناء شكل الصعود، يستطيع كاهن الفجر إلقاء _التدخل السماوي،_ الذي يعزز كاهن الفجر وكل الحلفاء حتى _300 درع_ ويمدد شكل الصعود بمقدار _6 أدوار._\n\nالتدخل السماوي يكلف 5 شحنات مخطوط ضخمة، ويمكن إلقاؤه مرة واحدة فقط في نفس شكل الصعود.
actors.hero.talent.judgement.title=حكم
actors.hero.talent.judgement.desc=_+1:_ أثناء شكل الصعود، يستطيع كاهن الفجر إلقاء _الحكم،_ الذي يسبب _ضررا 10-20_ لكل الأعداء المرئيين.\n\n_+2:_ أثناء شكل الصعود، يستطيع كاهن الفجر إلقاء _الحكم،_ الذي يسبب _ضررا 15-30_ لكل الأعداء المرئيين.\n\n_+3:_ أثناء شكل الصعود، يستطيع كاهن الفجر إلقاء _الحكم،_ الذي يسبب _ضررا 20-40_ لكل الأعداء المرئيين.\n\n_+4:_ أثناء شكل الصعود، يستطيع كاهن الفجر إلقاء _الحكم،_ الذي يسبب _ضررا 25-50_ لكل الأعداء المرئيين.\n\nالحكم يكلف 3 شحنات مخطوط. الحكم يسبب ضررا +33% لكل تعويذة ألقاها كاهن الفجر منذ دخول شكل الصعود أو منذ آخر إلقاء للحكم.
actors.hero.talent.flash.title=وميض
actors.hero.talent.flash.desc=_+1:_ أثناء شكل الصعود، يستطيع كاهن الفجر إلقاء _وميض_ للانتقال آنيا حتى _3 مربعات_ بعيدا.\n\n_+2:_ أثناء شكل الصعود، يستطيع كاهن الفجر إلقاء _وميض_ للانتقال آنيا حتى _4 مربعات_ بعيدا.\n\n_+3:_ أثناء شكل الصعود، يستطيع كاهن الفجر إلقاء _وميض_ للانتقال آنيا حتى _5 مربعات_ بعيدا.\n\n_+4:_ أثناء شكل الصعود، يستطيع كاهن الفجر إلقاء _وميض_ للانتقال آنيا حتى _6 مربعات_ بعيدا.\n\nالوميض يكلف شحنتي مخطوط في البداية، وشحنة إضافية لكل استعمال في نفس شكل الصعود.
actors.hero.talent.body_form.title=شكل الجسد
actors.hero.talent.body_form.desc=كاهن الفجر يستطيع إلقاء _شكل الجسد،_ الذي يشبع الثالوث بقوة مسحورة أو رمز عرفها كاهن الفجر في هذه المحاولة، بتكلفة شحنتين.\n\n_+1:_ عندما يُستعمل الثالوث، يكسب كاهن الفجر الأثر المختار لـ _20 دورا._\n\n_+2:_ عندما يُستعمل الثالوث، يكسب كاهن الفجر الأثر المختار لـ _27 دورا._\n\n_+3:_ عندما يُستعمل الثالوث، يكسب كاهن الفجر الأثر المختار لـ _33 دورا._\n\n_+4:_ عندما يُستعمل الثالوث، يكسب كاهن الفجر الأثر المختار لـ _40 دورا._\n\nالثالوث يستطيع أن يُشبع بأثر جسد واحد فقط في وقت واحد. تكلفة شحن درع الثالوث أعلى إن كان الرمز المختار نادرا وقويا.
actors.hero.talent.mind_form.title=شكل العقل
actors.hero.talent.mind_form.desc=كاهن الفجر يستطيع إلقاء _شكل العقل،_ الذي يشبع الثالوث بقوة عصا أو سلاح مرمي استعملوه كاهن الفجر في هذه المحاولة، بتكلفة 3 شحنات.\n\n_+1:_ عندما يُستعمل الثالوث، يستعمل كاهن الفجر أثر صعق أو رمي الغرض المختار، كأنه _+3._\n\n_+2:_ عندما يُستعمل الثالوث، يستعمل كاهن الفجر أثر صعق أو رمي الغرض المختار، كأنه _+4._\n\n_+3:_ عندما يُستعمل الثالوث، يستعمل كاهن الفجر أثر صعق أو رمي الغرض المختار، كأنه _+5._\n\n_+4:_ عندما يُستعمل الثالوث، يستعمل كاهن الفجر أثر صعق أو رمي الغرض المختار، كأنه _+6._\n\nالثالوث يستطيع أن يُشبع بأثر عقل واحد فقط في وقت واحد.
actors.hero.talent.spirit_form.title=شكل الروح
actors.hero.talent.spirit_form.desc=كاهن الفجر يستطيع إلقاء _شكل الروح،_ الذي يشبع الثالوث بقوة خاتم أو أثر عرفوه في هذه المحاولة (عدا مخطوط الفجر)، بتكلفة 4 شحنات.\n\n_+1:_ عندما يُستعمل الثالوث، سيكسب كاهن الفجر أثر خاتم عند _+1_ لـ 20 دورا، أو سيطلق أثر أثر عند _+4._\n\n_+2:_ عندما يُستعمل الثالوث، سيكسب كاهن الفجر أثر خاتم عند _+2_ لـ 20 دورا، أو سيطلق أثر أثر عند _+6._\n\n_+3:_ عندما يُستعمل الثالوث، سيكسب كاهن الفجر أثر خاتم عند _+3_ لـ 20 دورا، أو سيطلق أثر أثر عند _+8._\n\n_+4:_ عندما يُستعمل الثالوث، سيكسب كاهن الفجر أثر خاتم عند _+4_ لـ 20 دورا، أو سيطلق أثر أثر عند _+10._\n\nالثالوث يستطيع أن يُشبع بأثر روح واحد فقط في وقت واحد. الآثار عندها آثار وتكاليف شحن درع متنوعة عندما تُطلق بالثالوث.
actors.hero.talent.beaming_ray.title=شعاع النقل
actors.hero.talent.beaming_ray.desc=كاهن الفجر يستطيع إلقاء _شعاع النقل_ من حليف معزز بتكلفة شحنة واحدة. هذا الشعاع يستطيع العبور عبر الحيطان وينقل الحليف آنيا إلى موقع مستهدف. إن كان عدو في ذلك الموقع، يظهر الحليف بجانب العدو وسيستهدفه. شعاع النقل يستطيع حتى نقل الحلفاء غير المتحركين عادة آنيا، لكن عنده نصف المدى عند فعل ذلك.\n\n_+1:_ شعاع النقل عنده مدى أقصى _4 مربعات،_ ويزيد مكافأة قوة الكثيرين إلى _ضرر +35%_ ضد أقرب عدو لـ 10 أدوار.\n\n_+2:_ شعاع النقل عنده مدى أقصى _8 مربعات،_ ويزيد مكافأة قوة الكثيرين إلى _ضرر +40%_ ضد أقرب عدو لـ 10 أدوار.\n\n_+3:_ شعاع النقل عنده مدى أقصى _12 مربعا،_ ويزيد مكافأة قوة الكثيرين إلى _ضرر +45%_ ضد أقرب عدو لـ 10 أدوار.\n\n_+4:_ شعاع النقل عنده مدى أقصى _16 مربعا،_ ويزيد مكافأة قوة الكثيرين إلى _ضرر +50%_ ضد أقرب عدو لـ 10 أدوار.
actors.hero.talent.life_link.title=رابط الحياة
actors.hero.talent.life_link.desc=كاهن الفجر يستطيع إلقاء _رابط الحياة_ بين نفسه وحليف معزز بتكلفة شحنتين. هذه التعويذة تجعل الضرر يُقاسم بين كاهن الفجر وحليفه، وتجعل تعويذات كاهن الفجر المفيدة من المرتبة 3 أو أقل تتطبق على الاثنين إن تأثر أحدهما.\n\n_+1:_ رابط الحياة يدوم _10 أدوار_ ويزيد مكافأة قوة الكثيرين إلى _ضرر متلقى -35%._\n\n_+2:_ رابط الحياة يدوم _13 دورا_ ويزيد مكافأة قوة الكثيرين إلى _ضرر متلقى -40%._\n\n_+3:_ رابط الحياة يدوم _17 دورا_ ويزيد مكافأة قوة الكثيرين إلى _ضرر متلقى -45%._\n\n_+4:_ رابط الحياة يدوم _20 دورا_ ويزيد مكافأة قوة الكثيرين إلى _ضرر متلقى -50%._
actors.hero.talent.stasis.title=ركود
actors.hero.talent.stasis.desc=كاهن الفجر يستطيع إلقاء _ركود_ على حليف معزز بتكلفة شحنتين. الركود يزيل الحليف مؤقتا من السراديب ويحفظ الوقت المتبقي على كل التعزيزات، بما فيها قوة الكثيرين. سيظهر الحليف من جديد بجانبك عندما ينتهي الأثر. الركود يمكن إعادة إلقاؤه فورا ودون تكلفة لإنهاء الأثر مبكرا. الركود يعمل على الحلفاء غير المتحركين، لكنه لا يستطيع نقلهم بين طوابق السراديب.\n\n_+1:_ الركود يدوم بحد أقصى _60 دورا._\n\n_+2:_ الركود يدوم بحد أقصى _90 دورا._\n\n_+3:_ الركود يدوم بحد أقصى _120 دورا._\n\n_+4:_ الركود يدوم بحد أقصى _150 دورا._\n\nكاهن الفجر يستطيع إلقاء شعاع النقل أيضا عندما يكون حليف في ركود لاستدعائه من جديد، أو إلقاء رابط الحياة لتطبيق أثره استباقيا. الحلفاء لا يستفيدون من رابط الحياة أثناء الركود مع ذلك.
actors.hero.talent.heroic_energy.title=طاقة بطولية
actors.hero.talent.heroic_energy.rat_title=طاقة جرذية
actors.hero.talent.heroic_energy.desc=_+1:_ قدرة درع البطل عندها تكلفة شحن _منخفضة بنسبة 12%._\n\n_+2:_ قدرة درع البطل عندها تكلفة شحن _منخفضة بنسبة 23%._\n\n_+3:_ قدرة درع البطل عندها تكلفة شحن _منخفضة بنسبة 32%._\n\n_+4:_ قدرة درع البطل عندها تكلفة شحن _منخفضة بنسبة 40%._
actors.hero.talent.ratsistance.title=مقاومة الجرذان
actors.hero.talent.ratsistance.desc=_+1:_ الأعداء المعادون المحولون إلى جرذان يسببون _ضررا -10%._\n\n_+2:_ الأعداء المعادون المحولون إلى جرذان يسببون _ضررا -19%._\n\n_+3:_ الأعداء المعادون المحولون إلى جرذان يسببون _ضررا -27%._\n\n_+4:_ الأعداء المعادون المحولون إلى جرذان يسببون _ضررا -35%._
actors.hero.talent.ratlomacy.title=دبلوماسية الجرذان
actors.hero.talent.ratlomacy.desc=_+1:_ استعمال تحويل الجرذان على عدو محول إلى جرذ يجعله ودودا ويجعل التحويل دائما.\n\n_+2:_ استعمال تحويل الجرذان على عدو محول إلى جرذ يجعله ودودا، يجعل التحويل دائما، ويمنحهم _دورين_ من الأدرينالين.\n\n_+3:_ استعمال تحويل الجرذان على عدو محول إلى جرذ يجعله ودودا، يجعل التحويل دائما، ويمنحهم _4 أدوار_ من الأدرينالين.\n\n_+4:_ استعمال تحويل الجرذان على عدو محول إلى جرذ يجعله ودودا، يجعل التحويل دائما، ويمنحهم _6 أدوار_ من الأدرينالين.
actors.hero.talent.ratforcements.title=تعزيزات الجرذان
actors.hero.talent.ratforcements.desc=_+1:_ استعمال تحويل الجرذان على نفسك _يستدعي جرذ جبلي حليفا واحدا_ بجانبك.\n\n_+2:_ استعمال تحويل الجرذان على نفسك _يستدعي جرذي جبلي حليفين_ بجانبك.\n\n_+3:_ استعمال تحويل الجرذان على نفسك _يستدعي 3 جرذان جبلية حليفة_ بجانبك.\n\n_+4:_ استعمال تحويل الجرذان على نفسك _يستدعي 4 جرذان جبلية حليفة_ بجانبك.

actors.hero.talent.vanguard_bulwark.title=حصن الطليعة
actors.hero.talent.vanguard_bulwark.desc=_+1:_ يكسب الملك أطلس _+2 درعا_ وينتج ختمه المكسور الحماية _أسرع بنسبة 25%_.\n\n_+2:_ يكسب الملك أطلس _+4 دروع_ وينتج ختمه المكسور الحماية _أسرع بنسبة 50%_.\n\n_+3:_ يكسب الملك أطلس _+6 دروع_ وينتج ختمه المكسور الحماية _أسرع بنسبة 75%_.\n\n_+4:_ يكسب الملك أطلس _+8 دروع_ وينتج ختمه المكسور الحماية _أسرع بنسبة 100%_.
actors.hero.talent.crushing_force.title=قوة ساحقة
actors.hero.talent.crushing_force.desc=_+1:_ تسبب ضربات الأسلحة اليدوية _+2 ضررا إضافيا_، مع _فرصة 15%_ لترنح الهدف لدور واحد.\n\n_+2:_ تسبب ضربات الأسلحة اليدوية _+4 ضررا إضافيا_، مع _فرصة 30%_ لترنح الهدف لدور واحد.\n\n_+3:_ تسبب ضربات الأسلحة اليدوية _+6 ضررا إضافيا_، مع _فرصة 45%_ لترنح الهدف لدور واحد.\n\n_+4:_ تسبب ضربات الأسلحة اليدوية _+8 ضررا إضافيا_، مع _فرصة 60%_ لترنح الهدف لدور واحد.
actors.hero.talent.astral_focus.title=تركيز نجمي
actors.hero.talent.astral_focus.desc=_+1:_ تعمل جميع إطلاقات العصي بـ _مستوى فعلي +1_، ويمنح الإطلاق درعا مؤقتا قدره _نقطة واحدة_ (أقصى 4).\n\n_+2:_ تعمل جميع إطلاقات العصي بـ _مستويين فعليين +2_، ويمنح الإطلاق درعا مؤقتا قدره _نقطتان_ (أقصى 8).\n\n_+3:_ تعمل جميع إطلاقات العصي بـ _3 مستويات فعلية +3_، ويمنح الإطلاق درعا مؤقتا قدره _3 نقاط_ (أقصى 12).\n\n_+4:_ تعمل جميع إطلاقات العصي بـ _4 مستويات فعلية +4_، ويمنح الإطلاق درعا مؤقتا قدره _4 نقاط_ (أقصى 16).
actors.hero.talent.arcane_harvest.title=حصاد سحري
actors.hero.talent.arcane_harvest.desc=_+1:_ هزيمة أي عدو تمنح _فرصة 25%_ لشحن فوري لشحنة عصا أو صولجان ورؤية فلكية وجيزة.\n\n_+2:_ هزيمة أي عدو تمنح _فرصة 50%_ لشحن فوري لشحنة عصا أو صولجان ورؤية فلكية وجيزة.\n\n_+3:_ هزيمة أي عدو تمنح _فرصة 75%_ لشحن فوري لشحنة عصا أو صولجان ورؤية فلكية وجيزة.\n\n_+4:_ هزيمة أي عدو تمنح _فرصة 100%_ لشحن فوري لشحنة عصا أو صولجان ورؤية فلكية وجيزة.
actors.hero.talent.phantom_stride.title=خطوة الشبح
actors.hero.talent.phantom_stride.desc=_+1:_ أثناء الاختفاء أو فور الخروج من التخفي، تزداد المراوغة بنسبة _25%_ وسرعة الحركة بنسبة _10%_.\n\n_+2:_ أثناء الاختفاء أو فور الخروج من التخفي، تزداد المراوغة بنسبة _50%_ وسرعة الحركة بنسبة _20%_.\n\n_+3:_ أثناء الاختفاء أو فور الخروج من التخفي، تزداد المراوغة بنسبة _75%_ وسرعة الحركة بنسبة _30%_.\n\n_+4:_ أثناء الاختفاء أو فور الخروج من التخفي، تزداد المراوغة بنسبة _100%_ وسرعة الحركة بنسبة _40%_.
actors.hero.talent.desert_strike.title=ضربة الصحراء
actors.hero.talent.desert_strike.desc=_+1:_ تسبب هجمات المباغتة _+15% ضررا_، واستسلام العدو بالمباغتة يستعيد _0.25 شحنة_ لبردة الظلال.\n\n_+2:_ تسبب هجمات المباغتة _+30% ضررا_، واستسلام العدو بالمباغتة يستعيد _0.50 شحنة_ لبردة الظلال.\n\n_+3:_ تسبب هجمات المباغتة _+45% ضررا_، واستسلام العدو بالمباغتة يستعيد _0.75 شحنة_ لبردة الظلال.\n\n_+4:_ تسبب هجمات المباغتة _+60% ضررا_، واستسلام العدو بالمباغتة يستعيد _1.00 شحنة_ لبردة الظلال.
actors.hero.talent.forest_sanctuary.title=ملاذ الغابة
actors.hero.talent.forest_sanctuary.desc=_+1:_ أثناء الوقوف على العشب أو النباتات، تكسب صائدة الأرز _+2 درعا_.\n\n_+2:_ أثناء الوقوف على العشب أو النباتات، تكسب صائدة الأرز _+4 دروع_.\n\n_+3:_ أثناء الوقوف على العشب أو النباتات، تكسب صائدة الأرز _+6 دروع_.\n\n_+4:_ أثناء الوقوف على العشب أو النباتات، تكسب صائدة الأرز _+8 دروع_.
actors.hero.talent.pinpoint_accuracy.title=دقة متناهية
actors.hero.talent.pinpoint_accuracy.desc=_+1:_ تسبب الهجمات عن بعد على أهداف تبعد 3 مربعات أو أكثر _+12% ضررا_ مع _فرصة 25%_ لشل حركتها.\n\n_+2:_ تسبب الهجمات عن بعد على أهداف تبعد 3 مربعات أو أكثر _+24% ضررا_ مع _فرصة 50%_ لشل حركتها.\n\n_+3:_ تسبب الهجمات عن بعد على أهداف تبعد 3 مربعات أو أكثر _+36% ضررا_ مع _فرصة 75%_ لشل حركتها.\n\n_+4:_ تسبب الهجمات عن بعد على أهداف تبعد 3 مربعات أو أكثر _+48% ضررا_ مع _فرصة 100%_ لشل حركتها.
actors.hero.talent.tempest_combo.title=زوبعة عاصفة
actors.hero.talent.tempest_combo.desc=_+1:_ إصابة الأعداء تبني إيقاع قتال: _+10% دقة_ و _+8% سرعة هجوم_ لمدة دورين.\n\n_+2:_ إصابة الأعداء تبني إيقاع قتال: _+20% دقة_ و _+16% سرعة هجوم_ لمدة دورين.\n\n_+3:_ إصابة الأعداء تبني إيقاع قتال: _+30% دقة_ و _+24% سرعة هجوم_ لمدة دورين.\n\n_+4:_ إصابة الأعداء تبني إيقاع قتال: _+40% دقة_ و _+32% سرعة هجوم_ لمدة دورين.
actors.hero.talent.weapon_mastery.title=براعة السلاح
actors.hero.talent.weapon_mastery.desc=_+1:_ تشحن قدرات الأسلحة _أسرع بنسبة 15%_، وهزيمة الأعداء الأشداء تستعيد _شحنة سلاح واحدة_.\n\n_+2:_ تشحن قدرات الأسلحة _أسرع بنسبة 30%_، وهزيمة الأعداء الأشداء تستعيد _شحنة سلاح واحدة_.\n\n_+3:_ تشحن قدرات الأسلحة _أسرع بنسبة 45%_، وهزيمة الأعداء الأشداء تستعيد _شحنة سلاح واحدة_.\n\n_+4:_ تشحن قدرات الأسلحة _أسرع بنسبة 60%_، وهزيمة الأعداء الأشداء تستعيد _شحنة سلاح واحدة_.
actors.hero.talent.divine_illumination.title=إشراق الفجر
actors.hero.talent.divine_illumination.desc=_+1:_ تكشف تعاويذ ضوء الفجر الأعداء المتخفين والخفيين ضمن نطاق 4 مربعات.\n\n_+2:_ تكشف تعاويذ ضوء الفجر الأعداء المتخفين والخفيين ضمن نطاق 4 مربعات.\n\n_+3:_ تكشف تعاويذ ضوء الفجر الأعداء المتخفين والخفيين ضمن نطاق 4 مربعات.\n\n_+4:_ تكشف تعاويذ ضوء الفجر الأعداء المتخفين والخفيين ضمن نطاق 4 مربعات.
actors.hero.talent.dawn_restoration.title=استشفاء الفجر
actors.hero.talent.dawn_restoration.desc=_+1:_ كلما ألقى كاهن الفجر تعويذة سفر، يستعيد _+2 نقاط صحة_.\n\n_+2:_ كلما ألقى كاهن الفجر تعويذة سفر، يستعيد _+4 نقاط صحة_.\n\n_+3:_ كلما ألقى كاهن الفجر تعويذة سفر، يستعيد _+6 نقاط صحة_.\n\n_+4:_ كلما ألقى كاهن الفجر تعويذة سفر، يستعيد _+8 نقاط صحة_.
actors.mobs.npcs.blacksmith.intro_quest_warrior=أيها الإنسان! تبدو قويا.
actors.mobs.npcs.blacksmith.intro_quest_mage=أيها الإنسان! تبدو ذكيا.
actors.mobs.npcs.blacksmith.intro_quest_rogue=أيها الإنسان! تبدو متخفيا.
actors.mobs.npcs.blacksmith.intro_quest_huntress=أيها الإنسان! تبدو سريعا.
actors.mobs.npcs.blacksmith.intro_quest_duelist=أيها الإنسان! تبدو شجاعا.
actors.mobs.npcs.blacksmith.intro_quest_cleric=أيها الإنسان! تبدو مهما.
actors.mobs.npcs.blacksmith.intro_quest_start=تريد أن تكون مفيدا، إيه؟ نعم عندي شيء تستطيع فعله. بنيت هذه الورشة فوق منجم قديم، إنه أسفل ذلك السلم مباشرة. خذ هذه المعول ونقّب لي بعض _خام الذهب المظلم. 40 قطعة_ يجب أن تكفي. الصخر أسفل ناعم وجميل لذلك _ستستطيع التنقيب عبر الحيطان ببعض الجهد._\n\nماذا تقصد، كيف سأدفع لك؟ أنت طماع...\n\nحسنا، حسنا، أستطيع فعل بعض الحدادة لك. اعتبر نفسك محظوظا، أنا الحداد الوحيد في الجوار.
actors.mobs.npcs.blacksmith.intro_quest_crystal=احذر مع ذلك، المنجم خطير على إنسان صغير مثلك. إنه مهجور منذ فترة، وحزمة بلورات بدأت تنمو. إنها لامعة، لكنها هشة جدا أن تستحق أي شيء، وعندها أشياء سحرية تحميها. إنها قوية جدا، لذلك _احذر أين تنقّب_ وإلا ستلفت انتباهها.\n\nهناك _بلورة عملاقة_ في مكان ما أيضا. إنها أصعب بكثير، لذلك كن مستعدا لقتال إن بدأت كسرها. سأراهن أن تحطيمها سيبطئ كل نمو البلورات مع ذلك، لذلك سأدفع إضافيا إن استطعت فعلها.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=احذر مع ذلك، المنجم خطير على إنسان صغير مثلك. بعض الغنولات تريد الذهب أيضا والآن يخربون المكان. إنها أشياء غبية، لذلك تنقيبهم سبب كل أنواع الانهيارات والسقوف المنهارة. ستضطر للتنقيب عبره، لذلك _ابحث عن صخر مُقْلَق مؤخرا._\n\nأظن أن أحد الغنولات يسبب معظم المتاعب، على الأرجح _شامان مهندس أرض_ أو شيء ما. سأدفع إضافيا، إن استطعت إيجاده وقتله، لكنني متأكد أنه سيقاتل.
actors.mobs.npcs.blacksmith.intro_quest_fungi=احذر مع ذلك، المنجم خطير على إنسان صغير مثلك. هناك نوع من وحوش الفطر ينمو أسفل هناك. عنده حراس فطر مميتون فعلا إن رأوك، لكنهم لا يستطيعون النهوض ومطاردتك على الأقل. _ابقَ خارج النظر_ إن أردت البقاء حيا.\n\nسأدفع إضافيا إن استطعت إسقاط _الفطر الأكبر،_ لكنه سيستغرق جهدا حقيقيا. إنه متصل بحزمة عقد فطرية مخبأة في الحيطان. ستضطر لكسر معظمهم قبل أن تستطيع إضراره فعلا.
actors.mobs.npcs.blacksmith.reminder=انتهيت من إضاعة وقتي؟ مدخل المنجم هناك.
actors.mobs.npcs.blacksmith.reminder_crystal=أحضر لي أكبر قدر من الذهب تستطيع، وحاول كسر البلورة الكبيرة أيضا.
actors.mobs.npcs.blacksmith.reminder_gnoll=أحضر لي أكبر قدر من الذهب تستطيع، وحاول قتل مهندس الأرض الغنول أيضا.
actors.mobs.npcs.blacksmith.reminder_fungi=أحضر لي أكبر قدر من الذهب تستطيع، وحاول قتل الفطر العملاق أيضا.
actors.mobs.npcs.blacksmith.lost_pick=هل تمزح معي؟ أين معولي؟!
actors.mobs.npcs.blacksmith.quest_start_prompt=مستعد للنزول؟ تأكد أن عندك مساحة فراغ للذهب.\n\n_أنا أسمح لك بالنزول هناك مرة واحدة فقط!_
actors.mobs.npcs.blacksmith.enter_yes=أنا مستعد
actors.mobs.npcs.blacksmith.enter_no=ليس بعد
actors.mobs.npcs.blacksmith.exit_warn_none=انتهيت أصلا؟ بالكاد عندك أي ذهب! يجب أن تستطيع الحصول على _40 قطعة._\n\n_تذكر، لن أسمح لك بالعودة بمجرد أن تصعد._
actors.mobs.npcs.blacksmith.exit_warn_low=انتهيت أصلا؟ لا يبدو أن عندك كثير من الذهب. يجب أن تستطيع الحصول على _40 قطعة._\n\n_تذكر، لن أسمح لك بالعودة بمجرد أن تصعد._
actors.mobs.npcs.blacksmith.exit_warn_med=انتهيت؟ عندك بعض الذهب على الأقل، لكن هناك بالتأكيد المزيد في المنجم. يجب أن تستطيع الحصول على _40 قطعة._\n\n_تذكر، لن أسمح لك بالعودة بمجرد أن تصعد._
actors.mobs.npcs.blacksmith.exit_warn_high=انتهيت؟ يبدو أن عندك كمية جيدة من الذهب، لكنني أستطيع استعمال أكثر قليلا. يجب أن تستطيع الحصول على _40 قطعة._\n\n_تذكر، لن أسمح لك بالعودة بمجرد أن تصعد._
actors.mobs.npcs.blacksmith.exit_warn_full=انتهيت؟ عندك كثير من الذهب، لكن تأكد أنك لم تترك أي من معداتك خلفك.\n\n_تذكر، لن أسمح لك بالعودة بمجرد أن تصعد._
actors.mobs.npcs.blacksmith.exit_warn_crystal=تلك البلورة العملاقة ما زالت أسفل هناك أيضا. سأدفع إضافيا إن دمرتها.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=مهندس الأرض الغنول ما زال أسفل هناك أيضا. سأدفع إضافيا إن قتلته.
actors.mobs.npcs.blacksmith.exit_warn_fungi=ذلك الفطر العملاق ما زال أسفل هناك أيضا. سأدفع إضافيا إن قتلته.
actors.mobs.npcs.blacksmith.exit_yes=انتهيت
actors.mobs.npcs.blacksmith.exit_no=ليس بعد
actors.mobs.npcs.blacksmith.get_lost=أنا مشغول. اغرب!
actors.mobs.npcs.blacksmith.entrance_blocked=الطريق إلى الأسفل مسدود.
actors.mobs.npcs.blacksmith.cant_enter_old=تلك المنطقة غير قابلة للوصول في هذه المحاولة. العب لعبة جديدة لتجربة المهمة الجديدة!
actors.mobs.npcs.blacksmith.def_verb=سدّ
actors.mobs.npcs.blacksmith.desc=هذا الحداد الترول يبدو كما يبدو كل الترولات: طويل ونحيف، وجلده يشبه الحجر في اللون والملمس معا. حداد الترول يعبث بأدوات صغيرة بشكل غير متناسب.
actors.mobs.npcs.ghost.rat_1=مرحبا %s... كنت ذات يوم مثلك - قويا وواثقا... لكنني قُتلت على يد وحش خبيث... لا أستطيع مغادرة هذا المكان... ليس حتى أنتقم... اقتل _جرذ الصهاريج النتن،_ الذي أخذ حياتي...\n\nإنه يطارد هذا الطابق... ينشر القذارة في كل مكان... _احذر سحابة نتنه وعضته الأكالة، الحمض يذوب في الماء..._
actors.mobs.npcs.ghost.rat_2=من فضلك... ساعدني... اقتل البشاعة...\n\n_قاتله قرب الماء... تجنب النتن..._
actors.mobs.npcs.ghost.gnoll_1=مرحبا %s... كنت ذات يوم مثلك - قويا وواثقا... لكنني قُتلت على يد عدو ماكر... لا أستطيع مغادرة هذا المكان... ليس حتى أنتقم... اقتل _المحتال الغنول،_ الذي أخذ حياتي...\n\nإنه ليس كالغنولات الأخرى... يختبئ ويستعمل أسلحة مرماة... _احذر سهامه السامة والحارقة، لا تهاجم من بعيد..._
actors.mobs.npcs.ghost.gnoll_2=من فضلك... ساعدني... اقتل المحتال...\n\n_لا تدعه يصيبك... اقترب منه..._
actors.mobs.npcs.ghost.crab_1=مرحبا %s... كنت ذات يوم مثلك - قويا وواثقا... لكنني قُتلت على يد مخلوق قديم... لا أستطيع مغادرة هذا المكان... ليس حتى أنتقم... اقتل _سلطعون الصهاريج العظيم،_ الذي أخذ حياتي...\n\nإنه قديم بشكل غير طبيعي... بمخلب واحد ضخم وصدفة سميكة... _احذر مخلبه، يجب أن تباغت السلطعون وإلا سيسده به..._
actors.mobs.npcs.ghost.crab_2=من فضلك... ساعدني... اقتل القشريات...\n\n_سيسد دائما... عندما يراك قادما..._
actors.mobs.npcs.ghost.find_me=شكرا لك... تعال ابحث عني...
actors.mobs.npcs.ghost.desc=الشبح بالكاد مرئي. يبدو كبقعة لا شكل لها من ضوء خافت بوجه حزين.
actors.mobs.npcs.imp.old_intro=هل أنت مغامر؟ أنا أحب المغامرين! تستطيع الاعتماد عليهم دائما إن احتاج شيء إلى أن يُقتل، هل أنا محق؟ مقابل مكافأة بالطبع ;)
actors.mobs.npcs.imp.old_golems_1=في حالتي إنها _الغوليمات_ التي تحتاج أن تُقتل. ترى، سأبدأ مشروعا صغيرا هنا، لكن تلك الغوليمات الغبية سيئة للأعمال! من الصعب جدا التفاوض مع كتل جرانيت هائمة، لعنة عليهم! لذلك من فضلك اقتل... لنقل _4 منهم_ ومكافأة لك.
actors.mobs.npcs.imp.old_monks_1=في حالتي إنهم _الرهبان_ الذين يحتاجون أن يُقتلوا. ترى، سأبدأ مشروعا صغيرا هنا، لكن هؤلاء المجانين لا يشترون شيئا بأنفسهم وسيخيفون الزبائن الآخرين. لذلك من فضلك اقتل... لنقل _5 منهم_ ومكافأة لك.
actors.mobs.npcs.imp.old_golems_2=كيف تسير رحلة صيد الغوليم خاصتك؟ فقط لا تنسَ إحضار تلك الرموز.
actors.mobs.npcs.imp.old_monks_2=أوه، ما زلت حيا! كنت أعرف أن كونغ فو خاصتك سيكون أقوى ;) فقط لا تنسَ إحضار تلك الرموز.
actors.mobs.npcs.imp.cya=إلى اللقاء، %s!
actors.mobs.npcs.imp.hey=بسست، %s!
actors.mobs.npcs.imp.quest_intro_1=أوه مرحبا، هل أنت مغامر؟ أنا أحب المغامرين! تستطيع الاعتماد عليهم دائما عندما تحتاج مساعدة. بمكافأة مناسبة، بالطبع ;).\n\nهناك خزنة قزمة كبيرة أمامي فيها حزمة آثار نادرة داخلها. أنا نوع من هواة الجمع، وهناك تمثال صغير في تلك الخزنة أريده جدا.\n\nالخزنة مليئة بالحراس والفخاخ مع ذلك، لذلك أستطيع استعمال مساعدة صغيرة!
actors.mobs.npcs.imp.quest_intro_2=الخزنة مختومة سحريا. أستطيع نقلك آنيا بداخلها بتعويذة كنت أحضرها، لكن _لا أستطيع نقل معداتك معك._ يجب أن يكون هناك غنائم كثيرة داخل الخزنة لمساعدتك في طريقك مع ذلك! _ربما ستريد البدء بتجنب الأعداء والبحث عن أغراض غير محمية جيدا._\n\nأستطيع استدعاءك بغرضين من الخزنة. واحد سيكون تمثالي، والآخر يمكن أن يكون _أي شيء من الخزنة يعجبك!_\n\nجمعت حزمة أشياء قيمة قد تهمك أيضا! إن ساعدتني هنا _سأفتح متجرا أعمق قليلا_ وسنستطيع التبادل.
actors.mobs.npcs.imp.quest_in_progress=فقط اخطُ إلى مركز مدخل الخزنة عندما تكون مستعدا للذهاب وسأنقلك آنيا إلى الداخل.
actors.mobs.npcs.imp.enter_text=هل أنت مستعد؟ سأحتفظ بأغراضك بأمان هنا، _ستستعيد كل شيء عندما تعود._\n\nخذ هذا _الدرع القماشي_ و_بلورة النقل الآني_ معك مع ذلك. استعمل البلورة عندما يكون عندك تمثالي. ...أفترض _أنك تستطيع استعمالها مبكرا أيضا إن كنت في مشكلة،_ لكن لا تتوقع المكافأة الكاملة!\n\nالخزنة لم تُقْلَق منذ فترة طويلة، لذلك الأعداء فيها يجب أن يكونوا أبطأ من العادة. يجب أن يكون أسهل من العادة تجنب الكشف، خاصة إن _بقيت خلف اتجاه هوم الأعداء._ إن رآك عدو _لا يجب أن يطاردك إن رآك للحظة فقط._ ربما ستستطيع _الإحساس بخطوات قريبة_ أيضا إن انتبهت.
actors.mobs.npcs.imp.quest_completed_bad=حسنا، شكرا على المحاولة.\n\nالتعويذة التي استعملتها للوصول إلى الخزنة ستستغرق وقتا طويلا جدا للتحضير من جديد، لذلك الأفضل أن تنطلق في طريقك.
actors.mobs.npcs.imp.quest_completed_good=شكرا على مساعدتك!\n\nسيستغرقني بعض الوقت لتجهيز تعويذة نقلي الآني، وسأحتاج إلى التخطيط بناء على المعلومات التي أعطيتني أيضا.\n\nسأحزم وأراك أعمق قليلا في السراديب. أخاف أنني ما زلت أحتاج ذهبا، لذلك بضاعتي لن تكون مجانية ;).
actors.mobs.npcs.imp.quest_completed_great=عمل عظيم أسفل هناك، شكرا جزيلا!\n\nعندي كل ما أحتاجه هنا، لذلك سأحزم وأراك أعمق قليلا في السراديب. أخاف أنني ما زلت أحتاج ذهبا، لذلك بضاعتي لن تكون مجانية ;).\n\nما كان مهما جدا في التمثال؟ لا شيء مما تظن، إنه في الحقيقة غرض عادي جدا. يأتي من أرض بعيدة لم تعد موجودة؛ قد يكون الأخير من نوعه. لولا هؤلاء الأقزام الطماعين لكان قد دُمر على الأرجح مع كل شيء آخر...
actors.mobs.npcs.imp.enter_yes=انزل إلى الخزنة
actors.mobs.npcs.imp.enter_no=ابقَ هنا
actors.mobs.npcs.imp.desc=هذا الشخص الأحمر الصغير يبدو كعفريت. العفاريت مخلوقات صغار، معروفة بذكائها لا بقوتها.\n\nلم تسمع عن كائنات كهؤلاء إلا في الحكايات الشعبية القديمة مع ذلك، التي غالبا ما تصفهم كمسافرين من عالم آخر. لم ترَ أبدا أي دليل على وجودهم فعليا، لكن هذا العفريت حقيقي بوضوح ويبدو سعيدا جدا لرؤيتك.
actors.mobs.npcs.impshopkeeper.greetings=مرحبا، %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=ماذا فعلت يا %s؟ تسوق بسرعة، عليّ الخروج من هنا!
actors.mobs.npcs.impshopkeeper.thief=ظننت أنني أستطيع الوثوق بك!
actors.mobs.npcs.impshopkeeper.buyback=العفريت يرجع غرضك ببهجة.
actors.mobs.npcs.impshopkeeper.desc=العفريت فتح متجرا صغيرا على حدود القاعات الداخلية. من الجميل رؤية وجه ودود، لكن أسعاره بالتأكيد لا تبدو ودودة.
actors.mobs.npcs.mirrorimage.desc=هذا الوهم يشبهك بشكل وثيق، حتى يبدو أنه يحمل سلاحك ودرعك الحاليين.\n\nصور المرآة ستسعى وتهاجم الأعداء باستعمال سلاحها المقلد، الذي يتصرف مثل سلاحك تماما، لكنه يسبب ضررا أقل. تبدأ غير مرئية تقريبا، لكنها يجب أن تتخذ شكلا يُرى بسهولة أكبر لتستطيع الهجوم.\n\nبينما قوتها الهجومية يمكن أن تكون فعالة، صور المرآة ليس عندها متانة، وستتلاشى في اللحظة التي تتلقى فيها ضررا.
actors.mobs.npcs.mirrorimage.discover_hint=تستطيع إيجاد هذه الشخصية بمخطوطة معينة.
actors.mobs.npcs.npc.discover_hint=تستطيع إيجاد هذه الشخصية في منطقة معينة من السراديب.
actors.mobs.npcs.prismaticimage.desc=هذا الوهم المتلألئ يشبهك بشكل وثيق، حتى يبدو أنه يحمل سلاحك ودرعك الحاليين.\n\nصور الموشور ستحاول السعي واجتذاب تركيز الأعداء، باستعمال دفاعها وصحتها المحسّنة لحمايتك. بينما ليس عندها نفس القوة الهجومية لصور المرآة، عندها متانة محسّنة، بما فيها تلقي منافع من درعك.\n\nعندما تُخفَّض إلى 0 صحة، صور الموشور ستتلاشى عبر عدة أدوار، ويمكن أن تُشفى أثناء هذا الوقت أيضا. عندما لا يوجد أعداء، صور الموشور ستتلاشى وتنضم من جديد إلى سيدها.
actors.mobs.npcs.prismaticimage.discover_hint=تستطيع إيجاد هذه الشخصية بمخطوطة معينة.
actors.mobs.npcs.ratking.not_sleeping=أنا لست نائما!
actors.mobs.npcs.ratking.what_is_it=ما هذا؟ ليس عندي وقت لهذه السخافات. مملكتي لن تحكم نفسها!
actors.mobs.npcs.ratking.confused=ما... أين أنا؟ مملكتي تحتاجني!
actors.mobs.npcs.ratking.crown_clothes=ارتدِ بعض الملابس! أنت لست في حالة للحديث مع الملوك!
actors.mobs.npcs.ratking.crown_desc=أوه، هل ذلك التاج لي!؟ يبدو لامعا أكثر بكثير من تاجي، لذلك أقبل بفضيلة!\n\nفي الحقيقة، أظن أنني أستطيع أن أقدم لك شيئا كمكافأة على هذا التاج. قوة هائلة تليق ببطل مثلك! هل ترغب في ذلك؟
actors.mobs.npcs.ratking.crown_yes=بالطبع!
actors.mobs.npcs.ratking.crown_info=أخبرني المزيد أولا.
actors.mobs.npcs.ratking.crown_no=أفضّل ألا...
actors.mobs.npcs.ratking.crown_thankyou=هيهيهي، شكرا لك! الآن اذهب واجعل ملكك فخورا!
actors.mobs.npcs.ratking.crown_fine=حسنا! لا كأنني أردته أصلا...
actors.mobs.npcs.ratking.crown_after=تستمتع بدرعك الجديد؟ لا تراجعات!
actors.mobs.npcs.ratking.desc_crown=هذا الجرذ أكبر قليلا من جرذ جبلي عادي. إنه يرتدي تاج الملك المدفون على رأسه.
actors.mobs.npcs.ratking.desc_birthday=هذا الجرذ أكبر قليلا من جرذ جبلي عادي. إنه يرتدي قبعة حفلة خضراء صغيرة بدل تاجه المعتاد. عيد ميلاد سعيد أيها الملك الجرذ!
actors.mobs.npcs.ratking.desc_winter=هذا الجرذ أكبر قليلا من جرذ جبلي عادي. إنه يرتدي قبعة احتفالية صغيرة بدل تاجه المعتاد. عطلات سعيدة!
actors.mobs.npcs.ratking.desc=هذا الجرذ أكبر قليلا من جرذ جبلي عادي. إنه يرتدي تاجا صغيرا على رأسه.
actors.mobs.npcs.ratking.discover_hint=تستطيع إيجاد هذه الشخصية في نهاية منطقة معينة من السراديب.
actors.mobs.npcs.sheep.baa!=ماء!
actors.mobs.npcs.sheep.baa?=ماء؟
actors.mobs.npcs.sheep.baa.=ماء.
actors.mobs.npcs.sheep.baa...=ماء...
actors.mobs.npcs.sheep.def_verb=سدّ
actors.mobs.npcs.sheep.desc=هذه خروف سحري. ما السحري فيها؟ لا تستطيع قتلها. ستقف هناك حتى تتلاشى سحريا، كل الوقت تمضغ القش بنظرة فارغة.
actors.mobs.npcs.sheep.discover_hint=تستطيع إيجاد هذه الشخصية بغرض أو فخ معين.
actors.mobs.npcs.shopkeeper.thief=لص، لص!
actors.mobs.npcs.shopkeeper.warn=احذر! لن أحذرك من جديد.
actors.mobs.npcs.shopkeeper.flee=صاحب المتجر يهرب!
actors.mobs.npcs.shopkeeper.sell=بِع غرضا
actors.mobs.npcs.shopkeeper.talk=تحدث
actors.mobs.npcs.shopkeeper.buyback=صاحب المتجر يرجع غرضك بتردد.
actors.mobs.npcs.shopkeeper.talk_prison_intro=عندي كل ما تحتاجه لمغامرة ناجحة!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=هذا ختم مثير للاهتمام عندك هناك، إنها عادة قطعة واحدة. هل أنت بطل مشين أو شيء ما؟ حسنا مهما فعلت ليس من شأني، عملاتك ما زالت جيدة.
actors.mobs.npcs.shopkeeper.talk_prison_mage=هيهي، أظن أنني رأيت ملصق مطلوب باسمك في مكان ما في المدينة. هارب، هل نحن؟ أوه أنت بريء، هل أنت؟ بالطبع، بالطبع... لا تقلق، عندي أشياء أفضل من الإبلاغ عنك، لكن ربما يجب أن تشتري شيئا للتأكد؟
actors.mobs.npcs.shopkeeper.talk_prison_rogue=هل أتيت من نقابة اللصوص لتطهير المنطقة؟ لا، فقط تتسوق؟ حسنا اقتل بعض الوحوش أثناء وجودك هنا على أي حال. لا تتوقع خصما أيضا، أدفع مال حماية جيدا لأناسك وأنتم بالكاد تحمونني بأمان هنا أسفل.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=تبدين خارج عنصرك يا آنسة. ممرات السراديب الضيقة ليست واسعة كالقاعات الكبرى أو الغابات المحيطة بالمدينة، هل هي؟ هيهي، أوه لا تهتمي بهذياني، لماذا لا تشترين شيئا؟
actors.mobs.npcs.shopkeeper.talk_prison_duelist=حسنا إن لم تكن هي البطلة المسافرة! إن كنت تحاولين إنقاذ مدينة أخرى فحظ سعيد، الأخطار هنا أسوأ بكثير من عصابات قطاع طرق تافهة. أنا متأكد أنك ستفعلين أفضل من أي شخص آخر يستطيع، فقط حاولي ألا تموتي خارج متجري مباشرة.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=حسنا مرحبا بك يا صاحب السمو، أو هل هو صاحب القداسة الآن؟ هيهي، في أية حال هذا ليس مكانا لك، كثير من الناس سيكونون مضطربين جدا إن انتهى بك الأمر ميتا. بالتأكيد عندك بعض العملات مع ذلك، لماذا لا تشتري شيئا للمساعدة في منع ذلك؟
actors.mobs.npcs.shopkeeper.talk_caves=اصرف المال، عش أطول.\n\nأوه وقل مرحبا لذلك الحداد الترول نيابة عني إن رأيته. ذكّر ذلك الغبي أنه ما زال مدينا لي بمال تلك المطرقة التي بعتها له الأسبوع الماضي!
actors.mobs.npcs.shopkeeper.talk_city=بضاعتي تستطيع إبقائك آمنا هنا أسفل.\n\n...ولا تتسكع من فضلك. استغرقت الأبدية لجعل السكان هنا يتركونني وشأني، لا أريدك أن تجذب أي متاعب!
actors.mobs.npcs.shopkeeper.talk_halls=مهلا، عندي أسعار خاصة لصيادي الوحوش!\n\nأوه واحذر أسفل هناك! الوحوش المدفونة أسفل أسوأ بكثير مما رأيت في الخزنة، ولا توجد بلورة هروب لإنقاذك. لا تستطيع العودة وإنفاق المزيد من المال إن كنت ميتا! ;)\n\nهل الوحوش مثلي؟ هيهي، أبدا على الإطلاق. أنا مجرد رفيق صغير، لست مقاتلا كثيرا، واستطعت الحفاظ على عقلي سليما. الوحوش أسفل أشياء أقوى بكثير، وكلهم مستعبدون من... حسنا... فقط احذر أسفل هناك.
actors.mobs.npcs.shopkeeper.talk_ascent=لا أعرف ماذا تخطط لفعل ذلك التاج لكنني لا أريد أي دور فيه. اشترِ شيئا وتحرك، كلانا نحتاج إلى مغادرة هذا المكان!
actors.mobs.npcs.shopkeeper.desc=هذا الرجل القوي يبدو أنسب لمنطقة تجارية في مدينة كبيرة ما منه إلى سراديب. أسعاره تفسر لماذا يفضل عمل الأعمال هنا.
actors.mobs.npcs.wandmaker.intro_warrior=أوه، مرحبا بك! يا لها من مفاجأة سارة أن ألتقي بمحارب من الشمال في مكان محبط كهذا! لا بد أنك سافرت بعيدا جدا للوصول إلى هنا. إن كنت تبحث عن مغامرة، قد يكون عندي مهمة لك.
actors.mobs.npcs.wandmaker.intro_rogue=أوه يا سلامتي، لقد أفزعتني! لم ألتقِ بقطاع طريق من هذا المكان ما زال عنده عقل سليم، لذلك يجب أن تكون من السطح! إن كنت مستعدا لمساعدة غريب، قد يكون عندي مهمة لك.
actors.mobs.npcs.wandmaker.intro_mage=أوه، مرحبا %s! سمعت أن هناك اضطرابا بشأنك ومعهد السحرة؟ أوه لا عليك، لم أحب أولئك المتزمتين على أي حال. إن كنت راغبا، قد يكون عندي مهمة لك.
actors.mobs.npcs.wandmaker.intro_huntress=أوه، مرحبا يا آنسة! وجه ودود مفاجأة سارة هنا أسفل أليس كذلك؟ في الحقيقة، أقسم أنني رأيت وجهك من قبل، لكن لا أستطيع تذكر أين... أوه لا عليك، إن كنت هنا للمغامرة، قد يكون عندي مهمة لك.
actors.mobs.npcs.wandmaker.intro_duelist=أوه، مرحبا يا آنسة! يا لها من مفاجأة سارة أن ألتقي ببطلة في مكان محبط كهذا! إن كنت مستعدة لمساعدة رجل عجوز، قد يكون عندي مهمة لك.
actors.mobs.npcs.wandmaker.intro_cleric=أوه، مرحبا يا صاحب السمو! يا لها من مفاجأة سارة أن ألتقي بك في مكان محبط كهذا! أكره أن أفرض، لكن قد يكون عندي مهمة لك.
actors.mobs.npcs.wandmaker.intro_1=\n\nأتيت إلى هنا لإيجاد مكون نادر لعصا، لكنني أضللت نفسي، ودرعي السحري يضعف. سأحتاج إلى المغادرة قريبا، لكن لا أستطيع تحمل الذهاب دون الحصول على ما أتيت من أجله.
actors.mobs.npcs.wandmaker.intro_dust=أبحث عن بعض _غبار الجثة._ إنه نوع خاص من وجبة عظام ملعونة تظهر عادة في أماكن كهذه. يجب أن تكون هناك غرفة مترّسة حول هنا في مكان ما، أنا متأكد أن بعض الغبار سيظهر هناك. احذر مع ذلك، اللعنة التي يحملها الغبار قوية جدا، _ارجع إليّ بأسرع ما تستطيع_ وسأطهره لك.
actors.mobs.npcs.wandmaker.intro_ember=أبحث عن بعض _الجمر الطازج_ من عنصر نار مولود جديدا. العناصر تظهر عادة عندما لا يُتحكم في طقوس استدعاء، لذلك فقط ابحث عن بعض الشموع وموقع طقوس وأنا متأكد أنك ستستطيع جعل واحد يظهر. ستريد _تجنب محاصرة نفسك_ أثناء قتاله مع ذلك، أو _الاحتفاظ بنوع من أغراض التجميد في متناول اليد._ عناصر المواليد الجدد قوية وفوضوية جدا، لكنهم لا يحتملون البرد.
actors.mobs.npcs.wandmaker.intro_berry=حارس هذه السجن القديم احتفظ بـ _نبتة توت العفن،_ وأنا ألاحق إحدى بذورها. النبتة على الأرجح توحشت الآن مع ذلك، لذلك جعلها تتنازل عن بذرة قد يكون صعبا. حديقتها يجب أن تكون حول هنا في مكان ما. حاول إلى _البقاء بعيدا عن ضاربات كرومها_ إن أردت البقاء في قطعة واحدة. استعمال النار قد يكون مغريا لكن من فضلك لا تفعل، ستقتل النبتة وتدمر بذورها.
actors.mobs.npcs.wandmaker.intro_2=\n\nإن استطعت إحضار ذلك لي، سأكون سعيدا أن أدفع لك بإحدى عصيّ المصنوعة بدقة! أحضرت اثنتين معي، لذلك تستطيع أخذ أيهما تفضل.
actors.mobs.npcs.wandmaker.reminder_dust=أي حظ مع غبار الجثة، يا %s؟ ابحث عن بعض المتاريس.
actors.mobs.npcs.wandmaker.reminder_ember=أي حظ مع تلك الجمرات، يا %s؟ ستحتاج إلى إيجاد أربع شموع وموقع الطقوس.
actors.mobs.npcs.wandmaker.reminder_berry=أي حظ مع بذرة توت العفن، يا %s؟ ابحث عن غرفة مليئة بالنباتات.
actors.mobs.npcs.wandmaker.def_verb=سدّ
actors.mobs.npcs.wandmaker.desc=هذا السيد كبير السن لكنه نشيط يرتدي تعبيرا مرتبكا قليلا. إنه محمي بدرع سحري.
actors.mobs.quest.vault.vaultbosselemental.rankings_desc=أُغمر بالعنصر الأكبر
actors.mobs.quest.vault.vaultbosselemental.discover_hint=تستطيع إيجاد هذا العدو أثناء مهمة معينة.
actors.mobs.quest.vault.vaultbosselemental.desc=يمثل ذروة سحر استدعاء الأقزام، قوة هذا العنصر الضخم غير المستقرة تبدو منظمة بالدائرة المبهرة بالتساوي التي استدعته. هذا يمنحه القدرة على _تبديل الأشكال!_ كل شكل عنده هجمات ومقاومات ونقاط ضعف فريدة.
actors.mobs.quest.vault.vaultbosselemental.desc_fire=العنصر يتخذ حاليا _شكل ناريا_ حارا منصهرا. في هذا الشكل يستطيع إطلاق كرات نار واستدعاء موجات لهب تجتاح الساحة. سيحاول توجيه كرات النار في الاتجاه الذي تتحرك فيه، وموجات النار عندها دائما فجوة. إن أصبت بأي منهما ستكون _مشتعلة._\n\nفي هذا الشكل إنه _مقاوم للسحر،_ الذي يغذي الألسنة فقط. لبه المنصهر الهش قد يمكن إصابته بسهولة بـ _أسلحة بعيدة_ مع ذلك.
actors.mobs.quest.vault.vaultbosselemental.fire_resist=الألسنة تنمو بينما يمتص العنصر معظم هجومك السحري!
actors.mobs.quest.vault.vaultbosselemental.fire_weak=سلاحك المرمي يضرب لب العنصر، يسبب ضررا إضافيا!
actors.mobs.quest.vault.vaultbosselemental.desc_frost=العنصر يتخذ حاليا _شكل صقيع_ باردا. في هذا الشكل يستطيع إطلاق مخروط بارد يجتاح و استدعاء دوامة هواء بارد متحركة. كل من هذين الهجومين يمكن الالتفاف حوله بتوقيت جيد، لكن المخروط مميت خاصة عن بعد. إن أصبت بأي منهما _ستتجمد صلبا._\n\nفي هذا الشكل إنه أيضا _مقاوم للأسلحة المرماة،_ التي ستلتصق فقط بصدفته الجليدية. الصدفة لا تبدو متينة بشكل خاص مع ذلك، لذلك إصابة بـ _سلاح اشتباك_ يجب أن تكون ضارة بشكل خاص.
actors.mobs.quest.vault.vaultbosselemental.frost_resist=السلاح المرمي يلتصق بصدفة صقيع العنصر!
actors.mobs.quest.vault.vaultbosselemental.frost_weak=ضربة اشتباكك تحطم بعضا من صدفة الصقيع، وتسبب ضررا إضافيا!
actors.mobs.quest.vault.vaultbosselemental.desc_shock=العنصر يتخذ حاليا _شكل صدمة_ كهربائيا. في هذا الشكل يستطيع إطلاق صاعقة برق على موقعك، أو استدعاء خطوط شرارات من جوانب الساحة. هذه الهجمات أسهل قليلا في التفادي، لكنه يستطيع فعلها بشكل متكرر أكثر. إن أصبت بأي منهما ستكون _مصعوقا لحظيا._\n\nفي هذا الشكل إنه أيضا _مقاوم لهجمات الاشتباك،_ التي ستسبب هزة مؤلمة. الطاقة المحيطة به ستُزعزع بـ _السحر_ مع ذلك، ما يلحق ضررا إضافيا.
actors.mobs.quest.vault.vaultbosselemental.shock_resist=بينما تحاول الضرب تتلقى هزة مؤلمة!
actors.mobs.quest.vault.vaultbosselemental.shock_weak=السحر يعطل حقل العنصر الكهربائي، ويسبب ضررا إضافيا!
actors.mobs.quest.vault.vaultdm100.discover_hint=تستطيع إيجاد هذا العدو أثناء مهمة معينة.
actors.mobs.quest.vault.vaultdm100.desc=هذه الـ AE-100 تبدو مطابقة تقريبا لتلك التي تجدها في السجن، لكن بتوهج أزرق مخضر لامع يأتي من عينها. على الأرجح أُعيد تجهيزها لاستعمال مصدر طاقة قزمي أكثر حداثة.\n\nتتصرف تماما كـ AE-100 عادية. قدرتها على قوس البرق عن بعد ما زالت موجودة رغم تغيير مصدر الطاقة، وحالتها الأنظف تجعلها أكثر متانة قليلا.
actors.mobs.quest.vault.vaultdm200.discover_hint=تستطيع إيجاد هذا العدو أثناء مهمة معينة.
actors.mobs.quest.vault.vaultdm200.desc=هذه الـ AE-200 تبدو تماما كبنات عمومتها من الكهوف، لكن بعيون زرقاء مخضرة متوهجة. على الأرجح أُعيد تجهيزها بمصدر طاقة قزمي أكثر حداثة.\n\nتماما مثل بنات عمومتها في الكهوف، هذه الـ AE-200 كبيرة جدا أن تدخل الأماكن المغلقة، وما زالت قادرة على بصق الغاز.
actors.mobs.quest.vault.vaultrat.desc=هذا الجرذ عنده بعض تغييرات السلوك لاختبار ذكاء أعداء الخزنة الجديد:\n_-_ حركته يمكن 'سماعها' عبر الحيطان\n_-_ سيتجول على طول دورية معينة مسبقا\n_-_ أثناء التجول عنده مدى كشف منخفض بشكل حاد خلف الاتجاه الذي يتحرك فيه.\n_-_ أثناء النوم مدى كشفه منخفض أيضا\n_-_ عندما يكشفك 'سيتحقق' قبل التبديل إلى الصيد. الأعداء المتحققون يتحركون نحوك لكنهم لا يهاجمون وأسهل فقدانهم خلف الأبواب والزوايا.
actors.mobs.quest.vault.vaultskeleton.discover_hint=تستطيع إيجاد هذا العدو أثناء مهمة معينة.
actors.mobs.quest.vault.vaultskeleton.desc=هذه ستبدو كهياكل عظمية عادية من السجن لولا كمية شعر الوجه المذهلة عندها. يبدو أن بعض الأقزام لم يكونوا فوق سحر الأموات حتى قبل تولي ملكهم الجديد.\n\nتتصرف تماما كهياكل عظمية عادية، بما فيها الانفجار إلى شظايا عظام عند الموت. بتناقض، لحاها تبدو تمنحها حماية أكثر قليلا أيضا.
actors.mobs.quest.vault.vaultshaman.discover_hint=تستطيع إيجاد هذا العدو أثناء مهمة معينة.
actors.mobs.quest.vault.vaultshaman.desc=هؤلاء الشامانات الغنولات بوضوح من الكهوف، لكن عندهم قناع معدني غريب يبدو قزميا. ملاءمة القناع ضيقة للغاية، والشامانات يتحركون بطريقة متعثرة محرجة. هل القناع مصنوع للتحكم فيهم؟
actors.mobs.quest.vault.vaultshaman.spell_desc=هؤلاء الغنولات بالتأكيد ما زالوا قادرين على صعقك بالسحر، لكن دون لون قناع لا يمكن التكهن بنوع السحر الذي سيستعملونه. القناع المعدني يبدو أيضا أنه يحميهم أكثر قليلا من قناع خشبي، وهناك قوة أكبر بكثير خلف هجماتهم من شامان غنول عادي.
actors.mobs.acidic.desc=هذه المخلوقات المظلمة الضخمة الشبيهة بالعناكب تتجنب القتال القريب، تفضل إطلاق أشواك مسننة مشلّة من مسافات طويلة. هذا يبدو أنه يقطر بناز أكال.
actors.mobs.albino.desc=هذا فصيلة نادرة من الجرذان الجبلية، بفراء أبيض نقي وأسنان مشرشرة.
actors.mobs.albino.discover_hint=تستطيع نادرا إيجاد هذا العدو في منطقة معينة من السراديب.
actors.mobs.armoredstatue.desc=ستظن أنه مجرد تمثال آخر غير حي من تماثيل هذه السراديب، لكن عيونه الحمراء المتوهجة تفضحه.\n\nيبدو في حالة عظيمة بسبب الدرع الذي يرتديه، قد يكون صعبا جدا قتله.
actors.mobs.armoredstatue.desc_arm_wep=بينما التمثال نفسه مصنوع من الحجر، _%1$s_ و _%2$s_ التي يحملها تبدو حقيقية.
actors.mobs.bandit.desc=لص نخبة، مميز بردائه الأرجواني الأكثر فخامة. رغم مهارتهم الأكبر، أصبحوا عاجزي العقل تماما كاللصوص العاديين.\n\nبالإضافة إلى السرقة منك، قطاع الطرق المجانين سيعميك وجيزة، يشلونك، ويسممونك! هم أكثر احتمالا بكثير أن يحملوا غنائم إضافية من لص عادي مع ذلك.
actors.mobs.bat.desc=هؤلاء سكان الكهوف السريعون والمثابرون أخطر بكثير مما يبدون. يجددون صحتهم مع كل هجوم ناجح، ما يتيح لهم هزيمة خصوم أكبر بكثير.
actors.mobs.bee.desc_honey=رغم حجمها الصغير، النحل الذهبي يميل إلى حماية بيته بشراسة. هذا هُدّئ، ويبدو أنه يريد اتباعك.
actors.mobs.bee.desc=رغم حجمها الصغير، النحل الذهبي يميل إلى حماية بيته بشراسة. هذا غاضب جدا، الأفضل الحفاظ على مسافتك.
actors.mobs.bee.discover_hint=تستطيع إيجاد هذه الشخصية بغرض معين.
actors.mobs.brute.enraged=مغضب
actors.mobs.brute.def_verb=سدّ
actors.mobs.brute.desc=الوحوش الغنولية هي الأكبر والأقوى والأصعب من كل الغنولات. عندما يُجرحون جرحا قاتلا، يدخلون في الهيجان المحموم، يكسبون دروعا مؤقتة وتعزيزا كبيرا للضرر.
actors.mobs.brute$bruterage.name=غضب الوحش
actors.mobs.brute$bruterage.desc=هذا الوحش الغنولي يموت، لكنه يريد أن يأخذك معه!\n\nالوحش سيموت عندما تنفد دروعه، إما بالوقت أو إن تعرض للضرر. في هذه الأثناء، سيسبب ضررا متزايدا بشكل هائل، لذلك احذر!\n\nالدروع المتبقية: %d.
actors.mobs.causticslime.desc=هذا الوحل يبدو أنه تلوث بالسحر المظلم المنبعث من أسفل. فقد لونه الأخضر المعتاد، ويقطر بناز كاوٍ.
actors.mobs.causticslime.discover_hint=تستطيع نادرا إيجاد هذا العدو في منطقة معينة من السراديب.
actors.mobs.crab.desc=هذه السلطعونات الضخمة في قمة سلسلة الغذاء في الصهاريج. إنها سريعة للغاية ودرعها السميك يستطيع تحمل ضربات ثقيلة.
actors.mobs.crystalguardian.def_verb=سدّ
actors.mobs.crystalguardian.desc=هؤلاء الحراس البلوريون الكبار يبدون كتماثيل تقريبا، لولا عيونهم المتوهجة الساطعة. البلور المتصلب الذي صنعوا منه يجعلهم بطيئين لكن صلبين جدا، لذلك _الأفضل تركهم نائمين في عشهم البلوري لأطول فترة ممكنة._\n\nبسبب حجمهم، حراس البلورات سيتحركون أبطأ بكثير في الأماكن المغلقة. إنهم أيضا متينون جدا بحيث يستحيل قتلهم مباشرة. يمكن ضربهم وتعطيلهم مؤقتا، لكنهم سينهضون من جديد بعد فترة قصيرة.
actors.mobs.crystalguardian.discover_hint=تستطيع إيجاد هذا العدو أثناء مهمة معينة.
actors.mobs.crystalmimic.ate=المقلد أكل %s خاصتك!
actors.mobs.crystalmimic.escaped=المقلد البلوري هرب!
actors.mobs.crystalmimic.desc=المقلدات مخلوقات سحرية تستطيع اتخاذ أي شكل ترغب فيه. في السراديب تختار تقريبا دائما شكل صندوق كنز، لإغراء المغامرين غير المشتبهين.\n\nالمقلدات البلورية أكثر مكرا من بنات عمومتها العادية، وتفضل تجنب النزاع بينما تسرق الغنائم. ستحاول الركض بعيدا بمجرد اكتشافها، وعندها القدرة على إعادة تموضع الأعداء عندما تهاجم.
actors.mobs.crystalspire.warning=البلورة تهتز بينما تضربها. الاستمرار في هذا مقدر أن يجذب الانتباه إليك...
actors.mobs.crystalspire.alert=الاهتزاز ينمو ويهدر عبر الكهف كله!
actors.mobs.crystalspire.rankings_desc=ثقبته قمة البلورة
actors.mobs.crystalspire.desc=هذه القمة العملاقة من بلور فائق الصلابة هي على الأرجح مصدر كل المخلوقات البلورية الغريبة في هذا الكهف. أسلحتك العادية غير فعالة ضدها، لذلك ستحتاج إلى استعمال معولك إن أردت تدميرها.\n\n_تأكد أنك مستعد قبل بدء كسرها._ بلورة كبيرة كهذه ستستغرق وقتا للتنقيب عبرها على الأرجح، وربما لن تستطيع فعل ذلك دون إزعاج. القمة نفسها قد يكون عندها بعض وسائل الدفاع عن نفسها أيضا. _ربما هجمات القمة الخاصة يمكن استعمالها ضد أتباعها._
actors.mobs.crystalspire.discover_hint=تستطيع إيجاد هذا العدو أثناء مهمة معينة.
actors.mobs.crystalwisp.beam_kill=حزمة الضوء قتلتك...
actors.mobs.crystalwisp.desc=قطعة غاضبة صغيرة عائمة من بلور متصلب تنتج توهجا ساطعا. بينما ليست قوية بشكل خاص، أرواح البلورات ستطلق حزمة ضوء ضارة عليك إن كان عندها طلقة واضحة.\n\nالأرواح صغيرة كفاية لتتحرك بسهولة عبر النتوءات البلورية المتنوعة، لكنها لا تستطيع الإطلاق عبرها.
actors.mobs.crystalwisp.discover_hint=تستطيع إيجاد هذا العدو أثناء مهمة معينة.
actors.mobs.demonspawner.on_death=الطاقة المظلمة هنا تبدو تقل بينما تموت المولّدة.
actors.mobs.demonspawner.desc=هذا الخليط الملتوي من لحم الأقزام مسؤول عن خلق وحوش ممزقة من الأقزام الذين ماتوا في هذه المنطقة. بوضوح، هذه الوحوش لا ترى مانعا في استعمال كل مورد تستطيع ضد أعدائها.\n\nبينما مرعبة بصريا، مولّدات الوحوش ليس عندها وسيلة للحركة أو الدفاع عن نفسها مباشرة. كتلتها الكبيرة تجعلها صعبة القتل بسرعة مع ذلك، وستولد وحوشا ممزقة أسرع عندما تكون مهددة.\n\n_مولّدات الوحوش تبدو متصلة بمصدر مركزي ما من قوة مظلمة. قتلها قد يضعفه._
actors.mobs.dm100.zap_kill=صاعقة البرق قتلتك...
actors.mobs.dm100.desc=الـ AE-100 نموذج مبكر من 'آلة دفاع' قزمية صُممت لحماية منقّبي الأقزام في الكهوف أسفل هذا السجن. صدماتهم الكهربائية أثبتت أنها ضعيفة جدا مع ذلك، وهكذا أُهديت إلى المدينة البشرية أعلاه. ظلت غير مستعملة لسنوات وفي النهاية وجدت طريقها إلى السجن، حيث اعتبرها الحارس في البداية قاسية جدا أن تُستعمل. لكن، بينما أصبح السجناء أكثر اضطرابا أصبحت ضرورة.
actors.mobs.dm200.vent=الـ AE-200 تطلق نفثة عادم سام!
actors.mobs.dm200.desc=الـ AE-200 هي الجيل الثاني من 'آلة دفاع' قزمية، صُممت لحماية منقّبي الأقزام في الكهوف والمدينة أسفل. إنها أكبر وأضخم بكثير من سابقاتها، وتهاجم بقبضات هيدروليكية مدمرة.\n\nحجمها المتزايد هو أيضا ضعفها الأساسي، لأنها غير قادرة على الدخول في أنفاق وأبواب السراديب الضيقة. استطاع الأقزام تعويض نقص حركة الـ AE-200 بالسماح لها بتنفيس أبخرة عادمها السامة على أعداء بعيدين، أو أعداء لا تستطيع الوصول إليهم.
actors.mobs.dm201.vent=الـ AE-201 تقذف قنبلة أكالة!
actors.mobs.dm201.desc=جرب الأقزام وجيزة التأكيد أكثر على نقص حركة الـ AE-200 وخلقوا نماذج AE ثابتة بالكامل. الـ AE-201 هي AE-200 معاد تجهيزها تعمل كبرج حراسة ليس عنده قدرة حركة. مقابل نقص الحركة، الـ AE-201 عندها متانة وقوة هجوم أكبر بكثير.\n\nلأن الـ AE-201 ليس عندها محرك لتنفيس العادم منه، جهزها الأقزام بدل ذلك بقنابل غاز أكالة! الـ AE-201 حذرة مع هذه القنابل مع ذلك، وستقذفها فقط عندما تُهاجم من بعيد.
actors.mobs.dm300.notice=رُصد أفراد غير مصرح لهم!
actors.mobs.dm300.shield=الـ AE-300 تسحب القوة من الأسلاك المكشوفة وتدرع نفسها!
actors.mobs.dm300.charging=يتلقى ضررا! يُفعّل برج الطاقة!
actors.mobs.dm300.charging_hint=الـ AE-300 محصنة بينما تُشحن ببرج!
actors.mobs.dm300.supercharged=دمر! دمر! دمر!
actors.mobs.dm300.charge_lost=دُمر البرج! يعود إلى الطاقة المحلية!
actors.mobs.dm300.pylons_destroyed=تنبيه! رُصد عدم استقرار في شبكة الطاقة!
actors.mobs.dm300.rankings_desc=سحقته الـ AE-300
actors.mobs.dm300.def_verb=سدّ
actors.mobs.dm300.defeated=ضرر حرج! محاولة إطفاء-
actors.mobs.dm300.desc_supercharged=الـ AE-300 مشحونة حاليا بالكامل بالطاقة الكهربائية. في هذا الشكل لا تستطيع تلقي الضرر وتتحرك بسرعة مزدوجة! بالإضافة إلى ذلك، حفّارها يدور الآن بسرعة كافية لها _للحفر عبر الصخر الصلب،_ مع أنها تتحرك ببطء أكبر بكثير عند فعل هذا.\n\nمهاجمة الـ AE-300 مباشرة غير مجدية بينما هي مشحونة بشكل فائق، لكن _شيئا في المنطقة لا بد أن يزودها بهذه الطاقة،_ تدميره قد يضعفها.
actors.mobs.dwarfking.notice=كيف تجرؤ! ليس لديك فكرة عما تتدخل فيه!
actors.mobs.dwarfking.lifelink_1=أنا بحاجة إلى جوهرك، يا عبد!
actors.mobs.dwarfking.lifelink_2=انزف من أجلي، يا عبد!
actors.mobs.dwarfking.teleport_1=تعامل معهم، يا عبد!
actors.mobs.dwarfking.teleport_2=أبقِهم مشغولين، يا عبد!
actors.mobs.dwarfking.wave_1=كفى! انهضوا يا عبيدي!
actors.mobs.dwarfking.wave_2=المزيد! انزفوا لملككم!
actors.mobs.dwarfking.wave_3=عديمو الفائدة! اقتلوهم الآن!
actors.mobs.dwarfking.enraged=لا تستطيع قتلي يا %s. أنا. خالد!
actors.mobs.dwarfking.losing=لا! لا تستطيع فعل هذا... ليس لديك فكرة عما يكمن أسفل...
actors.mobs.dwarfking.defeated=أنت... حكمت علينا جميعا بالهلاك...
actors.mobs.dwarfking.rankings_desc=سقط قبل الملك المدفون
actors.mobs.dwarfking$dkghoul.rankings_desc=سقط قبل الملك المدفون
actors.mobs.dwarfking$dkmonk.rankings_desc=سقط قبل الملك المدفون
actors.mobs.dwarfking$dkwarlock.rankings_desc=سقط قبل الملك المدفون
actors.mobs.dwarfking$dkgolem.rankings_desc=سقط قبل الملك المدفون
actors.mobs.ebonymimic.reveal=كان هناك مقلد هناك!
actors.mobs.ebonymimic.hidden_name=مخطط مشبوه
actors.mobs.ebonymimic.hidden_desc=يبدو أن هناك شيئا هنا، لكنه شفاف تقريبا بالكامل.
actors.mobs.ebonymimic.desc=المقلدات مخلوقات سحرية تستطيع اتخاذ أي شكل ترغب فيه. في السراديب تختار تقريبا دائما شكل صندوق كنز، لإغراء المغامرين غير المشتبهين.\n\nالمقلدات الأبنوسية مقلدات متخفية عندها القدرة على جعل نفسها غير مرئية تقريبا. تتربص على أشياء من المحتمل أن يتفاعل المغامرون معها، لكنها تحتوي غنائمها الخاصة أيضا. ليست أصعب من مقلد عادي بمجرد اكتشافها، لكن عضتها المفاجئة مدمرة.
actors.mobs.ebonymimic.discover_hint=تستطيع إيجاد هذا العدو بحلية معينة.
actors.mobs.elemental$fireelemental.desc=العناصر مخلوقات فوضوية تُخلق غالبا عندما لا يُتحكم بشكل صحيح في سحر غامض قوي. العناصر عندها ذكاء أدنى، وترتبط عادة بنوع معين من السحر.\n\nعناصر النار نوع شائع من العناصر يسبب ضررا بسحر ناري. ستُشعل هدفها ملتهبا بهجمات اشتباك، وتستطيع إطلاق صواعق نار أحيانا أيضا.
actors.mobs.elemental$newbornfireelemental.charging=العنصر يشحن!
actors.mobs.elemental$newbornfireelemental.desc=العناصر مخلوقات فوضوية تُخلق غالبا عندما لا يُتحكم بشكل صحيح في سحر غامض قوي. العناصر عندها ذكاء أدنى، وترتبط عادة بنوع معين من السحر.\n\nعنصر النار هذا مستدعى حديثا، لكنه ما زال خطيرا جدا!
actors.mobs.elemental$newbornfireelemental.rankings_desc=فحّمته عنصر نار مولود جديد
actors.mobs.elemental$newbornfireelemental.desc_boss=بسبب الطبيعة الفوضوية لاستدعائه، يستطيع هذا العنصر نشر النار فقط في انفجارات غير دقيقة بعد شحنه لدور.
actors.mobs.elemental$newbornfireelemental.desc_ally=لأن هذا العنصر استُدعي بتعويذة، عنده تحكم أكثر قليلا في لهبه. إنه غير قادر على أداء هجمات بعيدة، لكنه سيُشعل الأعداء الذين يهاجمهم في الاشتباك.
actors.mobs.elemental$newbornfireelemental.discover_hint=تستطيع إيجاد هذا العدو أثناء مهمة معينة.
actors.mobs.elemental$frostelemental.desc=العناصر مخلوقات فوضوية تُخلق غالبا عندما لا يُتحكم بشكل صحيح في سحر غامض قوي. العناصر عندها ذكاء أدنى، وترتبط عادة بنوع معين من السحر.\n\nعناصر الصقيع نوع شائع من العناصر يضعف الأعداء بسحر بارد. ستبرد هدفها بهجمات اشتباك وهجمات بعيدة أحيانا. سحرها أكثر فعالية بكثير في الماء.
actors.mobs.elemental$shockelemental.desc=العناصر مخلوقات فوضوية تُخلق غالبا عندما لا يُتحكم بشكل صحيح في سحر غامض قوي. العناصر عندها ذكاء أدنى، وترتبط عادة بنوع معين من السحر.\n\nعناصر الصدمة نوع أقل شيوعا من العناصر يعطل أعداءه بالكهرباء وومضات الضوء. في الاشتباك ستقوس الكهرباء إلى الأعداء القريبين، وتسبب ضررا إضافيا لهدفها الأساسي إن كانوا في الماء. ستُركز أيضا أحيانا انفجار ضوء بعيدا على هدفها، تعميه مؤقتا.
actors.mobs.elemental$chaoselemental.desc=العناصر مخلوقات فوضوية تُخلق غالبا عندما لا يُتحكم بشكل صحيح في سحر غامض قوي. العناصر عندها ذكاء أدنى، وترتبط عادة بنوع معين من السحر.\n\nعناصر الفوضى عناصر نادرة وخطيرة لم تستقر على عنصر معين. ستطلق سحرا بريا غير قابل للتنبؤ عندما تهاجم.
actors.mobs.eye.deathgaze_kill=نظرة الموت قتلتك...
actors.mobs.eye.desc=عيون الشر كرات عائمة من طاقة مظلمة مكبوتة. بينما هي قادرة على قتال الاشتباك، قوتها الحقيقية تأتي من سحرها.\n\nبعد بناء الطاقة لفترة قصيرة ستطلق عين شريرة حزمة طاقة مدمرة تسمى _نظرة الموت._ أي شيء داخل أنظار عين الشر سيتلقى ضررا هائلا، المغامرون الحكماء سيركضون للاحتماء.
actors.mobs.fetidrat.rankings_desc=ذوّبه الجرذ النتن
actors.mobs.fetidrat.desc=هناك شيء خاطئ بوضوح مع هذا الجرذ. فراؤه الأسود الدهني وجلده المتعفن مختلفان جدا عن الجرذان الصحية التي رأيتها من قبل. عيناه الخضراوان الشاحبتان تجعلانه يبدو مهددا بشكل خاص.\n\nالجرذ يحمل سحابة نتن فظيع معه، إنها قوية بشكل ساحق عن قرب.\n\nناز مظلم يقطر من فم الجرذ، يأكل عبر الأرض لكنه يبدو مذوبا في الماء.
actors.mobs.fetidrat.discover_hint=تستطيع إيجاد هذا العدو أثناء مهمة معينة.
actors.mobs.fungalcore.desc=هذا الفطر العملاق لا بد أنه مصدر كل نشاط الفطر في هذا الكهف.
actors.mobs.fungalsentry.desc=هذا الفطر الطويل بشكل خاص يعمل كنقطة دفاع لشبكة الفطر الأكبر التي تعيش في هذا الكهف.\n\nإنه غير متحرك، لكنه سيطلق انفجارات سم دقيقة على أي شيء يدخل خط نظره. بينما تأثير هذه الانفجارات ضعيف إلى حد ما، _تستطيع تكديس كميات مميتة من السم بسرعة كبيرة._ بينما يستطيع أن يُقتل، الأفضل على الأرجح تجنبه.
actors.mobs.fungalspinner.desc=دوار الكهف هذا يبدو أنه يُتحكم فيه بفطر طفيلي. الفطر غيّر قدراته أيضا، استبدل شبكته وأكياسه السامة بنمو فطري.\n\nالدوار الفطري سيبصق حياة نباتية عليك بدل الشبكات، ينشر نباتات فطرية ويجذرك محتملا. بينما لا يستطيع التسميم، الدوار الفطري سيكسب مقاومة ضرر كبيرة إن كان مجاورا لأي فطر.
actors.mobs.ghoul.desc=بينما بدأ مجتمع الأقزام بالانهيار ببطء، وملك الأقزام الحالي يمسك بالسلطة المطلقة، أولئك الضعفاء أو قاوموه لم يُعاملوا بشكل جيد. بينما نما الملك أكثر مهارة في استعمال السحر المظلم، أثنى هؤلاء الأقزام لإرادته، والآن يشكلون جنود مشاة جيشه.\n\nالأموات الأحياء ليسوا أقوياء بشكل خاص وحدهم، لكنهم يسافرون دائما في مجموعات وأصعب بكثير في القتل بأعداد كبيرة. _عندما يُهزم ميت حي، سينهض من جديد بعد بضعة أدوار طالما ميت حي آخر قريب._
actors.mobs.gnoll.desc=الغنولات بشراويون شبيهون بالضباع. يسكنون في الصهاريج والسراديب، يغامرون إلى السطح من وقت لآخر للغارة عليه. كشافة الغنولات أعضاء عاديون في قطيعهم، ليست قوية كالوحوش وليست ذكية كالشامانات.
actors.mobs.gnollexile.desc=هذا الغنول ذو الفراء الرمادي عنده علامة كبيرة على كتفه، تدل عليه كمنفي. الغنولات عادة تُنفى من مجتمعها لتجاهل الأوامر أو كسر القوانين. المنفيون يجب أن يكونوا أقوياء وماكرين للبقاء على قيد الحياة، هذا يبدو أنه يعرف كيف يستعمل الرمح الذي يحمله.
actors.mobs.gnollexile.desc_passive=_الغنول المنفي لا يتحرك للهجوم._ لا يبدو عدوانيا كغنولات أخرى هنا، وربما لا يظن أن قتالك يستحق العناء. تستطيع فقط تركه يمر، لكن عنده حقيبة ظهر قد تكون مليئة بأغراض مفيدة...
actors.mobs.gnollexile.desc_aggro=_الغنول المنفي ينظر حوله بغضب._ يبدو أن شيئا جعله يقرر القتال بعد كل شيء. احذر من ذلك الرمح!
actors.mobs.gnollexile.seen_passive=الغنول الذي يحمل الرمح ينظر إليك بحذر، لكنه لا يتحرك للهجوم.
actors.mobs.gnollexile.seen_aggro=الغنول الذي يحمل الرمح يتحرك للهجوم!
actors.mobs.gnollgeomancer.warning=مهندس الأرض يبدأ بالتحرك. تأكد أنك مستعد قبل أن تستمر!
actors.mobs.gnollgeomancer.alert=مهندس الأرض يستيقظ! الكهف كله يبدو يتحول بينما يقفز بعيدا وهو يضحك بجنون!
actors.mobs.gnollgeomancer.rock_kill=الصخرة الطائرة قتلتك...
actors.mobs.gnollgeomancer.rockfall_kill=الصخور المتساقطة قتلتك...
actors.mobs.gnollgeomancer.rankings_desc=دفنه مهندس الأرض الغنول
actors.mobs.gnollgeomancer.desc=هذا الغنول الكبير الطويل المذهل لا بد أنه مصدر سحر تحريك الأرض المتنوع حول هنا، ومنظم كل نشاط الغنولات. على عكس نقّابي الغنولات في المنطقة، مهندس الأرض ماهر جدا بسحره، ولا يمكن أن يتعرض للضرر من الصخور المرماة أو المتساقطة. ليس عنده أي طريقة للقتال في قتال اشتباك مع ذلك.
actors.mobs.gnollgeomancer.desc_armor=مهندس الأرض مغلف حاليا في طبقة درع صخري. _ستحتاج إلى الاقتراب وكسره بعيدا بمعولك قبل أن تستطيع إضرار مهندس الأرض._
actors.mobs.gnollgeomancer.desc_armor_sapper=_نقّاب غنول قريب يحمل جهازا يعزز درع مهندس الأرض الصخري. لن تستطيع إضراره على الإطلاق الآن!_
actors.mobs.gnollgeomancer.desc_sleeping=شامان الغنول الطويل المذهل محاط بطبقة صخر، ويبدو كتمثال تقريبا. بالنظر عن قرب تستطيع رؤية الصخر يتحرك سحريا مع تنفس الغنول الكبير. لا يمكن أن يتعرض للضرر بينما هو مغلف في صخر كهذا، ويبدو أنه يستمتع بقيلولة ترابية حرفية.\n\nربما تستطيع الكسر عبر طبقات الصخر بمعولك، لكن _تأكد أنك مستعد لقتال عندما تفعل ذلك._ مهندس الأرض لا بد أنه مصدر سحر تحريك الأرض المتنوع حول هنا، ومنظم كل نشاط الغنولات. _هزيمة الغنولات المتناثرة حول هنا قبل قتاله قد تكون فكرة جيدة._
actors.mobs.gnollgeomancer.discover_hint=تستطيع إيجاد هذا العدو أثناء مهمة معينة.
actors.mobs.gnollguard.def_verb=سدّ
actors.mobs.gnollguard.spear_warn=الغنول يوجّه ضربة شريرة برأس رمحه!
actors.mobs.gnollguard.desc=غنول كبير وصعب يبدو يحمل رمحا ودرعا، لكن لا خوذة. هؤلاء الحراس على الأرجح وحوش في التدريب، مجندون للمساعدة في حماية المنجم من الحياة البرية المتجاوزة.\n\nحارس الغنول قوي كفاية لحمل الرمح بيد واحدة، لكنه لا يستطيع استعماله جيدا جدا. _سيحتاج مساحة مفتوحة إلى حد ما للهجوم عن بعد، وسيسبب لك ضررا أقل بشكل ملحوظ إن اقتربت منه._
actors.mobs.gnollguard.desc_armor=_نقّاب غنول قريب يحمل جهازا يمنح هذا الحارس درعا ترابيا، يخفض بشدة الضرر الذي يتلقاه._
actors.mobs.gnollguard.discover_hint=تستطيع إيجاد هذا العدو أثناء مهمة معينة.
actors.mobs.gnollsapper.desc=غنول صغير وضعيف لكنه ذكي بفراء شاحب وحقيبة مليئة بأجهزة متنوعة. إنه على الأرجح هنا للمساعدة في التنقيب عن الذهب المظلم والتعدين له، وعنده حارس قريب للحماية. إنه قادر على القتال، لكن هجماته ضعيفة بشكل مؤسف، ليست أقوى من كشاف غنول.\n\nبدل القتال مباشرة، النقّابون يفضلون استعمال الأجهزة المتنوعة عندهم لجعل البيئة الصخرية تهاجم لصالحهم. لا يعرفون سحر تحريك الأرض بأنفسهم مع ذلك، وهكذا هم محتملون جدا لاستعمال أجهزتهم بتهور. _يجب أن تكون هناك طرق كثيرة لاستعمال هجماتهم ضدهم، أو ضد حارسهم._
actors.mobs.gnollsapper.discover_hint=تستطيع إيجاد هذا العدو أثناء مهمة معينة.
actors.mobs.gnolltrickster.rankings_desc=خدعه المحتال الغنول
actors.mobs.gnolltrickster.desc=مخلوق غريب المظهر، حتى بمقاييس الغنولات. ينحني إلى الأمام بابتسامة شريرة، يحتضن تقريبا الحقيبة المعلقة على كتفه. عيونه واسعة بمزيج غريب من الخوف والإثارة.\n\nهناك مجموعة كبيرة من السهام رديئة الصنع في حقيبته، كلها تبدو ذات رؤوس بمواد ضارة متنوعة.
actors.mobs.gnolltrickster.discover_hint=تستطيع إيجاد هذا العدو أثناء مهمة معينة.
actors.mobs.goldenmimic.desc=المقلدات مخلوقات سحرية تستطيع اتخاذ أي شكل ترغب فيه. في السراديب تختار تقريبا دائما شكل صندوق كنز، لإغراء المغامرين غير المشتبهين.\n\nالمقلدات الذهبية مقلدات أصعب تحاول جذب أقوى المغامرين. عندها غنائم أفضل، لكنها أيضا أقوى بكثير من المقلدات العادية.
actors.mobs.golem.def_verb=سدّ
actors.mobs.golem.desc=الغوليمات محاولة لتصحيح عيوب آلة الأقزام السابقة عبر استعمال الأقزام الجديد للسحر. إنها أكثر إحكاما وكفاءة بكثير مقارنة بالـ AE-300 بينما ما زالت مميتة جدا.\n\nبينما الغوليمات ما زالت كبيرة جدا أن تدخل الممرات، منحها الأقزام قدرات سحرية جديدة للتعويض. الغوليمات تستطيع نقل نفسها آنيا بين الغرف، ونقل الأعداء آنيا إليهم عندما تكون خارج المدى.
actors.mobs.goo.notice=جلورب-جلورب!
actors.mobs.goo.defeated=جلرب... جلرب...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=سيد الوحل ينتفخ!
actors.mobs.goo.enraged=مغضب
actors.mobs.goo.gluuurp=جلوووورب!
actors.mobs.goo.rankings_desc=امتصه سيد الوحل
actors.mobs.greatcrab.noticed=السلطعون يسد بمخلبه الضخم.
actors.mobs.greatcrab.def_verb=سدّ
actors.mobs.greatcrab.rankings_desc=قصّه السلطعون العظيم
actors.mobs.greatcrab.desc=هذا السلطعون عملاق، حتى مقارنة بسلطعونات الصهاريج الأخرى. صدفته الزرقاء مغطاة بالشقوق والقواعق، تظهر عمرا عظيما. يمشي ببطء، بالكاد يحافظ على التوازن بمخلبه الضخم.\n\nبينما السلطعون عنده مخلب واحد فقط، حجمه يعوض بسهولة. السلطعون يمسك المخلب أمام أي تهديد، يدرع نفسه خلف جدار درع لا يمكن اختراقه. لكن، السلطعون لا يستطيع سد الهجمات التي لا يراها قادمة، أو الهجمات من أعداء متعددين في وقت واحد.
actors.mobs.greatcrab.discover_hint=تستطيع إيجاد هذا العدو أثناء مهمة معينة.
actors.mobs.guard.scorpion=تعال إلى هنا!
actors.mobs.guard.def_verb=سدّ
actors.mobs.guard.desc=كانوا ذات يوم حراس السجن، أصبح هؤلاء الحراس منذ فترة طويلة لا يختلفون عن النزلاء. يتعثرون كالأموات الأحياء، يتجولون بلا عقل عبر القاعات بحثا عن أي شيء في غير مكانه، مثلك!\n\nيحملون سلاسل حول وسطهم، ربما تُستعمل لسحب الأعداء إلى مدى قريب.
actors.mobs.hermitcrab.def_verb=سدّ
actors.mobs.hermitcrab.desc=لسبب أو لآخر، قرر سلطعون الصهاريج هذا ارتداء الجزء العلوي المكسور من برميل على رأسه! الوزن الإضافي أبطأه إلى سرعة عادية، لكنه منحه أيضا دفاعا أكبر بكثير. تظن أنك تستطيع سماع شيء يرتد داخل البرميل مع ذلك...
actors.mobs.mimic.reveal=ذلك الصندوق مقلد!
actors.mobs.mimic.hidden_hint=شيء ما في هذا الصندوق يبدو خاطئا... المشي ومحاولة فتحه قد تكون فكرة سيئة.
actors.mobs.mimic.desc=المقلدات مخلوقات سحرية تستطيع اتخاذ أي شكل ترغب فيه. في السراديب تختار تقريبا دائما شكل صندوق كنز، لإغراء المغامرين غير المشتبهين.\n\nالمقلدات عندها عضة شريرة، لكنها غالبا تحتوي كنزا أكثر من صندوق عادي.
actors.mobs.mimic.discover_hint=تستطيع إيجاد هذا العدو في أي مكان في السراديب.
actors.mobs.necromancer.desc=توافد هؤلاء سحرة الظلام المبتدئون إلى السجن، لأنه المكان المثالي لممارسة حرفتهم الشريرة.\n\nسحرة الأموات سيستدعون ويعززون الهياكل العظمية للقتال لصالحهم. قتل ساحر الأموات سيقتل أيضا الهيكل العظمي الذي يستدعيه.
actors.mobs.necromancer$necroskeleton.desc=هذا الهيكل العظمي استُدعي من قبل ساحر أموات. يتصرف تماما كهيكل عظمي عادي، وسيموت عندما يُقتل ساحر الأموات الذي استدعاه.
actors.mobs.mob.died=تسمع شيئا يموت في البعيد.
