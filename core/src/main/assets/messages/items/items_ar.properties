items.weapon.weapon$enchantment.discover_hint=تستطيع إيجاد غرض بهذا الأثر عشوائيا في السراديب، أو حاول تطبيقها على غرض بنفسك.
items.amulet.ac_end=انهِ اللعبة
items.amulet.desc_origins=أصول التاج مجهولة. التاريخ يقول إن الملك المدفون تفاخر أنه اكتشف الأثر قبل وقت قصير من قطع حضارة الأقزام كل الاتصالات. كيف وجده؟ كيف أخذه الظلام المختوم منه؟ أسئلة لوقت آخر ربما، كل ما يهم الآن أن التاج لك!
items.amulet.desc_ascent=أصول التاج مجهولة، لكن من الواضح أنه تأثر بشدة بقوة الظلام المختوم. السراديب يبدو أنها تنثني لإرادة الظلام بينما تتحرك عبرها، تجعل الأعداء أكثر عددا وقوة بكثير! أنت أيضا لم تعد قادرا على تفعيل أو رمي التاج، كما لو أنه ملعون.
items.amulet.ascent_title=الصعود
items.amulet.ascent_desc=تبدأ بالإحساس بقوة الظلام المختوم العظيمة والمروّعة تشع من التاج. الصعود راجعا عبر السراديب كبشريّ قد يكون أصعب مما ظننت!\n\nإن واصلت الصعود بالتاج فالسراديب ستصبح أكثر خطورة، النقلات الآنية بين الطوابق ستُعطل، وستستطيع فقط الفوز باللعبة بهزيمة الأعداء بينما تصعد عبر السراديب!\n\nتستطيع ترك التاج هنا الآن إن أردت الصعود دون بدء هذا التحدي، أو تفعيل التاج قبل الصعود لإنهاء اللعبة بشكل عادي.
items.amulet.ascent_yes=واصل!
items.amulet.ascent_no=توقّف الآن
items.amulet.discover_hint=تستطيع إيجاد هذا الغرض في قاع السراديب...
items.ankh.name=عنخ
items.ankh.ac_bless=بارك
items.ankh.bless=أنت تبارك العنخ بالماء السحري.
items.ankh.desc=هذا الرمز القديم للخلود يمنح القدرة على العودة إلى الحياة بعد الموت. أغلب الأغراض ستُسقط حيث متّ، لكن يمكن استعادتها إن رجعت إليها. باستعمال قربة ماء مملوءة، العنخ يمكن أن يُبارك بقوة إضافية.
items.ankh.desc_blessed=هذا الرمز القديم للخلود يمنح القدرة على العودة إلى الحياة بعد الموت. العنخ تمت مباركته وهو الآن أقوى بكثير. العنخ سيضحّي بنفسه لإنقاذك في لحظة خطر قاتل.
items.ankh.discover_hint=تستطيع شراء هذا الغرض في متجر.
items.arcaneresin.name=راتنج غامض
items.arcaneresin.prompt=اختر عصا
items.arcaneresin.ac_apply=طبّق
items.arcaneresin.level_too_high=تلك العصا قوية جدا بحيث الراتنج لا يستطيع تحسينها.
items.arcaneresin.not_enough=ليست عندك راتنج كافية لذلك!
items.arcaneresin.apply=أنت تطلي عصاك بالراتنج، تزيد قوتها!
items.arcaneresin.desc=هذا المسحوق الناعم يلمع بين درجات البنفسجي والأبيض. يمكن أن يعمل كمضخّم للطاقات السحرية، يزيد مستوى العصي عندما يُطبق عليها!\n\nترقية عصا تكلف 1، أو 2، أو 3 راتنج حسب مستوى العصا الأولي. الراتنج تستطيع ترقية العصي حتى حد أقصى +3.\n\nترقيات الراتنج _تُلغى بمصادر ترقية أخرى_ مع ذلك (مثل مخطوطات الترقية)، ولا تطبق عند تشبيع عصا في عصا حكيم النجوم الطويلة.
items.arcaneresin.discover_hint=تستطيع صنع هذا الغرض عبر الكيمياء.
items.brokenseal.name=ختم مكسور
items.brokenseal.ac_affix=ثبّت
items.brokenseal.prompt=اختر درعا
items.brokenseal.unknown_armor=يجب أن تعرّف ما إذا كان ذلك الدرع ملعونا أم لا أولا.
items.brokenseal.cursed_armor=الختم لن يُطبق على درع ملعون.
items.brokenseal.affix=أنت تثبّت الختم على درعك!
items.brokenseal.desc=ختم شمعي، مثبّت على درع كرمز للبسالة. عنده رونية حماية باهتة منقوشة في المركز، ومتشقق إلى نصفين عبر الوسط.\n\nتذكار من وطنه، الختم يساعد المحارب على المثابرة. بينما يلبس الختم، المحارب سيكسب فورا تدريعا عندما يكون على وشك أن يتضرر إلى نصف الصحة أو أقل.\n\nالختم يمكن _تثبيته على درع،_ ونقله بين الدروع. يمكن أن يحمل ترقية واحدة معه، طالما طبقت تلك الترقية على الدرع بينما الختم كان مربوطا به.
items.brokenseal.inscribed=الختم منقوش بـ_%s._
items.brokenseal.choose_title=اختر رمزا
items.brokenseal.choose_desc=كلا هذا الدرع والختم المكسور يحملان رمزا. اختر أي رمز يجب الاحتفاظ به.\n\nرمز الدرع: %1$s\nرمز الختم المكسور: %2$s\n\nلاحظ أنه إن اخترت الرمز الموجود حاليا على الدرع، فالختم لن يستطيع نقله لاحقا.
items.brokenseal.discover_hint=أحد الأبطال يبدأ بهذا الغرض.
items.brokenseal$warriorshield.desc_active=ختم الملك أطلس المكسور يساعده حاليا على المثابرة، يمنحه تدريعا فوق صحته. هناك فترة تبريد بعد أن يُطلق التدريع أولا قبل أن يمكن استعماله من جديد.\n\nهذا الدرع لا يضمحل مع الوقت، لكنه سينتهي إن لم يكن هناك أعداء قريبون لبضعة أدوار. عندما ينتهي، أي تدريع غير مستعمل سيخفّض فترة التبريد، حتى حد أقصى 50%%.\n\nالتدريع المتبقي: %1$d.\n\nفترة التبريد الحالية: %2$d.
items.brokenseal$warriorshield.desc_cooldown=الملك أطلس كسب مؤخرا تدريعا من ختمه المكسور، وعليه الانتظار حتى يستطيع الاستفادة من أثر تدريعه من جديد.\n\nالأدوار المتبقية: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=فترة تبريد درع الملك أطلس حاليا سلبية، ما يعني أنه عندما يُفعّل درعه ستكون فترة التبريد أقل من الـ150 دورا المعتادة. فترة تبريد الدرع يمكن تخفيضها إلى -150 دورا كحد أدنى، ما يعني أنها ستكون متوفرة فورا من جديد بمجرد تفعيلها.\n\nفترة التبريد الحالية: %d.
items.dewdrop.name=قطرة ندى
items.dewdrop.already_full=عندك صحة كاملة أصلا.
items.dewdrop.desc=قطرة ندى نقية كالبلور.\n\nبسبب سحر هذا المكان، الماء النقي عنده خصائص استعادة طفيفة.
items.equipableitem.curse_detected=تحس أن الغرض ملعون قبل أن تجهّزه مباشرة!
items.equipableitem.unequip_cursed=لا تستطيع إزالة غرض ملعون!
