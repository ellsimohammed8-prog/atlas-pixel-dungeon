items.artifacts.sandalsofnature.out_of_range=ذلك الموقع خارج المدى.
items.artifacts.sandalsofnature.desc_1=ما يبدو في البداية صنادلان مصنوعتان من الخيوط هما في الحقيقة نبتتان! تبدوان ضعيفتين وشاحبتين جدا، ربما تحتاجان إلى أن تُمنحا مغذيات؟
items.artifacts.sandalsofnature.desc_2=الأحذية نمتا والآن تشبهان أكثر حذائين مفصلين. عادت بعض الألوان لهما، ربما ما زالتا تستطيعان النمو أكثر؟
items.artifacts.sandalsofnature.desc_3=النبتتان نمتا من جديد والآن تشبهان زوج أحذية صلبة مصنوعا من لحاء. النبتتان يبدو أنهما استعادا قوتهما، لكن ربما ما زالتا تستطيعان النمو أكثر؟
items.artifacts.sandalsofnature.desc_4=النبتتان يبدو أنهما وصلتا إلى حجمهما الأقصى، تشبهان زوج درع سيقان مدرعة. درع السيقان بني غامق ويشبه شجرة متينة جدا.
items.artifacts.sandalsofnature.desc_hint=تشعر بتناغم أكثر مع الطبيعة أثناء ارتداء هذا الأثر.
items.artifacts.sandalsofnature.desc_cursed=الصنادل الملعونة تمنع أي تناغم مع الطبيعة.
items.artifacts.sandalsofnature.desc_ability=الأحذية تتموّج بلون آخر بذرة غذّيتهم إياها. يمكنهم التجذير وجيزة في الأرض وإنتاج أثر تلك النبتة في أي مكان في نطاق نصف قطر 3 مربعات.\nالذرة: _%s_\nالشحن المطلوب: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=لقّمت الأحذية %d بذور.
