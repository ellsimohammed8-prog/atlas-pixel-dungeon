levels.features.chasm.chasm=الهوة
levels.features.chasm.yes=نعم، أعرف ما أفعله
levels.features.chasm.no=لا، غيرت رأيي
levels.features.chasm.jump=هل تريد حقا القفز في الهوة؟ سقوط من ذلك البعد سيكون مؤلما.
levels.features.chasm.ondeath=سقطت حتى الموت...
levels.features.chasm.rankings_desc=مات عند الارتطام
levels.rooms.secret.ratkingroom$ratkingroomdeco.statue_name=تمثال جرذ
levels.rooms.secret.ratkingroom$ratkingroomdeco.pillow_name=وسادة ملكية
levels.rooms.secret.ratkingroom$ratkingroomdeco.statue_desc=تمثال على هيئة ملك الجرذان. من صنع هذا؟
levels.rooms.secret.ratkingroom$ratkingroomdeco.pillow_desc=هذه الوسادة البنفسجية المنتفخة أصغر من أن تكون سريرا لك، لكنها بالمقاس المثالي لأهم جرذ في العالم.
levels.rooms.special.magicalfireroom$eternalfire.desc=جدار من نار خضراء زاهية كثيفة هنا، يبدو أن سببها سحر. كثيفة جدا بحيث لا تستطيع العبور خلالها، وتشعل أي شيء يقترب منها. لا تظهر علامات على انطفائها طبيعيا، ستحتاج شيئا لإخمادها.
levels.rooms.special.sentryroom$sentry.name=حارس أحمر
levels.rooms.special.sentryroom$sentry.desc=يبدو أن هذا الحارس الأحمر كالدم موضوع هنا لحراسة الكنز في الطرف الآخر من هذه الغرفة. سيطلق عليك أشعة سحر التفكيك إن خطوت في المنطقة التي يدافع عنها.\n\nإنه محصن ضد كل الآثار الضارة ويستطيع الرؤية عبر الاختفاء، لكنه يبدو أنه يستغرق وقتا للشحن قبل أن يبدأ الإطلاق.\n\nبطريقة ما لا يريد الحارس أن يطلق إلا عليك، كأنه يعرف أن سكان السراديب لا يشكلون خطرا على الكنز.
levels.rooms.special.sentryroom$sentry.discover_hint=يمكنك إيجاد هذا العدو في أي مكان في السراديب.
levels.rooms.special.toxicgasroom$toxicvent.name=منفذ سام
levels.rooms.special.toxicgasroom$toxicvent.desc=لا بد أن مغامرا مهملا أطلق هذا الفخ قبل دهور. رغم حالته غير النشطة، ما زال ينفث غازا ساما في الغرفة ولا يظهر علامات على التوقف. ستحتاج طريقة للوقاية من ضرر الغاز إن أردت استكشاف هذه الغرفة.
levels.rooms.special.weakfloorroom$hiddenwell.name=بئر بعيدة
levels.rooms.special.weakfloorroom$hiddenwell.desc=تستطيع بالكاد تمييز بئر في الأعماق بالأسفل، ربما يوجد شيء ما هناك؟
levels.rooms.quest.ambitiousimproom$questentrance.name=مدخل الخزنة
levels.rooms.quest.ambitiousimproom$questentrance.desc=يبدو أن هذه الحفرة المشؤومة مدخل خزنة قزمة قديمة. حاجز سحري يمنع الدخول، تستطيع المشي فوقه كأن أرضا هنا.
levels.rooms.quest.blacksmithroom$questentrance.name=مدخل المنجم
levels.rooms.quest.blacksmithroom$questentrance.desc=هذا السلم يؤدي إلى منجم قديم تحت ورشة الحداد مباشرة.
levels.rooms.quest.blacksmithroom$smithyvisuals.name=الحدادة
levels.rooms.quest.blacksmithroom$smithyvisuals.desc=حدادة صغيرة أقامها الحداد الغول، كاملة بصينية فحم وكور وحوض ماء يبدو قذرا تماما.
levels.rooms.quest.ritualsiteroom$ritualmarker.name=علامة الطقوس
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=علامة مرسومة لطقوس مظلمة ما. عادة توضع الشموع على أركانها الأربعة.
levels.rooms.quest.ritualsiteroom$table.name=طاولة مشؤومة
levels.rooms.quest.ritualsiteroom$table.desc=هذه الطاولة الثقيلة تبدو وكأنها عُدّلت بفظاظة إلى ما يشبه رف تعذيب.
levels.rooms.quest.massgraveroom$massgravedeco.name=قبر جماعي
levels.rooms.quest.massgraveroom$massgravedeco.desc=العظام متناثرة على الأرض، ماذا حدث هنا؟
levels.rooms.quest.mineentrance$questexit.name=مخرج المنجم
levels.rooms.quest.mineentrance$questexit.desc=هذا السلم يؤدي خارج المنجم، عودة إلى ورشة الحداد.
levels.rooms.quest.vault.vaultentranceroom$questentranceinternal.name=منصة
levels.rooms.quest.vault.vaultentranceroom$questentranceinternal.desc=هذه المنصة الكبيرة بنفس حجم الحفرة فوقك. ربما هذه المنصة جزء من آلية مصعد ما عند دخول الخزنة بشكل عادي.
levels.rooms.quest.vault.vaultfinalroom.imp_warning_unprepared=بينما تخطو إلى الغرفة الكبيرة، يبدو أن الزمن يبطأ وتسمع صوت العفريت:\n\n"أظن أنك دخلت الغرفة الأخيرة في الخزنة، تمثالي الصغير يجب أن يكون بعدها مباشرة! أنا متأكد أنه سيكون هناك فخ أو حارس بشع ما، لذا _يجب أن تستكشف وتستعد حقا قبل أن تتقدم أكثر!_ أريدك أن تحصل على جائزتي فعليا، لا أن تموت محاولا!"
levels.rooms.quest.vault.vaultfinalroom.imp_warning_prepared=بينما تخطو إلى الغرفة الكبيرة، يبدو أن الزمن يبطأ وتسمع صوت العفريت:\n\n"حسنا، أظنك في الغرفة الأخيرة في الخزنة، تمثالي الصغير يجب أن يكون بعدها مباشرة! أنا متأكد أنه سيكون هناك فخ أو حارس بشع ما، لذا _تأكد أنك مشحون بالكامل وجاهز لقتال كبير!_ أريدك أن تحصل على جائزتي فعليا، لا أن تموت محاولا."
levels.rooms.quest.vault.vaultfinalroom.final_warning=تسمع شيئا يشحن، خطوة واحدة أخرى إلى الأمام ستطلق شيئا ما!
levels.rooms.quest.vault.vaultfinalroom$markertiles.name=علامة عملاقة
levels.rooms.quest.vault.vaultfinalroom$markertiles.desc=هذا النمط في بلاط الأرض يبدو كنسخة عملاقة من علامة استدعاء من السجن.\n\nالأرض كلها تطن بالطاقة، كأن قوة عظمى ما تنتظر أن تنطلق.
levels.rooms.quest.vault.vaultfinalroom$vaulttreasure.desc=الذهب مكدس على الأرض هنا، من المؤسف أنك لا تستطيع إخراجه معك من الخزنة.
levels.traps.alarmtrap.name=فخ الإنذار
levels.traps.alarmtrap.alarm=يصدر الفخ صوتا خارقا يتردد في كل السراديب!
levels.traps.alarmtrap.desc=يبدو أن هذا الفخ مربوط بآلية إنذار عالية الصوت. إطلاقه سينبه على الأرجح كل شيء في المستوى.
levels.traps.blazingtrap.name=فخ ملتهب
levels.traps.blazingtrap.desc=الخطو على هذا الفخ سيشعل خليطا كيميائيا قويا، ما يشعل منطقة واسعة.
levels.traps.burningtrap.name=فخ حارق
levels.traps.burningtrap.desc=الخطو على هذا الفخ سيشعل خليطا كيميائيا، ما يشعل المنطقة المحيطة.
levels.traps.chillingtrap.name=فخ مبرد
levels.traps.chillingtrap.desc=عند التفعيل، ستجمد الكيماويات في هذا الفخ الهواء حول موقعه بسرعة.
levels.traps.confusiontrap.name=فخ غاز الإرباك
levels.traps.confusiontrap.desc=إطلاق هذا الفخ سيطلق سحابة من غاز الإرباك في المنطقة المباشرة.
levels.traps.cursingtrap.name=فخ اللعنة
levels.traps.cursingtrap.curse=معداتك الملبوسة تصبح ملعونة!
levels.traps.cursingtrap.desc=يحتوي هذا الفخ على نفس السحر الخبيث الموجود في المعدات الملعونة. إطلاقه سيلعن بعض الأغراض في المنطقة المباشرة.
levels.traps.disarmingtrap.name=فخ التجريد
levels.traps.disarmingtrap.disarm=سلاحك نُقل آنيا بعيدا!
levels.traps.disarmingtrap.desc=يحتوي هذا الفخ على سحر نقل آني دقيق جدا، سيلف سلاح ضحيته إلى موقع آخر ما.
levels.traps.disintegrationtrap.name=فخ التفكيك
levels.traps.disintegrationtrap.one=الفخ يفكك %s خاصتك!
levels.traps.disintegrationtrap.some=الفخ يفكك بعضا من %s خاصتك!
levels.traps.disintegrationtrap.ondeath=قُتلت بفخ التفكيك...
levels.traps.disintegrationtrap.desc=عند إطلاقه، سيخزق هذا الفخ أقرب هدف بأشعة تفكيك، فيسبب ضررا مهما ويدمر الأغراض.\n\nلحسن الحظ آلية إطلاقه غير مخفية.
levels.traps.distortiontrap.name=فخ التشويه
levels.traps.distortiontrap.desc=مبني من سحر غريب مجهول الأصل، سيستدعي هذا الفخ كل أنواع المخلوقات إلى هذا الموقع.
levels.traps.explosivetrap.name=فخ متفجر
levels.traps.explosivetrap.desc=يحتوي هذا الفخ على بعض المتفجرات المسحوقة وآلية إطلاق. تفعيله سيسبب انفجارا في المنطقة المباشرة.
levels.traps.flashingtrap.name=فخ وامض
levels.traps.flashingtrap.desc=عند التفعيل، سيشعل هذا الفخ مسحوقا وامضا قويا مخزنا داخله، فيعمي ضحيته مؤقتا ويشلها ويجرحها.\n\nلا بد أن للفخ مخزون مسحوق كبير، لأنه يستطيع التفعيل مرات عديدة دون أن ينكسر.
levels.traps.flocktrap.name=فخ القطيع
levels.traps.flocktrap.desc=ربما مزحة من ساحر هاوٍ ما، إطلاق هذا الفخ سيخلق قطيعا من الأغنام السحرية.
levels.traps.frosttrap.name=فخ الصقيع
levels.traps.frosttrap.desc=عند التفعيل، ستجمد الكيماويات في هذا الفخ الهواء في منطقة واسعة حول موقعه بسرعة.
levels.traps.gatewaytrap.name=فخ البوابة
levels.traps.gatewaytrap.desc=فخ النقل الآني الخاص هذا يستطيع التفعيل عددا لا نهائيا من المرات وينقل دائما إلى نفس الموقع.
levels.traps.geysertrap.name=فخ النبع الحار
levels.traps.geysertrap.desc=عند إطلاقه، سيسبب هذا الفخ نبع ماء يتفجر، فيضر الأعداء الناريين، ويدفع كل الشخصيات القريبة، ويخمد النيران، ويحول التضاريس المحيطة إلى ماء.
levels.traps.gnollrockfalltrap.name=فخ سقوط صخور الغنول
levels.traps.gnollrockfalltrap.desc=فخ سقوط الصخور هذا مصنوع بمساعدة سحرية ما. عند إطلاقه، سيسبب ارتخاء الصخور وسقوطها فورا من الأعلى في منطقة 5×5 حوله. بسبب الصخور الألين في المنطقة، لن يسبب ضررا بحجم فخ سقوط صخور عادي، لكن درعك لن يكون فعالا ضده أيضا. الصخور لن تسقط أيضا في مواقع بجانبها حاجز، فهي تساعد على إمساك السقف.\n\n_هذا الفخ لا يميز الصديق من العدو، لذا هو ضار بالغنول بقدر ما هو ضار بك._
levels.traps.grimtrap.name=فخ كئيب
levels.traps.grimtrap.ondeath=قُتلت بانفجار فخ كئيب...
levels.traps.grimtrap.desc=سحر تدميري قوي للغاية مخزن داخل هذا الفخ، يكفي لقتل كل الأبطال فورا عدا الأصحّاء. إطلاقه سيرسل انفجارا بعيد المدى من سحر قاتل نحو أقرب شخصية.\n\nلحسن الحظ آلية إطلاقه غير مخفية.
levels.traps.grippingtrap.name=فخ الممسك
levels.traps.grippingtrap.desc=ينقض هذا الفخ على قدمي من يطلقه، فيضرهما ويبطئ حركتهما.\n\nبسبب طبيعته البسيطة، يستطيع هذا الفخ التفعيل مرات عديدة دون أن ينكسر.
levels.traps.guardiantrap.name=فخ الحارس
levels.traps.guardiantrap.alarm=يصدر الفخ صوتا خارقا يتردد في كل السراديب!
levels.traps.guardiantrap.desc=هذا الفخ مربوط بآلية سحرية غريبة، ستستدعي حراسا وتنبه كل الأعداء في الطابق.
levels.traps.guardiantrap$guardian.name=حارس مستدعى
levels.traps.guardiantrap$guardian.desc=يبدو أن هذا الشبح الأزرق صدى مستدعى لأحد حراس السراديب الحجريين.
levels.traps.guardiantrap$guardian.desc_weapon=بينما التمثال نفسه شبه غير مادي، الـ _%s_ الذي يحمله يبدو حقيقيا.
levels.traps.guardiantrap$guardian.discover_hint=يمكنك إيجاد هذا العدو بفخ معين.
levels.traps.oozetrap.name=فخ الوحل الكاوي
levels.traps.oozetrap.desc=سيرش هذا الفخ وحلا كاويا عند التفعيل، سيحرق حتى يغسل بعيدا.
levels.traps.pitfalltrap.name=فخ الحفرة
levels.traps.pitfalltrap.triggered_hero=الأرض تبدأ بالانهيار حولك!
levels.traps.pitfalltrap.triggered=الأرض تبدأ بالانهيار حول الفخ المُطلق!
levels.traps.pitfalltrap.no_pit=الأرض صلبة جدا ليعمل فخ حفرة هنا.
levels.traps.pitfalltrap.desc=هذا الفخ متصل بآلية باب سري كبير، وبعد فترة قصيرة من إطلاقه سينزلق أي شيء قريب منه عبر الأرض ويسقط! لن يعمل رغم ذلك في مناطق ذات أرضيات صلبة بشكل خاص.
levels.traps.poisondarttrap.name=فخ السهم السام
levels.traps.poisondarttrap.ondeath=قُتلت بفخ السهم السام...
levels.traps.poisondarttrap.desc=لا بد أن نافخ سهام صغيرا مخفي قريب، تفعيل هذا الفخ سيجعله يطلق سهما ساما على أقرب هدف.\n\nلحسن الحظ آلية إطلاقه غير مخفية.
levels.traps.rockfalltrap.name=فخ سقوط الصخور
levels.traps.rockfalltrap.ondeath=سُحقت بفخ سقوط الصخور...
levels.traps.rockfalltrap.desc=هذا الفخ متصل بسلسلة من الصخور الرخوة في الأعلى، إطلاقه سيجعلها تنهار على الغرفة كلها! إن لم يكن الفخ في غرفة معينة، ستسقط الصخور في منطقة حول الفخ بدل ذلك.\n\nلحسن الحظ آلية إطلاقه غير مخفية.
levels.traps.shockingtrap.name=فخ الصعق
levels.traps.shockingtrap.desc=آلية مخزن فيها كمية كبيرة من الطاقة. إطلاق هذا الفخ سيفرغ تلك الطاقة في حقل حوله.
levels.traps.stormtrap.name=فخ العاصفة
levels.traps.stormtrap.desc=آلية مخزن فيها كمية هائلة من الطاقة. إطلاق هذا الفخ سيفرغ تلك الطاقة في عاصفة كهربائية كبيرة.
levels.traps.summoningtrap.name=فخ الاستدعاء
levels.traps.summoningtrap.desc=إطلاق هذا الفخ سيستدعي عددا من وحوش هذه المنطقة إلى هذا الموقع.
levels.traps.teleportationtrap.name=فخ النقل الآني
levels.traps.teleportationtrap.desc=كلما أُطلق هذا الفخ، كل شيء حوله سيُنقل آنيا إلى مواقع عشوائية في هذا الطابق.
levels.traps.tengudarttrap.desc=من الواضح أن حارس السلاسل كان يستعد لقتال. هذا الفخ سيفعل نافخ سهام مخفيا سيطلق سهما ساما على أقرب شيء ليس حارس السلاسل.\n\nالفخ مصنوع جيدا جدا بحيث آلية إطلاقه مستحيلة الكشف دون مساعدة سحرية. لكن الفخ مرئي للحظة أثناء وضعه.
levels.traps.toxictrap.name=فخ الغاز السام
levels.traps.toxictrap.desc=إطلاق هذا الفخ سيطلق سحابة من الغاز السام في المنطقة المحيطة.
levels.traps.trap.discover_hint=يمكنك إيجاد هذا الفخ عشوائيا في السراديب. كل منطقة فيها فخاخ مختلفة قد تظهر.
levels.traps.trap.rankings_desc=قتله: %s
levels.traps.corrosiontrap.name=فخ الغاز الآكل
levels.traps.corrosiontrap.desc=إطلاق هذا الفخ سيطلق سحابة من غاز حمضي قاتل في المنطقة المباشرة.
levels.traps.warpingtrap.name=فخ الالتواء
levels.traps.warpingtrap.desc=هذا الفخ شبيه بفخ النقل الآني، لكنه سيجعل البطل يفقد معرفته بتخطيط الطابق أيضا!
levels.traps.weakeningtrap.name=فخ الإضعاف
levels.traps.weakeningtrap.desc=سحر مظلم في هذا الفخ يمتص الطاقة من أي شيء يلامسه. الأعداء الأقوياء قد يقاومون الأثر رغم ذلك.
levels.traps.worndarttrap.name=فخ السهم البالي
levels.traps.worndarttrap.ondeath=قُتلت بفخ السهم البالي...
levels.traps.worndarttrap.desc=لا بد أن نافخ سهام صغيرا مخفي قريب، تفعيل هذا الفخ سيجعله يطلق على أقرب هدف.\n\nبسبب قدمه ليس ضارا جدا رغم ذلك، إنه ليس حتى مخفيا...
levels.cavesbosslevel.wires_name=أسلاك مكشوفة
levels.cavesbosslevel.wires_desc=الأرض محفورة جزئيا هنا، تظهر بعض أسلاك كبيرة مكشوفة. لا بد أنها تصل الآلات الكهربائية المختلفة ببعضها.\n\nلا بد أن في الأسلاك تيارا ما يجري. إن خطا الـ AE-300 هنا فقد يستطيع سحب الطاقة منها.
levels.cavesbosslevel.energy_desc=الأرض هنا تشرّر بالكهرباء، ومن الضار الخطو عليها. _تبدو الشرر منجذبة في اتجاه معين..._ ربما تؤدي إلى مصدر الطاقة؟
levels.cavesbosslevel.gate_name=بوابة معدنية
levels.cavesbosslevel.gate_desc=بوابة معدنية كبيرة تسد الطريق إلى مدينة الأقزام الكبرى. الصندوق المعدني في الوسط يصدر طنينا عاليا، لا بد أنه متصل بالدوائر والآلات القريبة. ربما تدمير الـ AE-300 سيفتح البوابة؟
levels.cavesbosslevel.gate_desc_broken=لا بد أن البوابة كانت متصلة بالـ AE-300 بطريقة ما، لأنها انفجرت عند هزيمة الـ AE-300. الآن تبقى قطع مكسرة فقط.
levels.cavesbosslevel.water_desc=مع كل هذه الكهرباء حول هنا قد لا يكون الماء آمنا دائما...
levels.citybosslevel.throne_name=العرش
levels.citybosslevel.throne_desc=هذا العرش الكبير بشكل مذهل هو مقعد إمبراطورية الأقزام، مستولى عليه الآن من ساحر أموات مجنون بالسلطة.\n\nيبدو أن للعرش أجزاء سحرية أو ميكانيكية ما، قد يملك الملك المدفون قوة إضافية عند جلوسه عليه.
levels.citybosslevel.summoning_name=قاعدة الاستدعاء
levels.citybosslevel.summoning_desc=هذه القاعدة فيها فتحة كبيرة في الوسط، تشع عمليا بطاقة مظلمة.\n\nالملك المدفون يستعمل هذه القواعد كنقاط تركيز لسحره النيكرومانسي، ويستطيع استدعاء أتباع إليها. يجب أن تشحن القاعدة لبضعة أدوار قبل ظهور التبع، ونوع التبع المستدعى يُلمح إليه من تراكم القوة السحرية.
