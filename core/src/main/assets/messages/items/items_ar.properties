items.amulet.name=تاج أطلس
items.amulet.desc=تاج أطلس هو أقوى أثر معروف لدى البشر أو الأقزام. تحتوي بلوراته المتلألئة على قوة عجيبة لا تصدق.
items.artifacts.holytome.name=سفر الفجر
items.artifacts.holytome.desc=سفر فجر يعمل كبؤرة لسحر كاهن الفجر المقدس. استعمال السفر يتيح للكاهن إلقاء تعاويذ سحرية متنوعة.
items.kingscrown.name=تاج الملك المدفون
items.kingscrown.desc=تاج آخر ملوك الأقزام، يتوهج بطاقة سحرية هائلة.
items.tengusmask.name=قناع سجّان السلاسل
items.tengusmask.desc=سقط هذا القناع عن وجه سجّان السلاسل أثناء موته، وتشعر بقوة سحرية عظيمة تنبعث منه. هل كان القناع مصدر قوة السجّان؟
items.brokenseal$warriorshield.name=درع الملك أطلس
items.armor.curses.antientropy.name=%s مضاد الانتروبيا
items.armor.curses.antientropy.desc=لعنة مضاد الانتروبيا تعمل ضد قوى الكون، تسحب الطاقة إلى اللابس وبعيدا عن محيطه. هذا يُشعل اللابس وجيزة ملتهبا، لكنه يجمّد كل شيء حولهم!
items.armor.curses.bulk.name=%s الضخامة
items.armor.curses.bulk.desc=درع الضخامة يبدو أكبر وأكثر فرضية، لكنه لا يمتلك فعليا دفاعا محسّنا. والأسوأ من ذلك، الحجم الإضافي يجعل التحرك إلى الأبواب صعبا جدا.
items.armor.curses.corrosion.name=%s التآكل
items.armor.curses.corrosion.desc=درع التآكل قادر على الانفجار بسائل أكال، يغطي كل شيء في المنطقة بناز حمضي لزج.
items.armor.curses.displacement.name=%s الإزاحة
items.armor.curses.displacement.desc=لعنة الإزاحة تحاول نقل اللابس إلى الأمان عندما يُهاجمون. إنها فعالة أكثر بقليل مع ذلك، تنقل المستعمل آنيا عشوائيا حول المستوى.
items.armor.curses.metabolism.name=%s الأيض
items.armor.curses.metabolism.desc=لعنة الأيض تحوّل مباشرة الإشباع إلى صحة عندما يُجرح اللابس، توفر دفعة شفاء، لكنها تسبب المجاعة بسرعة.
items.armor.curses.multiplicity.name=%s التضاعف
items.armor.curses.multiplicity.desc=الدرع الملعون بالتضاعف يحتوي سحر ازدواج خطير. سيخلق أحيانا صورة مرآة للابس، لكنه من المحتمل بنفس القدر أن يضاعف المهاجم!
items.armor.curses.overgrowth.name=%s فرط النمو
items.armor.curses.overgrowth.desc=درع فرط النمو مغطى بنباتات مزهرة متنوعة. بينما هذا الأثر يبدو مثيرا بالتأكيد، لا يفعل شيئا للدفاع، وهذه النباتات ستُفعّل عشوائيا في القتال!
items.armor.curses.stench.name=%s النتن
items.armor.curses.stench.desc=الدرع الملعون بالنتن سيطلق سحب غاز ضار، خطيرة على كل شيء يعلق في السحابة.
items.armor.glyphs.affection.name=%s العاطفة
items.armor.glyphs.affection.desc=هذا الرمز القوي يتلاعب بعقول المهاجمين، يسحرهم مؤقتا.
items.armor.glyphs.antimagic.name=%s مضاد السحر
items.armor.glyphs.antimagic.desc=هذا الرمز القوي يتيح للدرع الدفاع عن لابسه ضد الهجمات السحرية بالإضافة إلى الجسدية. هذا الدفاع السحري لا يتأثر بمرتبة الدرع.
items.armor.glyphs.brimstone.name=%s الكبريت
items.armor.glyphs.brimstone.desc=هذا الرمز يدرع اللابس وأمتعته من النار، يُلغي تماما ضرره وآثاره السلبية.
items.armor.glyphs.camouflage.name=%s التمويه
items.armor.glyphs.camouflage.desc=هذا الرمز يتيح للابس الاندماج في العشب العالي، يمنحهم اختفاء مؤقتا.
items.armor.glyphs.entanglement.name=%s التشابك
items.armor.glyphs.entanglement.desc=هذا الرمز ينمي درعا ترابيا حول اللابس لامتصاص الضرر، لكن هذا الدرع سينكسر إن تحرك اللابس.
items.armor.glyphs.flow.name=%s التدفق
items.armor.glyphs.flow.desc=هذا الرمز يتلاعب بتدفق الماء حول اللابس، يجعلهم أسرع بكثير عند التحرك عبره.
items.armor.glyphs.obfuscation.name=%s التعتيم
items.armor.glyphs.obfuscation.desc=هذا الرمز يخفي اللابس، يجعلهم أكثر صعوبة في الكشف.
items.armor.glyphs.potential.name=%s الإمكانات
items.armor.glyphs.potential.desc=هذا الرمز يبني الطاقة عندما يُضرب، يمنح شحنا لعصا اللابس عندما يُفعّل.
items.armor.glyphs.repulsion.name=%s النفور
items.armor.glyphs.repulsion.desc=هذا الرمز يرتد القوة ضد المهاجمين، يرسلهم طائرين للخلف.
items.armor.glyphs.stone.name=%s الحجر
items.armor.glyphs.stone.desc=هذا الرمز يحيط الدرع بحجر سحري ثقيل يجعل التفادي مستحيلا، لكنه يسد الضرر بما يتناسب مع المراوغة.
items.armor.glyphs.swiftness.name=%s السرعة
items.armor.glyphs.swiftness.desc=هذا الرمز يعزز سرعة اللابس كلما لم يكونوا قرب عدو.
items.armor.glyphs.thorns.name=%s الأشواك
items.armor.glyphs.thorns.desc=هذا الرمز القوي يضر المهاجمين، يجعلهم ينزفون ببطء عندما يهاجمون اللابس.
items.armor.glyphs.viscosity.name=%s اللزوجة
items.armor.glyphs.viscosity.deferred=مؤجل %d
items.armor.glyphs.viscosity$defereddamage.name=ضرر مؤجل
items.armor.glyphs.viscosity$defereddamage.ondeath=الضرر المؤجل قتلك...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=قتله الضرر المؤجل
items.armor.glyphs.viscosity$defereddamage.desc=الضرر يُسبب ببطء مع الوقت بدل فورا.\n\nالضرر المؤجل المتبقي: %d.
items.armor.glyphs.viscosity.desc=هذا الرمز قادر على تخزين الضرر الموجه على اللابس، يسببه لهم ببطء بدل كلّه مرة واحدة.
items.armor.armor.ac_detach=افصل
items.armor.armor.detach_seal=تفصل الختم عن درعك.
items.armor.armor.equip_cursed=الدرع ينقبض حولك بألم.
items.armor.armor.identify=أنت الآن مألوف بما يكفي مع درعك لتعريفه.
items.armor.armor.hardening_gone=التصلب على هذا الدرع انتهى!
items.armor.armor.incompatible=تفاعل أنواع سحر مختلفة مسح الرمز على هذا الدرع!
items.armor.armor.curr_absorb=هذا الدرع _مرتبة-%1$d_ يسد _%2$d-%3$d ضررا_ ويتطلب _%4$d قوة_ للاستعمال بشكل صحيح.
items.armor.armor.avg_absorb=عادة هذا الدرع _مرتبة-%1$d_ يسد _%2$d-%3$d ضررا_ ويتطلب _%4$d قوة_ للاستعمال بشكل صحيح.
items.armor.armor.too_heavy=بسبب قوتك غير الكافية ارتداء هذا الدرع سيقلل قدرتك على التحرك، والتفادي، والدفاع.
items.armor.armor.probably_too_heavy=ربما هذا الدرع ثقيل جدا عليك.
items.armor.armor.excess_str=بسبب قوتك الزائدة، أنت _أكثر مراوغة_ أثناء ارتداء هذا الدرع.
items.armor.armor.evasion=إنه معزز لتعزيز _المراوغة._
items.armor.armor.defense=إنه معزز لتعزيز _الدفاع._
items.armor.armor.inscribed=إنه منقوش بـ _%s._
items.armor.armor.glyph_hardened=لقد تم _تصلبه._
items.armor.armor.hardened_no_glyph=هذا الدرع تم _تصلبه،_ لكنه ليس منقوشا برمز حاليا.
items.armor.armor.cursed_worn=لأن هذا الدرع ملعون، أنت عاجز عن إزالته.
items.armor.armor.cursed=تستطيع الشعور بسحر خبيث يتربص داخل هذا الدرع.
items.armor.armor.weak_cursed=رغم اللعنة، تستطيع خلع هذا الدرع.
items.armor.armor.not_cursed=هذا الدرع خالي من السحر الخبيث.
items.armor.armor.seal_attached=ختم الملك أطلس المكسور ملتصق بهذا الدرع. عندما يكون على وشك أن يُجرح دون نصف الصحة، سيمنحه _%d دروع_.
items.armor.armor.seal_transfer=ختم الملك أطلس المكسور يجب أن يُلصق على درعه الملبوس حاليا ليفيده. هل ترغب في فصل الختم تلقائيا عن الدرع الذي تزيله ولصقه على الدرع الذي تجهزه؟
items.armor.armor.seal_transfer_yes=نعم
items.armor.armor.seal_transfer_no=لا
items.armor.armor$glyph.glyph=رمز
items.armor.armor$glyph.killed=%s قتلك...
items.armor.armor$glyph.rankings_desc=قتله رمز
items.armor.armor$glyph.discover_hint=تستطيع إيجاد غرض بهذا الأثر عشوائيا في السراديب، أو حاول تطبيقها على غرض بنفسك.
items.armor.classarmor.ac_ability=اختر القدرة
items.armor.classarmor.ac_transfer=انقل
items.armor.classarmor.no_ability=درعك ليس عنده قدرة حاليا، يجب أن تختار واحدة!
items.armor.classarmor.not_equipped=تحتاج أن تكون مرتديا هذا الدرع لاستعمال قوته الخاصة!
items.armor.classarmor.low_charge=الدرع ليس عنده شحن كافٍ لاستعمال قوته الخاصة!
items.armor.classarmor.charge_use=استعمال القدرة الآن سيستهلك _%s_ شحن.
items.armor.classarmor.transfer_title=نقل الدرع
items.armor.classarmor.transfer_desc=سحر تاج الملك المدفون يمكن نقله إلى مجموعة درع أخرى. لاحظ أن الدرع الأصلي سيُدمر في العملية.
items.armor.classarmor.transfer_prompt=اختر درعا
items.armor.classarmor.transfer_cancel=ألغِ
items.armor.classarmor.transfer_complete=خُصائص درعك البطولي نُقلت!
items.armor.classarmor.discover_hint=تستطيع إيجاد هذا الغرض بعد هزيمة زعيم الطابق 20 ببطل معين.
items.armor.clericarmor.name=ثياب البطل
items.armor.clericarmor.desc=أثناء ارتداء هذا المزيج من القماش والصفائح، يستطيع كاهن الفجر أداء قدرة خاصة.
items.armor.clotharmor.name=درع قماش
items.armor.clotharmor.desc=هذا الدرع خفيف الوزن يوفر حماية أساسية.
items.armor.clotharmor.discover_hint=أحد الأبطال يبدأ بهذا الغرض.
items.armor.duelistarmor.name=لوح صدر البطل
items.armor.duelistarmor.desc=أثناء ارتداء هذا الدرع الصفائحي والعباءة، يستطيع نصل السموم أداء قدرة خاصة.
items.armor.huntressarmor.name=عباءة البطل
items.armor.huntressarmor.no_enemies=لا أعداء في النظر
items.armor.huntressarmor.desc=أثناء ارتداء هذه العباءة، تستطيع صيادة الأرز أداء قدرة خاصة.
items.armor.leatherarmor.name=درع جلد
items.armor.leatherarmor.desc=درع مصنوع من جلد وحش مدبوغ. ليست خفيفة كدرع القماش لكنها توفر حماية أفضل.
items.armor.magearmor.name=ثوب البطل
items.armor.magearmor.desc=أثناء ارتداء هذا الثوب الجميل، يستطيع حكيم النجوم أداء قدرة خاصة.
items.armor.mailarmor.name=درع بريدي
items.armor.mailarmor.desc=حلقات معدنية متشابكة تصنع بدلة درع صلبة لكن مرنة.
items.armor.platearmor.name=درع صفائحي
items.armor.platearmor.desc=صفائح معدنية ضخمة مربوطة معا في بدلة توفر حماية لا تضاهى لأي مغامر قوي كفاية لتحمل وزنها المذهل.
items.armor.roguearmor.name=ثياب البطل
items.armor.roguearmor.desc=أثناء ارتداء هذه الثياب المظلمة، يستطيع ظل الكثبان أداء قدرة خاصة.
items.armor.scalearmor.name=درع قشور
items.armor.scalearmor.desc=القشور المعدنية المخيطة على سترة جلدية تخلق درعا مرنا لكن واقيا.
items.armor.warriorarmor.name=بريد صفائح البطل
items.armor.warriorarmor.desc=أثناء ارتداء هذا الدرع الصفائحي الثقيل، يستطيع الملك أطلس أداء قدرة خاصة.
items.artifacts.alchemiststoolkit.name=عدة الكيميائي
items.artifacts.alchemiststoolkit.ac_brew=اخلط
items.artifacts.alchemiststoolkit.ac_energize=نشّط
items.artifacts.alchemiststoolkit.not_ready=عدتك لم ينتهِ إحمائها بعد.
items.artifacts.alchemiststoolkit.cursed=عدتك الملعونة تمنعك من استعمال الكيمياء!
items.artifacts.alchemiststoolkit.need_energy=تحتاج على الأقل 6 طاقة لذلك.
items.artifacts.alchemiststoolkit.energize_desc=كل 6 بلورات طاقة ستمنح العدة طاقة كافية لكسب مستوى، ما يزيد المعدل الذي تولد فيه العدة الطاقة مع الوقت، وسرعة إحمائها.\n\nكم من الطاقة ترغب في استعمالها؟
items.artifacts.alchemiststoolkit.energize_1=6 طاقة: +1 مستوى
items.artifacts.alchemiststoolkit.energize_all=%1$d طاقة: +%2$d مستويات
items.artifacts.alchemiststoolkit.desc=هذه العدة تحتوي على عدد من الكواشف والأعشاب مع قنينة خلط صغيرة، تسمح بعمل الكيمياء أثناء التنقل. القنينة تحتوي على ما يبدو أنه بلورات طاقة كيميائية في شكل سائل.
items.artifacts.alchemiststoolkit.desc_cursed=العدة الملعونة ربطت نفسها بجانبك، وترفض أن تتيح لك استعمال الكيمياء.
items.artifacts.alchemiststoolkit.desc_warming=العدة تُحمئ حاليا، وستكون جاهزة للاستعمال بعد فترة قصيرة.
items.artifacts.alchemiststoolkit.desc_hint=العدة المجهزة تولد ببطء طاقة كيميائية بينما تكسب الخبرة. يبدو أن الخليط في القنينة قد يمكن تعزيزه بإضافة بلورات طاقة إليه.
items.artifacts.artifact.cannot_wear_two=لا تستطيع ارتداء أثرين من نفس النوع.
items.artifacts.artifact.equip_cursed=الأثر يربط نفسه بك بألم.
items.artifacts.artifact.curse_known=تستطيع الشعور بسحر خبيث يتربص داخل هذا الأثر.
items.artifacts.artifact.not_cursed=هذا الأثر خالي من السحر الخبيث.
items.artifacts.artifact.need_to_equip=تحتاج إلى تجهيز أثرك لفعل ذلك.
items.artifacts.capeofthorns.name=عباءة الأشواك
items.artifacts.capeofthorns.desc=هذه الصفائح المعدنية المنهارة من الـ AE-300 تشكلت معا في عباءة صلبة. يبدو أنها تخزن طاقة عميقة، ربما عندها بعض من قوة الـ AE-300؟
items.artifacts.capeofthorns.desc_inactive=العباءة تشعر بثقل مطمئن على أكتافك، يبدو أنها تكسب طاقة من الضرر الذي تتلقاه.
items.artifacts.capeofthorns.desc_active=العباءة تبدو تُفرغ الطاقة المخزّنة، إنها تشع قوة وقائية.
items.artifacts.capeofthorns$thorns.inert=عباءتك تصبح خاملة من جديد.
items.artifacts.capeofthorns$thorns.radiating=عباءتك تبدأ في إشعاع الطاقة، تشعر بأنك محمي!
items.artifacts.capeofthorns$thorns.levelup=عباءتك تنمو أقوى!
items.artifacts.capeofthorns$thorns.name=أشواك
items.artifacts.capeofthorns$thorns.desc=عباءتك تشع الطاقة، تحيطك بحقل قوة منحرفة!\n\nكل الضرر الذي تتلقاه يُخفّض بينما أثر الأشواك نشط. بالإضافة إلى ذلك، إن كان المهاجم بجانبك، الكمية المخفضة تُعكس مرة أخرى على المهاجم.\n\nأدوار الأشواك المتبقية: %s.
items.artifacts.chaliceofblood.name=كأس الدم
items.artifacts.chaliceofblood.ac_prick=اوخز
items.artifacts.chaliceofblood.yes=نعم، أعرف ما أفعله
items.artifacts.chaliceofblood.no=لا، غيرت رأيي
items.artifacts.chaliceofblood.prick_warn=كل مرة تستعمل الكأس سيستنزف المزيد من طاقة حياتك، لكنه سيزيد تجدد صحتك الطبيعية في المقابل.\n\nحاليا وخز نفسك سيسبب _%1$d-%2$d ضررا،_ مع أن هذا الضرر يمكن تخفيضه _بكل من الصد الجسدي والسحري أو تخفيض الضرر._ دون اعتبار آثار تخفيض الضرر، وخز نفسك حاليا عنده _%3$s%% فرصة_ أن يستنزف قوة حياتك بالكامل.\n\nهل أنت متأكد أنك تريد أن تقدم للكأس المزيد من طاقة الحياة؟
items.artifacts.chaliceofblood.onprick=توخز نفسك، وجوهر حياتك يصب في الكأس.
items.artifacts.chaliceofblood.ondeath=الكأس يمتص جوهر حياتك حتى الجفاف...
items.artifacts.chaliceofblood.desc=هذا الكأس الفضي اللامع مزخرف بشكل غريب بأحجار حادة عند الحافة.
items.artifacts.chaliceofblood.desc_cursed=الكأس الملعونة ربطت نفسها بيدك، وتعوق قدرتك على تجديد الصحة.
items.artifacts.chaliceofblood.desc_1=بينما تمسك الكأس، تشعر بدافع غريب أن توخز نفسك على الأحجار الحادة.
items.artifacts.chaliceofblood.desc_2=بعض من دمك تجمع في الكأس، تستطيع أن تشعر بشكل خفي بالكأس يغذي طاقة الحياة فيك، يزيد تجدد صحتك الطبيعية. ما زلت تريد قطع نفسك على الكأس، رغم أنك تعرف أنه سيؤلم.
items.artifacts.chaliceofblood.desc_3=الكأس ممتلئة إلى الحافة بجوهر حياتك. تستطيع أن تشعر بالكأس الذي يصب طاقة الحياة مرة أخرى فيك.
items.artifacts.cloakofshadows.name=عباءة الظلال
items.artifacts.cloakofshadows.ac_stealth=تخفٍّ
items.artifacts.cloakofshadows.cooldown=عباءتك تحتاج %d جولات إضافية لإعادة التنشيط.
items.artifacts.cloakofshadows.cursed=لا تستطيع استعمال عباءة ملعونة.
items.artifacts.cloakofshadows.no_charge=عباءتك لم تُعاد شحنها كفاية لتكون قابلة للاستعمال بعد.
items.artifacts.cloakofshadows.desc=عباءة سحرية لا تُقدر بثمن، سرقت من مخزن الأسلحة الملكي منذ عدة سنوات من قبل ظل الكثبان. عند ارتدائها، يمكن استعمالها لتتحول إلى غير مرئي تماما لفترة قصيرة.\n\nكلما استُعملت العباءة أكثر، أصبحت أقوى، تتيح لظل الكثبان أن يصبح غير مرئي بشكل متكرر أكثر ولفترات أطول.
