journal.document.adventurers_guide.abilities.title=استعمال القدرات وتحديد الهدف
journal.document.adventurers_guide.abilities.body=١) القتال القريب: قف بجانب العدو (مثل الفأر) واضغط عليه للهجوم. الضغط على عدو بعيد يجعل بطلك يمشي نحوه.\n\n٢) تحديد الهدف عن بُعد: اختر عصا سحرية أو قوس الروح أو سلاحًا مقذوفًا، ثم اضغط على خانة الهدف. تسير القذيفة في خط مستقيم وتتوقف عند أول جدار أو عدو - اخرج إلى مكان مكشوف إذا كان هدفك خلف غطاء.\n\n٣) قدرات الأسلحة خاصة بشفرة السيروكو (المبارز) وحده. جهّز السلاح، واجمع الشحنات بإصابة الأعداء، ثم افتح السلاح واختر قدرته؛ وإذا طُلب منك الهدف فاضغط على خانته. بقية الأبطال ليس لديهم قدرات أسلحة - هذا مقصود وليس خللًا.\n\n٤) قدرات الدرع تأتي لاحقًا: عندما تحصل على درع الطبقة تختار واحدة من قدرات بطلك الثلاث. تستهلك شحنة تُعاد تعبئتها أثناء القتال، والقدرات الموجَّهة تطلب منك الضغط على خانة الوجهة.\n\n٥) لكل بطل مع ذلك تخصص مبكر: ختم الملك أطلس المكسور، وعصا حكيم النجوم، وقوس صيّادة الأرز الروحي، وعباءة ظل الكثبان، وكتاب كاهن الفجر. اضغط على الغرض في حقيبتك لترى أفعاله.

journal.document.alchemy_guide.blueprints.title=مخططات أطلس
journal.document.alchemy_guide.blueprints.body=تحفظ هذه الصفحات مخططات حدّادي الملك أطلس: طرق تطوير سلاح إلى هيئة جديدة في قدر الكيمياء.\n\nضع السلاح الأساسي ولفافة ترقية في القدر، وادفع 8 من طاقة الكيمياء. يحتفظ السلاح المطوَّر بكل ما كسبه القديم: مستوى ترقيته وسحره وتحسينه. لا يضيع شيء سوى اللفافة.\n\nحُفظت هنا أربعة مخططات: سيف تاج أطلس من سيف طويل، ومطرقة المحرك المدفون من مطرقة حرب، ورمح سيد الوحل من رمح، وفأس الأرز من فأس معركة.
