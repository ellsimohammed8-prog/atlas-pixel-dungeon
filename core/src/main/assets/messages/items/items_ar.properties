items.equipableitem.ac_unequip=اخلع
items.energycrystal.name=بلورة طاقة
items.energycrystal.desc=مجموعة من البلورات السحرية الصغيرة، مملوءة بالطاقة الكيميائية.\n\nهذه البلورات هي المكون الأكثر شيوعا في وصفات الكيمياء ويمكن إنتاجها في قدر كيمياء بتفكيك الأغراض المستهلكة.
items.gold.name=ذهب
items.gold.desc=كومة من القطع النقدية الذهبية. اجمع القطع النقدية الذهبية لتصرفها لاحقا في متجر.
