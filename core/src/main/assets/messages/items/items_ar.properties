items.weapon.missiles.tomahawk.desc=هذه الفؤوس المرميّة عندها حافة مسنّنة تمزّق بينما تلتصق بعدو.
items.weapon.missiles.trident.name=رمح ثلاثي
items.weapon.missiles.trident.desc=رماح رمي ضخمة بثلاث شوكات قاتلة في النهاية. قوية، لكن ثقيلة نوعا ما.
items.weapon.spiritbow.name=قوس الروح
items.weapon.spiritbow.ac_shoot=أطلق
items.weapon.spiritbow.prompt=اختر هدفا
items.weapon.spiritbow.stats=القوس لا يمكن ترقيته مباشرة، لكنه سيصبح أقوى باستمرار كلما ارتفع مستواك. في مستواك الحالي، الأسهم المطلقة من القوس ستسبب _%1$d-%2$d ضرر_ وتتطلب _%3$d قوة_ لاستعمالها بشكل صحيح.
items.weapon.spiritbow.desc=قوس مصنوع من خشب سحري قديم. وتر القوس ونقوشه تتوهج بضوء أزرق شاحب. عندما يُسحب الوتر هذا القوس سيستحضر سهما سحريا يمكن إطلاقه على عدو.
items.weapon.spiritbow.discover_hint=أحد الأبطال يبدأ بهذا الغرض.
items.weapon.weapon.identify=أنت الآن مألوف بما يكفي مع سلاحك لتعريفه.
items.weapon.weapon.too_heavy=بسبب قوتك غير الكافية هذا السلاح سيعيق سرعة هجومك، ودقتك، وقدرتك على الهجوم المفاجئ.
items.weapon.weapon.excess_str=بسبب قوتك الزائدة، ستسبب _0-%d ضرر إضافي_ بهذا السلاح.
items.weapon.weapon.hardening_gone=تقوية هذا السلاح زالت!
items.weapon.weapon.incompatible=تفاعل أنواع مختلفة من السحر ألغى المسحورة على هذا السلاح!
items.weapon.weapon.cursed_worn=لأن هذا السلاح ملعون، أنت عاجز عن إزالته.
