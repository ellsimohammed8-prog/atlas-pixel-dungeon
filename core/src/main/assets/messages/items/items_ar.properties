items.artifacts.driedrose$ghosthero.introduce=روحي مربوطة بهذه الوردة، كانت ثمينة جدا لي، هدية من حبي الذي تركته على السطح.\n\nلا أستطيع العودة إليه، لكن بفضلك عندي فرصة ثانية لإكمال رحلتي. عندما أستطيع سأستجيب لندائك وأقاتل معك.\n\nطالما عندك الوردة أستطيع سماع صوتك، لذلك تستطيع استعمالها لتوجيهي من بعيد.\n\nآمل أن تنجح حيث فشلت...
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=هذه الصهاريج كانت آمنة ذات يوم، حتى أن الناس عاشوا هنا في الشتاء.
