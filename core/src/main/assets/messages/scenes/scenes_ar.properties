scenes.titlescene$changesbutton.desc=تُحدّث لعبة أطلس بكسل دنجن بانتظام بتحسينات على المحتوى الموجود أو محتوى جديد بالكامل!\n\nكما يُحسَّن توازن اللعبة باستمرار في التحديثات، حتى لا تكون أغراض/أبطال/أعداء معينون أقوى أو أضعف من اللازم.\n\nوتشمل التحديثات أيضا إصلاحات للأخطاء وتحسينات متنوعة للاستقرار.
