items.heap.locked_chest_desc=لن تعرف ما بالداخل حتى تفتحه! لكن لفتحه تحتاج إلى مفتاح ذهبي.
items.heap.crystal_chest=صندوق بلوري
items.heap.crystal_chest_desc=تستطيع رؤية _%s_ بالداخل، لكن لفتح الصندوق تحتاج إلى مفتاح بلوري.
