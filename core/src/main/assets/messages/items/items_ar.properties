items.torch.ac_light=أشعل
items.torch.desc=أساسي للمغامرة، عندما تظلم سراديب، المشعل يمكن أن يساعد في إنارة الطريق.
items.waterskin.name=قربة ماء
items.waterskin.ac_drink=اشرب
items.waterskin.collected=أنت تجمع قطرة الندى في قربتك.
items.waterskin.full=قربتك مملوءة!
items.waterskin.empty=قربتك فارغة!
items.waterskin.desc=حاوية للسائل، مصنوعة من الجلد والخيط، مختومة بسدادة فلين.
items.waterskin.desc_water=الآن القربة تحتوي فقط على بعض ماء الشرب العادي. بالتأكيد هناك شيء في السراديب يمكن أن تخزنه القربة بدلا من ذلك.
items.waterskin.desc_heal=القربة تُستعمل حاليا لتخزين ماء الشفاء. كلما كانت القربة أكثر امتلاء، شُفيت فورا أكثر عندما تشرب منها. ستشرب فقط بقدر ما تحتاج.
items.waterskin.desc_full=القربة المملوءة يبدو أنها تشع طاقة، ربما يمكن استعمالها لمباركة غرض بقاء آخر؟
items.waterskin.discover_hint=أحد الأبطال يبدأ بهذا الغرض.
item.found_on=وُجد في الطابق %d

items.weapon.melee.crownblade.name=سيف تاج أطلس
items.weapon.melee.crownblade.ability_name=شقّ
items.weapon.melee.crownblade.typical_ability_desc=نصل السموم تستطيع _شقّ_ عدو بسيف تاج أطلس. هذا عادة يسبب _%1$d-%2$d ضرر_ وهو مضمون الإصابة. إن قتل الشقّ عدوا فهو فوري ونصل السموم تستطيع استعمال الشقّ من جديد خلال 5 أدوار مجانا.
items.weapon.melee.crownblade.ability_desc=نصل السموم تستطيع _شقّ_ عدو بسيف تاج أطلس. هذا يسبب _%1$d-%2$d ضرر_ وهو مضمون الإصابة. إن قتل الشقّ عدوا فهو فوري ونصل السموم تستطيع استعمال الشقّ من جديد خلال 5 أدوار مجانا.
items.weapon.melee.crownblade.desc=سيف الملك أطلس نفسه، طُوّر من سيف طويل في قدر الكيمياء. كل ضربة رابعة متتالية على نفس العدو توسمه بعلامة نجوم لـ5 أدوار. الضربات ضد عدو موسوم تسبب 20% ضررا إضافيا، وقتل عدو موسوم يعيد قليلا من الشبع.
items.weapon.melee.enginehammer.name=مطرقة المحرك المدفون
items.weapon.melee.enginehammer.ability_name=ضربة ثقيلة
items.weapon.melee.enginehammer.typical_ability_desc=نصل السموم تستطيع أداء _ضربة ثقيلة_ بمطرقة المحرك المدفون. هذا الهجوم المركّز عادة يسبب _%1$d-%2$d ضرر_ إن فاجأ العدو، ويذهلهم لـ5 أدوار ما يخفّض الدقة والمراوغة بمقدار 50%%. الضربة الثقيلة تصيب دائما لكنها تسبب ضررا عاديا إن لم تفاجئ العدو.
items.weapon.melee.enginehammer.ability_desc=نصل السموم تستطيع أداء _ضربة ثقيلة_ بمطرقة المحرك المدفون. هذا الهجوم المركّز يسبب _%1$d-%2$d ضرر_ إن فاجأ العدو، ويذهلهم لـ5 أدوار ما يخفّض الدقة والمراوغة بمقدار 50%%. الضربة الثقيلة تصيب دائما لكنها تسبب ضررا عاديا إن لم تفاجئ العدو.
items.weapon.melee.enginehammer.desc=مطرقة حرب طُوّرت حول نواة انتُزعت من المحرك المدفون. ضرباتها لها فرصة 20% لإطلاق موجة صادمة تصيب أيضا كل عدو بجانب الهدف بنصف ضرر الضربة.
items.weapon.melee.mirelordsreach.name=رمح سيد الوحل
items.weapon.melee.mirelordsreach.ability_name=طعن بطرف
items.weapon.melee.mirelordsreach.typical_ability_desc=نصل السموم تستطيع استعمال طرف رمح سيد الوحل _للطعن_ بعدو في المدى لكن ليس مجاورا. هذا عادة يسبب _%1$d-%2$d ضرر_، ويطرد العدو للخلف، وهو مضمون الإصابة.
items.weapon.melee.mirelordsreach.ability_desc=نصل السموم تستطيع استعمال طرف رمح سيد الوحل _للطعن_ بعدو في المدى لكن ليس مجاورا. هذا يسبب _%1$d-%2$d ضرر_، ويطرد العدو للخلف، وهو مضمون الإصابة.
items.weapon.melee.mirelordsreach.desc=رمح طُوّر على صورة الوحل. عندما تصل ضربة عند أقصى مدى السلاح، يجيب الوحل: يتجذّر العدو في مكانه لدور واحد.
items.weapon.melee.cedarcleaver.name=فأس الأرز
items.weapon.melee.cedarcleaver.ability_name=ضربة ثقيلة
items.weapon.melee.cedarcleaver.typical_ability_desc=نصل السموم يستطيع أداء _ضربة ثقيلة_ بفأس الأرز. هذا الهجوم المركّز عادة يسبب _%1$d-%2$d ضرر_ إن فاجأ العدو، ويذهلهم لـ5 أدوار ما يخفّض الدقة والمراوغة بمقدار 50%%. الضربة الثقيلة تصيب دائما لكنها تسبب ضررا عاديا إن لم تفاجئ العدو.
items.weapon.melee.cedarcleaver.ability_desc=نصل السموم يستطيع أداء _ضربة ثقيلة_ بفأس الأرز. هذا الهجوم المركّز يسبب _%1$d-%2$d ضرر_ إن فاجأ العدو، ويذهلهم لـ5 أدوار ما يخفّض الدقة والمراوغة بمقدار 50%%. الضربة الثقيلة تصيب دائما لكنها تسبب ضررا عاديا إن لم تفاجئ العدو.
items.weapon.melee.cedarcleaver.desc=فأس معركة من أرز عتيق، طُوّر لإنهاء ما يبدأه. يسبب 30% ضررا إضافيا للأعداء الذين تقل صحتهم عن 30%، وكل ضربة قاتلة تعيد نصف دور.
