items.weapon.melee.magesstaff.imbue_desc=هل أنت متأكد أنك تريد تشبيع عصاك الطويلة بهذه العصا؟\n\nإن كانت العصا المشبعة بنفس مستوى أو أعلى من العصا الطويلة، فالعصا الطويلة سترث مستوى تلك العصا زائد واحد من ترقياتها الخاصة.
items.weapon.melee.magesstaff.imbue_level=هذا التشبيع سيُنتج _عصا طويلة +%d._
items.weapon.melee.magesstaff.imbue_unknown=لا تعرف مستوى هذه العصا، لكن هذا التشبيع سيُنتج على الأقل _عصا طويلة +%d._
items.weapon.melee.magesstaff.imbue_cursed=_إن شبعت عصا ملعونة، فعصاك الطويلة ستصبح ملعونة أيضا!_
items.weapon.melee.magesstaff.imbue_lost=العصا المشبعة حاليًا في عصاك الطويلة _ستضيع_.
items.weapon.melee.magesstaff.imbue_talent=العصا المشبعة حاليًا في عصاك الطويلة _ستُرجع عند +0_.
