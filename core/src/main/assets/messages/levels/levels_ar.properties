levels.mininglevel.boulder_name=صخرة كبيرة
levels.mininglevel.crystal_desc=يوجد نتوء بلوري كبير وملون هنا. هذه البلورات هشة ويمكن كسرها بسهولة بمعول، أو ستنكسر إن قُبّ شيء بجانبها.
levels.mininglevel.boulder_desc=توجد صخرة كبيرة تسد الطريق. يجب أن يكون كسرها سهلا إلى حد ما بمعول.
levels.mininglevel.barricade_desc=الحاجز الخشبي مثبّت بثبات ويعمل كدعامة للسقف.\n\nبنى الغنول هذا على الأرجح ليعطي بعض الحماية من الصخور المتساقطة. _أي خلايا مجاورة ستحمى من فخاخ سقوط الصخور وهجماته._\n\nيبدو أنه سيحترق كما يحترق أي حاجز آخر.
