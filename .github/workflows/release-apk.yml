name: Attach APK to Release

# Manually dispatched: builds the debug APK on GitHub's runners and uploads
# it straight to an existing GitHub Release (no local download/upload needed).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload the APK to'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :android:assembleDebug

      - name: Upload APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android/build/outputs/apk/debug/*.apk | head -1)
          echo "Built: $APK"
          cp "$APK" "atlas-pixel-dungeon-${{ inputs.tag }}.apk"
          gh release upload "${{ inputs.tag }}" "atlas-pixel-dungeon-${{ inputs.tag }}.apk" --clobber
