scenes.welcomescene.save_warning=انقطعت اللعبة أثناء محاولة حفظ بيانات لعبتك مؤخرا. للعبة حمايات مدمجة ضد هذا، لذا يجب أن تكون بياناتك سليمة.\n\nيحدث هذا عادة عندما يفقد جهازك الطاقة فجأة، أو عندما يُنهي اللعبة دون تركها تغلق بشكل صحيح. ميزات توفير البطارية تسبب هذا غالبا على الأجهزة المحمولة. إعادة تشغيل جهازك قد تساعد أيضا إن كنت ترى هذا الخطأ كثيرا.
