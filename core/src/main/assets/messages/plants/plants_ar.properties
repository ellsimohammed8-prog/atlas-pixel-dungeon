plants.blandfruitbush.name=فاكهة باهتة
plants.blandfruitbush.desc=قريبة بعيدة لتوت العفن، ثمرة شجيرة الفاكهة الباهتة كمثرية الشكل طعمها كالغبار المتكتل. الثمرة مقززة وغير مشبعة لكنها ليست سامة. ربما يمكن طبخها.
plants.blandfruitbush.discover_hint=يمكنك إيجاد هذه النبتة عشوائيا في السراديب.
plants.blandfruitbush$seed.name=بذرة فاكهة باهتة
plants.blindweed.name=عشبة العمى
plants.blindweed.desc=عند لمسها تهلك عشبة العمى في وميض ضوء ساطع. الوميض قوي بما يكفي لإرباك المرء لعدة ثوان.
plants.blindweed.warden_desc=_حارسة البستان_ ستوجه طاقة عشبة العمى إلى حجاب اختفاء مؤقت، بدل أن تُربك.
plants.blindweed$seed.name=بذرة عشبة العمى
plants.mageroyal.name=عشبة الملوك
plants.mageroyal.refreshed=تشعر بالانتعاش.
plants.mageroyal.desc=أزهار عشبة الملوك الشوكية تحتوي على مادة كيميائية معروفة بخواصها كعامل تحييد قوي. أي شيء يخطو في هذه النبتة سيتطهر من آثار سلبية كثيرة.
plants.mageroyal.warden_desc=بالإضافة إلى أثر التحييد، ستصبح _حارسة البستان_ محصنة مؤقتا ضد كل الآثار ذات المساحات عند خطوها على عشبة الملوك.
plants.mageroyal$seed.name=بذرة عشبة الملوك
plants.earthroot.name=جذر الأرض
plants.earthroot.desc=عندما يلمس مخلوق جذر الأرض، تصنع جذوره نوعا من الدرع الطبيعي الثابت حوله.
plants.earthroot.warden_desc=جذور نبتة جذر الأرض ستتحرك مع _حارسة البستان_، مانحة إياها درع لحاء متحركا.
plants.earthroot$seed.name=بذرة جذر الأرض
plants.earthroot$armor.name=درع عشبي
plants.earthroot$armor.desc=نوع من الدرع الطبيعي الثابت مصنوع من اللحاء والخيوط.\n\nهذا الدرع العشبي سيصد %d ضررا من أي ضربة جسدية، حتى تنفد متانته أخيرا وينهار.\n\nولأن الدرع ثابت، التحرك سيكسره ويضيعه.\n\nالدرع المتبقي: %d.
plants.fadeleaf.name=ورقة التلاشي
plants.fadeleaf.desc=لمس ورقة التلاشي سينقل أي مخلوق انتقالا آنيا إلى مكان عشوائي في المستوى الحالي.
plants.fadeleaf.warden_desc=أثر انتقال ورقة التلاشي أقوى لدى _حارسة البستان_، إذ يعيدها إلى نهاية مستوى السراديب السابق.
plants.fadeleaf$seed.name=بذرة ورقة التلاشي
plants.firebloom.name=زهرة النار
plants.firebloom.desc=عندما يلمس شيء زهرة النار، تشتعل بالنيران.
plants.firebloom.warden_desc=عندما تدوس زهرة النار، ستُشبع _حارسة البستان_ للحظات باللهب بدل أن تتأذى.
plants.firebloom$seed.name=بذرة زهرة النار
plants.icecap.name=قبعة الجليد
plants.icecap.desc=عند لمسها، تطلق قبعة الجليد نفخة من غبار الطلع المجمد. أثر التجميد أقوى بكثير إن كانت البيئة رطبة.
plants.icecap.warden_desc=عندما تدوس قبعة الجليد، ستُشبع _حارسة البستان_ للحظات بالصقيع بدل أن تتأذى.
plants.icecap$seed.name=بذرة قبعة الجليد
plants.plant.warden_desc=هذه النبتة ليس لها أثر خاص عند استعمالها من طرف حارسة البستان.
plants.plant.discover_hint=يمكنك إيجاد هذه النبتة عشوائيا في السراديب، أو زرعها من بذرتها المرتبطة بها.
plants.plant$seed.seed_of=بذرة %s
plants.plant$seed.ac_plant=ازرع
plants.plant$seed.info=ارمِ هذه البذرة إلى المكان الذي تريد زرع نبتة فيه.\n\n%s
plants.plant$seed$placeholder.name=بذرة
plants.rotberry.name=توت العفن
plants.rotberry.desc=توت شجيرة توت عفن شابة طعمه كالموت الحلو، الحلو. على مدى بضع سنوات، ستنمو شجيرة توت العفن هذه لتصبح قلب عفن آخر. عند دوسها، تنتج شابة توت العفن نفخة صغيرة من غاز سام.
plants.rotberry.warden_desc=عادة لا تنتج شجيرة توت العفن إلا قليل غاز عند دوسها، لكن _حارسة البستان_ قادرة على تسخير طاقتها لتعزيز قوتها مؤقتا!
plants.rotberry.discover_hint=يمكنك زرع هذه النبتة من بذرتها المرتبطة بها أثناء مهمة معينة.
plants.rotberry$seed.name=بذرة توت العفن
plants.rotberry$seed.discover_hint=يمكنك إيجاد هذا الغرض أثناء مهمة معينة.
plants.sorrowmoss.name=زهرة الحزن
plants.sorrowmoss.desc=زهرة الحزن زهرة (وليست طحلبا) بتلاتها حادة كالشفرات، مغطاة بسم قاتل.
plants.sorrowmoss.warden_desc=عندما تدوس زهرة الحزن، ستُشبع _حارسة البستان_ للحظات بالسم بدل أن تتأذى.
plants.sorrowmoss$seed.name=بذرة زهرة الحزن
plants.starflower.name=زهرة النجوم
plants.starflower.desc=نبتة نادرة، يقال إن زهرة النجوم تمنح قوة مقدسة لمن يلمسها.
plants.starflower.warden_desc=بالإضافة إلى البركة، ستكسب _حارسة البستان_ كمية مهمة من إعادة شحن العصي عندما تدوس زهرة النجوم.
plants.starflower$seed.name=بذرة زهرة النجوم
plants.stormvine.name=كرمة العاصفة
plants.stormvine.desc=تؤثر الجاذبية في نبتة كرمة العاصفة بشكل غريب، ما يتيح لمجساتها الزرقاء الرقيقة أن 'تتدلى' على الهواء. أي شيء يعلق في الكرمة يتأثر بهذا، ويصبح مرتبكا.
plants.stormvine.warden_desc=_حارسة البستان_ قادرة على التحكم في أثر جاذبية كرمة العاصفة، وستحلق للحظات عندما تدوس واحدة.
plants.stormvine$seed.name=بذرة كرمة العاصفة
plants.sungrass.name=عشب الشمس
plants.sungrass.desc=عشب الشمس مشهور بخواص شفاء نسغه البطيئة لكن الفعالة.
plants.sungrass.warden_desc=_حارسة البستان_ تستطيع تلقي الشفاء من عشب الشمس المدوس حتى إن ابتعدت عنه.
plants.sungrass$seed.name=بذرة عشب الشمس
plants.sungrass$health.name=شفاء عشبي
plants.sungrass$health.desc=عشب الشمس يملك خواص شفاء ممتازة، وإن كان أبطأ بكثير من جرعة الشفاء.\n\nالابتعاد عن النبتة سيكسر أثر الشفاء.\n\nالشفاء المتبقي: %d.
plants.swiftthistle.name=شوك السرعة
plants.swiftthistle.desc=عند دوسه، سيسرّع شوك السرعة للحظات تدفق الزمن حوله، ما يتيح للدائس أداء عدة إجراءات فورا.
plants.swiftthistle.warden_desc=بالإضافة إلى كسب إجراءات فورية، ستحصل _حارسة البستان_ أيضا على دفعة سرعة وجيزة عند دوس شوك السرعة.
plants.swiftthistle$seed.name=بذرة شوك السرعة
plants.swiftthistle$timebubble.name=فقاعة زمنية
plants.swiftthistle$timebubble.desc=فقاعة صغيرة من زمن مسرّع، تتيح أداء الإجراءات فورا. لكن الهجوم أو استعمال السحر سيكسر هذا الأثر.\n\nالأدوار المتبقية: %s.
