actors.hero.heroclass.warrior=الملك أطلس
actors.hero.heroclass.warrior_desc_short=يتحمل الملك أطلس ضررا إضافيا بالحماية التي يمنحها _ختمه الجبلي._ يمكن نقل الختم بين الدروع و_ينقل ترقية واحدة._
actors.hero.heroclass.warrior_unlock=الملك أطلس مفتوح تلقائيا.
actors.hero.heroclass.mage=حكيم النجوم
actors.hero.heroclass.mage_desc_short=حكيم النجوم عالم بفنون السماء ويحمل _عصا سحرية_ أقوى من العصي العادية. يمكن _نقش العصا بأي عصا سحرية_ يجدها.
actors.hero.heroclass.mage_unlock=لفتح حكيم النجوم _استعمل مخطوطة ترقية لتقوية غرض._
actors.hero.heroclass.rogue=ظل الكثبان
actors.hero.heroclass.rogue_desc_short=يستطيع ظل الكثبان مراوغة الأعداء والضرب من الاختفاء باستعمال _عباءة الظلال._ كما _يكتشف الأسرار والفخاخ_ من مسافة أكبر.
actors.hero.heroclass.rogue_unlock=لفتح ظل الكثبان _نفّذ 10 هجمات مباغتة في لعبة واحدة._
actors.hero.heroclass.huntress=صيادة الأرز
actors.hero.heroclass.huntress_desc_short=صيادة الأرز بارعة في الأسلحة الرميّة ولديها _قوس سحري_ بسهام لا تنتهي. كما تعبر العشب الطويل _دون أن تدوسه._
actors.hero.heroclass.huntress_unlock=لفتح صيادة الأرز _أصب الأعداء بالأسلحة الرميّة 10 مرات في لعبة واحدة._
actors.hero.heroclass.duelist=نصل السيروكو
actors.hero.heroclass.duelist_desc_short=نصل السيروكو أستاذة أسلحة تستطيع استعمال سلاحها لتفعيل _قدرة سلاح خاصة._ هذه القدرة _مختلفة لكل سلاح._
actors.hero.heroclass.duelist_unlock=لفتح نصل السيروكو _جهّز سلاحا من الدرجة 2 أو أعلى دون عقوبة قوة._
actors.hero.heroclass.cleric=كاهن الفجر
actors.hero.heroclass.cleric_desc_short=كاهن الفجر حارس للنور المقدس يستعمل _سفر الفجر_ الفريد لتوجيه سحر مشع. يستطيع _تعلم التعاويذ وترقيتها_ عبر المواهب.
actors.hero.heroclass.cleric_unlock=لفتح كاهن الفجر _طهّر تماما لعنة أي قطعة معدات ملعونة._
actors.hero.herosubclass.berserker=غضب الجبل
actors.hero.herosubclass.berserker_short_desc=يبني _غضب الجبل_ غضبه كلما تلقى ضررا. الغضب يزيد ضرره ويمكن تفعيله عند 100% للحصول على حماية إضافية.
actors.hero.herosubclass.gladiator=مصارع الرمال
actors.hero.herosubclass.gladiator_short_desc=يبني _مصارع الرمال_ سلسلة ضربات عند نجاح هجماته. يستطيع إنفاق السلسلة لاستعمال قدرات فريدة.
actors.hero.herosubclass.battlemage=حكيم المعركة
actors.hero.herosubclass.battlemage_short_desc=يستحضر _حكيم المعركة_ تأثيرات إضافية عند القتال القريب بعصاه. هذه التأثيرات تعتمد على العصا المنقوشة في عصاه.
actors.hero.herosubclass.warlock=رابط النجوم
actors.hero.herosubclass.warlock_short_desc=لدى _رابط النجوم_ فرصة لوسم الأعداء بعلامة النجوم بعصيه. يشفى كلما ألحق ضررا جسديا بأعداء موسومين.
actors.hero.herosubclass.assassin=الخنجر الصامت
actors.hero.herosubclass.assassin_short_desc=يستطيع _الخنجر الصامت_ تحضير ضربة قاتلة أثناء اختفائه. كلما طال انتظاره، ازدادت قوة الهجوم.
actors.hero.herosubclass.freerunner=عدّاء الكثبان
actors.hero.herosubclass.freerunner_short_desc=يبني _عدّاء الكثبان_ زخما أثناء جريه، يمكن استعماله لبدء الجري الحر. يمنحه هذا سرعة ومراوغة إضافيتين لفترة قصيرة.
actors.hero.herosubclass.sniper=قناصة الأرز
actors.hero.herosubclass.sniper_short_desc=تستطيع _قناصة الأرز_ اختراق الدروع بهجماتها البعيدة. بعد الضرب بسلاح رميّ، تستطيع المتابعة بهجوم خاص من قوسها.
actors.hero.herosubclass.warden=حارسة البستان
actors.hero.herosubclass.warden_short_desc=تستطيع _حارسة البستان_ الرؤية عبر العشب الطويل وتكسب تأثيرات إضافية عند زرع البذور ودوس النباتات.
actors.hero.herosubclass.champion=النصل التوأم
actors.hero.herosubclass.champion_short_desc=تستطيع _النصل التوأم_ حمل سلاحين وتكسب شحنات أسلحة أكثر. هجماتها العادية تستعمل سلاحها الأساسي، لكنها تستطيع تبديل الأسلحة واستعمال أي منهما.
actors.hero.herosubclass.monk=قبضة النسيم الغربي
actors.hero.herosubclass.monk_short_desc=تبني _قبضة النسيم الغربي_ الطاقة أثناء القتال. يمكن إنفاق هذه الطاقة على قدرات فريدة متنوعة.
actors.hero.herosubclass.priest=حارس النور
actors.hero.herosubclass.priest_short_desc=يكسب _حارس النور_ تعاويذ بعيدة المدى جديدة ونسخة مقواة من النور المرشد.
actors.hero.herosubclass.paladin=فارس الفجر
actors.hero.herosubclass.paladin_short_desc=يكسب _فارس الفجر_ تعاويذ قصيرة المدى جديدة ونسخا مقواة من السلاح المقدس والحماية.
actors.hero.herosubclass.herald_of_dawn=مبشّر الفجر
actors.hero.herosubclass.herald_of_dawn_short_desc=يستدعي _مبشّر الفجر_ روحا من النور الأول لتقاتل بجانبه.
actors.hero.herosubclass.herald_of_dawn_desc=مبشّر الفجر مُستدعٍ يستدعي _وهج الفجر،_ روحا من النور الأول، لتقاتل بجانبه.\n\nيمكن توجيه الوهج للهجوم أو المتابعة أو البقاء في موضع. وهو يقوى بمستوى المبشّر وحده، لا بعدّته أبدا، وهو روح يُستدعى بها، لا إله ولا ملاك يُعبد.\n\nلا يمكن وجود أكثر من وهج واحد في وقت واحد، وهو يتلاشى عندما يُقتل، أو ينتهي وقته، أو يسقط المبشّر.\n\nيكسب مبشّر الفجر أيضا تعويذة _استدعاء الوهج،_ التي تستدعي الوهج بتكلفة 3 شحنات.
actors.mobs.goo.name=سيد الوحل
actors.mobs.goo.desc=لا يُعرف الكثير عن سيد الوحل. ومن الممكن جدا أنه ليس مخلوقا أصلا، بل تكتل من مواد الصهاريج الخبيثة اكتسب بطريقة ما ذكاء بدائيا. وعلى أي حال، فالسحر الأسود هو بالتأكيد ما سمح لسيد الوحل بالوجود.\n\nطبيعته الهلامية جعلته يمتص الكثير من الطاقة المظلمة، حتى إنك تشعر بقشعريرة لمجرد الاقتراب منه. وإن تمكن سيد الوحل من مهاجمتك بهذه الطاقة فلن تعيش طويلا.
actors.mobs.tengu.name=سجّان السلاسل
actors.mobs.tengu.desc=كان سجّان السلاسل سجّان الملك أطلس، وسُمّي باسم القناع الحديدي المطعّم في وجهه — وباسم السلاسل التي لم يفلت منها حقا أبدا.\n\nتقيّد مشابك كبيرة معصمي سجّان السلاسل وركبتيه، وإن بدا أنه تخلّص من سلاسله منذ زمن طويل.\n\nسيحاول استعمال الفخاخ والسحر الخادع والضربات الدقيقة للقضاء على الشيء الوحيد الذي يقف بينه وبين الهرب: أنت.
actors.mobs.dm300.name=المحرك المدفون
actors.mobs.dm300.desc=الـ AE-300 هي أكبر وأقوى 'آلة دفاع' بناها الأقزام على الإطلاق. آلة مهيبة كهذه يصعب صنعها، لذا لم يصنع الأقزام سوى القليل منها لحراسة مداخل مدينتهم الجوفية.\n\nوهي مجهزة بمنافذ تنفث أبخرة العادم السامة، وبمثقاب عالي الطاقة يمكنها استعماله للهجوم ولزعزعة الأرض. ويمكن للـ AE-300 أيضا الاتصال بشبكة طاقة، مما يزيد قوتها أكثر.
actors.mobs.dwarfking.name=الملك المدفون
actors.mobs.dwarfking.desc=قبل سنين كثيرة، اكتشف أحد أعلى سحرة بلاط الأقزام أسرارا منحته قوة هائلة على الحياة والموت. وسرعان ما استعمل هذه القوة، فأخضع أقرانه وملكه وأفسدهم، وفي النهاية كل مواطن من الأقزام. وهو الآن الملك، حاكم على جيش من الرعايا الموتى الأحياء.\n\nالملك المدفون عدو شرس، سيحاول تطويق أعدائه وإغراقهم بحشود أتباعه من الموتى الأحياء.
actors.mobs.yogdzewa.name=الظلام المختوم
actors.mobs.yogdzewa.desc=الظلام المختوم شر قديم أقدم من الجبل نفسه؛ وحش عظيم يمتد إلى عوالم البشر ويلتهمها ليغذي نموه الذي لا ينتهي. ختم ملوك القدماء هذا الرعب الكوني تحت الجبل، ومنذ ذلك الحين وسجّانوه يحاولون إبقاءه محتويا.\n\nينحدر الظلام المختوم من بُعد من الفوضى السحرية الخام، ولا يستطيع إحضار شكله الحقيقي إلى هذا العالم. وبدلا من ذلك صنع صورا مجسّدة له واستدعى أتباعا مظلمين لخدمته هنا.\n\nهذه العين العملاقة هي مركز قوة الظلام المختوم في هذا العالم. ورغم أن العين نفسها لا تتحرك، فإنها قادرة على إطلاق أشعة قوية من السحر المظلم واستدعاء أتباع متنوعين لمساعدتها.
actors.buffs.soulmark.name=موسوم بالنجوم
actors.buffs.soulmark.desc=وضع رابط النجوم علامة نجوم على هذا المخلوق، ما يتيح له الشفاء كلما تلقى ضررا جسديا.\n\nأدوار علامة النجوم المتبقية: %s.
