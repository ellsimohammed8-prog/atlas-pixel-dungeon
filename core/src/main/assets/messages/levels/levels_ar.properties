levels.vaultlevel$vaultflametrap.name=منفذ لهب الخزنة
levels.vaultlevel$vaultflametrap.desc=يبدو أن هذا المنفذ يرسل دفعات من لهب أخضر في فترات منتظمة. تستطيع رؤية النيران تبدأ بالتكون قبل أن يطلق مباشرة. النيران يمكن تفاديها عادة، لكن _أي شيء يتيح لك مقاومة النار أو الآثار ذات المساحات_ فعال أيضا.
tiles.custom.carpet.name=سجاد
tiles.custom.carpet.desc=سجاد سميك يغطي الأرض. لا بد أنه معالَج بطريقة ما، إنه ليس قابلا للاشتعال.
