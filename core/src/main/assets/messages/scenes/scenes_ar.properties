scenes.welcomescene.lang_warning_title=ترجمة غير مكتملة
scenes.welcomescene.lang_warning_msg=بعض المحتوى الجديد من هذا التحديث لم يُترجم بعد.\n\nقد تظهر بعض العبارات بالإنجليزية.\n\nفرق الترجمة تعمل على حل هذا وستُستكمل الترجمة قريبا.\n\nشكرا لصبرك.
