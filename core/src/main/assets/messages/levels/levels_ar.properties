levels.prisonlevel.region_deco_desc=قفص معدني كبير بما يكفي لاحتواء شخص. يبدو أنه مقفل إلى الأرض بطريقة ما، لا تستطيع تحريكه.
levels.prisonlevel.region_deco_alt_name=قفص معلق
