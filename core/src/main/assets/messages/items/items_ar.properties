items.weapon.missiles.throwingspear.desc=هذه الرماح الخفيفة عندها إطارات رفيعة صُمّمت لتُرمى، لا لتُطعن.
items.weapon.missiles.throwingspike.name=شوكة رمي
items.weapon.missiles.throwingspike.desc=هذه الأعمدة المعدنية المدببة المتينة يُقصد بها أن تُرمى إلى أعداء بعيدين.
