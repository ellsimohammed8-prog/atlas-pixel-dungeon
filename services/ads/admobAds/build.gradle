//Atlas: this module is an ANDROID library, not a plain Java library.
//It compiles against the AdMob/UMP SDKs, which ship as Android archives
//(AAR) whose dependencies only publish Android variants — a java-library
//consumer cannot resolve them ('No matching variant' in Gradle).
apply plugin: 'com.android.library'

android {
    namespace 'com.shatteredpixel.shatteredpixeldungeon.services.ads'
    compileSdk appAndroidCompileSDK
    compileOptions.sourceCompatibility = compileOptions.targetCompatibility = appJavaCompatibility

    defaultConfig {
        minSdk appAndroidMinSDK
    }
}

dependencies {
    implementation project(':SPD-classes')
    api project(':services')
    // AdMob SDK (Atlas: replace test ad IDs in AdMobAds.java / AndroidManifest with your own before release)
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    // UMP consent SDK (GDPR consent form for EEA/UK; also ships transitively with play-services-ads)
    implementation 'com.google.android.ump:user-messaging-platform:2.2.0'
}
