items.rings.ring.equip_cursed=الخاتم ينقبض حول إصبعك بألم!
items.rings.ring.unknown_desc=هذا الشريط المعدني مزخرف بجوهرة كبيرة تلمع في الظلام. من يعلم ما أثره عند الارتداء؟
items.rings.ring.known=هذا %s
items.rings.ring.identify=أنت الآن مألوف بما يكفي مع خاتمك لتعريفه.
items.rings.ring.cursed_worn=لأن هذا الخاتم ملعون، أنت عاجز عن إزالته.
items.rings.ring.curse_known=تستطيع الشعور بسحر خبيث يتربص داخل هذا الخاتم.
items.rings.ring.not_cursed=هذا الخاتم خالي من السحر الخبيث.
items.rings.ringofaccuracy.name=خاتم الدقة
items.rings.ringofaccuracy.stats=عند الارتداء، هذا الخاتم سيزيد دقتك بمقدار _%s%%._
items.rings.ringofaccuracy.typical_stats=عند الارتداء، هذا الخاتم سيزيد عادة دقتك بمقدار _%s%%._
items.rings.ringofaccuracy.combined_stats=خواتمك المجهزة تجمع قوتها، تزيد دقتك بمقدار _%s%%_ في المجموع.
items.rings.ringofaccuracy.upgrade_stat_name_1=تعزيز الدقة
items.rings.ringofaccuracy.desc=هذا الخاتم يزيد تركيزك، يجعل من الأسهل لهجماتك أن تجد هدفها. خاتم ملعون سيصعّب على هجماتك أن تتصل بدل ذلك.
items.rings.ringofarcana.name=خاتم الغموض
items.rings.ringofarcana.stats=عند الارتداء، هذا الخاتم سيزيد قوة المسحورات والرموز بمقدار _%s%%._
items.rings.ringofarcana.typical_stats=عند الارتداء، هذا الخاتم سيزيد عادة قوة المسحورات والرموز بمقدار _%s%%._
items.rings.ringofarcana.combined_stats=خواتمك المجهزة تجمع قوتها، تزيد قوة المسحورات والرموز بمقدار _%s%%_ في المجموع.
items.rings.ringofarcana.upgrade_stat_name_1=تعزيز الغموض
items.rings.ringofarcana.desc=هذا الخاتم يعزز مسحورات الأسلحة السحرية ورموز الدروع، بما فيها اللعنات! إنه يزيد أولا فرصة التفعيل، ثم يزيد قوة الأثر بمجرد أن تصبح فرصة التفعيل 100%. خاتم ملعون سيضعف المسحورات والرموز واللعنات بدل ذلك.
items.rings.ringofelements.name=خاتم العناصر
items.rings.ringofelements.stats=عند الارتداء، هذا الخاتم سيوفر _%s%%_ مقاومة عنصرية.
items.rings.ringofelements.typical_stats=عند الارتداء، هذا الخاتم سيوفر عادة _%s%%_ مقاومة عنصرية.
items.rings.ringofelements.combined_stats=خواتمك المجهزة تجمع قوتها، توفر _%s%%_ مقاومة عنصرية في المجموع.
items.rings.ringofelements.upgrade_stat_name_1=مقاومة
items.rings.ringofelements.desc=هذا الخاتم يوفر مقاومة لمعظم الآثار العنصرية والسحرية، يقلل الضرر ومدة الإضعاف. طبيعي أن خاتما ملعونا سيسوء هذه الآثار بدل ذلك.
items.rings.ringofenergy.name=خاتم الطاقة
items.rings.ringofenergy.stats=عند الارتداء، هذا الخاتم سيزيد سرعة شحن العصي والآثار ودرع البطل بمقدار _%s%%._
items.rings.ringofenergy.typical_stats=عند الارتداء، هذا الخاتم سيزيد عادة سرعة شحن العصي والآثار ودرع البطل بمقدار _%s%%._
items.rings.ringofenergy.combined_stats=خواتمك المجهزة تجمع قوتها، تزيد سرعة الشحن بمقدار _%s%%_ في المجموع.
items.rings.ringofenergy.upgrade_stat_name_1=تعزيز الشحن
items.rings.ringofenergy.desc=معداتك السحرية ستُعاد شحنها أسرع في الحقل الغامض الذي يشع من هذا الخاتم. خاتم ملعون سيبطئ إعادة الشحن بدل ذلك.
items.rings.ringofevasion.name=خاتم المراوغة
items.rings.ringofevasion.stats=عند الارتداء، هذا الخاتم سيزيد مراوغتك بمقدار _%s%%._
items.rings.ringofevasion.typical_stats=عند الارتداء، هذا الخاتم سيزيد عادة مراوغتك بمقدار _%s%%._
items.rings.ringofevasion.combined_stats=خواتمك المجهزة تجمع قوتها، تزيد مراوغتك بمقدار _%s%%_ في المجموع.
items.rings.ringofevasion.upgrade_stat_name_1=تعزيز المراوغة
items.rings.ringofevasion.desc=هذا الخاتم يسرع ردود فعل اللابس، يجعل من الأصعب إصابة الضربات عليه. خاتم ملعون سيجعل المستعمل أسهل في الضرب بدل ذلك.
items.rings.ringofforce.name=خاتم القوة الجسدية
items.rings.ringofforce.stats=عندما تكون دون سلاح، بقوتك الحالية، هذا الخاتم سيسبب _%1$d-%2$d ضررا._ بسلاح مجهز، هذا الخاتم سيزيد الضرر بمقدار _%3$d._
items.rings.ringofforce.typical_stats=عندما تكون دون سلاح، بقوتك الحالية، عادة هذا الخاتم سيسبب _%1$d-%2$d ضررا._ بسلاح مجهز، عادة هذا الخاتم سيزيد الضرر بمقدار _%3$d._
items.rings.ringofforce.combined_stats=خواتمك المجهزة تجمع قوتها، تسبب مجموع _%1$d-%2$d ضرر_ دون سلاح، أو تزيد الضرر بمقدار _%3$d_ مع واحد.
items.rings.ringofforce.upgrade_stat_name_1=ضرر دون سلاح
items.rings.ringofforce.upgrade_stat_name_2=تعزيز ضرر مسلح
items.rings.ringofforce.upgrade_stat_name_3=ضرر القدرة
items.rings.ringofforce.ability_name=موقف المقاتل
items.rings.ringofforce.typical_ability_desc=نصل السموم يمكن أن يتبنى _موقف مقاتل_ بهذا الخاتم، ما يجعل هجماتها العادية تستعمل هذا الخاتم دائما حتى مع سلاح مجهز. هذه الهجمات يجب أن تسبب عادة _%1$d-%2$d ضررا_ وسترث أيضا مسحورة السلاح وتعزيزه. هذا الموقف يبطئ سرعة إعادة شحن الأسلحة بنسبة 50%%.
items.rings.ringofforce.ability_desc=نصل السموم يمكن أن يتبنى _موقف مقاتل_ بهذا الخاتم، ما يجعل هجماتها العادية تستعمل هذا الخاتم دائما حتى مع سلاح مجهز. هذه الهجمات ستسبب _%1$d-%2$d ضررا_ وسترث أيضا مسحورة السلاح وتعزيزه. هذا الموقف يبطئ سرعة إعادة شحن الأسلحة بنسبة 50%%.
items.rings.ringofforce.desc=هذا الخاتم يعزز قوة ضربات اشتباك اللابس. هذه القوة الإضافية ضعيفة إلى حد ما عند حمل الأسلحة، لكن هجوم دون سلاح سيصبح أقوى بكثير. خاتم ملعون سيضعف ضربات اللابس بدل ذلك.
items.rings.ringofforce$brawlersstance.name=موقف المقاتل
items.rings.ringofforce$brawlersstance.desc=أثناء هذا الموقف هجمات نصل السموم العادية ستستعمل خاتم قوة مجهزا حتى عندما يكون عندها سلاح مجهز. هذه الهجمات تكسب ضررا إضافيا وستستعمل تعزيز السلاح ومسحورته.\n\nالحفاظ على هذا الموقف يأخذ تركيزا مع ذلك، يقلل سرعة إعادة شحن قدرة السلاح بنسبة 50%.\n\nهذا الموقف يمكن تبديله أو إيقافه باستعمال خاتم قوة، لكن تخفيض سرعة الشحن سيستمر لفترة قصيرة إن فُعل الموقف وأُلغي بسرعة.
items.rings.ringoffuror.name=خاتم الغضب
items.rings.ringoffuror.stats=عند الارتداء، هذا الخاتم سيزيد سرعة هجماتك بمقدار _%s%%._
items.rings.ringoffuror.typical_stats=عند الارتداء، هذا الخاتم سيزيد عادة سرعة هجماتك بمقدار _%s%%._
items.rings.ringoffuror.combined_stats=خواتمك المجهزة تجمع قوتها، تزيد سرعة هجماتك بمقدار _%s%%_ في المجموع.
items.rings.ringoffuror.upgrade_stat_name_1=تعزيز سرعة الهجوم
items.rings.ringoffuror.desc=هذا الخاتم يمنح اللابس غضبا داخليا، يتيح لهم الهجوم بسرعة أكبر. خاتم ملعون سيبطئ سرعة هجوم اللابس بدل ذلك.
items.rings.ringofhaste.name=خاتم السرعة
items.rings.ringofhaste.stats=عند الارتداء، هذا الخاتم سيزيد سرعة حركتك بمقدار _%s%%._
items.rings.ringofhaste.typical_stats=عند الارتداء، هذا الخاتم سيزيد عادة سرعة حركتك بمقدار _%s%%._
items.rings.ringofhaste.combined_stats=خواتمك المجهزة تجمع قوتها، تزيد سرعة حركتك بمقدار _%s%%_ في المجموع.
items.rings.ringofhaste.upgrade_stat_name_1=تعزيز سرعة الحركة
items.rings.ringofhaste.desc=هذا الخاتم يقلل إجهاد الحركة على اللابس، يتيح لهم الركض بسرعات فوق بشرية. خاتم ملعون سيثقل اللابس بدل ذلك.
items.rings.ringofmight.name=خاتم الجبروت
items.rings.ringofmight.stats=عند الارتداء، هذا الخاتم سيزيد قوتك بمقدار _%1$d_ وصحتك القصوى بمقدار _%2$s%%._
items.rings.ringofmight.typical_stats=عند الارتداء، هذا الخاتم سيزيد عادة قوتك بمقدار _%1$d_ وصحتك القصوى بمقدار _%2$s%%._
items.rings.ringofmight.combined_stats=خواتمك المجهزة تجمع قوتها، تعزز قوتك بمقدار _%1$d_ وصحتك القصوى بمقدار _%2$s%%_ في المجموع.
items.rings.ringofmight.upgrade_stat_name_1=تعزيز القوة
items.rings.ringofmight.upgrade_stat_name_2=تعزيز الصحة القصوى
items.rings.ringofmight.desc=هذا الخاتم يعزز السمات الجسدية للابس، يمنحهم قوة جسدية وبنية أكبر. خاتم ملعون سيضعف اللابس.
items.rings.ringofsharpshooting.name=خاتم الرماية الحادة
items.rings.ringofsharpshooting.stats=عند الارتداء، هذا الخاتم سيعزز ضرر أسلحتك المرماة كأن مستواها ازداد بمقدار _%1$d،_ وسيزيد متانتها بمقدار _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=عند الارتداء، هذا الخاتم سيعزز عادة ضرر أسلحتك المرماة كأن مستواها ازداد بمقدار _%1$d_ وسيزيد متانتها بمقدار _%2$s%%._
items.rings.ringofsharpshooting.combined_stats=خواتمك المجهزة تجمع قوتها، تعزز مستوى السلاح المرمي الفعال بمقدار _%1$d_ وتزيد متانتها بمقدار _%2$s%%_ في المجموع.
items.rings.ringofsharpshooting.upgrade_stat_name_1=تعزيز ضرر المستوى
items.rings.ringofsharpshooting.upgrade_stat_name_2=تعزيز المتانة
items.rings.ringofsharpshooting.desc=هذا الخاتم يعزز دقة اللابس وتصويبه، ما سيجعل كل أسلحة المقذوفات أكثر ضررا ومتانة. خاتم ملعون سيكون عنده الأثر المعاكس.
items.rings.ringoftenacity.name=خاتم التمسك
items.rings.ringoftenacity.stats=عند الارتداء، هذا الخاتم سيخفّض الضرر الذي تأخذه حتى _%s%%._
items.rings.ringoftenacity.typical_stats=عند الارتداء، هذا الخاتم سيخفّض عادة الضرر الذي تأخذه حتى _%s%%._
items.rings.ringoftenacity.combined_stats=خواتمك المجهزة تجمع قوتها، تخفّض الضرر الذي تأخذه حتى _%s%%_ في المجموع.
items.rings.ringoftenacity.upgrade_stat_name_1=مقاومة الضرر القصوى
items.rings.ringoftenacity.desc=عند الارتداء، هذا الخاتم سيتيح للابس أن يقاوم ضربات قاتلة عادة. كلما كان المستعمل مصابا أكثر، كان أكثر مقاومة للضرر. خاتم ملعون سيجعل من الأسهل على الأعداء أن يعدموا اللابس بدل ذلك.
items.rings.ringofwealth.name=خاتم الثراء
items.rings.ringofwealth.stats=عند الارتداء، هذا الخاتم سيزيد حظك بمقدار _%s%%._
items.rings.ringofwealth.typical_stats=عند الارتداء، هذا الخاتم سيزيد عادة حظك بمقدار _%s%%._
items.rings.ringofwealth.combined_stats=خواتمك المجهزة تجمع قوتها، تزيد حظك بمقدار _%s%%_ في المجموع.
items.rings.ringofwealth.upgrade_stat_name_1=تعزيز الحظ
items.rings.ringofwealth.desc=هذا الخاتم يعمل كمغناطيس للكنز، يزيد احتمال أن الأعداء والحاويات ستحمل أغراض قيمة. خاتم ملعون سيقلل فرصتك في تلقي الغنائم بدل ذلك.
