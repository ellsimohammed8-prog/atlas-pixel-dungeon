actors.blobs.foliage.name=أوراق شجر
actors.blobs.foliage.desc=أعمدة من الضوء تخترق كآبة الحديقة تحت الأرض.
actors.blobs.freezing.name=هواء مجمد
actors.blobs.freezing.desc=الهواء بارد بشكل غير طبيعي هنا.
actors.blobs.goowarn.name=طاقة مظلمة
actors.blobs.goowarn.desc=ذرات من الطاقة المظلمة تحتتشد هنا!
actors.blobs.inferno.name=جحيم
actors.blobs.inferno.desc=جحيم مستعر هنا.
actors.blobs.paralyticgas.name=غاز الشلل
actors.blobs.paralyticgas.desc=سحابة من غاز الشلل تدور هنا.
actors.blobs.regrowth.name=إعادة نمو
actors.blobs.sacrificialfire.name=نار القربان
actors.blobs.sacrificialfire.desc=يوجد مذبح هنا بنار قربان مشتعلة فوقه. أي مخلوق يُقتل هنا سيُستهلك كقربان لأرواح السراديب.\n\nربما ستُمنح مكافأة إن قُدمت قرابين كافية؟
actors.blobs.sacrificialfire.worthy=النار تستهلك قربانك وتنمو أقوى.
actors.blobs.sacrificialfire.unworthy=النار تستهلك قربانك، لكنها لا تتغير.
actors.blobs.sacrificialfire.reward=النار تشتعل ثم تتبدد، تاركة مكافأة خلفها!
actors.blobs.smokescreen.name=حجاب دخان
actors.blobs.smokescreen.desc=سحابة من دخان أسود كثيف تدور هنا.
