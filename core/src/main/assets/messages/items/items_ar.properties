items.wands.wand$placeholder.name=عصا
items.wands.wandofblastwave.name=عصا موجة الانفجار
items.wands.wandofblastwave.staff_name=عصا طويلة لموجة الانفجار
items.wands.wandofblastwave.ondeath=قتلت نفسك بعصا موجة الانفجار الخاصة بك...
items.wands.wandofblastwave.knockback_ondeath=الاصطدام قتلك...
items.wands.wandofblastwave.desc=هذه العصا مصنوعة من نوع من الحجر المرمر، بحافة ذهبية وجوهرة سوداء مستديرة عند الطرف. تبدو ثقيلة جدا في يدك.
items.wands.wandofblastwave.typical_stats_desc=هذه العصا تطلق مقذوفا ينفجر بعنف في موقع مستهدف. قوة هذا الانفجار عادة تسبب _%1$d-%2$d ضرر_ وهي قوية بما يكفي لإرسال أغلب الأعداء متطايرين.
items.wands.wandofblastwave.stats_desc=هذه العصا تطلق مقذوفا ينفجر بعنف في موقع مستهدف. قوة هذا الانفجار تسبب _%1$d-%2$d ضرر_ وهي قوية بما يكفي لإرسال أغلب الأعداء متطايرين.
items.wands.wandofblastwave.upgrade_stat_name_2=إرجاع
items.wands.wandofblastwave.bmage_desc=عندما يضرب _حكيم المعركة_ عدوا مشلولا بعصا طويلة لموجة الانفجار، ستستهلك الشلل لتسبب انفجار ضرر سحري إضافي. هذا عنده فترة تبريد قصيرة لكل عدو.
items.wands.wandofblastwave.eleblast_desc=انفجار عنصري بعصا طويلة لموجة الانفجار يسبب 67% ضرر ويطرد كل الأعداء خارج منطقة الانفجار.
items.wands.wandofcorrosion.name=عصا التآكل
items.wands.wandofcorrosion.staff_name=عصا طويلة للتآكل
items.wands.wandofcorrosion.desc=هذه العصا عندها جسم رمادي ينفتح إلى جوهرة برتقالية باهرة.
items.wands.wandofcorrosion.stats_desc=هذه العصا تطلق مقذوفا ينفجر في سحابة غاز شديد التآكل في موقع مستهدف. أي شيء يقع داخل هذه السحابة سيأخذ ضررا متزايدا مع الوقت، بدءا من _%d ضرر._
items.wands.wandofcorrosion.upgrade_stat_name_1=ضرر التآكل
items.wands.wandofcorrosion.upgrade_stat_name_2=حجم الغاز
items.wands.wandofcorrosion.bmage_desc=عندما يضرب _حكيم المعركة_ عدوا بعصا طويلة للتآكل، العدو عنده فرصة أن يصبح مغطى بالوحل.
items.wands.wandofcorrosion.eleblast_desc=انفجار عنصري بعصا طويلة للتآكل يصيب الأعداء بأربعة أدوار من التآكل، بدءا من 6 ضرر.
items.wands.wandofcorruption.name=عصا الفساد
items.wands.wandofcorruption.staff_name=عصا طويلة للفساد
items.wands.wandofcorruption.already_corrupted=تلك الشخصية لا يمكن التأثير فيها أكثر.
items.wands.wandofcorruption.desc=هذه العصا تشع طاقة مظلمة فوضوية، لو لم يكن ذلك واضحا أصلا من الجمجمة الزخرفية الصغيرة المشكّلة على طرفها.
items.wands.wandofcorruption.stats_desc=هذه العصا ستطلق انفجار طاقة مفسدة ستضعف الأعداء وتثنيهم في النهاية إلى إرادتك. الأعداء قادرون على مقاومة الفساد، لكن الأعداء الضعفاء أسهل بكثير في إفسادهم من الأصحاء.
items.wands.wandofcorruption.upgrade_stat_name_1=قوة الإفساد
items.wands.wandofcorruption.upgrade_stat_name_2=مدة الإضعاف
items.wands.wandofcorruption.bmage_desc=عندما يضرب _حكيم المعركة_ عدوا بعصا طويلة للفساد، العدو عنده فرصة أن يصبح مذعورا.
items.wands.wandofcorruption.eleblast_desc=انفجار عنصري بعصا طويلة للفساد يصيب الأعداء بخمسة أدوار من الذعر.
items.wands.wandofdisintegration.name=عصا التفكك
items.wands.wandofdisintegration.staff_name=عصا طويلة للتفكك
items.wands.wandofdisintegration.desc=هذه العصا مصنوعة من قطعة سبج صلبة ناعمة، بضوء بنفسجي غامق يمتد على جانبها، ينتهي عند الطرف. تتوهج بطاقة مدمرة، تنتظر الانطلاق للأمام.
items.wands.wandofdisintegration.stats_desc=هذه العصا تطلق شعاعا يخترق أي عائق، وسيذهب أبعد كلما تمت ترقيته أكثر. الشعاع يسبب _%1$d-%2$d ضرر،_ وسيسبب أيضا ضررا إضافيا لكل عدو وحائط يخترقه.
items.wands.wandofdisintegration.upgrade_stat_name_2=المدى الأقصى
items.wands.wandofdisintegration.bmage_desc=عندما يحملها _حكيم المعركة_، عصا طويلة للتفكك عندها مدى هجوم متزايد، كما لو كان عندها مسحورة إسقاط.
items.wands.wandofdisintegration.eleblast_desc=انفجار عنصري بعصا طويلة للتفكك يسبب 100% ضرر ويخترق عبر الحيطان.
items.wands.wandoffireblast.name=عصا انفجار النار
items.wands.wandoffireblast.staff_name=عصا طويلة لانفجار النار
items.wands.wandoffireblast.desc=هذه العصا مصنوعة من خشب مطلي بالأحمر بأوراق ذهبية مستعملة ببذخ لجعلها تبدو ملكية فعلًا. تفرقع وتصفر عند الطرف، متلهفة لإطلاق سحرها القوي.
items.wands.wandoffireblast.stats_desc=هذه العصا تنفجر مخروط نار عند استعمالها. هجومها التالي سيستهلك _%1$d شحنات_ ويسبب _%2$d-%3$d ضرر._ كلما استعملت العصا شحنات أكثر، كان الأثر أكبر وأقوى.
items.wands.wandoffireblast.upgrade_stat_name_1=ضرر شحنة واحدة
items.wands.wandoffireblast.upgrade_stat_name_2=ضرر شحنتين
items.wands.wandoffireblast.upgrade_stat_name_3=ضرر 3 شحنات
items.wands.wandoffireblast.bmage_desc=عندما يضرب _حكيم المعركة_ عدوا بعصا طويلة لانفجار النار، هناك فرصة لها أن تنتج انفجارا يضر الأعداء ويستهلك كل النار القريبة! هذه الفرصة تزداد كلما كانت النار أكثر مجاورة للعدو.
items.wands.wandoffireblast.eleblast_desc=انفجار عنصري بعصا طويلة لانفجار النار يسبب 100% ضرر، ويحطم الأبواب مفتوحة، ويشعل الأعداء والتضاريس.
items.wands.wandoffrost.name=عصا الصقيع
items.wands.wandoffrost.staff_name=عصا طويلة للصقيع
items.wands.wandoffrost.desc=هذه العصا يبدو أنها مصنوعة من نوع من الجليد السحري. تصبح أكثر لموعا نحو طرفها المستدير. تبدو باردة جدا عند الإمساك، لكن بطريقة ما يدك تبقى دافئة.
items.wands.wandoffrost.stats_desc=هذه العصا تطلق انفجارات طاقة جليدية نحو أعدائك، تسبب _%1$d-%2$d ضرر_ وتبريد. الأثر يبدو أقوى في الماء. الأعداء المبردون أو المجمدون يأخذون ضررا أقل من هذه العصا.
items.wands.wandoffrost.upgrade_stat_name_2=مدة التبريد
items.wands.wandoffrost.bmage_desc=عندما يضرب _حكيم المعركة_ عدوا مبردا بعصا طويلة للصقيع، عندهم فرصة أن يتجمدوا فورا. هذه الفرصة تصبح أكبر كلما كانوا مبردين أكثر.
items.wands.wandoffrost.eleblast_desc=انفجار عنصري بعصا طويلة للصقيع يسبب 100% ضرر، ويجمد الأعداء، ويطفئ النيران.
items.wands.wandoflightning.name=عصا البرق
items.wands.wandoflightning.staff_name=عصا طويلة للبرق
items.wands.wandoflightning.ondeath=قتلت نفسك بعصا البرق الخاصة بك...
items.wands.wandoflightning.desc=هذه العصا مصنوعة من معدن صلب، يجعلها ثقيلة بشكل مفاجئ. سنّان ينحنيان معًا عند الطرف، والكهرباء تتقوس بينهما.
items.wands.wandoflightning.stats_desc=هذه العصا ترسل برقا قويا يتقوس عبر ما تُصوّب إليه، يسبب _%1$d-%2$d ضرر._ هذه الكهرباء ستقوس إلى الشخصيات القريبة، وتنتشر بسهولة أكثر في الماء. الأقواس من هذه العصا يمكن أن تضرّك، لكنها لن تؤذي حلفاءك.
items.wands.wandoflightning.bmage_desc=عندما يضرب _حكيم المعركة_ عدوا بعصا طويلة للبرق، عنده فرصة أن يشحن نفسه كهربائيا لمدة 10 أدوار. أثناء الشحن حكيم المعركة محصن ضد ضرر البرق وسيقوّس البرق أبعد.
items.wands.wandoflightning.eleblast_desc=انفجار عنصري بعصا طويلة للبرق يسبب 100% ضرر، ويصعق الأعداء لـ5 أدوار، ويكهرب الماء.
items.wands.wandoflightning$lightningcharge.name=مشحون كهربائيا
items.wands.wandoflightning$lightningcharge.desc=حكيم المعركة مشحون حاليا بالطاقة، يمنحه حصانة ضد عصاه الطويلة للبرق ويزيد المدى الذي يقوس منه البرق.\n\nالأدوار المتبقية: %s.
items.wands.wandoflivingearth.name=عصا التراب الحي
items.wands.wandoflivingearth.staff_name=عصا طويلة للتراب الحي
items.wands.wandoflivingearth.desc=هذه العصا مصنوعة من صخرة عجيبة، بنطاقات طاقة صفراء متوهجة. الصخور يبدو أنها تتزحزح قليلا بينما تمسك العصا، كما لو أنها تحس يدك.
items.wands.wandoflivingearth.stats_desc=هذه العصا ترسل مسامير صخر سحرية نحو الأعداء، تسبب _%1$d-%2$d ضرر._ الصخور ستشكل بعد ذلك حول المستعمل، تمنحهم درعا بما يتناسب مع الضرر المسبب. إن بُنيت درع كافية، ستشكّل إلى حارس صخري عندما تُصعق العصا في المرة التالية.
items.wands.wandoflivingearth.upgrade_stat_name_2=صحة الحارس القصوى
items.wands.wandoflivingearth.upgrade_stat_name_3=صد الحارس
items.wands.wandoflivingearth.bmage_desc=عندما يضرب _حكيم المعركة_ عدوا بعصا طويلة للتراب الحي، بعض الضرر المسبب يرجع كدرع صخري.
items.wands.wandoflivingearth.eleblast_desc=انفجار عنصري بعصا طويلة للتراب الحي يسبب 50% ضرر، ويشفي حارسا ترابيا نشطا لكل عدو يُصاب.
items.wands.wandoflivingearth$rockarmor.name=درع صخري
items.wands.wandoflivingearth$rockarmor.desc=صخور سحرية تحيط بجسمك، عندما تُهاجم ستحاول أن تصدّ عنك، وستخفّض الضرر الذي تأخذه بمقدار 50%%. كل ضرر يصدّ يقشّر بعض الصخر مع ذلك.\n\nالدرع المتبقي: %1$d.\n\nإن بُنيت صخر كافية حولك، الصعقة التالية من عصاك للتراب الحي ستجعل الصخور تتشكل إلى حارس سيقاتل معك.\n\nالدرع اللازمة للحارس: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=هذا الحارس الترابي يستفيد أيضا من قوة الكثير. الأدوار المتبقية: %d.
items.wands.wandoflivingearth$earthguardian.name=حارس ترابي
items.wands.wandoflivingearth$earthguardian.desc=الصخور من عصاك للتراب الحي تشكلت إلى حارس ترابيّ حام! هذا الحامي الصخري سيهاجم الأعداء القريبين، ما سيجبرهم على مهاجمة الحارس بدلًا منك. عندما تذهب كل التهديدات القريبة، الحارس سيعيد تشكيل نفسه حولك، وسيرجع عندما تستعمل عصاك التالية.
items.wands.wandoflivingearth$earthguardian.wand_info=القوة الدفاعية للحارس مرتبطة بمستوى عصاك. حاليا يصدّ _%1$d-%2$d ضرر._
items.wands.wandoflivingearth$earthguardian.discover_hint=تستطيع إيجاد هذه الشخصية بعصا معينة.
items.wands.wandofmagicmissile.name=عصا المقذوف السحري
items.wands.wandofmagicmissile.staff_name=عصا طويلة للمقذوف السحري
items.wands.wandofmagicmissile.desc=هذه العصا البسيطة إلى حد ما تطلق مقذوفات طاقة سحرية نقية. بينما العصا نفسها ليس عندها آثار خاصة، فعندها شحنات متوفرة أكثر وتستطيع أن تعزز العصي الأخرى مؤقتا عندما تُرقّى.
items.wands.wandofmagicmissile.stats_desc=كل مسمار من هذه العصا يسبب _%1$d-%2$d ضرر،_ وسيعزّز مؤقتا العصي الأخرى إن تمت ترقيتها.
items.wands.wandofmagicmissile.bmage_desc=عندما يضرب _حكيم المعركة_ عدوا بعصا طويلة للمقذوف السحري، كل عصيّه ستكسب شحنة بالإضافة إلى عصاه الطويلة.
items.wands.wandofmagicmissile.eleblast_desc=انفجار عنصري بعصا طويلة للمقذوف السحري يسبب 50% ضرر، ويمنح الحكيم 15 دورًا من إعادة الشحن.
items.wands.wandofmagicmissile.discover_hint=أحد الأبطال يبدأ بهذا الغرض.
items.wands.wandofmagicmissile$magiccharge.name=شحنة سحرية
items.wands.wandofmagicmissile$magiccharge.desc=عصاك للمقذوف السحري غذّت القوة إلى عصيّك، معززة مستوى صعقتهم التالية الفعّال.\n\nعصيّك معزّزة إلى: +%d.\n\nأدوار الشحنة السحرية المتبقية: %s.
items.wands.wandofprismaticlight.name=عصا الضوء الموشوري
items.wands.wandofprismaticlight.staff_name=عصا طويلة للضوء الموشوري
items.wands.wandofprismaticlight.desc=هذه العصا مصنوعة من قطعة صلبة من البلور شبه الشفاف، مثل قطعة زجاج طويلة ناعمة. قطع صغيرة من الضوء الملون ترقص حول طرف العصا، متلهفة للاندفاق.
items.wands.wandofprismaticlight.stats_desc=هذه العصا تطلق أشعة ضوء تقطع ظلام السراديب، تكشف المناطق المخبأة والفخاخ. الشعاع يمكن أن يعمي الأعداء، ويسبب _%1$d-%2$d ضرر._ الأعداء الشيطانيون والأموات الأحياء سيحترقون في ضوء العصا اللامع، يأخذون ضررا إضافيا.
items.wands.wandofprismaticlight.upgrade_stat_name_2=فرصة العمى
items.wands.wandofprismaticlight.upgrade_stat_name_3=مدة الضوء
items.wands.wandofprismaticlight.bmage_desc=عندما يضرب _حكيم المعركة_ عدوا بعصا طويلة للضوء الموشوري، سيُصابون بالإعاقة لمدة تتدرج مع مستوى العصا الطويلة.
items.wands.wandofprismaticlight.eleblast_desc=انفجار عنصري بعصا طويلة للضوء الموشوري يسبب 67% ضرر، ويكشف كل التضاريس في الانفجار، ويعمي الأعداء لـ5 أدوار.
items.wands.wandofregrowth.name=عصا إعادة النمو
items.wands.wandofregrowth.staff_name=عصا طويلة لإعادة النمو
items.wands.wandofregrowth.desc=هذه العصا مصنوعة من جذع رفيع من خشب منحوت ببراعة. بطريقة ما ما زالت حية ومليئة بالحيوية، خضراء زاهية مثل قلب شجرة فتية. "عندما تنقطع الحياة تبدأ حياة جديدة دائما في النمو... الدورة الأبدية تبقى دائما!"
items.wands.wandofregrowth.stats_desc=عند الاستعمال، هذه العصا ستنفجر بطاقة إعادة نمو سحرية للخارج في مخروط، تجعل العشب والجذور والنباتات النادرة تفجر إلى الحياة. صعقتها التالية ستستهلك _%1$d شحنات_. كلما استعملت العصا شحنات أكثر، كان الأثر أكبر وأقوى.
items.wands.wandofregrowth.degradation=بعد _%d شحنات_ أخرى هذه العصا ستبدأ بالفشل في إنتاج النباتات والعشب الطازج. هذا الحد يزداد بالرفع بالمستوى أو ترقية العصا.
items.wands.wandofregrowth.upgrade_stat_name_1=العشب لكل شحنة
items.wands.wandofregrowth.upgrade_stat_name_2=حد العشب الإجمالي
items.wands.wandofregrowth.bmage_desc=عندما يضرب _حكيم المعركة_ عدوا بعصا طويلة لإعادة النمو، وأي منهما واقف على العشب، سيكسب شفاءً عشبيا بما يتناسب مع الضرر المسبب.
items.wands.wandofregrowth.eleblast_desc=انفجار عنصري بعصا طويلة لإعادة النمو يجذّر الأعداء وينمي العشب عشوائيا على منطقة الانفجار.
items.wands.wandofregrowth$dewcatcher.name=قابض الندى
items.wands.wandofregrowth$dewcatcher.desc=قابضو الندى هم نباتات عجيبة تملأ نفسها بالندى السحري. يحاولون التمويه كعشب لتجنّب الانتباه، لكن انتفاخاتهم من الندى المتجمّع تفضحهم.
items.wands.wandofregrowth$dewcatcher.discover_hint=تستطيع إيجاد هذه النبتة بعصا معينة.
items.wands.wandofregrowth$seedpod.name=قرن بذرة
items.wands.wandofregrowth$seedpod.desc=قرون البذور هي نباتات سحرية تنتج بذورا من أنواع نباتات أخرى، بدل أي بذور خاصة بها. بطريقة ما تستطيع الانتشار رغم عدم وجود بذرة لها.
items.wands.wandofregrowth$seedpod.discover_hint=تستطيع إيجاد هذه النبتة بعصا معينة.
items.wands.wandofregrowth$lotus.name=اللوتس الذهبي
items.wands.wandofregrowth$lotus.desc=اللوتس الذهبي نبتة غامضة لا يمكن استحضارها إلا بعصا قوية لإعادة النمو. هالته تعزّز كل النباتات وآثار النباتات، لكنه يحرق طاقته ويموت بعد وقت قصير.
items.wands.wandofregrowth$lotus.wand_info=هذا اللوتس أُنتج بعصا إعادة نمو _+%1$d_. كل النباتات في أثره _ستُطلق فورا_ إن زُرعت على شخصية. النباتات عندها أيضا _%2$d%% فرصة_ أن تسقط بذرتها، والأسهم ذات الرأس ستستعمل _%3$d%% متانة أقل_.
items.wands.wandofregrowth$lotus.discover_hint=تستطيع إيجاد هذه النبتة بعصا معينة، بعد ترقيتها عدة مرات.
items.wands.wandoftransfusion.name=عصا نقل الدم
items.wands.wandoftransfusion.staff_name=عصا طويلة لنقل الدم
items.wands.wandoftransfusion.ondeath=قتلت نفسك بعصا نقل الدم الخاصة بك...
items.wands.wandoftransfusion.charged=عصاك الطويلة مشحونة بطاقة حياة عدوك!
items.wands.wandoftransfusion.desc=عصا ذات شكل بسيط نوعا ما، تبرز بسبب لونها الأرجواني وجوهرتها شديدة السواد عند الطرف.
items.wands.wandoftransfusion.stats_desc=عند استعمالها على الحلفاء أو الأعداء المسحورين، هذه العصا ستسحب _%1$d من صحة المستعمل_ لتشفي أو تدرع الحليف بمقدار _%2$d صحة._ عند استعمالها على الأعداء، العصا تسحرهم وجيزة بينما تطبق _%3$d تدريع_ على المستعمل. الأموات الأحياء العدائيون سيأخذون _%4$d-%5$d ضرر_ بدل أن يُسحروا.
items.wands.wandoftransfusion.upgrade_stat_name_1=شفاء الحلفاء
items.wands.wandoftransfusion.upgrade_stat_name_2=التدريع الذاتي
items.wands.wandoftransfusion.upgrade_stat_name_3=ضرر الأموات الأحياء
items.wands.wandoftransfusion.bmage_desc=عندما يضرب _حكيم المعركة_ عدوا مسحورا بعصا طويلة لنقل الدم، سيكسب تدريعا وصعقته التالية بالعصا الطويلة لن تكلف أي صحة.
items.wands.wandoftransfusion.eleblast_desc=انفجار عنصري بعصا طويلة لنقل الدم يسحر الأعداء، ويشفي الحلفاء، ويسبب 100% ضرر للأعداء الأموات الأحياء.
items.wands.wandofwarding.name=عصا الحراسة
items.wands.wandofwarding.staff_name=عصا طويلة للحراسة
items.wands.wandofwarding.no_more_wards=عصاك لا تستطيع الحفاظ على المزيد من الحراسات.
items.wands.wandofwarding.bad_location=لا تستطيع وضع حراسة هناك.
items.wands.wandofwarding.desc=هذه العصا المعدنية القصيرة عندها جوهرة بنفسجية زاهية تطفو فوق طرفها.
items.wands.wandofwarding.stats_desc=بدل أن تضر عدوا مباشرة، هذه العصا ستستدعي حراسات وحرس ثابتين. الحراسات يمكن استدعاؤها في أي مكان، حتى عبر الحيطان إن كانت عندك رؤية. هذه العصا تستطيع الحفاظ على حراسات بقيمة _%d طاقة_ في كل مرة.
items.wands.wandofwarding.upgrade_stat_name_1=ضرر الحراسة
items.wands.wandofwarding.upgrade_stat_name_2=طاقة الحراسة
items.wands.wandofwarding.bmage_desc=عندما يضرب _حكيم المعركة_ عدوا بعصا طويلة للحراسة، كل الحراسات والحرس النشطين عندهم فرصة للشفاء.
items.wands.wandofwarding.eleblast_desc=انفجار عنصري بعصا طويلة للحراسة يشفي كل الحراسات والحرس في منطقة الانفجار.
items.wands.wandofwarding$ward.desc_generic_ward=هذه الحراسة ستقف تلقائيا بإطلاق الصعق على أي عدو يأتي في مدى رؤيتها.\n\nصعق هذه الحراسة بعصاك للحراسة سيرقيها.\n\nالحراسات عندها عدد محدود من الصعقات قبل أن تتبدد.
items.wands.wandofwarding$ward.desc_generic_sentry=هذا الحارس عنده نفس قوة النيران كحراسة، لكن عنده صحة بدل عدد محدد من الشحنات. يشبه الجوهرة عند طرف عصاك للحراسة.\n\nصعق هذا الحارس بعصاك للحراسة سيرقيه ويشفيه.\n\nهذا الحارس سينفق بعض الصحة كلما صعق عدوا، لكن يمكن شفاؤه باستعمال عصاك للحراسة عليه.
items.wands.wandofwarding$ward.name_1=حراسة صغرى
items.wands.wandofwarding$ward.desc_1=هذه الحراسة الأساسية ستصعق تلقائيا أي عدو يأتي في مدى رؤيتها، تسبب _%1$d-%2$d ضرر._\n\nصعق هذه الحراسة بعصاك للحراسة سيرقيها.\n\nهذه الحراسة ستصعق مرة واحدة فقط قبل أن تتبدد.\n\nعصاك للحراسة تستعمل _%3$d طاقة_ للحفاظ على هذه الحراسة.
items.wands.wandofwarding$ward.name_2=حراسة
items.wands.wandofwarding$ward.desc_2=هذه الحراسة المرقاة عندها نمطًا أكثر تعقيدا، وتستطيع الهجوم مرات متعددة. كل صعقة من هذه الحراسة ستسبب _%1$d-%2$d ضرر._\n\nصعق هذه الحراسة بعصاك للحراسة سيرقيها.\n\nهذه الحراسة ستصعق ثلاث مرات قبل أن تتبدد.\n\nعصاك للحراسة تستعمل _%3$d طاقة_ للحفاظ على هذه الحراسة.
items.wands.wandofwarding$ward.name_3=حراسة كبرى
items.wands.wandofwarding$ward.desc_3=هذه الحراسة المرقاة بالكامل قادرة على الهجوم مرات أكثر من أسلافها. كل صعقة من هذه الحراسة ستسبب _%1$d-%2$d ضرر._\n\nصعق هذه الحراسة بعصاك للحراسة سيرقيها.\n\nهذه الحراسة ستصعق خمس مرات قبل أن تتبدد.\n\nعصاك للحراسة تستعمل _%3$d طاقة_ للحفاظ على هذه الحراسة.
items.wands.wandofwarding$ward.name_4=حارس أصغر
items.wands.wandofwarding$ward.desc_4=هذا الحارس الأصغر عنده نفس قوة النيران كحراسة كبرى، لكن عنده صحة بدل عدد محدد من الشحنات. يشبه الجوهرة عند طرف عصاك للحراسة. كل صعقة من هذا الحارس ستسبب _%1$d-%2$d ضرر._\n\nصعق هذا الحارس بعصاك للحراسة سيرقيه ويشفيه.\n\nهذا الحارس سينفق بعض الصحة كلما صعق عدوا، لكن يمكن شفاؤه باستعمال عصاك للحراسة عليه.\n\nعصاك للحراسة تستعمل _%3$d طاقة_ للحفاظ على هذا الحارس.
items.wands.wandofwarding$ward.name_5=حارس
items.wands.wandofwarding$ward.desc_5=هذا الحارس المرقى أكبر وأكثر متانة من حارس أصغر. كل صعقة من هذا الحارس ستسبب _%1$d-%2$d ضرر._\n\nصعق هذا الحارس بعصاك للحراسة سيرقيه ويشفيه.\n\nهذا الحارس سينفق بعض الصحة كلما صعق عدوا، لكن يمكن شفاؤه باستعمال عصاك للحراسة عليه.\n\nعصاك للحراسة تستعمل _%3$d طاقة_ للحفاظ على هذا الحارس.
items.wands.wandofwarding$ward.name_6=حارس أكبر
items.wands.wandofwarding$ward.desc_6=هذا الحارس المرقى بالكامل أكثر متانة بشكل كبير من أسلافه. كل صعقة من هذا الحارس ستسبب _%1$d-%2$d ضرر._\n\nصعق هذا الحارس بعصاك للحراسة سيشفيه.\n\nهذا الحارس سينفق بعض الصحة كلما صعق عدوا، لكن يمكن شفاؤه باستعمال عصاك للحراسة عليه.\n\nعصاك للحراسة تستعمل _%3$d طاقة_ للحفاظ على هذا الحارس.
items.wands.wandofwarding$ward.discover_hint=تستطيع إيجاد هذه الشخصية بعصا معينة.
items.wands.wandofwarding$ward.dismiss_title=أطرد هذه الحراسة؟
items.wands.wandofwarding$ward.dismiss_body=تستطيع تبديد هذه الحراسة إن لم تعد ترغب أن تحافظ عليها عصاك. فعل ذلك يدمّر الحراسة فورا.\n\nأطرد هذه الحراسة؟
items.wands.wandofwarding$ward.dismiss_confirm=نعم
items.wands.wandofwarding$ward.dismiss_cancel=لا
items.weapon.curses.annoying.name=%s مزعج
items.weapon.curses.annoying.msg_1=أوه، هل نقاتل شيئا ما!؟
items.weapon.curses.annoying.msg_2=نعم، اضربهم!
items.weapon.curses.annoying.msg_3=هي، اسمع!
items.weapon.curses.annoying.msg_4=هل وصلنا إلى الزعيم بعد!؟
items.weapon.curses.annoying.msg_5=آخ، لا تأرجحني بقوة هكذا!
items.weapon.curses.annoying.msg_6=مت، أيّتها الحشرة!
items.weapon.curses.annoying.msg_7=ويييييييييي!
items.weapon.curses.annoying.msg_8=هل نأخذ استراحة!؟
items.weapon.curses.annoying.msg_9=باو، هاها!
items.weapon.curses.annoying.msg_10=ضربة موفّقة!
items.weapon.curses.annoying.msg_11=لم أكن أريد أن أكون سلاحا، أردت أن أكون فأس حطّاب.
items.weapon.curses.annoying.msg_12=تذكّر، الثقة المفرطة قاتل بطيء وخبيث.
items.weapon.curses.annoying.msg_13=كل قواعدكم ملك لنا!
items.weapon.curses.annoying.desc=الأسلحة المزعجة قادرة على الكلام، لكنها نشطة أكثر من اللازم. غالبا ستجذب الانتباه إليك دون قصد.
items.weapon.curses.annoying.elestrike_desc=ضربة عنصرية بلعنة مزعجة عندها 20% فرصة أن تذعر كل عدو في المدى لـ6 أدوار.
items.weapon.curses.dazzling.name=%s مبهر
items.weapon.curses.dazzling.desc=الأسلحة المبهرة ستومض أحيانا بضوء مبهر، تعمي كل ما يستطيع رؤيتها.
items.weapon.curses.dazzling.elestrike_desc=ضربة عنصرية بلعنة مبهرة عندها 50% فرصة أن تعمي كل عدو في المدى لـ6 أدوار.
items.weapon.curses.displacing.name=%s مُزحزح
items.weapon.curses.displacing.desc=الأسلحة المزحزحة مشبعة بسحر نقل آني فوضوي، تمتلك القدرة على ثني الأعداء حول الطابق عشوائيا.
items.weapon.curses.displacing.elestrike_desc=ضربة عنصرية بلعنة مزحزحة عندها 50% فرصة أن تنقل آنيا كل عدو في المدى.
items.weapon.curses.explosive.name=%s متفجر
items.weapon.curses.explosive.warm=دافئ...
items.weapon.curses.explosive.hot=ساخن!
items.weapon.curses.explosive.desc=الأسلحة المتفجرة تبني القوة باستمرار وتنفجر، تضر أي شيء قريب.
items.weapon.curses.explosive.desc_cool=سلاحك حاليا بارد عند اللمس.
items.weapon.curses.explosive.desc_warm=سلاحك يبني الطاقة ويصبح دافئا...
items.weapon.curses.explosive.desc_hot=سلاحك ساخن! على وشك الانفجار!
items.weapon.curses.explosive.elestrike_desc=ضربة عنصرية بلعنة متفجرة عندها 50% فرصة أن تسبب انفجارا يظهر على عدو عشوائي في المدى.
items.weapon.curses.friendly.name=%s ودود
items.weapon.curses.friendly.desc=الأسلحة الودودة مناسبة أفضل للمسالمين، تطلق أحيانا سحرا يجعل القتال مستحيلا.
items.weapon.curses.friendly.elestrike_desc=ضربة عنصرية بلعنة ودودة عندها 50% فرصة أن تسحر كل عدو في المدى لـ6 أدوار.
items.weapon.curses.polarized.name=%s مستقطب
items.weapon.curses.polarized.desc=السلاح المستقطب متأثر بسحر يجعل هجومه يسبب إما ضررا أكثر بمقدار 50%، أو لا ضرر على الإطلاق.
items.weapon.curses.polarized.elestrike_desc=ضربة عنصرية بلعنة مستقطبة عندها 50% فرصة أن تسبب 24-36 ضرر لكل عدو في المدى.
items.weapon.curses.pressurized.name=%s مضغوط
items.weapon.curses.pressurized.desc=الأسلحة المضغوطة قادرة على الانفجار بنافورة ماء قوية تطرد كل شيء بعيدا، بما في ذلك أنت.
items.weapon.curses.pressurized.elestrike_desc=ضربة عنصرية بلعنة مضغوطة ستخلق موجة ماء تدمّر التضاريس وتطرد كل عدو في المدى.
items.weapon.curses.sacrificial.name=%s تضحوي
items.weapon.curses.sacrificial.desc=الأسلحة التضحوية ستطلب الدم من اللابس في المقابل لمهاجمة الأعداء. كلما كان اللابس أكثر صحة، أخذت اللعنة دما أكثر.
items.weapon.curses.sacrificial.elestrike_desc=ضربة عنصرية بلعنة تضحوية تجعل البطل وكل عدو في المدى ينزف 12 نقطة صحة.
items.weapon.curses.wayward.name=%s شارد
items.weapon.curses.wayward.desc=الأسلحة الشاردة ستصبح أحيانا غير دقيقة للغاية. هذا السحر يدوم لفترة قصيرة عندما يُفعّل، لكن يمكن تبديده بهبوط ضربة بالسلاح الشارد.
items.weapon.curses.wayward.elestrike_desc=ضربة عنصرية بلعنة شاردة عندها 50% فرصة أن تسحر كل عدو في المدى لـ6 أدوار.
items.weapon.curses.wayward$waywardbuff.name=شارد
items.weapon.curses.wayward$waywardbuff.desc=سحر سلاحك الشارد تم تفعيله، يجعله غير دقيق للغاية لفترة قصيرة. لاحظ أن هذا لا يؤثر في الهجمات المضمونة الإصابة، مثل الهجمات المفاجئة. مهاجمة بنجاح بالسلاح الشارد سيمسح هذا الأثر فورا.\n\nالأدوار المتبقية: %s.
items.weapon.curses.wondrous.name=%s عجيب
items.weapon.curses.wondrous.desc=الأسلحة العجيبة تحتوي على نفس السحر الفوضوي الموجود في العصي الملعونة. لا يمكن التنبؤ بما سيحدث عندما تُطلق هذه اللعنة!
items.weapon.curses.wondrous.elestrike_desc=ضربة عنصرية بلعنة عجيبة عندها فرصة أن تطبق أثر عصا ملعونة مختلف على كل عدو في المدى.
items.weapon.enchantments.blazing.name=%s مشتعل
items.weapon.enchantments.blazing.desc=هذه المسحورة تجعل النيران تبصق من سلاح، تشعل الأعداء وتسبب ضررا إضافيا للأعداء المحترقين أصلا.
items.weapon.enchantments.blazing.elestrike_desc=ضربة عنصرية بمسحورة مشتعلة تنشر النار إلى كل مربع في المدى، تدوم 8 أدوار.
items.weapon.enchantments.blocking.name=%s صَدّ
items.weapon.enchantments.blocking.desc=الأسلحة الصادّة عندها فرصة أن تدرعك وجيزة بعد الهجوم بها.
items.weapon.enchantments.blocking.elestrike_desc=ضربة عنصرية بمسحورة صادّة تمنح نصل السموم 6 تدريع إضافي لكل عدو في المدى.
items.weapon.enchantments.blocking$blockbuff.name=صدّ
items.weapon.enchantments.blocking$blockbuff.desc=مسحورة سلاحك الصادّة منحتك دفعة وجيزة لقوتك الدفاعية!\n\nالتدريع المتبقي: %d\n\nالأدوار المتبقية: %s.
items.weapon.enchantments.blooming.name=%s مزهر
items.weapon.enchantments.blooming.desc=الأسلحة المزهرة تحتوي على سحر سيجعل النباتات تنبت على أو حول من ضربتهم.
items.weapon.enchantments.blooming.elestrike_desc=ضربة عنصرية بمسحورة مزهرة تنشر العشب إلى حتى 8 مربعات في المدى، وتجذّر كل الأعداء في المدى لـ6 أدوار.
items.weapon.enchantments.chilling.name=%s مبرد
items.weapon.enchantments.chilling.desc=الأعداء المضروبون بهذه المسحورة يُبرّدون، يبطئون حركتهم وهجماتهم.
items.weapon.enchantments.chilling.elestrike_desc=ضربة عنصرية بمسحورة مبردة تنشر هواء مبرد إلى كل مربع في المدى، يدوم 8 أدوار.
items.weapon.enchantments.crystal.name=%s بلوري
items.weapon.enchantments.crystal.alert_fixed=سلاحك البلوري أُصلح بالكامل!
items.weapon.enchantments.crystal.alert_fixed_ghost=سلاح الروح البلوري أُصلح بالكامل!
items.weapon.enchantments.crystal.alert_noflaw=سلاحك البلوري لم يعد معيبا.
items.weapon.enchantments.crystal.alert_noflaw_ghost=سلاح الروح البلوري لم يعد معيبا.
items.weapon.enchantments.crystal.alert_nocrack=سلاحك البلوري لم يعد متشققا.
items.weapon.enchantments.crystal.alert_nocrack_ghost=سلاح الروح البلوري لم يعد متشققا.
items.weapon.enchantments.crystal.alert_flawed=سلاحك البلوري أصبح متضررا قليلا.
items.weapon.enchantments.crystal.alert_flawed_ghost=سلاح الروح البلوري أصبح متضررا قليلا.
items.weapon.enchantments.crystal.alert_cracked=سلاحك البلوري يتشقق، على وشك الانكسار!
items.weapon.enchantments.crystal.alert_cracked_ghost=سلاح الروح البلوري يتشقق، على وشك الانكسار!
items.weapon.enchantments.crystal.alert_shattered=سلاحك البلوري يتحطم إلى قطع!
items.weapon.enchantments.crystal.alert_shattered_ghost=سلاح الروح البلوري يتحطم إلى قطع!
items.weapon.enchantments.crystal.desc=هذه المسحورة القوية تسبب ضررا سحريا إضافيا وتعزّز قيمة السلاح. مع ذلك، السلاح المسحور يمكن أن يتحطم إن لم تُصلح البلورات، أو يُمنح وقتا للإصلاح الذاتي.
items.weapon.enchantments.crystal.desc_thrown=الأسلحة البلورية المرماة عندها متانة أقل بكثير، لكنها تستعيدها ببطء مع الوقت.
items.weapon.enchantments.crystal.desc_perfect=هذا السلاح البلوري حاليا في حالة مثالية.
items.weapon.enchantments.crystal.desc_fine=هذا السلاح البلوري حاليا في حالة جيدة.
items.weapon.enchantments.crystal.desc_flawed=هذا السلاح البلوري عنده عيب، لكنه ليس على وشك الانكسار.
items.weapon.enchantments.crystal.desc_cracked=هذا السلاح البلوري يتشقق، وهو في خطر الانكسار الدائم!
items.weapon.enchantments.crystal.elestrike_desc=ضربة عنصرية بمسحورة بلورية تسبب 10-20 ضرر وتصلح السلاح لكل عدو في المدى، عدا الهدف الأساسي.
items.weapon.enchantments.kinetic.name=%s حركي
items.weapon.enchantments.kinetic.desc=عندما يُقتل عدو بسلاح حركي، أي قوة زائدة تُخزن في السلاح وستُطبق على الهجوم الناجح التالي.
items.weapon.enchantments.kinetic.elestrike_desc=ضربة عنصرية بمسحورة حركية تطبّق 40% من الضرر المخزّن على كل عدو في المدى، عدا الهدف الأساسي.
items.weapon.enchantments.kinetic$conserveddamage.name=ضرر محفوظ
items.weapon.enchantments.kinetic$conserveddamage.desc=سلاحك خزّن القوة الزائدة من ضربة قاتلة سابقة، وسيطبّقها كضرر إضافي على هجومك التالي. الطاقة ستتلاشى ببطء مع الوقت، مع ذلك.\n\nالضرر المحفوظ: %d.
items.weapon.enchantments.corrupting.name=%s مفسد
items.weapon.enchantments.corrupting.desc=هذه المسحورة القوية تمتلك القدرة على تحويل الأعداء إلى إرادتك. عندما يُقتل عدو بهذا السلاح، هناك فرصة أن يصبحوا فاسدين بدل أن يموتوا.
items.weapon.enchantments.corrupting.elestrike_desc=ضربة عنصرية بمسحورة مفسدة عندها 5-25% فرصة (بناء على الصحة المفقودة) أن تفسد كل عدو في المدى، عدا الهدف الأساسي.
items.weapon.enchantments.eldritch.name=%s غامض
items.weapon.enchantments.eldritch.desc=الأسلحة الغامضة تضرب الرعب في الأعداء القريبين الذين يشهدون ضرباتها، تجعلهم يهربون من المهاجم.
items.weapon.enchantments.eldritch.elestrike_desc=ضربة عنصرية بمسحورة غامضة تطبق رعبا ممتدا على كل عدو في المدى، بما في ذلك الهدف الأساسي.
items.weapon.enchantments.elastic.name=%s مرن
items.weapon.enchantments.elastic.desc=الأسلحة المرنة عندها فرصة أن ترسل الأعداء متطايرين للخلف مسافات قصيرة.
items.weapon.enchantments.elastic.elestrike_desc=ضربة عنصرية بمسحورة مرنة تطرد كل الأعداء في المدى 5 مربعات للخلف.
items.weapon.enchantments.grim.name=%s قاتم
items.weapon.enchantments.grim.desc=هذه المسحورة القوية تمتلك القدرة على إعدام عدو فورا. الأثر أكثر احتمالا أن يحدث كلما كان العدو أضعف.
items.weapon.enchantments.grim.elestrike_desc=ضربة عنصرية بمسحورة قاتمة عندها 6-30% فرصة (بناء على الصحة المفقودة) أن تقتل كل عدو في المدى، عدا الهدف الأساسي.
items.weapon.enchantments.lucky.name=%s محظوظ
items.weapon.enchantments.lucky.desc=الأعداء المقتولون بسلاح محظوظ عندهم فرصة أن يسقطوا غنائم إضافية.
items.weapon.enchantments.lucky.elestrike_desc=ضربة عنصرية بمسحورة محظوظة عندها 12.5% فرصة أن تستحدث غنائم تحت كل عدو في المدى. هذا الأثر يمكن أن يُطلق فقط مرة واحدة لكل عدو.
items.weapon.enchantments.projecting.name=%s مُسقِط
items.weapon.enchantments.projecting.desc=مع هذه المسحورة الأسلحة الاشتباكية ستكسب مدى إضافيا. الأسلحة بعيدة المدى ستخترق الحيطان عند التصويب على أهداف قريبة.
items.weapon.enchantments.projecting.elestrike_desc=ضربة عنصرية بمسحورة مسقطة تسبب 30% ضرر لكل عدو في المدى، عدا الهدف الأساسي.
items.weapon.enchantments.shocking.name=%s صاعق
items.weapon.enchantments.shocking.desc=الكهرباء تتقوس من سلاح صاعق، تسبب ضررا إضافيا لكل الأعداء القريبين.
items.weapon.enchantments.shocking.elestrike_desc=ضربة عنصرية بمسحورة صاعقة تنشر الكهرباء إلى كل مربع في المدى، تدوم 8 أدوار.
items.weapon.enchantments.unstable.name=%s غير مستقر
items.weapon.enchantments.unstable.desc=هذه المسحورة تشع طاقة فوضوية، تعمل كمسحورة مختلفة مع كل ضربة.
items.weapon.enchantments.unstable.elestrike_desc=ضربة عنصرية بمسحورة غير مستقرة تطبق أثر مسحورة عشوائي على كل عدو في المدى، عدا الهدف الأساسي.
items.weapon.enchantments.vampiric.name=%s مصاص دماء
items.weapon.enchantments.vampiric.desc=هذه المسحورة القوية تمتص قوة الحياة من الأعداء مع كل ضربة، تعيدها إلى اللابس. الأثر أقوى كلما كانت صحة اللابس أقل.
items.weapon.enchantments.vampiric.elestrike_desc=ضربة عنصرية بمسحورة مصاص دماء تشفي نصل السموم بمقدار 2.5 نقطة صحة لكل عدو في المدى.
items.weapon.enchantments.venomous.name=%s سام
items.weapon.enchantments.venomous.desc=الأسلحة السامة تصيب سمًّا متأخرًا لكنه قاتل، يصبح أكثر حدة كلما طُبق.
items.weapon.enchantments.venomous.elestrike_desc=ضربة عنصرية بمسحورة سامة تطبق سمًّا متأخرا إضافيا على كل عدو في المدى، عدا الهدف الأساسي.
items.weapon.enchantments.vorpal.name=%s حاد للغاية
items.weapon.enchantments.vorpal.desc=الأسلحة الحادة للغاية خطرة بشكل خاص، عندها فرصة أن تضرب بنظافة تجعلها تصيب النزيف بدل الضرر للأعداء الذين يمكن أن ينزفوا.
items.weapon.enchantments.vorpal.elestrike_desc=ضربة عنصرية بمسحورة حادة للغاية تطبق نزيفا إضافيا على كل عدو في المدى، عدا الهدف الأساسي.
items.weapon.melee.assassinsblade.name=نصل القاتل
items.weapon.melee.assassinsblade.stats_desc=هذا السلاح أقوى ضد الأعداء غير المدركين.
items.weapon.melee.assassinsblade.ability_name=تسلل
items.weapon.melee.assassinsblade.typical_ability_desc=نصل السموم_ تستطيع _التسلل_ بينما تحمل نصل قاتل. هذه القدرة تتيح لنصل السموم أن تخطف فورا حتى 3 مربعات وتمنحها عادة _%d أدوار من الاختفاء._
items.weapon.melee.assassinsblade.ability_desc=نصل السموم تستطيع _التسلل_ بينما تحمل نصل قاتل. هذه القدرة تتيح لنصل السموم أن تخطف فورا حتى 3 مربعات وتمنحها _%d أدوار من الاختفاء._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=مدة القدرة
items.weapon.melee.assassinsblade.desc=نصل صغير متموج مصنوع من السبج، صعب الاستعمال رغم خفته، لكنه قاتل إن وجد العلامة الصحيحة.
items.weapon.melee.battleaxe.name=فأس معركة
items.weapon.melee.battleaxe.stats_desc=هذا سلاح دقيق نوعا ما.
items.weapon.melee.battleaxe.ability_name=ضربة ثقيلة
items.weapon.melee.battleaxe.typical_ability_desc=نصل السموم يستطيع أداء _ضربة ثقيلة_ بفأس معركة. هذا الهجوم المركّز عادة يسبب _%1$d-%2$d ضرر_ إن فاجأ العدو، ويذهلهم لـ5 أدوار ما يخفّض الدقة والمراوغة بمقدار 50%%. الضربة الثقيلة تصيب دائما لكنها تسبب ضررا عاديا إن لم تفاجئ العدو.
items.weapon.melee.battleaxe.ability_desc=نصل السموم يستطيع أداء _ضربة ثقيلة_ بفأس معركة. هذا الهجوم المركّز يسبب _%1$d-%2$d ضرر_ إن فاجأ العدو، ويذهلهم لـ5 أدوار ما يخفّض الدقة والمراوغة بمقدار 50%%. الضربة الثقيلة تصيب دائما لكنها تسبب ضررا عاديا إن لم تفاجئ العدو.
items.weapon.melee.battleaxe.desc=رأس الفولاذ الضخم لفأس المعركة هذا يضع ثقلا كبيرا خلف كل ضربة واسعة.
items.weapon.melee.crossbow.name=قوس ونشاب
items.weapon.melee.crossbow.typical_stats_desc=عادة هذا السلاح يعزز الأسهم المرماة لتسبب _%1$d-%2$d ضرر_ عندما يُجهز، وسيمنحها حتى مسحورته.
items.weapon.melee.crossbow.stats_desc=هذا السلاح يعزز الأسهم المرماة لتسبب _%1$d-%2$d ضرر_ عندما يُجهز، وسيمنحها حتى مسحورته.
items.weapon.melee.crossbow.ability_name=طلقة مشحونة
items.weapon.melee.crossbow.typical_ability_desc=نصل السموم تستطيع _شحن_ قوسها ونشابها، تجعل هجومها العادي التالي به دائما يصيب وتطبق أحد ثلاثة آثار: الهجمات الاشتباكية ستطرد الأعداء بعيدا، الأسهم غير ذات الرأس عادة ستسبب _+%1$d ضرر_، والأسهم ذات الرأس ستطبق أثرها في منطقة 7x7 وستدوم عادة _%2$d استعمالات أكثر_.
items.weapon.melee.crossbow.ability_desc=نصل السموم تستطيع _شحن_ قوسها ونشابها، تجعل هجومها العادي التالي به دائما يصيب وتطبق أحد ثلاثة آثار: الهجمات الاشتباكية ستطرد الأعداء بعيدا، الأسهم غير ذات الرأس ستسبب _+%1$d ضرر_، والأسهم ذات الرأس ستطبق أثرها في منطقة 7x7 وستدوم _%2$d استعمالات أكثر_.
items.weapon.melee.crossbow.desc=سلاح معقد إلى حد ما يطلق السهام بسرعات استثنائية. بينما لم يُصمّم لذلك، ثقل هذا القوس ونشاب وبنيته المتينة يجعلانه سلاح اشتباك لائق أيضًا.
items.weapon.melee.crossbow.upgrade_ability_stat_name=تعزيز القدرة
items.weapon.melee.crossbow$chargedshot.name=مشحون
items.weapon.melee.crossbow$chargedshot.desc=نصل السموم تركّز القوة في قوسها ونشابها. الهجوم التالي الذي تقوم به به سيصيب دائما ويطبق أحد ثلاثة آثار:\n- الهجمات الاشتباكية ستطرد الأعداء بضعة مربعات بعيدا.\n- الأسهم غير ذات الرأس ستسبب ضررا إضافيا.\n- الأسهم ذات الرأس ستكسب استعمالات إضافية وتطبق أثرها في منطقة 7x7. آثار الأسهم الإيجابية ستؤثر فقط في الحلفاء، والآثار الضارة ستطبّق فقط على الأعداء. نصل السموم لا تستطيع استعمال هذه القدرة لتطبيق آثار أسهم إيجابية على نفسها.
items.weapon.melee.cudgel.name=هراوة
items.weapon.melee.cudgel.stats_desc=هذا سلاح دقيق نوعا ما.
items.weapon.melee.cudgel.ability_name=ضربة ثقيلة
items.weapon.melee.cudgel.typical_ability_desc=نصل السموم يستطيع أداء _ضربة ثقيلة_ بهراوة. هذا الهجوم المركّز عادة يسبب _%1$d-%2$d ضرر_ إن فاجأ العدو، ويذهلهم لـ5 أدوار ما يخفّض الدقة والمراوغة بمقدار 50%%. الضربة الثقيلة تصيب دائما لكنها تسبب ضررا عاديا إن لم تفاجئ العدو.
items.weapon.melee.cudgel.ability_desc=نصل السموم يستطيع أداء _ضربة ثقيلة_ بهراوة. هذا الهجوم المركّز يسبب _%1$d-%2$d ضرر_ إن فاجأ العدو، ويذهلهم لـ5 أدوار ما يخفّض الدقة والمراوغة بمقدار 50%%. الضربة الثقيلة تصيب دائما لكنها تسبب ضررا عاديا إن لم تفاجئ العدو.
items.weapon.melee.cudgel.desc=صولجان نحاسي صغير، صُنع أكثر كأداة دفاع عن النفس للنبلاء من كونه سلاح مغامرة.
items.weapon.melee.cudgel.discover_hint=أحد الأبطال يبدأ بهذا الغرض.
items.weapon.melee.dagger.name=خنجر
items.weapon.melee.dagger.stats_desc=هذا السلاح أقوى ضد الأعداء غير المدركين.
items.weapon.melee.dagger.ability_name=تسلل
items.weapon.melee.dagger.typical_ability_desc=نصل السموم تستطيع _التسلل_ بينما تحمل خنجرا. هذه القدرة تتيح لنصل السموم أن تخطف فورا حتى 5 مربعات وتمنحها عادة _%d أدوار من الاختفاء._
items.weapon.melee.dagger.ability_desc=نصل السموم تستطيع _التسلل_ بينما تحمل خنجرا. هذه القدرة تتيح لنصل السموم أن تخطف فورا حتى 5 مربعات وتمنحها _%d أدوار من الاختفاء._
items.weapon.melee.dagger.upgrade_ability_stat_name=مدة القدرة
items.weapon.melee.dagger.desc=خنجر حديدي بسيط بمقبض خشبي مهترئ.
items.weapon.melee.dagger.discover_hint=أحد الأبطال يبدأ بهذا الغرض.
items.weapon.melee.dirk.name=خنجر طويل
items.weapon.melee.dirk.stats_desc=هذا السلاح أقوى ضد الأعداء غير المدركين.
items.weapon.melee.dirk.ability_name=تسلل
items.weapon.melee.dirk.typical_ability_desc=نصل السموم تستطيع _التسلل_ بينما تحمل خنجرا طويلا. هذه القدرة تتيح لنصل السموم أن تخطف فورا حتى 4 مربعات وتمنحها عادة _%d أدوار من الاختفاء._
items.weapon.melee.dirk.ability_desc=نصل السموم تستطيع _التسلل_ بينما تحمل خنجرا طويلا. هذه القدرة تتيح لنصل السموم أن تخطف فورا حتى 4 مربعات وتمنحها _%d أدوار من الاختفاء._
items.weapon.melee.dirk.upgrade_ability_stat_name=مدة القدرة
items.weapon.melee.dirk.desc=خنجر طعن أطول، يعطي فولاذا أكثر قليلا لتغرسه في الأعداء.
items.weapon.melee.flail.name=مذبّة
items.weapon.melee.flail.stats_desc=هذا سلاح غير دقيق نوعا ما.\nهذا السلاح لا يستطيع هجوم مفاجئ.
items.weapon.melee.flail.ability_name=تدوير
items.weapon.melee.flail.spin_warn=لا تستطيع تدوير المذبّة أكثر.
items.weapon.melee.flail.typical_ability_desc=نصل السموم تستطيع _تدوير_ مذبّة لبناء القوة لفترة قصيرة. كل دور تُدار المذبة ستسبب عادة _+%d ضرر_ في هجومها العادي التالي، حتى حد أقصى 3 مرات. المذبّة الدائرة مضمونة الإصابة أيضا. بدء تدوير المذبة فقط يكلف شحنة.
items.weapon.melee.flail.ability_desc=نصل السموم تستطيع _تدوير_ مذبّة لبناء القوة لفترة قصيرة. كل دور تُدار المذبة ستسبب _+%d ضرر_ في هجومها العادي التالي، حتى حد أقصى 3 مرات. المذبّة الدائرة مضمونة الإصابة أيضا. بدء تدوير المذبة فقط يكلف شحنة.
items.weapon.melee.flail.desc=كرة شائكة مربوطة بمقبض بطول سلسلة. صعبة التحكم جدا، لكنها مدمّرة إن أصابت ضربة صلبة.
items.weapon.melee.flail$spinabilitytracker.name=تدوير
items.weapon.melee.flail$spinabilitytracker.desc=نصل السموم تدوّر مذبتها، تبني الضرر لهجومها العادي التالي بها. كل تدوير يأخذ دورا واحدا لكنه يزيد الضرر، حتى حد أقصى ثلاث تدويرات. المذبّة مضمونة الإصابة أيضا أثناء التدوير.\n\nالتدويرات الحالية: %1$d%%.\nالأدوار المتبقية: %2$s.
items.weapon.melee.gauntlet.name=قفاز حجري
items.weapon.melee.gauntlet.stats_desc=هذا سلاح سريع جدا.
items.weapon.melee.gauntlet.ability_name=ضربة سلسلية
items.weapon.melee.gauntlet.typical_ability_desc=نصل السموم تستطيع أداء _ضربة سلسلية_ بقفاز حجري. هذا الهجوم مضمون الإصابة وعادة يسبب _+%d ضرر_ لكل مرة أصابت فيها نصل السموم بهجوم سلاح اشتباكي أو مرمي عادي. عدم الإصابة لـ5 أدوار (15 بعد قتل) يعيد تعيين هذه السلسلة.
items.weapon.melee.gauntlet.ability_desc=نصل السموم تستطيع أداء _ضربة سلسلية_ بقفاز حجري. هذا الهجوم مضمون الإصابة ويسبب _+%d ضرر_ لكل مرة أصابت فيها نصل السموم بهجوم سلاح اشتباكي أو مرمي عادي. عدم الإصابة لـ5 أدوار (15 بعد قتل) يعيد تعيين هذه السلسلة.
items.weapon.melee.gauntlet.desc=هذا القفاز الضخم مصنوع من قماش قرمزي بحجر سحري ثقيل مغطّى فوقه. القماش يشتد حولك، يجعل ألواح الحجر السميكة كجلد ثانٍ تقريبا. تأرجح سلاح ثقيل كهذا يتطلب قوة، لكنه يضيف قوة هائلة لضرباتك.
items.weapon.melee.glaive.name=سيف عمودي
items.weapon.melee.glaive.stats_desc=هذا سلاح بطيء نوعا ما.\nهذا السلاح عنده مدى إضافي.
items.weapon.melee.glaive.ability_name=طعن بطرف
items.weapon.melee.glaive.typical_ability_desc=نصل السموم تستطيع استعمال طرف سيف عمودي _للطعن_ بعدو في المدى لكن ليس مجاورا. هذا عادة يسبب _%1$d-%2$d ضرر_، ويطرد العدو للخلف، وهو مضمون الإصابة.
items.weapon.melee.glaive.ability_desc=نصل السموم تستطيع استعمال طرف سيف عمودي _للطعن_ بعدو في المدى لكن ليس مجاورا. هذا يسبب _%1$d-%2$d ضرر_، ويطرد العدو للخلف، وهو مضمون الإصابة.
items.weapon.melee.glaive.desc=سلاح عمودي ضخم يتكوّن من نصل سيف في نهاية عمود.
items.weapon.melee.gloves.name=قفازات مرصعة
items.weapon.melee.gloves.stats_desc=هذا سلاح سريع جدا.
items.weapon.melee.gloves.ability_name=ضربة سلسلية
items.weapon.melee.gloves.typical_ability_desc=نصل السموم تستطيع أداء _ضربة سلسلية_ بقفازات مرصعة. هذا الهجوم مضمون الإصابة وعادة يسبب _+%d ضرر_ لكل مرة أصابت فيها نصل السموم بهجوم سلاح اشتباكي أو مرمي عادي. عدم الإصابة لـ5 أدوار (15 بعد قتل) يعيد تعيين هذه السلسلة.
items.weapon.melee.gloves.ability_desc=نصل السموم تستطيع أداء _ضربة سلسلية_ بقفازات مرصعة. هذا الهجوم مضمون الإصابة ويسبب _+%d ضرر_ لكل مرة أصابت فيها نصل السموم بهجوم سلاح اشتباكي أو مرمي عادي. عدم الإصابة لـ5 أدوار (15 بعد قتل) يعيد تعيين هذه السلسلة.
items.weapon.melee.gloves.desc=هذه القفازات المرصعة لا توفر أي حماية حقيقية، لكنها تعمل كسلاح صالح بينما تبقي اليدين حرّتين.
items.weapon.melee.gloves.discover_hint=أحد الأبطال يبدأ بهذا الغرض.
items.weapon.melee.greataxe.name=فأس عظيم
items.weapon.melee.greataxe.stats_desc=هذا السلاح ثقيل بشكل لا يُصدق.
items.weapon.melee.greataxe.ability_name=انتقام
items.weapon.melee.greataxe.typical_ability_desc=نصل السموم تستطيع أداء هجوم _انتقام_ بفأس عظيم إن كانت تحت 50%% صحة. هذا الهجوم المدمّر عادة يسبب _%1$d-%2$d ضرر،_ وهو مضمون الإصابة، وهو فوري إن قتل عدوا.
items.weapon.melee.greataxe.ability_desc=نصل السموم تستطيع أداء هجوم _انتقام_ بفأس عظيم إن كانت تحت 50%% صحة. هذا الهجوم المدمّر يسبب _%1$d-%2$d ضرر،_ وهو مضمون الإصابة، وهو فوري إن قتل عدوا.
items.weapon.melee.greataxe.desc=صُمّم ليُحمل فوق الكتف، هذا الفأس العملاق قوي كما هو ثقيل.
items.weapon.melee.greatshield.name=درع عظيم
items.weapon.melee.greatshield.typical_stats_desc=عادة هذا السلاح يصدّ 0-%d ضرر. هذا الصدّ يتدرج مع الترقيات.
items.weapon.melee.greatshield.stats_desc=هذا السلاح يصدّ 0-%d ضرر. هذا الصدّ يتدرج مع الترقيات.
items.weapon.melee.greatshield.ability_name=حراسة
items.weapon.melee.greatshield.typical_ability_desc=نصل السموم تستطيع _حراسة_ نفسها بدرع عظيم، تلغي بالكامل كل الهجمات الفيزيائية أو السحرية الموجهة ضدها عادة لـ_%d أدوار_. بمجرد أن تصدّ نصل السموم هجوما، الهجوم المضاد أو استعمال السحر سيُنهي الحراسة.
items.weapon.melee.greatshield.ability_desc=نصل السموم تستطيع _حراسة_ نفسها بدرع عظيم، تلغي بالكامل كل الهجمات الفيزيائية أو السحرية الموجهة ضدها لـ_%d أدوار_. بمجرد أن تصدّ نصل السموم هجوما، الهجوم المضاد أو استعمال السحر سيُنهي الحراسة.
items.weapon.melee.greatshield.upgrade_ability_stat_name=مدة القدرة
items.weapon.melee.greatshield.desc=أكثر شبهًا بحائط متحرّك من درع، هذه الكتلة العملاقة من المعدن تساعد الدفاع، لكن لا تترك مجالا كبيرا للهجوم.
items.weapon.melee.greatsword.name=سيف عظيم
items.weapon.melee.greatsword.ability_name=شقّ
items.weapon.melee.greatsword.typical_ability_desc=نصل السموم تستطيع _شقّ_ عدو بسيف عظيم. هذا عادة يسبب _%1$d-%2$d ضرر_ وهو مضمون الإصابة. إن قتل الشقّ عدوا فهو فوري ونصل السموم تستطيع استعمال الشقّ من جديد خلال 5 أدوار مجانا.
items.weapon.melee.greatsword.ability_desc=نصل السموم تستطيع _شقّ_ عدو بسيف عظيم. هذا يسبب _%1$d-%2$d ضرر_ وهو مضمون الإصابة. إن قتل الشقّ عدوا فهو فوري ونصل السموم تستطيع استعمال الشقّ من جديد خلال 5 أدوار مجانا.
