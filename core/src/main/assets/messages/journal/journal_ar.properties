journal.document.adventurers_guide.title=مجلد إتقان السراديب
journal.document.adventurers_guide.intro.title=مقدمة
journal.document.adventurers_guide.intro.body=تحياتي أيها المغامر، أنت تقرأ مجلد إتقان السراديب! هذا الدليل يُستعمل كمرجع أساسا، وسيعلمك سحريا متى يكون من الأفضل قراءة كل صفحة.\n\n(عندما يومض زر اليوميات، اختره لقراءة ما عند الدليل ليخبرك! بعض الصفحات مفقودة رغم ذلك، ربما تستطيع إيجادها في السراديب؟)
journal.document.adventurers_guide.examining.title=الفحص
journal.document.adventurers_guide.examining.body=من المهم دراسة أعدائك ومحيطك بدل الاندفاع أعمى! تعوّد على فحص كل شيء جديد.\n\n(تستطيع الفحص باستعمال زر العدسة المكبرة ثم اختيار ما تريد فحصه. تستطيع أيضا فحص التعزيزات أو الإضعافات باختيار أيقوناتها.)
journal.document.adventurers_guide.surprise_attacks.title=الهجمات المباغتة
journal.document.adventurers_guide.surprise_attacks.body=الهجمات المباغتة مضمونة الإصابة، ما يجعلها مفيدة بشكل خاص ضد الأعداء المراوغين كالأفاعي والأخيلة.\n\nتستطيع مباغتة الأعداء مباشرة بعد دخولهم بابا وهم يطاردونك، أو عندما يفقدون رؤيتك بأي طريقة أخرى.
journal.document.adventurers_guide.identifying.title=تعريف الأغراض
journal.document.adventurers_guide.identifying.body=ألوان الجرعات ورموز المخطوطات مختلفة في كل سراديب. المعدات غير المعرفة قد تكون مرقّاة أو مسحورة إن حالك الحظ، أو قد تكون ملعونة!\n\nمخطوطات التعريف أو الترقية أو إزالة اللعنة مفيدة جدا إن أردت تقليل خطر استعمال معدات غير معرفة.\n\n(تستطيع إيجاد قائمة بكل الأغراض التي عرفتها في لسان الكتالوج في يومياتك)
journal.document.adventurers_guide.food.title=التعامل مع الجوع
journal.document.adventurers_guide.food.body=التقنين الفعال من أفضل الطرق لتحسين فرص نجاتك، لا تحتاج دائما الأكل مباشرة عندما تجوع!\n\nعندما لا تكون متضورا ستتجدد صحتك ببطء، لذا إن أكلت بصحة كاملة سيضيع ذلك التجدد!\n\nإن وزعت مواعيد أكلك بناء على صحتك، سيصمد طعامك أطول بكثير.
journal.document.adventurers_guide.alchemy.title=الكيمياء والتمائم
journal.document.adventurers_guide.alchemy.body=إن لم تجد غرضا مستهلكا مفيدا، تستطيع استعماله كمكون كيمياء أو تحويله إلى طاقة كيميائية عامة. شحن الجرعات والمخطوطات بالطاقة يعرفها أيضا!\n\nالتمائم نوع فريد من المعدات تُصنع وتُرقى باستعمال الكيمياء. تُصنع بمحفز تميمة سحري وقليل من الطاقة الكيميائية.\n\n(أول قدر كيمياء في الطابق 3 أو 4 من السراديب. توجد صفحات من كتاب وصفات الكيمياء قرب هذه القدور أيضا.)
journal.document.adventurers_guide.dieing.title=التعامل مع الهزيمة
journal.document.adventurers_guide.dieing.body=استكشاف السراديب خطر ومعظم المغامرين يلقون حتفهم في النهاية.\n\nالحظ يساعد، لكن أفضل المغامرين يستعملون كل حيلة صغيرة لتحسين فرصهم.\n\n(لا تنزعج إن كنت تموت كثيرا، هذه اللعبة صعبة! ركز على تعلم اللعبة والتحسن باطراد، لا على الفوز فورا.)
journal.document.adventurers_guide.searching.title=البحث
journal.document.adventurers_guide.searching.body=السراديب مليئة بأبواب سرية وفخاخ تبدو غير مرئية للوهلة الأولى. تستطيع قضاء بعض الوقت والبحث بعناية إن اشتبهت أن بابا أو فخا مخفي قريب.\n\n(تستطيع بحث كل المربعات حولك باستعمال زر العدسة المكبرة مرتين. ربما توجد أبواب خفية قرب مكان عثورك على هذه الصفحة!)
journal.document.adventurers_guide.strength.title=القوة
journal.document.adventurers_guide.strength.body=لا يوجد وقت للتدرب بالأسلحة والدروع التي تجدها في السراديب، لذا ستحتاج قوة غاشمة لاستعمالها بفعالية.\n\nجرعات القوة ومخطوطات الترقية هي الطريقة الأفضل لتلبية متطلبات قوة معدات المراتب الأعلى.\n\nمن المهم أن تبدأ أخيرا باستعمال أغراض المراتب العالية، لكن لا تتجاهل المعدات التي تستطيع استعمالها الآن.
journal.document.adventurers_guide.upgrades.title=الترقيات
journal.document.adventurers_guide.upgrades.body=كلما تعمقت أكثر في السراديب، ازدادت أهمية أن تستعمل معدات مرتبة عالية مرقّاة سحريا، لكنك ستحتاج أيضا القوة لاستعمالها بشكل صحيح.\n\nالعصي والخواتم والآثار لا تحتاج قوة، لكن استخداماتها محدودة أو لا تساعد مباشرة في القتال بنفس القدر.\n\nاتخاذ قرارات جيدة حول ما ترقيه مهم جدا للنجاة مبكرا في السراديب، ولتهيئة نفسك للنجاح لاحقا فيها.
journal.document.adventurers_guide.looting.title=النهب الفعال
journal.document.adventurers_guide.looting.body=الغرف خلف أبواب مقفلة أو المحتوية على عقبات عادة فيها غنائم أفضل. عندما يسد عقبة طريقك، عادة تستطيع إيجاد غرض للمساعدة في نفس الطابق.\n\nستستطيع دائما إيجاد جرعتَي قوة و3 مخطوطات ترقية في كل منطقة سراديب من خمسة طوابق، لذا هي مؤشر رائع على مدى جودة استكشافك.\n\n(تستطيع رؤية قائمة بالمعالم والمفاتيح غير المستعملة في لسان الملاحظات في نافذة اليوميات.)
journal.document.adventurers_guide.levelling.title=كسب الخبرة
journal.document.adventurers_guide.levelling.body=الارتقاء بالمستوى يعزز إحصائياتك ويمنح نقاط موهبة، ما قد يصنع فرقا كبيرا في القتال. من الأفضل أن يكون عندك مستوى واحد على الأقل لكل طابق من السراديب.\n\nقد يكون من المغري التسرع وتجنب الاستكشاف أو القتال، لكن ذلك سيحرمك من الإمدادات والخبرة.\n\n(تستطيع رؤية معلومات عن بطلك، بما فيها الخبرة، في لوحة الحالة في ركن واجهة اللعبة. اختر صورة بطلك للحصول على معلومات أكثر.)
journal.document.adventurers_guide.positioning.title=التموضع
journal.document.adventurers_guide.positioning.body=الإستراتيجية مهمة بقدر المعدات. المواقف السيئة كالمحاصرة يمكن تفاديها عادة بتموضع جيد.\n\nمثلا، معظم السراديب فيها ممرات ضيقة تجبر الأعداء على قتالك واحدا تلو الآخر. هذه الممرات غالبا فيها أبواب للهجمات المباغتة أيضا!\n\nتوجد طرق صغيرة كثيرة لاستعمال ملامح البيئة كالعشب والماء والحفر والفخاخ لصالحك أيضا.
journal.document.adventurers_guide.magic.title=الهجمات السحرية
journal.document.adventurers_guide.magic.body=الهجمات السحرية تخترق الدرع مباشرة ويصعب تفاديها. هذا يعني أن ضرر العصي موثوق جدا، لكنه يجعل الأعداء السحريين خطرين جدا أيضا!\n\nالهجمات السحرية دائما لها عيب رغم ذلك. العصي شحناتها محدودة والأعداء السحريون عادة لن يستطيعوا استعمال سحرهم عن قرب.\n\nعند مواجهة أعداء يستعملون السحر من المهم تعلم كيف تمنعهم من استعماله عليك.
journal.document.alchemy_guide.title=دليل الكيمياء
journal.document.alchemy_guide.potions.title=مقدمة وجرعات
journal.document.alchemy_guide.potions.body=مرحبا بك في تطبيقات الكيمياء العملية! هذا الكتاب مرجع وصفات لصنع أغراض عند قدر كيمياء.\n\nسنبدأ بالوصفة الأكثر رمزية: الجرعات!\n\nاستعمل ثلاث بذور لتخمير جرعة عشوائية! كل بذرة لها نظير جرعة، استعمل عدة بذور من نفس النوع لزيادة فرصة ارتباط الجرعة بالبذور التي استعملتها.
journal.document.alchemy_guide.stones.title=صنع الأحجار الرونية
journal.document.alchemy_guide.stones.body=خلط مخطوطة في قدر كيمياء سيشرب سحرها في صخرتين داخل القدر. هذا يصنع أحجارا رونية ويعرف المخطوطة!
journal.document.alchemy_guide.energy_food.title=الطاقة والطعام
journal.document.alchemy_guide.energy_food.body=وصفات كثيرة تتطلب طاقة كيميائية بلورية، تُصنع بتفكيك الأغراض المستهلكة في قدر كيمياء. شحن الجرعات أو المخطوطات بالطاقة يعرفها أيضا.\n\nبعض الوصفات التي تتطلب الطاقة سحرية، لكن هذه تشبه الطبخ التقليدي.
journal.document.alchemy_guide.exotic_potions.title=جرعات غريبة
journal.document.alchemy_guide.exotic_potions.body=يمكن خلط الجرعات مع الطاقة لصنع جرعات غريبة. آثارها أقوى، لكنها مفيدة غالبا بطرق مختلفة.
journal.document.alchemy_guide.exotic_scrolls.title=مخطوطات غريبة
journal.document.alchemy_guide.exotic_scrolls.body=المخطوطات الغريبة يمكن صنعها ببعض الطاقة ومخطوطة. إنها أقوى قليلا وأغلى من الجرعات الغريبة.
journal.document.alchemy_guide.bombs.title=قنابل محسّنة
journal.document.alchemy_guide.bombs.body=يمكن خلط قنبلة بارود أسود عادية مع غرض معين لصنع قنبلة محسّنة.
journal.document.alchemy_guide.weapons.title=تحسين الأسلحة
journal.document.alchemy_guide.weapons.body=بعض الأسلحة الأخف أو الأكثر سحرية يمكن استعمالها في الكيمياء!\n\nكل مجموعة أسلحة مرماة تنتج معدنًا سائلا يكفي لإصلاح مجموعة أخرى من نفس المستوى والمرتبة بالكامل. لاحظ أن تحويل مجموعة إلى كيمياء سيدمر المجموعة كلها، حتى إن لم تكن كاملة!\n\nعصا واحدة ستنتج راتنجا غامضا يكفي لترقية عصوين من نفس المستوى، لكن ليس أعلى من +3.
journal.document.alchemy_guide.brews_elixirs.title=مزائج وإكسيرات
journal.document.alchemy_guide.brews_elixirs.body=المزائج والإكسيرات جرعات متقدمة بآثار متنوعة، عادة ذات استعمال واحد.
journal.document.alchemy_guide.spells.title=تعويذات
journal.document.alchemy_guide.spells.body=التعويذات محتواة في بلورات وتوفر آثارا متنوعة، عادة ذات استعمالات متعددة.
journal.document.sewers_guard.discover_hint=يمكنك إيجاد هذا النص في منطقة معينة، لكن فقط بعد إيجاد كل النصوص السابقة في هذه المجموعة.
journal.document.sewers_guard.new_position.title=منصبي الجديد!
journal.document.sewers_guard.new_position.body=85 من الخريف، 375\nعزيزي أمي وأبي،\n\nقلت لكما إن كل العمل الشاق في حرس المدينة سيؤتي ثماره. لقد ترقيت للتو!\n\nدُعيت للانضمام إلى فريق متخصص يعمل في الصهاريج. يبدو أن هناك مشاكل مع الهوام والخارجين على القانون هناك، ومهمتنا تطهير المكان منهم. إنه عمل قذر، لكن الصهاريج دافئة في الشتاء وأجره ثلاثة أضعاف واجب الحراسة العادي!\n\nالأمر كله سري بعض الشيء رغم ذلك، فلا أستطيع إرسال هذه الرسالة فعليا. يبدو غريبا ألا أكتب لكما، لذا سأستمر في كتابتها على أي حال. ربما أستطيع أن أريكما إياها يوما ما.\n\nأطيب التحيات،\n- سونيا
journal.document.sewers_guard.dangerous.title=منصب خطر...
journal.document.sewers_guard.dangerous.body=88 من الخريف، 375\nعزيزي أمي وأبي،\n\nأفهم الآن لماذا الأجر جيد جدا، الصهاريج موبوءة بالوحوش! 'الهوام' و'الخارجون على القانون' هم جرذان عملاقة متعطشة للدماء وقطعان من الغنول الغاضبين.\n\nلحسن الحظ بقية فريقي يعرفون حقا ما يفعلونه. قائد فريقنا، توماس، خبير في هذا. أحاول التعلم بسرعة حتى لا أكون عبئا كبيرا.\n\nهذا العمل أخطر بكثير مما ظننت. أنا سعيدة أنني لا أستطيع إرسال هذه الآن، لا أريدكما أن تقلقا.\n\nسأحافظ على سلامتي،\n- سونيا
journal.document.sewers_guard.crabs.title=سرطانات عملاقة!
journal.document.sewers_guard.crabs.body=11 من الشتاء، 376\nعزيزي أمي وأبي،\n\nكأن الجرذان لم تكن سيئة بما يكفي، في الأسفل أكثر توجد سرطانات عملاقة! واحد منها اندفع متجاوزا إياي وأصاب لي بشدة قبل أن نقتله. توماس يقول إنه ليس خطئي، لكنني أعرف أنه يحاول فقط أن يكون لطيفا معي.\n\nلحسن الحظ، في طريق خروجنا صادفنا مغامرا عنده بعض مرهم عشب الشمس الاحتياطي. لي ربما لم يكن لينجو دون ذلك الشيء.\n\nرأيت المغامر يحدق في وردة قبل أن يغادروا، قالوا إنها هدية. لماذا يخاطر أحد بحياته هنا إن كان أحد يهتم به كثيرا هكذا؟\n\nهذا بالضبط ما أفعله أليس كذلك؟ أشعر أنني فوق رأسي في هذا.
journal.document.sewers_guard.guild.title=نقابة اللصوص
journal.document.sewers_guard.guild.body=23 من الشتاء، 376\nعزيزي أمي وأبي،\n\nلا وحوش جديدة هذه المرة، بدل ذلك صادفنا مجموعة صغيرة من نقابة اللصوص أثناء الدورية.\n\nكل ما سمعته عن النقابة سيئ، لكن بقية فريقي بدوا ودودين تقريبا معهم. توماس تبادل المعلومات والإمدادات مع أحدهم قبل أن نفترق.\n\nلا أفهم، ألم يكن من المفترض أن نتخلص من الخارجين على القانون؟ توماس حتى قال ألا نذكر هذا لأي أحد في القيادة. معلوماتهم وإمداداتهم كانت مفيدة جدا رغم ذلك، ولم نكن نستطيع تحمل قتال أكثر.\n\nأظننا جميعا في هذا معا هنا في الأسفل.
journal.document.sewers_guard.lost.title=لقد ضللنا
journal.document.sewers_guard.lost.body=40 من الشتاء، 376\n\nتوماس وأنا ضائعان. دُفعنا بعيدا عن بقية الفريق أثناء قتال بعض الغنول. لا أحد منا مصاب، لكن الصهاريج السفلية كالمتاهة.\n\nتوماس يقول إنه يعرف طريقا للخروج، لكنه يبدأ من مدخل السجن القديم في قاع الصهاريج. لا أحب النزول أعمق حقا، لكن ليس عندنا حصص والذهاب للأسفل أسرع بكثير من التجوال بحثا عن طريق دوريتنا.\n\nسيكون الأمر على ما يرام. توماس يعرف ما يفعله.
journal.document.sewers_guard.not_worth.title=الأمر لا يستحق
journal.document.sewers_guard.not_worth.body=توماس وأنا صادفنا وحش وحل ضخما ما عند مدخل السجن. قبل أن نستطيع رد الفعل قصفنا بالسحر. توماس تلقى معظمه. لقد رحل.\n\nلا مبلغ من المال يستحق هذا. سأغادر عبر الطريق الذي أخبرني به توماس. ثم سآخذ ما كسبته كحارسة وأستعمله لنقل والديّ وأنا بعيدا عن هذه المدينة الملعونة. جزء مني يريد أن يأمل أن للملك خطة لكل هذا، لكنني أشك.\n\nأترك هذه الرسائل خلفي كتحذير للآخرين. الأمر أكثر من مجرد جرذان وسرطانات عملاقة، شيء ما خاطئ جدا هنا في الأسفل.
journal.document.prison_warden.discover_hint=يمكنك إيجاد هذا النص في منطقة معينة، لكن فقط بعد إيجاد كل النصوص السابقة في هذه المجموعة.
journal.document.prison_warden.journal.title=كتابة يوميات
journal.document.prison_warden.journal.body=1 من الربيع، 362\n\nهذا هو المدخل الأول في يوميات عمل آمرة السجن كيانا سميث. مع كل ما يحدث مؤخرا، قررت بدء يوميات لترتيب أفكاري.\n\nإدارة سجن على عمق نصف ميل تحت الأرض لم تكن سهلة أبدا، لكن مؤخرا يبدو أن نوعا من الاضطراب المنظم يحدث. النزلاء يتصرفون دون سبب ثم يرفضون تفسير لماذا.\n\nبعض الحراس بدأوا يقولون إن المكان مسكون. لا أستطيع ترك رجالي ينشرون الإشاعات، لكن لا أستطيع لومهم بالضبط على عدم الارتياح.\n- سميث
journal.document.prison_warden.recruits.title=مجندون جدد
journal.document.prison_warden.recruits.body=80 من الربيع، 362\n\nكما وُعدنا، وصل مجموعة من المجندين الجدد اليوم. يبدو الأمر كالمعتاد، بضعة واعدين وكثير من الجنود الذين يريدون الأجر فقط. مع ذلك، وجود كل هذه العضلات الجديدة سيساعد كثيرا مع نزلائنا المشاغبين مؤخرا.\n\nفي عمل كهذا من المهم معرفة من تستطيع الوثوق به. موظف جديد واحد، توماس، يبدو واعدا بشكل خاص. أحتاج كل مساعدة أستطيع الحصول عليها الآن، فإذا أدى جيدا سأرى بشأن ترقيته بسرعة.\n- سميث
journal.document.prison_warden.mines.title=إغلاق المناجم
journal.document.prison_warden.mines.body=54 من الشتاء، 363\n\nجاءت مجموعة من المهندسين من المدينة اليوم، قائلين إنهم هنا لإغلاق المدخل القديم للمناجم في الأسفل. أظن أن المدينة لا تريد إزعاج نفسها بصيانة الممر أكثر. لم أُبلّغ مسبقا، كالعادة.\n\nكبير مهندسيهم أخبرني أيضا بعض الهراء عن تسرب سحر الأقزام من المناجم. لا أصدق كلمة منه.\n\nالوضع تحت سيطرة أفضل بكثير مع طاقمنا الجديد، لكن جذر المشكلة لم يُعالج بعد. شيء ما يؤثر بالتأكيد في النزلاء هنا، وهدم بضعة جدران لن يغير ذلك.\n- سميث
journal.document.prison_warden.rotberry.title=نبتة توت العفن
journal.document.prison_warden.rotberry.body=23 من الخريف، 363\n\nتلقيت هدية جميلة من فيليكس اليوم. إنها شجيرة حمراء زاهية ما تسمى 'توت العفن'.\n\nذكرت له كيف أن هذا المكان كئيب من قبل، يبدو أنه كان يستمع. حسب كلامه هذه النبتة تكره الضوء والماء فعليا، لذا عليّ فقط تقليم الأوراق مرة في الشهر أو نحو ذلك. التقليم لا بد أنه مهم رغم ذلك، فقد ذكره عشرات المرات في رسالته.\n\nبالطبع، فيليكس لا يفعل شيئا مجانا أبدا. يقول إن البذور التي تنتجها هذه ممتازة لصنع العصي، لذا من الطبيعي أن أدين له ببعضها كلما أنتجت النبتة بعضا.\n- سميث
journal.document.prison_warden.no_support.title=لا دعم
journal.document.prison_warden.no_support.body=11 من الربيع، 364\n\nما الذي تفكر فيه المدينة بحق الجحيم؟ بعد طلبي المساعدة بشكل عاجل لم أسمع شيئا، ولا حتى اعتذارا فارغا كما يرسلون عادة عندما تُرفض طلباتي.\n\nفي هذه الأثناء يستمر النزلاء في السوء، وبعض الحراس حتى بدأوا يسببون المتاعب. هل يخططون لترك هذا يستمر في السوء حتى نتعامل مع شغب!؟\n\nتوماس بقي موثوقا كما هو دائما على الأقل. مساعدته التنظيمية كانت لا تقدر بثمن، وفكرته في تفعيل وحدات AE-100 القديمة تلك كانت مؤسفة لكن ضرورية. أنا واثقة أنني أستطيع العودة إلى قمة هذا الوضع، أحتاج فقط بعض الدعم اللعين!\n-سميث
journal.document.prison_warden.letter.title=رسالة إلى توماس
journal.document.prison_warden.letter.body=توماس،\n\nلقد كنت صديقا عظيما، لذا أقدم لك معروفا.\n\nعندما تبدأ مناوبتك الليلة، اقفل وعزز زنزانة حارس السلاسل، وارمِ المفتاح في مكان منعزل ما، واخرج. لا يهم إن كان السجناء الآخرون دون مراقبة، قريبا جدا لن يستطيع أحد مغادرة هذا المكان. ذلك المسخ يجب أن يبقى محبوسا رغم ذلك، إن هرب فلا أحد يعلم ما سيفعله.\n\nلا تخبر أحدا بهذا، ولا تتعب نفسك بالبحث عني. القبطان يجب أن يغرق مع سفينته.\n- كيانا
journal.document.caves_explorer.discover_hint=يمكنك إيجاد هذا النص في منطقة معينة، لكن فقط بعد إيجاد كل النصوص السابقة في هذه المجموعة.
journal.document.caves_explorer.expedition.title=بداية البعثة!
journal.document.caves_explorer.expedition.body=1 من الصيف، 308\n\nاليوم تبدأ بعثتنا ذات الأربعة أسابيع إلى مناجم الأقزام المهجورة! تم تكليفي من الملك نفسه باستكشاف المنطقة. أهدافي الرئيسية هي إيجاد أي موارد طبيعية غير مستغلة ومسح الكهوف لمشروع بناء سجن محتمل.\n\nبينما أنا قادر على الدفاع عن نفسي، قبلت مرافقة من حرس المدينة بإصرار الملك. إنهم مجموعة من البسطاء، لكن طالما لا يبطئونني فوجودهم محتمل.\n\nمن المتوقع أن نطهر الصهاريج ونصل إلى المناجم مساء.\n- أرشيبالد دروموند. كبير سحرة، المعهد الجنوبي للسحر.
journal.document.caves_explorer.gold.title=ذهب كثير جدا!
journal.document.caves_explorer.gold.body=4 من الصيف، 308\n\nأيامنا القليلة الأولى كانت مثمرة جدا حقا! بعد إقامة مخيم قاعدة، انطلقنا لاستكشاف بعض المناطق العليا من المنجم المهجور. بينما توجد فوضى عديمة الفائدة كثيرة تركها الأقزام، العديد من جدران الكهوف تعج بالذهب أيضا!\n\nللأسف، لسنا أول من هنا. الكهوف مليئة بحياة برية عدوانية، ويبدو أن قطعان الغنول مهتمة بالذهب أيضا. أعترف أنني كنت غير عادل تجاه مرافقة حرسي، لقد كانوا مستكشفين وحراسا شخصيين أكفاء أكثر بكثير مما توقعت.\n\nحتى مع هذا النجاح، ما زال عندنا الكثير من المناجم لاستكشافه.\n- أرشيبالد
journal.document.caves_explorer.troll.title=قابلت غولا
journal.document.caves_explorer.troll.body=11 من الصيف، 308\n\nبعد بدء استكشافنا في القسم الأوسط من المناجم، صادفنا وجها ودودا! حسنا... ودود نسبيا. غول كهوف أقام حدادة صغيرة هناك. إنه فظ وغير كثير الكلام، لكنه أصلح معداتنا مقابل بعض الذهب.\n\nللأسف، أخبرنا الحداد الغول أيضا أن كل هذا الذهب الجميل ليس جيدا تماما كما يبدو. يسميه 'الذهب المظلم' ويبدو أنه يتدهور بسرعة في ضوء الشمس. ذلك يفسر بالتأكيد لماذا لم تكن هناك نزاعات على الموارد هنا أبدا.\n\nأظننا نحتاج التعمق قليلا أكثر لنرى إن كان هناك أي شيء أكثر قيمة.\n- أرشيبالد
journal.document.caves_explorer.city.title=مدخل المدينة
journal.document.caves_explorer.city.body=21 من الصيف، 308\n\nنحن الآن عند علامة الأسابيع الثلاثة، وبعد قضاء معظم الأيام العشرة الماضية في رسم خرائط أعمق فأعمق، وصلنا أخيرا إلى قاع المناجم. وجدنا أدوات معدنية متنوعة وبوابة عظيمة تسد الدخول إلى مدينة الأقزام القديمة الكبرى.\n\nحذرنا الحداد من بعض هذه الآلات. كانت مخصصة على ما يبدو للدفاع عن المنطقة ولها ميل للتفعيل عند إزعاجها. ليس لنا عمل في المدينة، والمعدن قيمته كخردة ستكون ضئيلة، ففكرنا أن من الأفضل اتباع تحذيره والتوجه خارجا.\n\nيجب أن أعترف أنني كنت فضوليا، لكن التحقيق هناك لم يكن يستحق الخطر بالتأكيد.\n- أرشيبالد
journal.document.caves_explorer.alive.title=إنه حي!
journal.document.caves_explorer.alive.body=23 من الصيف، 308\n\nإحدى آلات الأقزام عادت إلى الحياة بطريقة ما! كنا فقط نمر بجانبها عندما اندفعت وكادت تسحق اثنين من مجموعتنا بقبضتيها المعدنيتين الضخمتين. لحسن الحظ، كنت أحمل عصا التفكيك معي. بضعة انفجارات موجهة جيدا من تلك وحُوّل الشيء الوحشي إلى خردة معدنية.\n\nما يزعجني أننا لم نفعل أي شيء على الإطلاق لاستفزاز الآلة. لا يمكن أن الأقزام صمموا الآلات لتكون عدوانية هكذا، كأنها كانت تحاول مباغتتنا!\n\nعلى الأقل استطعت تقديم بعض المساعدة لرفاقي هذه المرة.\n- أرشيبالد
journal.document.caves_explorer.report.title=التقرير النهائي
journal.document.caves_explorer.report.body=28 من الصيف، 308\n\nاليوم سننهي تعبئة أمتعتنا ونستعد للمغادرة. في الوقت المناسب أيضا، فقد بدأ العديد من مجموعتنا يعانون من كوابيس رهيبة بعد حادثة الآلة العدوانية. إنه على الأرجح مجرد إرهاق، لكن كوابيسهم كلها متشابهة بشكل مقلق.\n\nباختصار، المناطق العليا من المنجم آمنة تماما. إذا وُجد استعمال للذهب المظلم فقد يكون تنقيبه مربحا جدا. المساحات المفتوحة الكبيرة ستناسب خطط بناء المدينة جيدا جدا أيضا. المناجم السفلية أكثر خطورة رغم ذلك، ويجب تفاديها.\n\nسأكتب كل هذا في تقريري النهائي على مدى الأيام القليلة القادمة.\n- أرشيبالد
journal.document.city_warlock.discover_hint=يمكنك إيجاد هذا النص في منطقة معينة، لكن فقط بعد إيجاد كل النصوص السابقة في هذه المجموعة.
journal.document.city_warlock.old_king.title=الملك مات
journal.document.city_warlock.old_king.body=إنه اليوم 5 من الشهر 2 من السنة 33 من عصر السحر. إذا كان أحد من العالم العلوي يقرأ هذا، فإنه في وقت ما من شتاء 264. اسمي ثيمور زاهر، وحسب أفضل معرفتي أنا آخر عضو ناجٍ من بلاط الأقزام.\n\nملكنا مات، استُبدل بأحد زملائي السابقين الذي جن بالسلطة. بقية البلاط خضعوا له، كالبلهاء الذين هم، وفقدوا إرادتهم الحرة في العملية. أنا وحدي رأيت هذا قادما وهربت قبل أن يكتمل طقوسه.\n\nالدائرة الداخلية سقطت، لكن سلطة الملك الجديد لم تصل إلى الجميع بعد. يجب أن أقيم مقاومة بأسرع ما يمكن. أرفض ترك حضارتنا المجيدة تسقط لهذا المهووس بالعظمة!
journal.document.city_warlock.resistance.title=مقاومة
journal.document.city_warlock.resistance.body=يبدو أن الكلمة انتشرت بسرعة. لم تمر سوى بضعة أيام وقد جمعت جيشا صغيرا من الموالين للملك القديم. قليلون مهرة بالسحر، لكن نظام الرهبان المحاربين كله تقريبا معنا. يجب أن نكون أكثر من ندٍّ لقزم مجنون واحد وبلاطه من العبيد.\n\nفي هذه الأثناء اختبأ الملك الجديد في الغرف الداخلية لمدينتنا. لا شك أنه أنفق معظم سلطته ويأمل أن يستعيدها قبل أن يواجه مقاومة أكثر.\n\nسنشنّ هجومنا في غضون ساعتين أخريين. بحظنا سنستطيع تشكيل مجلس مؤقت وإعادة مدينتنا الرائعة إلى الاستقرار بنهاية الليلة.
journal.document.city_warlock.failure.title=فشل
journal.document.city_warlock.failure.body=يبدو أنني أبله أيضا. افترضت أن الملك الجديد احتاج البلاط ليخضعوا له طوعا، لكنني أرى الآن أن عنده السلطة للتحكم حتى فيمن يقاومونه.\n\nجلبت أعمىً كل المعارضة الأقوى إلى عتبة بابه حتى يستطيع شخصيا تحويلهم إلى عبيده. الآن موجات من طاقته النخرية تجتاح المدينة، محوّلة معظمهم فورا إلى خاضعين له.\n\nالقليلون الذين ما زالت عندهم إرادة حرة يهربون. اخترت البقاء خلفهم للمراقبة بأفضل ما أستطيع والبحث عن ثغرة. بالقوة السحرية التي عندي يجب أن أستطيع البقاء مخفيا وآمنا لبعض الوقت.
journal.document.city_warlock.more_powerful.title=أقوى
journal.document.city_warlock.more_powerful.body=تتبع الوقت أصبح صعبا، لكن مر أسبوع تقريبا منذ مدخلي الأخير. حضارتنا انهارت حقا. البوابات مغلقة، كل وظائف مجتمعنا توقفت، وقشور أقزام فارغة تتجول في القاعات.\n\nخلال كل هذا، بطريقة ما، الملك الجديد يصبح أقوى حتى. كل يوم قوة إرادته تصبح أقوى، لكنها تتغير أيضا. لا أستطيع وصفها، لكن يبدو كأنه لم يعد قزما على الإطلاق.\n\nأبدأ في تقبل أن أفضل ما أستطيع أن آمله على الأرجح هو توثيق هذه الأحداث. سأبقى هنا قدر ما أستطيع، ثم سأنسحب حين تبدأ إرادتي بالضعف.
journal.document.city_warlock.new_power.title=قوة جديدة
journal.document.city_warlock.new_power.body=ماذا يحدث هنا؟ القوة المنبعثة من الملك الجديد مختلفة فعلا عن البداية، لكن يوجد شيء آخر أيضا. هذه القوة الجديدة تبدو مشعة من أعمق قاعات مدينتنا.\n\nالأكثر إثارة للحيرة أن النشاط في المدينة العليا تناقص أيضا. لا أعرف ما يحدث هناك في الأسفل، لكنه يجذب تقريبا كل انتباه الملك الجديد.\n\nالعودة إلى القاعات العميقة ستكون خطرة، لكن يجب أن أكتشف ما يسبب هذا التغيير. ربما الملك الجديد عنده نقطة ضعف في النهاية؟
journal.document.city_warlock.seen_it.title=لقد رأيته
journal.document.city_warlock.seen_it.body=لقد رأيت ما يكمن في الأسفل، لكنني لا أستطيع وصفه. يداي ترتجفان بشكل لا يمكن التحكم فيه وأنا أحاول وضع أفكاري في الكتابة.\n\nلماذا يحدث هذا؟ هل فعل الملك الجديد هذا؟ لا معنى لذلك. ربما استعماله المتهور للسلطة جذبه؟ كنت آمل أن أنقذ حضارتنا، لكنني أرى الآن أن العالم كله في خطر.\n\nبطريقة ما، الملك هو الشر الأصغر. ليس عندي خيار آخر، من أجل الصالح الأكبر سأستسلم. أرجو أن ترشدني يا ملكي، استعملني كأداة لإبقاء الظلام المختوم بعيدا!
journal.document.halls_king.discover_hint=يمكنك إيجاد هذا النص في منطقة معينة، لكن فقط بعد إيجاد كل النصوص السابقة في هذه المجموعة.
journal.document.halls_king.rejection.title=الرفض
journal.document.halls_king.rejection.body=حمقى!\n\nعلى مدى 33 سنة الماضية ازدهرت مملكتنا بتقنيتنا السحرية الجديدة. تعلمنا كيف نستدعي الأرواح العنصرية ونخضعها لإرادتنا، لكن بطريقة ما الآن المزيد من التجارب 'خطير جدا'.\n\nأعرف ما يحدث حقا. رفض نظرياتي لا علاقة له بجدواها وكل العلاقة بالشخص الذي يقترحها. إنهم على الأرجح يضحكون عليّ خلف ظهري جميعا.\n\nحسنا لا مزيد! لا أهتم بما يقولون، سأستكشف أبعد أصقاع كوننا لوحدي، وأحتفظ بكل ما أكتشفه لنفسي!\n- ر.
journal.document.halls_king.amulet.body=لقد فعلتها!\n\nلم أكن أعرف ما قد أجده بالضبط، لكن ما اكتشفته هناك كان أبعد من أجرأ تكهناتي. قوة كثيرة جدا، جالسة هناك جاهزة للأخذ فقط، وكلها لي!\n\nبهذا لن يجرؤ أي من البلهاء في البلاط على معارضتي. أشعر بالدوار فقط من التفكير في كل الطرق المختلفة التي أستطيع إذلالهم بها. بحق الجحيم، لماذا أتوقف هناك، عندي قوة كافية لتدمير كل واحد منهم إن أردت! قد يكون ذلك مفرطا، لكن يجب ألا أطيل التفكير وإلا سيشتبهون.\n\nأظنني سأسمي هذه القوة العظمى تاج أطلس!\n- ر.
journal.document.halls_king.ritual.title=الطقوس
journal.document.halls_king.ritual.body=ثيمور واجهني علنا في وقت سابق اليوم وأصر أن أشرح مصدر قوتي الجديدة. صرفته بأفضل ما أستطيع، لكنني أشعر بعيون الحكم من بقية البلاط عليّ مرة أخرى.\n\nكنت آمل أن أقضي وقتا أطول قليلا في الاستمتاع بالهدوء قبل العاصفة، لكن لا يهم حقا. قررت ما أريد فعله. سأدعي أنني كسبت قوتي عبر طقس جديد، وسأعرض أداءه على السحرة الآخرين والملك. بعد انتهاء الطقس، سأكون الملك!\n\nثيمور سيحتج، بالطبع، لكن مع هذا الكم من القوة المعروضة أشك أنهم سيستمعون إليه!\n\nالكل سيخضع أمامي!\n- ملك الأقزام المستقبلي
journal.document.halls_king.new_king.title=ملك جديد
journal.document.halls_king.new_king.body=أنا الملك، أهاهاهاهاهااا!\n\nلقد تركوني أفعلها فقط! بمشقة إقناع بسيطة وافقوا على تركي 'أشارك' هذه القوة معهم في طقس عظيم. في لحظة تحولوا من جوقة أصوات ساخرة إلى بلاطي الجديد من الرعايا الصامتين!\n\nكما هو متوقع، هرب ثيمور كالجبان عند أول علامة متاعب. أستطيع الشعور بقوة المقاومة التي يبنيها أيضا. أظنني سأسمح له بالاستمرار، حتى يستطيع تسليم كل متآمريه إلى عتبة بابي مباشرة!\n\nمن الواضح أن المملكة لا تحترمني أيضا، أظنني سأصلح ذلك أيضا.\n- ملك الأقزام
journal.document.halls_king.thing.title=الشيء
journal.document.halls_king.thing.body=توجد مشكلة. تم القضاء على ثيمور دون جهد، لكن يبدو أن بحثي في المستويات الخارجية لم يمر دون ملاحظة.\n\n'شيء' ما... جُذب إلى عالمي وبدأ يفرض نفسه عبرا في قاع القاعات السفلية. لتعقيد الأمور أكثر، ذلك هو الموقع بالضبط حيث خزنت التاج! مخلوق حاقد كهذا، لماذا يجب أن يحاول حرماني من قوتي وهناك الكثير في الخارج ما زال للأخذ؟\n\nرغم قوتي رغم ذلك، لا أظن أنني أستطيع فقط الاندفاع وقتاله. قوته الحقيقية لا يمكن تصورها، لكن لا بد أن هناك طريقة ما للحد منها. سأدافع عن جائزتي!
journal.document.halls_king.attrition.title=الاستنزاف
journal.document.halls_king.attrition.body=عندي خطة للتعامل مع الشيء. قوته لا نهائية، لكن قدرته على التوسع في هذا العالم ليست كذلك. إنه يعتمد على أتباع وأفاتارات لتنفيذ إرادته بينما يحاول بناء قوة كافية للاستيلاء على التاج.\n\nبينما لا أملك التاج جسديا ما زال عندي تحكم كامل في قوته. مع مدينة الأقزام كلها تحت تصرفي عندي أفضلية عددية أيضا. أستطيع فقط الاستمرار في إرسال جنود لمنعه من الاستيلاء على التاج وربح هذه الحرب باطراد عبر الاستنزاف!\n\nأنا، رودني، ملك الأقزام، سأصمد أكثر منك أيها الظلام المختوم!
