actors.blobs.stenchgas.desc=سحابة من نتانة عفنة تدور هنا.
actors.blobs.stormcloud.name=سحب العاصفة
actors.blobs.stormcloud.desc=سحابة من بخار ماء متموج تدور هنا.
actors.blobs.toxicgas.name=غاز سام
actors.blobs.toxicgas.desc=سحابة خضراء من غاز سام تدور هنا.
