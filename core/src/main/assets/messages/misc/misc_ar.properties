challenges.no_food=في حمية
challenges.no_food_desc=الطعام نادر أصلا، لكن عليك أن تراقب حصصك أيضا!\n\n- الطعام وقرن الوفرة فعاليتهما ثلث المعتاد في إشباع الجوع\n- مصادر الإشباع الأخرى غير متأثرة
challenges.no_armor=الإيمان درعي
challenges.no_armor_desc=ستحتاج الإيمان بنفسك، فذاك درعك لن يفعل الكثير!\n\n- قوة الصد الأساسي مخفضة لكل الدروع عدا القماش\n- كل الدروع تكسب صدا قليلا جدا عند الترقية\n- قوة دفاع حارس الأرض مخفضة بشكل مهم أيضا
challenges.no_healing=رهاب الأدوية
challenges.no_healing_desc=جرعات الشفاء مفيدة حقا، لكنك للأسف مصاب بحساسية!\n\n- جرعات الشفاء، والأغراض التي تستعمل جرعات الشفاء في وصفتها، وفاكهة الشمس ستسمم البطل بدل شفائه\n- المزائج غير المستقرة لا تستطيع تسميم البطل أو شفاءه عشوائيا\n- هذه الأغراض ما زالت تعمل عادة على الشخصيات الأخرى.
challenges.no_herbalism=أرض قاحلة
challenges.no_herbalism_desc=يبدو أنه لم يبق ماء نظيف في هذه السراديب الملعونة...\n\n- قطرات الندى محذوفة\n- النباتات محذوفة\n- البذور ما زالت تظهر، لكنها لن تتجذر
challenges.swarm_intelligence=ذكاء السرب
challenges.swarm_intelligence_desc=احذر، وحوش السراديب أصبحت أذكى!\n\n- بينما يراك الأعداء أو يرون حلفاءك، سيجذبون أعداء آخرين قريبين إلى موقعك.\n- مدى هذا يبدأ بمربعين فقط، لكنه ينمو بمربعين في كل دور يراك فيه العدو، حتى 12.\n- كسر الرؤية يعيد تعيين مدى الجذب، ولو للحظة كما مع باب.
challenges.darkness=إلى الظلام
challenges.darkness_desc=إنها سراديب في النهاية!\n\n- مسافة الرؤية العادية مخفضة بشكل كبير\n- يظهر مشعل في كل طابق\n- مصادر الضوء الأخرى فعاليتها الخمس
challenges.no_scrolls=رونية محرمة
challenges.no_scrolls_desc=رونية معينة أصعب في الإيجاد. للأسف، دائما هي الأكثر فائدة.\n\n- نصف مخطوطات ترقية السراديب محذوفة
challenges.champion_enemies=أبطال عدائيون
challenges.champion_enemies_desc=لست الوحيد الذي يستطيع الارتقاء!\n\nالأعداء العاديون لديهم فرصة 1/8 للظهور بتعزيز بطل خاص في الطابق 1، تصعد إلى 1/6 في الطابق 21.\n\n- النصلان التوأم يستيقظان إن ظهرا نائمين\n- البطل يعرف متى يظهر بطل\n- النصلان التوأم لا يمكن تحويلهما إلى حلفاء\n\nتوجد ستة أنواع من الأعداء الأبطال:\n_ملتهب (برتقالي):_ +25% ضرر اشتباك، يشعل عند الضربة، ينشر النيران عند الموت، لا يستطيع إشعال مربعات الماء\n_ممتد (بنفسجي):_ +25% ضرر اشتباك، +3 مدى اشتباك\n_ضد السحر (أخضر):_ -50% ضرر متلقى، محصن ضد الآثار السحرية\n_عملاق (أزرق):_ -80% ضرر متلقى، +1 مدى اشتباك، لا يستطيع دخول الأنفاق\n_مبارك (أصفر):_ دقة ومراوغة ×4\n_نامٍ (أحمر):_ +20% دقة ومراوغة وضرر وصحة فعلية. يزداد بنسبة 1% كل 4 أدوار.
challenges.stronger_bosses=زعماء أشرس
challenges.stronger_bosses_desc=الزعماء أصعب بكثير مع هذا التحدي!\n\n_سيد الوحل:_ +20% صحة\n_-_ الشفاء في الماء يتصاعد، حتى 3/دور\n_-_ ينتفخ في دور واحد بدل 2\n_حارس السلاسل:_ +25% صحة\n_-_ المرحلة 1: الفخاخ أفتك بكثير\n_-_ المرحلة 2: القدرات أكثر تكرارا\n_AE-300:_ +33% صحة\n_-_ الصواري أصلب و3 تتفعل\n_-_ القدرات أقوى وأكثر تكرارا\n_-_ الـ AE-300 أسرع وهو فائق الشحن\n_-_ الأسلاك المكشوفة ضعف الشيوع\n_الملك المدفون:_ +50% صحة\n_-_ الأتباع أقوى في كل المراحل\n_-_ المرحلة 1: قدرات واستدعاءات أسرع\n_-_ المرحلة 2: تبعان إضافيان في كل جولة\n_-_ المرحلة 3: صحة ×2، استدعاءات أسرع\n_الظلام المختوم:_\n_-_ تُستدعى قبضتان في وقت واحد!\n_-_ +60% ضرر الليزر\n_-_ أتباع أقوى
pacts.open_map=عهد الخريطة المكشوفة
pacts.open_map_desc=عهد أطلس. اختر حتى 3 عهود في الجولة.\n\n_النعمة:_ ينكشف لك تخطيط كل طابق كاملًا عند دخوله.\n\n_الثمن:_ الأعداء يلحقون بك ضررًا أكبر بنسبة 15%.
pacts.buried_hoard=عهد الكنز المدفون
pacts.buried_hoard_desc=عهد أطلس. اختر حتى 3 عهود في الجولة.\n\n_النعمة:_ تجد ذهبًا أكثر بنسبة 50% من كل مصدر.\n\n_الثمن:_ أسعار المتاجر أعلى بنسبة 30%.
pacts.thorns=عهد الشوك
pacts.thorns_desc=عهد أطلس. اختر حتى 3 عهود في الجولة.\n\n_النعمة:_ يرتد على المهاجم 25% من ضرر الاشتباك الذي يلحقه بك.\n\n_الثمن:_ جرعات الشفاء تستعيد صحة أقل بنسبة 25%.
pacts.hungry_dark=عهد الظلام الجائع
pacts.hungry_dark_desc=عهد أطلس. اختر حتى 3 عهود في الجولة.\n\n_النعمة:_ الجوع ينمو أبطأ بنسبة 50%.\n\n_الثمن:_ مدى رؤيتك ينقص بخانتين.
pacts.glass=عهد الزجاج
pacts.glass_desc=عهد أطلس. اختر حتى 3 عهود في الجولة.\n\n_النعمة:_ تلحق ضررًا أكبر بنسبة 25%.\n\n_الثمن:_ تتلقى ضررًا أكبر بنسبة 25%.
pacts.cartographer=عهد عين الخرائطي
pacts.cartographer_desc=عهد أطلس. اختر حتى 3 عهود في الجولة.\n\n_النعمة:_ الأبواب السرية والفخاخ في حدود 6 خانات منك تنكشف لك.\n\n_الثمن:_ تكتسب خبرة أقل بنسبة 15%.
pacts.iron_patience=عهد الصبر الحديدي
pacts.iron_patience_desc=عهد أطلس. اختر حتى 3 عهود في الجولة.\n\n_النعمة:_ كل ضربة تتلقاها ينقص ضررها بمقدار 2.\n\n_الثمن:_ هجماتك تستغرق وقتًا أطول بنسبة 15%.
pacts.gambler=عهد تاج المقامر
pacts.gambler_desc=عهد أطلس. اختر حتى 3 عهود في الجولة.\n\n_النعمة:_ الصناديق لديها فرصة 25% لاحتواء غنيمة مضاعفة.\n\n_الثمن:_ المقلّدون (الميميك) يختبئون في الصناديق أكثر بكثير.
rankings$record.something=قتله شيء ما
rankings$record.won=حصل على تاج أطلس
rankings$record.ascended=صعد بالتاج!

utils.atlasseeds.crown_bonus=يمنحك تاج أطلس 150 قطعة ذهبية إضافية!
utils.atlasseeds.dawn_bonus=يمنحك فجر أطلس مشعلاً إضافياً وبذرة عشب الشمس!
