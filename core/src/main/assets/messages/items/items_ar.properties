items.heap.tomb=قبر
items.heap.tomb_desc=هذا القبر القديم قد يحتوي على شيء مفيد، لكن مالكه سيعترض بالتأكيد على التحقق.
items.heap.skeleton=بقايا هيكلية
items.heap.skeleton_desc=هذا كل ما تبقّى من مغامر تعيس. ربما يستحق التحقق من أي نفائس.
items.heap.remains=بقايا البطل
items.heap.remains_desc=هذا كل ما تبقّى من أحد أسلافك. ربما يستحق التحقق من أي نفائس.
items.honeypot.name=قدر عسل
items.honeypot.ac_shatter=حطّم
items.honeypot.desc=قدر العسل الكبير هذا مدهون بالعسل فقط في الواقع، بدل ذلك يضم نحلة عملاقة! هذه الأنواع من النحل الضخم عادة تبقى في خلاياها، ربما القدر نوع من قفص صياد متخصص؟ النحلة تبدو راضية تماما داخل القدر بعسلها، وتطنّ عليك بحذر عندما تنظر إليها.
items.honeypot$shatteredpot.name=قدر عسل محطم
items.honeypot$shatteredpot.desc=القدر تم تحطيمه، فقط العسل اللزج الذي يدهن حيطانه يمسكه معًا، وهو يتفكّك ببطء.\n\nرغم حالته المحطمة، النحلة ما زالت تريد حماية القدر على ما يبدو.
