scenes.heroselectscene.daily_desc=كل يوم تتوفر لعبة جديدة متماثلة للجميع! هذه 'المحاولة اليومية' تولّد نفس السراديب لكل من يلعبها (ما دام يلعب نفس إصدار اللعبة).\n\nيمكنك أخذ ما تشاء من الوقت لإتمام محاولة يومية، لكن لا يمكنك امتلاك إلا واحدة نشطة في كل مرة. _المحاولات اليومية غير مؤهلة للشارات ولها صفحة ترتيب خاصة بها._\n\nهل تريد بدء محاولة اليوم بالبطل والتحديات المختارة حاليا؟
scenes.heroselectscene.daily_yes=نعم
scenes.heroselectscene.daily_no=لا
scenes.heroselectscene.daily_repeat=لقد لعبت محاولة اليوم بالفعل. يمكنك إعادتها إن شئت، لكن كمحاولة تدريبية غير مصنفة فقط.\n\nبعد إتمام الإعادة، ستتمكن من رؤيتها من نافذة الترتيب اليومي لفترة قصيرة قبل حذف السجل.\n\nهل تريد إعادة محاولة اليوم بالبطل والتحديات المختارة حاليا؟
scenes.heroselectscene.daily_unavailable_long=يبدو أنك بدأت محاولة يومية من المستقبل! قد يحدث هذا إن غيّرت منطقتك الزمنية مؤخرا، أو غيّرت ساعة نظامك. _محاولتك اليومية التالية ستتوفر بعد %d أيام._
scenes.heroselectscene.daily_existing=لديك محاولة يومية جارية بالفعل. يجب إنهاؤها قبل بدء أخرى.
scenes.heroselectscene.daily_nowin=كل يوم تتوفر لعبة جديدة متماثلة للجميع! هذه 'المحاولة اليومية' تولّد نفس السراديب لكل من يلعبها (ما دام يلعب نفس إصدار اللعبة).\n\n_يجب أن تفوز بلعبة واحدة على الأقل قبل أن تتمكن من لعب المحاولات اليومية._
scenes.heroselectscene.custom_seed_title=أدخل بذرة مخصصة
scenes.heroselectscene.custom_seed_desc=تستعمل اللعبة رمزا بذريا لتوليد السراديب، نفس البذرة وإصدار اللعبة يولّدان دائما نفس السراديب! _ألعاب البذرة المخصصة لا يمكنها كسب الشارات ولا تساهم في الألعاب الملعوبة، وتظهر في أسفل صفحة الترتيب._
scenes.heroselectscene.custom_seed_duplicate=لديك لعبة عادية جارية بتلك البذرة بالفعل. يجب إنهاؤها قبل استعمال تلك البذرة المخصصة.
scenes.heroselectscene.custom_seed_nowin=تستعمل اللعبة رمزا بذريا لتوليد السراديب، نفس البذرة وإصدار اللعبة يولّدان دائما نفس السراديب!\n\n_يجب أن تفوز بلعبة واحدة على الأقل قبل أن تتمكن من إدخال بذور مخصصة._
