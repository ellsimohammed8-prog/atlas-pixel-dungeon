items.weapon.missiles.shuriken.name=شوريكن
items.weapon.missiles.shuriken.stats_desc=الشوريكن يمكن أن تُرمى فورا بفترة تبريد 20 دورا.
items.weapon.missiles.shuriken.desc=هذه القطع المعدنية على شكل نجمة بشفرات حادة كالشّعرة يمكن رميها بسرعة أثناء الحركة.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=فترة تبريد الشوريكن
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=لقد رميت مؤخرا شوريكن فورا، وعليك الانتظار قبل فعل ذلك من جديد. الشوريكن يمكن أن تُرمى ما زال، لكن بسرعة سلاح عادية.\n\nالأدوار المتبقية: %s.
items.weapon.missiles.throwingclub.name=هراوة رمي
items.weapon.missiles.throwingclub.stats_desc=هذا السلاح لا يلتصق بالأعداء ويمكن جمعه فورا.
items.weapon.missiles.throwingclub.desc=سلاح مرمي بسيط إلى حد ما لكن متين، في جوهره صخرة كبيرة مربوطة بعصا.
items.weapon.missiles.throwinghammer.name=مطرقة رمي
items.weapon.missiles.throwinghammer.stats_desc=هذا السلاح لا يلتصق بالأعداء ويمكن جمعه فورا.
items.weapon.missiles.throwinghammer.desc=هذه المطارق الثقيلة صُمّمت لتُرمى نحو عدو. بناؤها المعدني بالكامل الأملس يعني أنها متينة تماما.
items.weapon.missiles.throwingknife.name=سكين رمي
items.weapon.missiles.throwingknife.stats_desc=هذا السلاح أقوى ضد الأعداء غير المدركين.
items.weapon.missiles.throwingknife.desc=هذه السكاكين الخفيفة الوزن موزونة للتقوّس عبر الهواء مباشرة إلى هدفها.
