items.weapon.melee.handaxe.desc=فأس خفيف، يُستعمل عادة لقطع الأشجار. النصل الواسع يعمل جيدا ضد الأعداء أيضا.
items.weapon.melee.katana.name=كاتانا
items.weapon.melee.katana.stats_desc=هذا السلاح يصدّ 0-3 ضرر.
items.weapon.melee.katana.ability_name=اندفاع
items.weapon.melee.katana.typical_ability_desc=نصل السموم تستطيع _الاندفاع_ بكاتانا نحو عدو على بعد مربع واحد. هذا يتحرك نحو العدو، عادة يسبب _%1$d-%2$d ضرر_، وهو مضمون الإصابة.
items.weapon.melee.katana.ability_desc=نصل السموم تستطيع _الاندفاع_ بكاتانا نحو عدو على بعد مربع واحد. هذا يتحرك نحو العدو، يسبب _%1$d-%2$d ضرر_، وهو مضمون الإصابة.
items.weapon.melee.katana.desc=سيف رفيع بحارس معدني كبير فوق المقبض.
