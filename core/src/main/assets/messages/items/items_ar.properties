items.weapon.missiles.missileweapon.break_upgraded_warn_desc=إن انكسر آخر سلاح مرمي في كوم أسلحتك المرماة المعزز، فالكوم سيضيع بشكل دائم. هل أنت متأكد أنك تريد رميه؟
