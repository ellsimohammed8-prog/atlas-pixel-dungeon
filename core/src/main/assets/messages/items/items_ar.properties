items.liquidmetal.already_fixed=ذلك السلاح المرمي في حالة مثالية أصلا!
items.liquidmetal.apply=أنت تستعمل %d معدن سائل لإصلاح سلاحك المرمي.
items.liquidmetal.desc=هذا السائل السحري يمكن أن يملأ الشقوق والتمزّقات على سلاح مرمي، يعيده إلى حالة مثالية! إن كان كوم أسلحة يفتقد سلاحا لكنه مُصلح بالكامل في غير ذلك، فالمعدن السائل يمكن حتى أن يُستعمل لاستبدال سلاح مفقود من الكوم!\n\nسلاح من الفئة 1 يتطلب 10 معدن سائل ليُصلح بالكامل، سلاح من الفئة 5 يتطلب 30. كل ترقية تزيد أيضا كمية المعدن اللازمة بمقدار 35%.\n\nالمعدن السائل لا يمكن استعماله لإصلاح الرؤوس على الأسهم المروّسة.
items.liquidmetal.discover_hint=تستطيع صنع هذا الغرض عبر الكيمياء.
items.lostbackpack.name=حقيبة ظهر مفقودة
items.lostbackpack.desc=هذا مخزونك المفقود. اجمعه لاستعادة كل الأغراض التي فقدتها!
items.merchantsbeacon.name=منارة التاجر
items.merchantsbeacon.ac_use=استعمل
items.merchantsbeacon.desc=هذه القطعة الغريبة من تقنية الأقزام تتيح لك التواصل من مسافات عظيمة.\n\nبعد التفعيل، هذه المنارة ستتيح لك بيع الأغراض إلى متجر بيكسل من أي مكان في السراديب.\n\nمع ذلك، السحر داخل المنارة سيدوم لجلسة واحدة فقط، لذا استعمله بحكمة.
items.stylus.name=قلم غامض
items.stylus.ac_inscribe=انقش
items.stylus.prompt=اختر درعا
items.stylus.identify=يجب أن تعرّف ما إذا كان ذلك الدرع ملعونا أولا.
items.stylus.cursed=سحر القلم لن يعمل على درع ملعون.
items.stylus.inscribed=لقد نقشت درعك بالقلم.
items.stylus.desc=هذا القلم الغامض مصنوع من حجر مظلم، صلب جدا. باستعماله تستطيع نقش رمز سحري على درعك، لكن ليست عندك قدرة على اختيار أي رمز سيكون، القلم سيقرّر عنك.
