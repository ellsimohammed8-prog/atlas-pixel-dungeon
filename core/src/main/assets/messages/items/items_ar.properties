items.artifacts.masterthievesarmband.desc=عصابة ذراع المخمل الأرجوانية تحمل علامة لص سيد. هذا لا يخصك، لكنه ربما لم يكن يخص مستعملها الأخير أيضا.
items.artifacts.masterthievesarmband.desc_cursed=عصابة الذراع الملعونة مربوطة بمعصمك، وبطريقة ما جراب ذهبك يبدو أنه يصبح أخف ببطء...
items.artifacts.masterthievesarmband.desc_worn=تشعر بالقوة تتعاظم في عصابة الذراع على معصمك بينما تكسب الخبرة. يمكنك استعمال هذه القوة للسرقة من المتاجر، أو لسرقة الأعداء!\n\nسرقة الأعداء تحدث فورا، تربكهم وجيزة، وتمنحك فرصة للحصول على أي غنائم عندهم! هذه القوة أكثر فعالية ضد الأعداء غير الواعين. سرقة نفس العدو مرات متعددة لا تمنح المزيد من فرص الغنائم.
