items.weapon.missiles.bolas.name=بولاس
items.weapon.missiles.bolas.stats_desc=هذا السلاح يصيب هدفه بالإعاقة.
items.weapon.missiles.bolas.desc=هذه الأسلحة بعيدة المدى غير العادية ليست ضارة جدا، لكنها تقوم بعمل ممتاز في إبطاء هدفها.
items.weapon.missiles.boomerang.name=بوميرانغ
items.weapon.missiles.boomerang.desc=عند رميها نحو العدو هذا المقذوف الخشبي المنحني المسطح سيعود إلى يد راميه.
items.weapon.missiles.boomerang.durability=بسبب بنائه الصلب، هذا البوميرانغ لن ينكسر من الاستعمال.
items.weapon.missiles.fishingspear.name=رمح صيد
items.weapon.missiles.fishingspear.desc=رماح رمي صغيرة تعمل جيدا كسلاح مرتجل رغم تصميمها للصيد.
items.weapon.missiles.forcecube.name=مكعب قوة
items.weapon.missiles.forcecube.ondeath=قتلت نفسك بمكعب القوة الخاص بك...
items.weapon.missiles.forcecube.stats_desc=هذا السلاح ينشر قوة اصطدامه على منطقة صغيرة، يصيب كل شيء قريب.
items.weapon.missiles.forcecube.desc=هذه المكعبات السحرية غريبة الشكل صغيرة بما يكفي للإمساك في يدك، لكنها ثقيلة بشكل لا يُصدق.
items.weapon.missiles.heavyboomerang.name=بوميرانغ ثقيل
items.weapon.missiles.heavyboomerang.stats_desc=هذا السلاح يدور راجعا إلى الموقع الذي رُمي منه بعد خمسة أدوار.
items.weapon.missiles.heavyboomerang.desc=هذا البوميرانغ الكبير صعب الاستعمال بفعالية، لكنه سيسبب ضررا كبيرا.
items.weapon.missiles.javelin.name=رمح قذف
items.weapon.missiles.javelin.desc=هذه الرماح المرميّة الأكبر موزونة للحفاظ على الشوكة عند طرفها في المقدمة بينما تبحر عبر الهواء.
