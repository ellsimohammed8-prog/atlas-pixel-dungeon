items.artifacts.timekeepershourglass.freeze=اجمّد الزمن حولي
items.artifacts.timekeepershourglass.prompt=كيف ترغب في استعمال سحر الساعة الرملية؟\n\nأثناء الركود، الزمن سيتحرك عادة بينما أنت مجمّد ومحصن تماما، يستهلك حتى شحنتين في كل مرة.\n\nعندما يُجمّد الزمن، تستطيع التحرك كأن أفعالك لا تستغرق وقتا. يمكن تعطيل هذا في أي وقت باستعمال الساعة الرملية أو الهجوم.
items.artifacts.timekeepershourglass.desc=هذه الساعة الرملية الكبيرة المزخرفة تبدو عادية إلى حد ما، لكنك تشعر بقوة عظيمة في إطارها المحفور بدقة. بينما تدير الساعة الرملية وتراقب الرمل يصب تستطيع الشعور بسحرها يجذبك، بالتأكيد استعمال هذا السحر سيمنحك بعض التحكم في الزمن.
items.artifacts.timekeepershourglass.desc_hint=الساعة الرملية يبدو أنها فقدت بعض الرمل، لو فقط تستطيع إيجاد بعضه...
items.artifacts.timekeepershourglass.desc_cursed=الساعة الرملية الملعونة مقفلة على جانبك، تستطيع الشعور بها تحاول التلاعب بتدفق زمنك.
items.artifacts.timekeepershourglass$timefreeze.name=تجميد الزمن
items.artifacts.timekeepershourglass$timefreeze.desc=الزمن مجمّد حولك، يتيح لك أداء الأفعال فورا. الأثر سيدوم حتى يُلغي أو تنفد شحن ساعتك الرملية. الهجوم أو استعمال السحر سيكسر هذا الأثر أيضا.\n\nالأدوار حتى استعمال الشحنة: %s.
items.artifacts.timekeepershourglass$sandbag.name=كيس رمل سحري
items.artifacts.timekeepershourglass$sandbag.levelup=تضيف الرمل إلى ساعتك الرملية.
items.artifacts.timekeepershourglass$sandbag.maxlevel=ساعتك الرملية ممتلئة بالرمل السحري!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=ليس عندك ساعة رملية لوضع هذا الرمل فيها.
items.artifacts.timekeepershourglass$sandbag.desc=هذا الكيس الصغير من الرمل الناعم يجب أن يعمل بشكل مثالي مع ساعتك الرملية.\n\nيبدو غريبا أن صاحب المتجر عنده هذا الغرض المعيّن في الوقت الذي تحتاجه...
items.artifacts.unstablespellbook.name=كتاب تعويذات غير مستقر
items.artifacts.unstablespellbook.ac_read=اقرأ
items.artifacts.unstablespellbook.ac_add=أضف
items.artifacts.unstablespellbook.blinded=لا تستطيع القراءة من الكتاب بينما أنت معمي.
items.artifacts.unstablespellbook.no_charge=كتاب تعويذاتك نفدت طاقته الآن.
items.artifacts.unstablespellbook.cursed=لا تستطيع القراءة من كتاب تعويذات ملعون.
items.artifacts.unstablespellbook.prompt=اختر مخطوطة
items.artifacts.unstablespellbook.infuse_scroll=تشبع طاقة المخطوطة في الكتاب.
items.artifacts.unstablespellbook.unable_scroll=لست قادرا على إضافة هذه المخطوطة إلى الكتاب.
items.artifacts.unstablespellbook.unknown_scroll=لست متأكدا من نوع هذه المخطوطة بعد.
items.artifacts.unstablespellbook.desc=هذا المخطوط في حالة جيدة بشكل مفاجئ نظرا لعمره. إنه يفور ويتشقق بينما تحرك الصفحات، يتدفق بطاقة غير مستقرة. إن قرأت من هذا الكتاب، لا يمكن التنبؤ بأي تعويذة قد تلقيها.
items.artifacts.unstablespellbook.desc_cursed=الكتاب الملعون ربط نفسه بك، إنه يعوق قدرتك على استعمال معظم المخطوطات.
items.artifacts.unstablespellbook.desc_index=الكتاب غير كامل. فهرسه يشير حاليا إلى الصفحات الفارغة التالية:
items.artifacts.unstablespellbook.desc_empowered=المخطوطات التي أضفتها إلى الكتاب تتوهج بالقوة. ستستطيع اختيار النسخة الغريبة من آثار هذه المخطوطات، لكن بتكلفة شحنة إضافية.
items.artifacts.unstablespellbook.read_empowered=المخطوطة التي أضفتها إلى كتاب التعويذات تتدفق بالطاقة. تستطيع توجيه إما النسخة العادية، أو الغريبة من أثر هذه المخطوطة.\n\nاختيار النسخة الغريبة سيكلف شحنتين بدل واحدة.
items.bags.bag.name=حقيبة ظهر
items.bags.bag.discover_hint=تستطيع شراء هذا الغرض في متجر.
items.bags.potionbandolier.name=حزام جرعات
items.bags.potionbandolier.desc=هذا الحزام السميك يناسب حول صدرك كوشاح، عنده العديد من الأشرطة المعزولة عليه لحمل قناني الجرعات، قربة مائك، أو قناني معدن سائل.\n\nبينما داخل الحزام، جرعاتك يجب أن تكون محمية من البرد.
items.bags.scrollholder.name=حامل مخطوطات
items.bags.scrollholder.desc=هذا الحاوي الأنبوبي يبدو كأنه سيحتوي أدوات ومخططات فلكي، لكن مخطوطاتك ستناسب تمامًا كذلك. حتى أن هناك بعض الجيوب الجانبية التي ستناسب جيدًا بلورات التعويذات، والأقلام الغامضة، والراتنج الغامض.\n\nالحامل لا يبدو قابلا للاشتعال جدا، لذلك مخطوطاتك يجب أن تكون آمنة من النار داخلها.
items.bags.velvetpouch.name=جراب مخمل
items.bags.velvetpouch.desc=هذا الجراب المخمل الصغير يستطيع تخزين العديد من الأغراض الصغيرة فيه، مثل البذور، والأحجار الرونية، وبعض مكونات الكيمياء.
items.bags.velvetpouch.discover_hint=أحد الأبطال يبدأ بهذا الغرض.
items.bags.magicalholster.name=حزام سحري
items.bags.magicalholster.desc=هذا الحزام الرفيع مصنوع من جلد حيوان غريب ما، ويمتلك سحرا قويا يتيح له تخزين كمية ضخمة من الأسلحة بعيدة المدى.\n\nتستطيع ببساطة الوصول إلى الحقيبة وستمسك دائما الغرض الذي كنت تبحث عنه.\n\nبسبب سحر الحزام، العصي ستُشحن أسرع قليلا والأسلحة المرماة ستدوم أطول قليلا داخلها.
items.bombs.arcanebomb.name=قنبلة غامضة
items.bombs.arcanebomb.desc=هذه القنبلة أُشبعت بخصائص غامضة. ستنفجر في انفجار قوي مشابه لهجوم سيد الوحل المشحون، يسبب _%1$d-%2$d ضررا سحريا_ لأي شيء داخل مربعين.
items.bombs.arcanebomb.discover_hint=تستطيع صنع هذا الغرض عبر الكيمياء.
items.bombs.bomb.name=قنبلة
items.bombs.bomb.ac_lightthrow=أشعل وارمِ
items.bombs.bomb.snuff_fuse=تطفئ فتيل القنبلة بسرعة.
items.bombs.bomb.ondeath=الانفجار قتلك...
items.bombs.bomb.rankings_desc=قتله انفجار
items.bombs.bomb.desc=قنبلة بارود أسود ثقيلة إلى حد ما. انفجار من هذه القنبلة يسبب _%1$d-%2$d ضررا_ لأي شيء مجاور لها، وسيدمر بعض التضاريس أو الأغراض المجاورة.
items.bombs.bomb.desc_fuse=يبدو أن الفتيل سيستغرق بضع جولات للاحتراق بمجرد أن يُشعل.
items.bombs.bomb.desc_burning=فتيل القنبلة يحترق بعيدا، احتفظ بمسافتك أو أطفئه!
items.bombs.bomb$doublebomb.name=قنبلتان
items.bombs.bomb$doublebomb.desc=كومة قنبلتي بارود أسود ثقيلتين، تبدو كأنك تحصل على واحدة مجانا!
items.bombs.firebomb.name=قنبلة نار
items.bombs.firebomb.desc=هذه القنبلة عُدّلت لتنفجر في منطقة أكبر، تسبب _%1$d-%2$d ضررا_ وتنشر لهبا مستمرا داخل مربعين.
items.bombs.firebomb.discover_hint=تستطيع صنع هذا الغرض عبر الكيمياء.
items.bombs.flashbangbomb.name=قنبلة وميض
items.bombs.flashbangbomb.desc=هذه القنبلة المخصصة ستثور في انفجار ضوء وصوت وكهرباء عندما تنفجر. أي شيء داخل مربعين سيأخذ _%1$d-%2$d ضررا_ من الانفجار، وضررا إضافيا 25%% من الكهرباء، وسيُصعق لـ 10 أدوار.
items.bombs.flashbangbomb.discover_hint=تستطيع صنع هذا الغرض عبر الكيمياء.
items.bombs.frostbomb.name=قنبلة صقيع
items.bombs.frostbomb.desc=هذه القنبلة عُدّلت لتنفجر في منطقة أكبر، تسبب _%1$d-%2$d ضررا_ وتنشر هبة هواء متجمدة مستمرة داخل مربعين.
items.bombs.frostbomb.discover_hint=تستطيع صنع هذا الغرض عبر الكيمياء.
items.bombs.holybomb.name=قنبلة مقدسة
items.bombs.holybomb.desc=هذه القنبلة عُدّلت لتومض ضوءا مقدسا في منطقة أكبر عندما تنفجر. أي شيء داخل مربعين سيأخذ _%1$d-%2$d ضررا_ من الانفجار، والأعداء الأموات الأحياء أو مخلوقات الظلام ستأخذ ضررا إضافيا 50%% من الضوء المقدس.
items.bombs.holybomb.discover_hint=تستطيع صنع هذا الغرض عبر الكيمياء.
items.bombs.noisemaker.name=صانع ضوضاء
items.bombs.noisemaker.desc=هذه القنبلة المخصصة ستحدث ضوضاء بشكل متكرر عندما ينتهي فتيلها. عندما يلمسها شيء، ستنفجر وتسبب _%1$d-%2$d ضررا_ لأي شيء داخل مربعين!
items.bombs.noisemaker.desc_burning=صانع الضوضاء يدق بعيدا، سينفجر عندما يقترب شيء!
items.bombs.noisemaker.discover_hint=تستطيع صنع هذا الغرض عبر الكيمياء.
items.bombs.smokebomb.name=قنبلة دخان
items.bombs.smokebomb.desc=هذه القنبلة عُدّلت لبصق سحابة غاز سميكة في نفس وقت الانفجار. ستسبب _%1$d-%2$d ضررا_ وتنشر ضبابا مخفيا داخل مربعين.
items.bombs.smokebomb.discover_hint=تستطيع صنع هذا الغرض عبر الكيمياء.
items.bombs.regrowthbomb.name=قنبلة إعادة نمو
items.bombs.regrowthbomb.desc=هذه القنبلة المخصصة سترش سائلا مانحا للحياة في كل مكان داخل 3 مربعات بدل الانفجار. المنطقة العالقة في الانفجار ستنبت عشبا ونباتات بسرعة. أنت وأي حلفاء عالقون في الانفجار ستشفى كأنك شربت جرعة شفاء.
items.bombs.regrowthbomb.discover_hint=تستطيع صنع هذا الغرض عبر الكيمياء.
items.bombs.shrapnelbomb.name=قنبلة شظايا
items.bombs.shrapnelbomb.desc=هذه القنبلة عُدّلت بخردة معدن الـ AE-300، التي ستتناثر وتطير في كل مكان عندما تنفجر، تسبب _%1$d-%2$d ضررا_ في نطاق ضخم حول القنبلة. الأفضل أن تختبئ خلف شيء عند استعمالها...
items.bombs.shrapnelbomb.discover_hint=تستطيع صنع هذا الغرض عبر الكيمياء.
items.bombs.woollybomb.name=قنبلة صوفية
items.bombs.woollybomb.desc=هذه القنبلة المخصصة ستخلق حقلا واسعا من خراف سحرية بعد الانفجار. الانفجار سيسبب _%1$d-%2$d ضررا_ لأي شيء داخل مربعين. الخراف ستسد الحركة وستدوم لفترة طويلة جدا! الخراف لن تدوم طويلا في حضور أعداء أقوياء مع ذلك، ويمكن تبديدها يدويا أسرع بالتفاعل معها.
items.bombs.woollybomb.discover_hint=تستطيع صنع هذا الغرض عبر الكيمياء.
items.food.berry.name=توت السراديب
items.food.berry.eat_msg=ذلك التوت كان لذيذا!
items.food.berry.desc=هذا التوت الصغير وجدته صيادة الأرز بين نباتات السراديب. يمكن أكله بسرعة، يستعيد كمية صغيرة من الإشباع، وقد يحتوي بذرة قابلة للاستعمال!
items.food.berry.discover_hint=تستطيع إيجاد هذا الغرض باستعمال موهبة بطل معينة.
items.food.blandfruit.name=فاكهة لطيفة
items.food.blandfruit.cooked=فاكهة لطيفة مطبوخة
items.food.blandfruit.sunfruit=فاكهة الشمس
items.food.blandfruit.rotfruit=فاكهة العفن
items.food.blandfruit.earthfruit=فاكهة الأرض
items.food.blandfruit.blindfruit=فاكهة العمى
items.food.blandfruit.firefruit=فاكهة النار
items.food.blandfruit.icefruit=فاكهة الجليد
items.food.blandfruit.fadefruit=فاكهة التلاشي
items.food.blandfruit.sorrowfruit=فاكهة الحزن
items.food.blandfruit.stormfruit=فاكهة العاصفة
items.food.blandfruit.dreamfruit=فاكهة الحكيم
items.food.blandfruit.starfruit=فاكهة النجوم
items.food.blandfruit.swiftfruit=فاكهة السرعة
items.food.blandfruit.raw=لا تستطيع تحمل أكلها نيئة.
items.food.blandfruit.desc=جافة وغير جوهرية جدا، ربما طبخها مع مكون آخر سيحسّنها.
items.food.blandfruit.desc_cooked=الفاكهة انتفخت من وقتها منقوعة في القدر وحتى أنها امتصت خصائص البذرة التي طُبخت معها. سيكون عندها أثر أي جرعة تتوافق مع البذرة.
items.food.blandfruit.desc_eat=يبدو جاهزا للأكل!
items.food.blandfruit.desc_throw=يبدو متقلقل جدا، ربما الأفضل رميه.
items.food.blandfruit$chunks.name=قطع فاكهة لطيفة
items.food.blandfruit$chunks.desc=الفاكهة اللطيفة انفجرت عند الاصطدام، تركت قطعا خاملة خلفها.\n\nرغم قليل من الأوساخ، هذه القطع الكبيرة من فاكهة لطيفة مطبوخة تبدو صالحة للأكل بشكل مثالي.
items.food.chargrilledmeat.name=لحم مشوي على الفحم
items.food.chargrilledmeat.desc=يبدو كشريحة لحم لائقة.
items.food.chargrilledmeat.discover_hint=تستطيع إنشاء هذا باستعمال غرض طعام آخر.
items.food.food.name=حصة طعام
items.food.food.ac_eat=كل
items.food.food.eat_msg=ذلك الطعام كان طعمه لذيذا!
items.food.food.desc=لا شيء فاخر هنا: لحم مجفف، بعض البسكويت - أشياء كهذه.
items.food.frozencarpaccio.name=كارباتشيو مجمد
items.food.frozencarpaccio.invis=ترى يديك تتحول إلى غير مرئية!
items.food.frozencarpaccio.hard=تشعر بجلدك يتصلب!
items.food.frozencarpaccio.refresh=منعش!
items.food.frozencarpaccio.better=تشعر بأنك أفضل!
items.food.frozencarpaccio.desc=إنها قطعة لحم نيء مجمدة. الطريقة الوحيدة لأكلها هي قطع شرائح رقيقة منها. وهكذا إنها جيدة بشكل مفاجئ.
items.food.frozencarpaccio.discover_hint=تستطيع إنشاء هذا باستعمال غرض طعام آخر.
items.food.meatpie.name=فطيرة لحم
items.food.meatpie.eat_msg=ذلك الطعام كان لا يُصدق!
items.food.meatpie.desc=فطيرة لذيذة محشوة بلحم مالح. هذا سيُشبعك أكثر بكثير من أي وجبة أخرى.
items.food.meatpie.discover_hint=تستطيع صنع هذا الغرض عبر الكيمياء.
items.food.mysterymeat.name=لحم غامض
items.food.mysterymeat.eat_msg=ذلك الطعام كان طعمه... غريبا.
items.food.mysterymeat.hot=أوه إنه حار!
items.food.mysterymeat.legs=لا تستطيع أن تشعر بساقيك!
items.food.mysterymeat.not_well=لست بخير.
items.food.mysterymeat.stuffed=أنت ممتلىء.
items.food.mysterymeat.desc=كُل على مسؤوليتك الخاصة!
items.food.mysterymeat.discover_hint=تستطيع الحصول على هذا الغرض كسقوط من أعداء معينين.
items.food.mysterymeat$placeholder.name=لحم
items.food.phantommeat.name=لحم شبحي
items.food.phantommeat.desc=شريحة لحم كبيرة لامعة شفافة، قطعت من سمكة بيرانا شبح. هذا اللحم السحري لا يحتاج أن يُطبخ ويمنح عددا من المنافع الدفاعية بالإضافة إلى إشباعك بالكامل. عندما يُؤكل سيمنح الاختفاء، وجلد اللحاء، وبعض الشفاء، ويشفي العديد من الآثار الضارة.
items.food.phantommeat.discover_hint=تستطيع الحصول على هذا الغرض كسقوط من أعداء معينين.
items.food.pasty.name=فطيرة
items.food.pasty.fish_name=سمك مطهو بالبخار
items.food.pasty.amulet_name=تاج أطلس؟
items.food.pasty.egg_name=بيضة عيد الفصح
items.food.pasty.rainbow_name=جرعة قوس قزح
items.food.pasty.shattered_name=كعكة خضراء
items.food.pasty.pie_name=فطيرة اليقطين
items.food.pasty.vanilla_name=كعكة زرقاء
items.food.pasty.cane_name=عصا حلوى
items.food.pasty.sparkling_name=جرعة لامعة
items.food.pasty.desc=فطيرة كورنية أصيلة بحشوة تقليدية من لحم البقر والبطاطس. لذيذة!
items.food.pasty.fish_desc=سمكة كاملة مطهوة بالبخار، محفوظة سحريا على فرشة من الخضار. إنه تقليد حفظ بعض الأسماك لوقت لاحق حول هذا الوقت من العام، لذا ستحتفظ ببعض البقايا بدل أكلها كلها مرة واحدة.\n\nسنة قمرية جديدة سعيدة!
items.food.pasty.amulet_desc=لقد وجدتها أخيرا، تاج أطلس السحري - انتظر لحظة، هذه مجرد شوكولاتة مغلفة بورق قصدر جُعلت تبدو كالتاج! لن تمنحك قوة لا حدود لها، لكنها على الأقل ستملؤك وتمنحك شحنة أثر قليلة.\n\nأبريل أحمق!
items.food.pasty.egg_desc=بيضة شوكولاتة كبيرة عظيمة، مغلفة بورق أصفر ملون. هناك شوكولاتة كافية هنا لملئك بسهولة، والسكر قد يمنح آثارك قليلا من الشحن الإضافي.\n\nعيد فصح سعيد!
items.food.pasty.rainbow_desc=هذه الجرعة الملونة نوع من الطعام السائل. بالإضافة إلى إرضاء جوعك، عندها قليل من السحر فيها سيهدئ عدوا غير زعيم مجاورا، يجعله مترددا مؤقتا في قتالك.\n\nفخر سعيد!
items.food.pasty.shattered_desc=هذه الشريحة الكبيرة من كعكة الفانيليا عندها رشات ملونة وتزيين أخضر. الكعكة صُنعت للاحتفال بسنوات من الخبرة، وستمنحك قليلا من تلك الخبرة عندما تُؤكل.\n\nأطلس بكسل دنجن مبنية على شاترد بكسل دنجن، التي أُصدرت لأول مرة في 5 أغسطس 2014. عيد ميلاد سعيد يا شاترد بكسل دنجن!
items.food.pasty.pie_desc=شريحة كبيرة عظيمة من فطيرة اليقطين. نكهتها الحلوة والحارة ستملؤك وتمنحك قليلا من الشفاء.\n\nهالوين سعيد!
items.food.pasty.vanilla_desc=هذه الشريحة الكبيرة من كعكة الفانيليا عندها رشات ملونة وتزيين أزرق. الكعكة صُنعت للاحتفال بسنوات من الخبرة، وستمنحك قليلا من تلك الخبرة عندما تُؤكل.\n\nبكسل دنجن الأصلية أُصدرت لأول مرة في 4 ديسمبر 2012. عيد ميلاد سعيد يا بكسل دنجن!
items.food.pasty.cane_desc=عصا حلوى سكرية حلوة ضخمة. كبيرة كفاية لملئك، والسكر قد يمنح عصيك قليلا من الشحن الإضافي أيضا.\n\nعطلات سعيدة!
items.food.pasty.sparkling_desc=هذه الجرعة اللامعة نوع من الطعام السائل. ترضي الجوع وتحاكي النبيذ اللامع، لكنها ليست كحولية فعليا. الشعور الدافئ في بطنك سيمنح قليلا من الدروع.\n\nسنة جديدة سعيدة!
items.food.pasty$fishleftover.name=بقايا سمك
items.food.pasty$fishleftover.eat_msg=ذلك الطعام كان طعمه مقبولا.
items.food.pasty$fishleftover.desc=بعض فائض الأسماك من وجبتك السابقة. تستطيع أكلها في أي وقت تريد لاستعادة قليلا من الجوع.
items.food.smallration.name=حصة طعام صغيرة
items.food.smallration.eat_msg=ذلك الطعام كان طعمه مقبولا.
items.food.smallration.desc=تبدو تماما كحصة طعام عادية لكن أصغر.
items.food.smallration.discover_hint=تستطيع شراء هذا الغرض في متجر.
items.food.stewedmeat.name=لحم مطهو
items.food.stewedmeat.eat_msg=ذلك الطعام كان طعمه مقبولا.
items.food.stewedmeat.desc=طهو اللحم طهره من أي مرض أو طفيليات. يجب أن يكون آمنا للأكل.
items.food.stewedmeat.discover_hint=تستطيع صنع هذا الغرض عبر الكيمياء.
items.food.supplyration.name=حصة إمداد
items.food.supplyration.desc=هذه الحصة تُركت في السراديب من قبل وإلى أعضاء نقابة اللصوص. صُممت خصيصا لتؤكل أثناء التنقل، وتساعد في خدع عامة.\n\nبينما لا تملؤك بقدر حصة عادية، يمكن أكلها بسرعة، توفر قليلا من الشفاء المباشر، وستعيد شحنة لعباءة ظلال ظل الكثبان.
items.food.supplyration.discover_hint=تستطيع إيجاد هذا الغرض باستعمال موهبة بطل معينة.
items.journal.documentpage.name=صفحة ممزقة
items.journal.documentpage.desc=صفحة وحيدة، ربما ممزقة من كتاب ما. ستحتاج إلى التقاطها لقراءتها.
items.journal.alchemypage.name=صفحة كتاب كيمياء ممزقة
items.journal.alchemypage.desc=صفحة ممزقة من كتاب دليلي عن الكيمياء.\n\nمعظم النص صغير جدا لقراءته عن بعد، لكن تستطيع تمييز عنوان الصفحة:\n\n_"%s"_
items.journal.guidebook.name=مجلد إتقان السراديب
items.journal.guidebook.hint_mobile=كتابك الدليلي أنده نصيحة لك! اضغط على زر اليوميات اللامع في أعلى يمين الشاشة لقراءتها.
items.journal.guidebook.hint_desktop=كتابك الدليلي لديه نصيحة لك! اختر زر اليوميات اللامع (%s) في أعلى يمين الشاشة لقراءتها.
items.journal.guidebook.hint_status=كتاب دليلي
items.journal.guidebook.desc=كتاب دليلي لمغامر، تُرك هنا من شخص قرر أن المغامرة ليست له! هذا الكتاب بالذات سحري، ويستطيع أن يدعو المغامرين لقراءة صفحة في اللحظة الصحيحة.\n\nرغم تلك الوظيفة، الكتاب الأكثر شعبية بسبب الكلمات الكبيرة "لا تفزع!" المكتوبة بحروف كبيرة ودودة على الغلاف.
items.journal.guidepage.name=صفحة كتاب دليلي ممزقة
items.journal.guidepage.desc=صفحة ممزقة من كتاب دليلي للمغامرات.\n\nمعظم النص صغير جدا لقراءته عن بعد، لكن تستطيع تمييز عنوان الصفحة:\n\n_"%s"_
items.journal.regionlorepage$sewers.name=رسالة بالية
items.journal.regionlorepage$sewers.desc=ما تبدو وكأنها رسالة، مكتوبة على قطعة ورق متسخة بالأوساخ. ستحتاج إلى التقاطها لتتمكن من قراءة ما هو مكتوب عليها.
items.journal.regionlorepage$prison.name=مدخل يوميات بالٍ
items.journal.regionlorepage$prison.desc=دخول يوميات، أو نوع آخر من السجلات، مكتوب على قطعة ورق قديم. يبدو أنها نجت أفضل من الرسائل التي وجدتها في الصهاريج، لكن ما زلت ستحتاج إلى التقاطها لقراءتها.
items.journal.regionlorepage$caves.name=دخول سجل قديم
items.journal.regionlorepage$caves.desc=ما يبدو كدخول في دفتر سجل مستكشف، محفوظ بشكل مدهش رغم ما يجب أن يكون عمره. التقطها لقراءتها.
items.journal.regionlorepage$city.name=لوح صدئ
items.journal.regionlorepage$city.desc=لوح معدني صغير صدئ برسالة محفورة سحرية فيه. الحروف ما زالت واضحة رغم عمر اللوح، لكن ستحتاج لالتقاطها لقراءتها.
items.journal.regionlorepage$halls.name=لوح متوهج
items.journal.regionlorepage$halls.desc=لوح أسود صغير بحروف خضراء متوهجة محفورة فيه. الحروف المتوهجة تتمازج معا في ضباب من بعيد، ستحتاج لالتقاطها لقراءتها.
items.keys.goldenkey.name=مفتاح ذهبي
items.keys.goldenkey.desc=ثلمات هذا المفتاح الذهبي صغيرة ومعقدة. ربما سيفتح صندوقا مقفلا؟
items.keys.crystalkey.name=مفتاح بلوري
items.keys.crystalkey.desc=أسطح هذه المفتاح البلورية تلمع في الظلام. ربما ستفتح شيئا مصنوعا من الكريستال؟
items.keys.ironkey.name=مفتاح حديدي
items.keys.ironkey.desc=ثلمات هذا المفتاح الحديدي القديمة مهترئة جيدا؛ حبله الجلدي مهترئ من العمر. أي باب قد يفتحه؟
items.keys.wornkey.name=مفتاح بالٍ
items.keys.wornkey.desc=هذا المفتاح مهترئ ومغير اللون، لكنه يبدو جديا. على الأرجح يمكنه فتح بعض الباب الجدية القريبة.
items.potions.potion.ac_drink=اشرب
items.potions.potion.turquoise=جرعة فيروزية
items.potions.potion.crimson=جرعة قرمزية
items.potions.potion.azure=جرعة لازوردية
items.potions.potion.jade=جرعة اليشب
items.potions.potion.golden=جرعة ذهبية
items.potions.potion.magenta=جرعة أرجوانية
items.potions.potion.charcoal=جرعة فحمية
items.potions.potion.ivory=جرعة عاجية
items.potions.potion.amber=جرعة كهرمانية
items.potions.potion.bistre=جرعة بستر
items.potions.potion.indigo=جرعة بنفسجية
items.potions.potion.silver=جرعة فضية
items.potions.potion.unknown_desc=هذه القارورة تحتوي على سائل ملون دوّار. من يعرف ماذا سيحدث عند شربه أو رميه؟
items.potions.potion.harmful=جرعة ضارة!
items.potions.potion.beneficial=جرعة مفيدة
items.potions.potion.yes=نعم، أعرف ما أفعله
items.potions.potion.no=لا، غيرت رأيي
items.potions.potion.sure_drink=هل أنت متأكد أنك تريد شربها؟ في معظم الحالات يجب أن ترمي مثل هذه الجرعات على أعدائك.
items.potions.potion.sure_throw=هل أنت متأكد أنك تريد رميها؟ في معظم الحالات من المنطقي شربها.
items.potions.potion.shatter=القارورة تتحطم والسائل يرتشش بلا أذى.
items.potions.potion.discover_hint=تستطيع إيجاد هذا الغرض عشوائيا في السراديب، أو صنه عبر الكيمياء.
items.potions.potion$placeholder.name=جرعة
items.potions.potion$seedtopotion.name=جرعة عشوائية
items.potions.potionofexperience.name=جرعة خبرة
items.potions.potionofexperience.desc=التجارب المشهورة لأعداد كبيرة من المعارك مخفضة إلى شكل سائل، هذه الجرعة سترفع مستوى خبرتك فورا.
items.potions.potionoffrost.name=جرعة صقيع
items.potions.potionoffrost.desc=المادة الكيميائية الموجودة في هذه الجرعة ستتبخر إلى سحابة متجمدة عند التعرض للهواء الطلق.
items.potions.potionofhaste.name=جرعة سرعة
items.potions.potionofhaste.energetic=تشعر بأنك نشيط!
items.potions.potionofhaste.desc=شرب هذا السائل الغريب الحلاوة سيشبعك بطاقة هائلة لفترة قصيرة، يتيح لك الركض بسرعات عالية.
items.potions.potionofhealing.name=جرعة شفاء
items.potions.potionofhealing.heal=جروحك تبدأ في الانغلاق.
items.potions.potionofhealing.desc=هذا الإكسير سيستعيد صحتك بسرعة ويشفي فورا العديد من العلل.
items.potions.potionofinvisibility.name=جرعة اختفاء
items.potions.potionofinvisibility.invisible=ترى يديك تتحولان إلى غير مرئية!
items.potions.potionofinvisibility.desc=شرب هذه الجرعة سيجعلك غير مرئي مؤقتا. بينما غير مرئي، الأعداء غير قادرين على رؤيتك. الهجمات الجسدية والآثار السحرية (مثل المخطوطات والعصي) ستلغي الاختفاء فورا.
items.potions.potionoflevitation.name=جرعة ارتفاع
items.potions.potionoflevitation.float=تطفو في الهواء!
items.potions.potionoflevitation.desc=شرب هذا السائل الغريب سيجعلك تحوم في الهواء، قادر على الانجراف دون جهد فوق الفخاخ والحفر. رمي هذه الجرعة سيخلق سحابة غاز غير مكرر، يربك أي شيء يعلق فيها.
items.potions.potionofliquidflame.name=جرعة لهب سائل
items.potions.potionofliquidflame.desc=هذه القارورة تحتوي على مركّب غير مستقر سينفجر بعنف إلى لهيب عند التعرض للهواء الطلق.
items.potions.potionofmindvision.name=جرعة رؤية العقل
items.potions.potionofmindvision.see_mobs=تستطيع بطريقة ما أن تشعر بحضور عقول المخلوقات الأخرى!
items.potions.potionofmindvision.see_none=تستطيع بطريقة ما أن تشعر أنك وحدك في هذا المستوى في هذه اللحظة.
items.potions.potionofmindvision.desc=بعد شرب هذا، عقلك سيصبح متناغما مع التوقيع النفسي للمخلوقات البعيدة، يتيح لك الإحساس بوجودات بيولوجية عبر الحيطان. هذه الجرعة ستسمح لك أيضا بالرؤية عبر الحيطان والأبواب القريبة.
items.potions.potionofparalyticgas.name=جرعة غاز مشل
items.potions.potionofparalyticgas.desc=عند التعرض للهواء الطلق، السائل في هذه القارورة سيتبخر إلى ضباب أصفر مخدّر. أي شخص يستنشق السحابة سيُشل فورا، غير قادر على الحركة لبعض الوقت بعد تناثر السحابة. هذا الغرض يمكن رميه على الأعداء البعيدين لإمساكهم داخل أثر الغاز.
items.potions.potionofpurity.name=جرعة نقاء
items.potions.potionofpurity.freshness=تشعر بنضرة غير شائعة في الهواء.
items.potions.potionofpurity.protected=غشاء واقٍ يغلفك!
items.potions.potionofpurity.desc=هذا الكاشف السحري سيحيّد بسرعة كل الآثار الضارة المحيطة بالمنطقة في منطقة واسعة. شربه سيمنحك حصانة مؤقتة ضد مثل هذه الآثار.
items.potions.potionofstrength.name=جرعة قوة
items.potions.potionofstrength.msg=قوة جديدة تتدفق عبر جسدك، الآن عندك %d قوة!
items.potions.potionofstrength.desc=هذا السائل القوي سيجري عبر عضلاتك، يزيد قوتك بشكل دائم بنقطة واحدة.
items.potions.potionoftoxicgas.name=جرعة غاز سام
items.potions.potionoftoxicgas.desc=فتح أو تحطيم هذا الزجاج المضغوط سيجعل محتوياته تنفجر إلى سحابة سامة قاتلة من غاز أخضر. قد تختار رمي هذه الجرعة على الأعداء البعيدين بدل فتحها بيد.
items.potions.brews.brew.discover_hint=تستطيع صنع هذا الغرض عبر الكيمياء.
items.potions.brews.aquabrew.name=مزيج الماء
items.potions.brews.aquabrew.desc=عند التحطم، هذا المزيج سيطلق انفجارا من الماء المضغوط في موقعه. إنه قوي بما يكفي لإضرار الأعداء الناريين فقط، لكنه ينشر الماء أيضا إلى التضاريس القريبة، يعطل الفخاخ، يطفئ النيران، ويدفع الشخصيات قرب الانفجار.
items.potions.brews.blizzardbrew.name=مزيج العاصفة الثلجية
items.potions.brews.blizzardbrew.desc=عند التحطم، هذا المزيج سيطلق عاصفة ثلجية دوارة تنتشر بسرعة كغاز.
items.potions.brews.causticbrew.name=مزيج كاوٍ
items.potions.brews.causticbrew.desc=هذا المزيج سينشر نازا أكالا في منطقة واسعة حول الموقع الذي يتحطم فيه. أي شيء يمسكه الناز سيذوب ببطء إن لم يستطع غسله في الماء.
items.potions.brews.infernalbrew.name=مزيج جحيمي
items.potions.brews.infernalbrew.desc=عند التحطم، هذا المزيج سيطلق جحيما مسعورا ينتشر بسرعة كغاز.
items.potions.brews.shockingbrew.name=مزيج صاعق
items.potions.brews.shockingbrew.desc=عند التحطم، هذا المزيج سيطلق عاصفة كهربائية في منطقة واسعة حول الموقع الذي ينكسر فيه.
items.potions.brews.unstablebrew.name=مزيج غير مستقر
items.potions.brews.unstablebrew.desc=هذا المزيج السحري يتوهج بألوان قوس قزح متغيرة.\n\nعند شربه أو رميه سيطلق أثر جرعة عشوائية. أثر الجرعة سيكون مفيد دائمًا إن شُربت، وسيكون ضارًا دائمًا إن رُميت.
items.potions.elixirs.elixir.discover_hint=تستطيع صنع هذا الغرض عبر الكيمياء.
items.potions.elixirs.elixirofarcanearmor.name=إكسير درع غامض
items.potions.elixirs.elixirofarcanearmor.desc=هذا الإكسير سيمنح الشارب مقاومة طويلة الأمد للضرر السحري.
items.potions.elixirs.elixirofaquaticrejuvenation.name=إكسير تجديد مائي
items.potions.elixirs.elixirofaquaticrejuvenation.desc=هذا الإكسير يحتوي على بقايا سيد الوحل معززة بجرعة شفاء. بينما هو لن يوفر شفاء فوريا، سيستعيد باطراد كمية أكبر من الصحة بينما تقف في الماء.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=شفاء مائي
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=لقد كسبت مؤقتا خصائص استرجاعية مشابهة بخصائص سيد الوحل.\n\nبينما تقف في الماء، ستستعيد كمية صغيرة من الصحة في كل دور. الأثر متوقف عندما تكون في صحة كاملة أو خارج الماء.\n\nالشفاء المتبقي: %d.
items.potions.elixirs.elixirofdragonsblood.name=إكسير دم التنين
items.potions.elixirs.elixirofdragonsblood.desc=عند استهلاكه، هذا الإكسير سيرسل قوة نارية تجري عبر أوردة الشارب. هذا الأثر سيجعل الشارب محصنا ضد النار، ويتيح لهم إشعال الأعداء ملتهبًا بهجمات جسدية.
items.potions.elixirs.elixiroffeatherfall.name=إكسير سقوط الريش
items.potions.elixirs.elixiroffeatherfall.light=تشعر بخفة كريشة!
items.potions.elixirs.elixiroffeatherfall.desc=هذا الإكسير يوفر أثر ارتفاع أضعف لكن أكثر تحكما، يتيح للشارب أن يسقط مسافات عظيمة دون ضرر لفترة قصيرة.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=سقوط الريش
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=أنت تحت آثار إكسير سقوط الريش، يتيح لك السقوط في الهاويات دون تلقي ضرر!\n\nالأدوار المتبقية: %s.
items.potions.elixirs.elixirofhoneyedhealing.name=إكسير شفاء معسّل
items.potions.elixirs.elixirofhoneyedhealing.desc=هذا الإكسير يجمع بين الشفاء وحلاوة العسل. عند شربه، سيطبق نفس أثر جرعة الشفاء ويرضي كمية صغيرة من الجوع، لكن يمكن رميه أيضا لشفاء حليف.\n\nالمخلوقات ذات الصلة بالعسل قد تُهدأ إذا استُعمل هذا الغرض عليهم.
items.potions.elixirs.elixiroficytouch.name=إكسير لمسة جليدية
items.potions.elixirs.elixiroficytouch.desc=عند استهلاكه، هذا الإكسير سيتيح للشارب أن يمتص الحرارة من الأعداء الذين يهاجمونهم. هذا الأثر سيجعل الشارب محصنا ضد البرد، ويتيح لهم تبريد الأعداء بهجمات جسدية.
items.potions.elixirs.elixirofmight.name=إكسير قوة
items.potions.elixirs.elixirofmight.msg=قوة جديدة تتدفق عبر جسدك، الآن عندك %d قوة!
items.potions.elixirs.elixirofmight.desc=هذا السائل القوي سيجري عبر عضلاتك، يزيد قوتك بشكل دائم بنقطة واحدة ويزيد الصحة القصوى مؤقتا بمقدار %d نقاط. تعزيز الصحة يتناسب مع صحتك القصوى، لكنه سيتآكل ببطء بينما تكسب مستويات.
items.potions.elixirs.elixirofmight$htboost.name=تعزيز الصحة القصوى
items.potions.elixirs.elixirofmight$htboost.desc=جسدك يشعر بقوة وصحة غير طبيعية.\n\nصحتك القصوى معززة لفترة ممتدة من الوقت. بينما تكسب مستويات، التعزيز سيتلاشى باطراد.\n\nكمية التعزيز الحالية: %d.\nالمستويات المتبقية: %d.
items.potions.elixirs.elixiroftoxicessence.name=إكسير جوهر سام
items.potions.elixirs.elixiroftoxicessence.desc=عند استهلاكه، هذا الإكسير سيشبع الشارب بطاقة سامة. الشارب سينشر باستمرار غازا ساما بينما يتحركون، وسيكونون محصنون ضد الغاز السام والسم لفترة أطول قليلا من مدة الأثر.
items.potions.exotic.exoticpotion.turquoise=جرعة فيروزية غريبة
items.potions.exotic.exoticpotion.crimson=جرعة قرمزية غريبة
items.potions.exotic.exoticpotion.azure=جرعة لازوردية غريبة
items.potions.exotic.exoticpotion.jade=جرعة يشب غريبة
items.potions.exotic.exoticpotion.golden=جرعة ذهبية غريبة
items.potions.exotic.exoticpotion.magenta=جرعة أرجوانية غريبة
items.potions.exotic.exoticpotion.charcoal=جرعة فحمية غريبة
items.potions.exotic.exoticpotion.ivory=جرعة عاجية غريبة
items.potions.exotic.exoticpotion.amber=جرعة كهرمانية غريبة
items.potions.exotic.exoticpotion.bistre=جرعة بستر غريبة
items.potions.exotic.exoticpotion.indigo=جرعة بنفسجية غريبة
items.potions.exotic.exoticpotion.silver=جرعة فضية غريبة
items.potions.exotic.exoticpotion.unknown_desc=هذه القارورة الدائرية تحتوي على سائل ملون خشن. يبدو أن تكون غريبة على هذه الأرض، من يعلم ماذا قد تفعل عند شربها أو رميها؟
items.potions.exotic.exoticpotion.warning=هل تريد حقا إلغاء استعمال هذه الجرعة؟ ستُستهلك على أي حال.
items.potions.exotic.exoticpotion.yes=نعم، أنا متأكد
items.potions.exotic.exoticpotion.no=لا، غيرت رأيي
items.potions.exotic.exoticpotion.discover_hint=تستطيع صنع هذا الغرض عبر الكيمياء.
items.potions.exotic.potionofcleansing.name=جرعة تطهير
items.potions.exotic.potionofcleansing.desc=هذا الكاشف القوي سيجعل الشارب محصنا ضد كل آثار الحالة الضارة لبضعة أدوار عند الشرب. يمكن رميها على هدف لتطهيرهم أيضا.
items.potions.exotic.potionofcleansing$cleanse.name=مُطهَّر
items.potions.exotic.potionofcleansing$cleanse.desc=هذه الشخصية محصنة مؤقتا ضد كل آثار الحالة الضارة!\n\nالأدوار المتبقية: %s.
items.potions.exotic.potionofcorrosivegas.name=جرعة غاز أكال
items.potions.exotic.potionofcorrosivegas.desc=فتح أو تحطيم هذا الزجاج المضغوط سيجعل محتوياته تنفجر إلى سحابة قاتلة من غاز أكال بلون الصدأ. الغاز ينتشر أسرع من الغاز السام وهو أكثر قتلا، لكنه لن يدوم طويلا أيضا.
items.potions.exotic.potionofdragonsbreath.name=جرعة نفس التنين
items.potions.exotic.potionofdragonsbreath.prompt=اختر موقعا للإحراق
items.potions.exotic.potionofdragonsbreath.desc=هذه القارورة تحتوي على مركب غير عادي ينفجر إلى لهيب بعد وقت قصير من الاختلاط باللعاب. بصق السائل بسرعة سيتيح للمستعمل أن يبصق لهيبا من فمهم!
items.potions.exotic.potionofearthenarmor.name=جرعة درع ترابي
items.potions.exotic.potionofearthenarmor.desc=بدل أن يشل، هذا السائل عنده أثر متصلب على الجلد الذي سيحوله إلى درع طبيعي مؤقت.
items.potions.exotic.potionofdivineinspiration.name=جرعة إلهام سماوي
items.potions.exotic.potionofdivineinspiration.no_more_points=لا تستطيع كسب المزيد من نقاط الموهبة الإضافية.
items.potions.exotic.potionofdivineinspiration.select_tier=اختر مرتبة موهبة لكسب نقطتين إضافيتين فيها. يجب أن تكون قد فتحت المرتبة لتستطيع إنفاق النقاط.
items.potions.exotic.potionofdivineinspiration.bonus=+2 نقاط موهبة!
items.potions.exotic.potionofdivineinspiration.desc=قوة الطاقة المقدسة مخفضة إلى شكل سائل، هذه الجرعة ستشبع الشارب بقوة سماوية، تمنحهم نقطتين موهبة إضافيتين في مرتبة من اختيارهم.\n\nهذه الجرعة يمكن استعمالها مرة واحدة فقط لكل مرتبة موهبة.
items.potions.exotic.potionofmagicalsight.name=جرعة رؤية سحرية
items.potions.exotic.potionofmagicalsight.desc=بعد شرب هذا، حواسك سترتفع وجيزة إلى مستويات لا تُصدق، يتيح لك أن ترى عبر الحيطان في نطاق نصف قطر 12 مربعا!
items.potions.exotic.potionofmastery.name=جرعة إتقان
items.potions.exotic.potionofmastery.prompt=اتقن غرضا
items.potions.exotic.potionofmastery.weapon_easier=سلاحك يصبح أسهل في الحمل!
items.potions.exotic.potionofmastery.armor_easier=درعك يصبح أسهل في الارتداء!
items.potions.exotic.potionofmastery.desc=بدل من منح قوة خام، هذه الجرعة ستواءم عضلات المستعمل إلى غرض معيّن بدل ذلك. هذا سيجعل ذلك الغرض أسهل في الاستعمال، كأن الشارب مارس معه وبنى ذاكرة عضلية.\n\nالسلاح أو الدرع المختار سيتطلب قوة أقل بنقطتين للاستعمال. هذه الجرعة يمكن استعمالها مرة واحدة فقط على كل غرض.
items.potions.exotic.potionofshielding.name=جرعة دروع
items.potions.exotic.potionofshielding.desc=بدل أن تشفي، هذه الجرعة ستسقُط بدل ذلك درعا متينا حول جسد المستعمل، يسد كمية كبيرة من الضرر.
items.potions.exotic.potionofshroudingfog.name=جرعة ضباب التغطية
items.potions.exotic.potionofshroudingfog.desc=عند التعرض للهواء، السائل في هذه القارورة سينتج ضبابا دخانيا سميكا ينتشر بسرعة ويسد رؤية أعدائك.
items.potions.exotic.potionofsnapfreeze.name=جرعة تجميد فوري
items.potions.exotic.potionofsnapfreeze.desc=المادة الكيميائية الموجودة في هذه الجرعة ستتفاعل بسرعة مع الهواء، تجمّد وتجذر فورا كل من ضمن آثارها.
items.potions.exotic.potionofstamina.name=جرعة قوة تحمل
items.potions.exotic.potionofstamina.desc=شرب هذا السائل الغريب الحلاوة سيشبعك بتعزيز طاقة طويل الأمد، يتيح لك الركض بإيقاع متعجل لفترة ممتدة من الوقت.
items.potions.exotic.potionofstormclouds.name=جرعة سحب عاصفة
items.potions.exotic.potionofstormclouds.desc=رمي هذه الجرعة سيخلق سحابة بخار مركزة تنتشر بسرعة، ستتكثف وتنسكب على البيئة. معظم التضاريس ستُحوّل إلى ماء، الأعداء الناريين سيأخذون ضررا، النار ستُطفأ، والفخاخ ستُفاض وتُكسر.
items.quest.ceremonialcandle.name=شمعة احتفالية
items.quest.ceremonialcandle.desc=مجموعة شموع، مذابة ومندمجة معا عبر الاستعمال.\n\nوحدها لا قيمة لها، ولكن مستعملة مع شموع أخرى في نمط، يمكنها تركيز الطاقة لطقوس استدعاء.
items.quest.ceremonialcandle.discover_hint=تستطيع إيجاد هذا الغرض أثناء مهمة معينة.
items.quest.corpsedust.name=غبار جثة
items.quest.corpsedust.chill=قشعريرة تمر على عمودك الفقري.
items.quest.corpsedust.desc=كرة غبار الجثة لا تختلف ظاهريا عن كرة غبار عادية. لكن تستطيع الشعور بطاقة خبيثة تتربص داخلها.\n\nالتخلص منها في أقرب وقت ممكن سيكون فكرة جيدة.
items.quest.corpsedust.discover_hint=تستطيع إيجاد هذا الغرض أثناء مهمة معينة.
items.quest.corpsedust&dustwraith.rankings_desc=لُعن بغبار الجثة
items.quest.darkgold.name=خام ذهب مظلم
items.quest.darkgold.you_now_have=الآن عندك %d خام ذهب مظلم.
items.quest.darkgold.desc=هذا المعدن يُدعى مظلما ليس بسبب لونه (لا يختلف عن الذهب العادي)، بل لأنه يذوب تحت ضوء النهار، يجعله عديم الفائدة على السطح.
items.quest.darkgold.discover_hint=تستطيع إيجاد هذا الغرض أثناء مهمة معينة.
items.quest.dwarftoken.name=رمز قزم
items.quest.dwarftoken.discard=تتخلص من الرمز الزائد.
items.quest.dwarftoken.desc=قطعة معدن غريبة الشكل كان يحملها ساكن خزنة قزمة. ربما هي جزء من السحر الذي كان يربطها بالخزنة؟ الأفضل أن تحتفظ بها، قد يكون لها بعض الاستعمال.
items.quest.dwarftoken.desc_old=العديد من الأقزام وبعض إبداعاتهم الأكبر تحمل هذه القطع المعدنية الصغيرة ذات الغرض المجهول. ربما هي مجوهرات أو نوع من الهوية. الأقزام شعب غريب.
items.quest.dwarftoken.discover_hint=تستطيع إيجاد هذا الغرض أثناء مهمة معينة.
items.quest.embers.name=جمر عنصري
items.quest.embers.desc=جمر خاص يمكن حصاده فقط من عناصر نار شابة. تشع طاقة حرارية.
items.quest.embers.discover_hint=تستطيع إيجاد هذا الغرض أثناء مهمة معينة.
items.quest.escapecrystal.name=بلورة هروب
items.quest.escapecrystal.ac_use=استعمل
items.quest.escapecrystal.prompt=اختر غرضا
items.quest.escapecrystal.desc=بلورة تعويذة سحرية رفيعة يبدو أنها تحتوي سحر نقل آني. تستطيع استعمال البلورة في أي وقت لمغادرة خزنة الأقزام، لكن إن غادرت مبكرا لن تحصل على المكافأة الكاملة!
items.quest.escapecrystal.discover_hint=تستطيع إيجاد هذا الغرض أثناء مهمة معينة.
items.quest.escapecrystal.injure_warning_1=الزمن يبدو أنه يتباطأ بينما تسمع صوت العفريت:\n\n"مهلا، تبدو مصابا جدا، هل كل شيء يسير على ما يرام أسفل هناك؟ أريد تمثالي لكن ليس بشدة كافية أن تموت في محاولة الحصول عليه!"
items.quest.escapecrystal.injure_warning_2="إن كنت عالقا في موقف سيئ تستطيع استعمال أحد _أغراض النقل من الغرفة البادئة_ للهروب إلى هناك والمحاولة من جديد."
items.quest.escapecrystal.injure_warning_3="إن كانت الأمور تبدو خطيرة حقا، تستطيع _الهروب باستعمال تلك البلورة التي أعطيتك إياها._ لن أمنحك المكافأة الكاملة لكنها بالتأكيد أفضل من الموت!"
items.quest.escapecrystal.injure_confirm=حسنا (هذه الرسالة لن تظهر من جديد في المحاولات المستقبلية)
items.quest.escapecrystal.leaving_start=الزمن يبدو أنه يتباطأ بينما تسمع صوت العفريت:\n\n"استمع، أتفهم إن كنت عصبيا لكن من فضلك على الأقل غادر الغرفة الأولى!"\n\n"لا تحتاج أن تقلق على معداتك، أنا عفريت ذو كلمة، أعد بأن كل شيء سينتظرك عندما تعود. أعد أيضا أنني سأتركك تستعمل البلورة للهروب إن كنت في خطر فعليا."
items.quest.escapecrystal.leaving_early=الزمن يبدو أنه يتباطأ بينما تسمع صوت العفريت:\n\n"حقا، هارب أصلا!؟ تعرف أنك تستطيع الهروب من معظم الأعداء في ذلك المكان أليس كذلك؟"\n\n"انظر، إن كانت حياتك في خطر أستطيع إخراجك، لكنني لن أتركك تأخذ أي شيء معك. توقعت منك أكثر بكثير =("
items.quest.escapecrystal.leaving_partly_explored=الزمن يبدو أنه يتباطأ بينما تسمع صوت العفريت:\n\n"أوه، هل تغادر أصلا؟ حسنا أفترض أنك ساعدت في رسم خريطة المكان، وذلك أفضل من لا شيء."\n\n"مع ذلك، توقعت منك أكثر =(. بالطبع سأخرجك إن احتجتني. سأتركك تأخذ شيئا كجرعة أو مخطوطة معك أفترض."
items.quest.escapecrystal.leaving_fully_explored=الزمن يبدو أنه يتباطأ بينما تسمع صوت العفريت:\n\n"تحتاج إلى المغادرة؟ حسنا، لقد استكشفت الخزنة كمية لائقة على الأقل. كنت آمل أن تكون أفضل في سرقتها فعليا، لكنني عندي الآن فكرة أفضل بكثير عن كيفية عمل المكان."\n\n"سأتركك تُحضر شيئا معك، لكن لا شيء معزّز سحريا!"
items.quest.escapecrystal.leaving_partial_victory=الزمن يبدو أنه يتباطأ بينما تسمع صوت العفريت:\n\n"كنت آمل أن تحصل على تمثالي، لكنك قمت بعمل عظيم في استكشاف وتطهير معظم الخزنة!"\n\n"أقول لك ما، سأتركك تحتفظ بغرض طالما أنه غير معزّز فوق +1، وسأنشئ متجرا أعمق في السراديب أيضا. سأحتاج بعض الوقت لتخطيط خطواتي التالية على أي حال."
items.quest.escapecrystal.leaving_victory=الزمن يبدو أنه يتباطأ بينما تسمع صوت العفريت:\n\n"عمل ممتاز!! هل أنت مستعد للمغادرة؟ سآخذ التمثال منك عندما تعود."\n\n"كما وعدت سأنشئ متجرا أعمق وسأتركك تأخذ أي شيء يعجبك معك! خذ وقتك في الاختيار إن أردت، كل شيء آخر سيبقى داخل الخزنة."
items.quest.escapecrystal.leaving_item=هل أنت متأكد أن هذا هو الغرض الذي تريد أخذه معك؟
items.quest.escapecrystal.leaving_seal=_الختم المكسور الملتصق بهذا الدرع مرتبط بالمرآة ولا يمكن أخذه معك._ الختم سيُزال تلقائيا عن الدرع. هذا سيخفّض مستوى الدرع بمقدار 1 لكنه لن يزيل أي رمز عنده.
items.quest.escapecrystal.leaving_staff=_عصا حكيم النجوم هذه مرتبطة بالمرآة ولا يمكن أخذها معك، لكن العصا المشبعة فيها يمكن._ العصا ستُزال تلقائيا عن العصا الرئيسية، وستُعطى لك بمستوى العصا الرئيسية ناقص 1.
items.quest.escapecrystal.leaving_yes=غادر الخزنة
items.quest.escapecrystal.leaving_no=ابقَ هنا
items.quest.escapecrystal.error_start=يبدو أنك لست في مستوى الخزنة! هذا ربما حدث بسبب خلل أو عطل.
items.quest.escapecrystal.error_no_items=لا شيء من أغراضك يُخزن، لذلك أُزيلت البلورة من مخزونك.
items.quest.escapecrystal.error_with_items=أغراضك تُخزن حاليا، لذلك يجب أن تحاول النزول إلى الخزنة من جديد لبدء المهمة. أغراضك المخزنة ستُرجع لك عندما تنتهي المهمة.
items.quest.gooblob.name=كتلة الوحل
items.quest.gooblob.desc=كتلة ملتوية من المادة اللزجة، انفصلت عن سيد الوحل بينما كان يموت. إنها تقريبا ككرة هلام كبيرة، مع أنك لن تجرؤ أن تأكلها.\n\nلا تفعل شيئا وحدها، لكنها قد تكون مفيدة عندما تُجمع مع جرعات معينة، أو قنبلة. على الأقل يجب أن تتحول إلى كمية لائقة من الطاقة.
items.quest.gooblob.discover_hint=تستطيع الحصول على هذا الغرض كسقوط من أعداء معينين.
items.quest.impstatue.name=تمثال حجر السج
items.quest.impstatue.desc=تمثال أسود نفاث صغير منقوش من حجر السج. يشبه العفريت الذي أرسلك إلى هنا أسفل، حتى أن عنده عيونه الخضراء المتوهجة. هناك نقش على قاعدة التمثال بلغة لم تراها من قبل أبدا.
items.quest.impstatue.discover_hint=تستطيع إيجاد هذا الغرض أثناء مهمة معينة.
items.quest.vaultbeacon.name=منارة الخزنة
items.quest.vaultbeacon.desc=تعويذة منارة العودة هذه يبدو أنها عندها موقع معين أصلا، على الأرجح إلى غرفة الدخول التي وجدتها فيها.\n\nيمكنك استعمالها لتوفير الوقت أثناء الاستكشاف، أو كطريقة للهروب إن كنت في خطر.
items.quest.vaultbeacon.discover_hint=تستطيع إيجاد هذا الغرض أثناء مهمة معينة.
items.quest.metalshard.name=شظية معدن ملعون
items.quest.metalshard.desc=شظية معدن ملعون صدئ، انفصلت عن الـ AE-300 بينما كان يدمر. تستطيع الشعور بسحر خبيث غير نشط داخلها.\n\nلا تفعل شيئا وحدها، لكنها قد تكون مفيدة عندما تُجمع مع مخطوطات معينة، أو قنبلة. على الأقل يجب أن تتحول إلى كمية لائقة من الطاقة.
items.quest.metalshard.discover_hint=تستطيع الحصول على هذا الغرض كسقوط من أعداء معينين.
items.quest.pickaxe.name=معول
items.quest.pickaxe.ability_name=اخترق
items.quest.pickaxe.ability_desc=نصل السموم يمكن أن _يخترق_ عدوا بمعول. هذا مضمون أن يصيب، يطبق الهش لثلاثة أدوار، ويسبب _%1$d-%2$d ضررا_ على الأعداء ذوي الجلد الصلب.
items.quest.pickaxe.upgrade_ability_stat_name=ضرر القدرة
items.quest.pickaxe.desc=هذه أداة متينة وثقيلة لكسر الصخور. لا تحتاج إلى تجهيز المعول للتعدين به، لكنه ربما يمكن أن يُجهّز كسلاح في ضائقة.
items.quest.pickaxe.discover_hint=تستطيع إيجاد هذا الغرض أثناء مهمة معينة.
items.remains.remainsitem.ac_use=استعمل
items.remains.remainsitem.discover_hint=تستطيع إيجاد هذا الغرض في بقايا بطل معيّن من محاولة مفقودة سابقة.
items.remains.bowfragment.name=شظية قوس
items.remains.bowfragment.desc=هذه الشظية الخشبية المكسورة كانت ذات يوم جزءا من قوس روح صيادة أرز مفقودة. ما زلت تشعر بقليل من طاقة الطبيعة متبقية في الشظية، يمكنك استعمال الشظية لنمو بعض العشب العالي حولك. فعل هذا سيدمر الشظية مع ذلك.
items.remains.brokenhilt.name=قبضة مكسورة
items.remains.brokenhilt.desc=هذه القبضة المكسورة تبدو كأنها أتت من سلاح نصل سموم مهزومة. ما زلت تستطيع الشعور بقليل من القوة العسكرية متبقية في القبضة، يمكنك استعمالها للحصول على ضرر إضافي صغير في ضربتي اشتباك التاليتين. فعل هذا سيدمر القبضة مع ذلك.
items.remains.brokenstaff.name=عصا مكسورة
items.remains.brokenstaff.desc=عصا حكيم النجوم هذه كُسرت إلى نصفين بعد أن قابل مالكها حتفه. ما زلت تستطيع الشعور ببعض الطاقة السحرية متبقية في العصا، يمكنك استعمالها لمنح عصيك دفعة شحن صغيرة. فعل هذا سيدمر العصا مع ذلك.
items.remains.cloakscrap.name=قصاصة قماش
items.remains.cloakscrap.desc=هذه القصاصة من قماش شفاف تبدو كأنها أتت من عباءة ظلال ظل كثبان متأخر. ما زلت تستطيع الشعور بقليل من الطاقة الغامضة متبقية فيها، يمكنك استعمالها لمنح آثارك دفعة شحن صغيرة. فعل هذا سيدمر القماش مع ذلك.
items.remains.sealshard.name=شظايا ختم
items.remains.sealshard.desc=هذه الشظايا الصغيرة من الشمع الأحمر تبدو كأنها أتت من ختم ملك أطلس ساقط. ما زلت تستطيع الشعور بقليل من الإرادة العالقة بالختم، يمكنك استعمالها لمنح نفسك قليلا من الدروع. فعل هذا سيدمر شظايا الختم مع ذلك.
items.remains.tornpage.name=صفحة ممزقة
items.remains.tornpage.desc=هذه الصفحة تبدو كأنها مُزقت من مخطوط فجر كاهن فجر منتهي. ما زال هناك قليل من الطاقة السماوية عالقة بها، يمكنك استعمالها لاستعادة قليلا من الصحة. فعل هذا سيدمر الصفحة الممزقة مع ذلك.
