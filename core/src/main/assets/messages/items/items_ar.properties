items.weapon.melee.mace.desc=رأس الحديد الكبير لهذا السلاح يسبب ضررا كبيرا.
items.weapon.melee.magesstaff.name=عصا الحكيم الطويلة
items.weapon.melee.magesstaff.ac_imbue=اشبع
items.weapon.melee.magesstaff.ac_zap=اصعق
items.weapon.melee.magesstaff.prompt=اختر عصا
items.weapon.melee.magesstaff.imbue=لقد شبعت عصاك الطويلة بـ%s.
