actors.buffs.starmark.name=علامة النجوم
actors.buffs.starmark.desc=هذا المخلوق موسوم بعلامة نجوم سيف التاج. يتلقى 20% ضررا إضافيا من سيف التاج.\n\nأدوار علامة النجوم المتبقية: %s.
