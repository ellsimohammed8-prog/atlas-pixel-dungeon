journal.document.intros.title=مقدمات المناطق
journal.document.intros.discover_hint=يمكنك العثور على هذا النص عند دخول منطقة معينة لأول مرة.
journal.document.intros.dungeon.title=السراديب
journal.document.intros.dungeon.body=غامر أبطال كثيرون في السراديب قبلك من المدينة في الأعلى، ومعظمهم لم يُسمع عنهم أبدا مجددا.\n\nيُقال إن تاج أطلس الضائع يرقد في الأعماق في الأسفل — تاج الملك القديم الذي رسم خرائط هذه القاعات أولا، قبل أن يختمها الجبل. وحتى الآن، تشع طاقة مظلمة من الأسفل، تشق طريقها إلى المدينة.\n\nهل ستغزو السراديب وتطالب بالتاج؟ حان وقت بدء مغامرتك الخاصة!
journal.document.intros.sewers.title=الصهاريج الغارقة
journal.document.intros.sewers.body=الطوابق العليا من المملكة المدفونة هي الصهاريج العظيمة التي كانت تغذي المدينة في الأعلى بمياه الجبل.\n\nومع تسلل الطاقة المظلمة من الأسفل، ازدادت وحشية مخلوقات الأقبية غير المؤذية عادة، واضطرت المدينة إلى إرسال دوريات حراسة للنزول للحفاظ على سلامة المياه.\n\nهذا المكان خطر، لكن الشر العامل هنا على الأقل ضعيف.
journal.document.intros.prison.title=سجن السلاسل
journal.document.intros.prison.body=بنى ملوك أطلس هذا السجن في الجبل لاحتجاز أخطر مجرمي المملكة. كان مُدارا بصرامة ومستحيل الهروب منه، وكان المحكومون من كل أنحاء البلاد يُجلبون إلى هنا لقضاء مدتهم.\n\nلكن سرعان ما بدأ ضباب مظلم يتسلل من الأسفل، ملتويًا بعقول الحارس والسجين على حد سواء.\n\nوردا على ذلك، ختمت المدينة السجن بأكمله. لا أحد يعرف ما حل بمن تُركوا للموت داخل هذه الجدران...
journal.document.intros.caves.title=كهوف الجذور
journal.document.intros.caves.body=تمتد هذه الكهوف إلى أسفل السجن، حيث تصل جذور غابات الأرز العظيمة عميقا في الجبل. غنية بالمعادن والبلور، كانت في الماضي قلب التجارة النابض بين مدينة السطح والمملكة في الأسفل.\n\nتسكن الكهوف الآن حيوانات جوفية، وقبائل غنول، وآلات مهجورة — أفسدتها على الأرجح نفس القوة التي أثرت على المناطق في الأعلى.
journal.document.intros.city.title=المدينة المدفونة
journal.document.intros.city.body=كانت المدينة المدفونة في الماضي عاصمة المملكة تحت الجبل، وأعظم مدنها جميعا. في أوجها بنى حدّادوها ومهندسوها آلات عجيبة من المعدن والحرفة أتاحت للمدينة التوسع بسرعة.\n\nثم في يوم ما، أُوصدت بوابات المدينة ولم يسمع أحد عن أهلها مجددا. القليلون الذين هربوا أثناء إغلاقها رووا قصصا عن ساحر بلاط سرق العرش، والقوة الرهيبة التي تعلم تسخيرها.
journal.document.intros.halls.title=القاعات المختومة
journal.document.intros.halls.body=كانت هذه القاعات العميقة تحتضن في الماضي بلاط الملك المدفون، حيث كان تاج أطلس محفوظا تحت الختم. الآن لُويت بالظلام المتسرب من الأسفل، واستولى عليها شيء أكثر شرا...\n\nتسكن هذه القاعات مخلوقات مرعبة من كل نوع، تقودها قوة مظلمة رهيبة. إن لم يكن الملك المدفون مصدر الفساد المنتشر، فما يوجد هنا في الأسفل هو المصدر لا محالة.\n\nسِر بحذر — قلة قليلة من المغامرين نزلوا إلى هذا العمق...
journal.document.intros.halls.discover_hint=يمكنك العثور على هذا النص في منطقة معينة، لكن فقط بعد العثور على كل النصوص السابقة في هذه المجموعة.
