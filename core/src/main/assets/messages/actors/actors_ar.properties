actors.mobs.mob.rankings_desc=قتله: %s
actors.mobs.mob.discover_hint=تستطيع إيجاد هذا العدو في منطقة معينة من السراديب.
actors.mobs.monk.def_verb=سدّ
actors.mobs.monk.parried=تصدى
actors.mobs.monk.desc=هؤلاء الرهبان متعصبون، كرسوا أنفسهم لحماية ملكهم عبر القوة الجسدية. عظيم جدا تفانيهم بحيث أنهم استسلموا بالكامل بعقولهم لملكهم، والآن يتجولون في المدينة القزمية كأموات أحياء بلا عقل.\n\nقبضات الزفير تعتمد كليا على فن القتال يدًا بيد، وقادرة على استعمال قبضاتها العارية للهجوم والدفاع. عندما تصبح مركزة، الرهبان سيصدون الهجوم الجسدي التالي المستعمل ضدهم، حتى إن كان مضمونا الإصابة بخلاف ذلك. قبضات الزفير تبني التركيز أسرع أثناء التنقل، وأبطأ عندما تكون في قتال مباشر.
actors.mobs.monk$focus.name=مركز
actors.mobs.monk$focus.desc=هذا الراهب يركز بشكل مثالي على هدفه، ويبدو أنه يتوقع حركاتهم قبل أن يفعلوها.\n\nبينما هو مركز، الهجوم الجسدي التالي الموجه ضد هذه الشخصية مضمون أن يخطئ، بغض النظر عن الظروف. صد هذا الهجوم سيصرف تركيز الراهب، وسيحتاج إلى بنائه من جديد لصد هجوم آخر. قبضات الزفير تبني التركيز أسرع بينما تتحرك.
actors.mobs.phantompiranha.teleport_away=سمكة البيرانا الشبح تنتقل آنيا بعيدا...
actors.mobs.phantompiranha.desc=أسماك البيرانا الشبح فصيلة نادرة من البيرانا بقدرات سحرية وأجساد شفافة مخيفة. إنها قادرة على الانتقال آنيا بينما تُهاجم، إما للهروب أو للاقتراب من عدوها بسرعة!\n\nبينما هي مزعجة للقتال، لحمها ثمين لخصائصه السحرية.
actors.mobs.piranha.desc=هذه الأسماك آكلة اللحوم تُربى خصيصا لحماية المناطق المغمورة. عضتها مميتة، لذلك الأفضل تجنب مواجهتها مباشرة.
actors.mobs.piranha.discover_hint=تستطيع إيجاد هذا العدو في أي مكان في السراديب.
actors.mobs.pylon.desc_inactive=برج طاقة، مقصود به المساعدة في تنظيم الكهرباء التي تعمل بها الآلات في هذه المنطقة.\n\nالبرج غير نشط حاليا ومحصن ضد الضرر.
actors.mobs.pylon.desc_active=برج طاقة، مقصود به المساعدة في تنظيم الكهرباء التي تعمل بها الآلات في هذه المنطقة. البرج يتدفق حاليا بالطاقة الكهربائية، هذا لا بد أنه ما يشحن الـ AE-300 بشكل فائق!\n\nفي هذه الحالة الأبراج هشة، لكنها ستقوس الكهرباء إلى المربعات القريبة في نمط باتجاه عقارب الساعة. بسبب بنيتها المعدنية الثقيلة، الأبراج مقاومة لكميات كبيرة من الضرر.
actors.mobs.rat.desc=الجرذان الجبلية سكان عدوانيون لكن ضعفاء إلى حد ما من الصهاريج. عندهم عضة شريرة، لكنهم يهددون الحياة فقط بأعداد كبيرة.
actors.mobs.ripperdemon.leap=الوحش الممزق يستعد للقفز!
actors.mobs.ripperdemon.desc=هذه المخلوقات المرعبة نتيجة جثث الأقزام العديدة في هذه المنطقة التي استُعملت من قبل قوى مظلمة. الوحوش الممزقة مخلوقات ميّتة هزيلة تشبه الأقزام، لكن بأجساد مكسرة ومخالب طويلة حادة مصنوعة من العظم.\n\nالوحوش الممزقة ليست متينة بشكل خاص، لكنها رشيقة وخطيرة. إنها قادرة على القفز لمسافات عظيمة للوصول بسرعة إلى الأهداف قبل قرنها بمخالبها.
actors.mobs.rotheart.desc=ثمرة توت العفن فريدة جدا. بدل أن تتعفن وتوفر مغذيات، الثمرة تنمو، تتصلب، وتشمل البذرة. توفر الحماية للأعضاء الداخلية التي تنمو داخل الثمرة. هذه الكرة العملاقة يُشار إليها بقلب نبتة توت عفن بالغة.
actors.mobs.rotheart.discover_hint=تستطيع إيجاد هذا العدو أثناء مهمة معينة.
actors.mobs.rotlasher.rankings_desc=جلده ضارب العفن
actors.mobs.rotlasher.desc=ضارب العفن جزء من بنية جذر نبتة توت عفن ناضجة، ووسيلة دفاعها الأساسية أيضا. الضاربون عميان وعاقلون في الأرض، لكنهم سيهاجمون بعنف أي تهديد قريب بعد أخذ لحظة للكشف عنه. عندما لا يوجد أعداء قريبون، يقفون بلا حركة، يحاولون الاندماج مع النباتات المحيطة.
actors.mobs.rotlasher.discover_hint=تستطيع إيجاد هذا العدو أثناء مهمة معينة.
actors.mobs.scorpio.desc=هذه المخلوقات المظلمة الضخمة الشبيهة بالعناكب تتجنب القتال القريب، تفضل إطلاق أشواك مسننة مشلّة من مسافات طويلة.
actors.mobs.senior.desc=هؤلاء الرهبان متعصبون، كرسوا أنفسهم لحماية ملكهم عبر القوة الجسدية. عظيم جدا تفانيهم بحيث أنهم استسلموا بالكامل بعقولهم لملكهم، والآن يتجولون في المدينة القزمية كأموات أحياء بلا عقل.\n\nهذا الراهب أتقن فن القتال يدًا بيد، وقادر على كسب التركيز أثناء التحرك أسرع بكثير من الرهبان العاديين. عندما يصبحون مركزين، الرهبان سيصدون الهجوم الجسدي التالي المستعمل ضدهم، حتى إن كان مضمونا الإصابة بخلاف ذلك. قبضات الزفير تبني التركيز أسرع أثناء التنقل، وأبطأ عندما تكون في قتال مباشر.
actors.mobs.shaman.bolt_kill=الصاعقة السحرية قتلتك...
actors.mobs.shaman.desc=شامانات الغنولات غنولات أذكياء يستعملون تعويذات قتال لتعويض نقص قوتهم. عندهم مكانة محترمة جدا في مجتمع الغنولات، رغم قوتهم الأضعف.
actors.mobs.shaman$redshaman.spell_desc=هذا الشامان يرتدي قناعا أحمر، وسيستعمل سحرا _يضعف قوتك الهجومية_ مؤقتا.
actors.mobs.shaman$blueshaman.spell_desc=هذا الشامان يرتدي قناعا أزرق، وسيستعمل سحرا _يزيد الضرر الذي تتلقاه_ مؤقتا.
actors.mobs.shaman$purpleshaman.spell_desc=هذا الشامان يرتدي قناعا أرجوانيا، وسيستعمل سحرا _يخفّض دقتك ومراوغتك_ مؤقتا.
actors.mobs.armoredbrute.desc=وحوش الغنولات الأكبر الأقدم غالبا ما يرتدون درعا قويا لإظهار مكانتهم. الدرع يجعل هذه الوحوش أكثر صمودا للضرر الجسدي بكثير، وانضباطها الأكبر يعني أنها تستطيع الغضب لفترة أطول بكثير قبل الاستسلام لجروحها.
actors.mobs.skeleton.explo_kill=قُتلت بانفجار العظام...
actors.mobs.skeleton.def_verb=سدّ
actors.mobs.skeleton.desc=الهياكل العظمية مكونة من عظام مغامرين تعساء وسكان السجن، متحركة بانبعاثات سحر شرير من الأعماق أسفل. بعد أن تتعرض لضرر كافٍ، الهياكل العظمية ستتحلل في انفجار عظام. الشظايا من هذا الانفجار ضارة لأي شيء قريب، لكن الدرع فعال جدا في تخفيفها.
actors.mobs.slime.def_verb=سدّ
actors.mobs.slime.desc=الأوحال مخلوقات غريبة، سحرية قليلا بجسد خارجي مطاطي ولب سائل. صهاريج المدينة توفر لهم إمدادا وفيرا من الماء والمغذيات.\n\nبسبب غشائها الخارجي المرن، من الصعب أن تسبب أكثر من _6 ضرر_ للأوحال من أي هجوم واحد.
actors.mobs.snake.hint=حاول استعمال زر الفحص على ثعبان لتعلم كيفية مواجهته.
actors.mobs.snake.desc=هذه الثعابين كبيرة الحجم قادرة على الانزلاق بسرعة حول الضربات، تجعلها صعبة الإصابة جدا. الهجمات السحرية أو هجمات المفاجئة تستطيع إمساكها على حين غرة مع ذلك.\n\nتستطيع أداء هجوم مفاجئ بالهجوم أثناء خروجك من رؤية الثعبان. طريقة واحدة هي ترك ثعبان يطاردك عبر باب ثم _الضرب مباشرة بعد أن يتحرك إلى الباب._
actors.mobs.spectralnecromancer.desc=بينما الهياكل العظمية هي خبز وملح ساحر الأموات، بعضهم يفضل النظر في أتباع أقل جسدية. سحرة الأموات الشبحيون اختاروا الخيول كأتباع لهم المفضل!\n\nخيول فردية ليست قوية كالهياكل العظمية، لكن سحرة هؤلاء الأموات ليسوا خائفين من استدعاء حزمة منهم!
actors.mobs.spinner.desc=عناكب الكهوف هذه ذات الفراء الأخضر تحاول تجنب القتال المباشر. بدل ذلك تفضل الانتظار في البعيد بينما ضحيتها تكافح في شبكتها المفرزة، تموت ببطء من عضتها السامة. قادرة على إطلاق شبكاتها لمسافات عظيمة، وستحاول سد أي طريق تسلكه فريستها.
actors.mobs.statue.def_verb=سدّ
actors.mobs.statue.desc=ستظن أنه مجرد تمثال آخر غير حي من تماثيل هذه السراديب، لكن عيونه الحمراء المتوهجة تفضحه.
actors.mobs.statue.desc_weapon=بينما التمثال نفسه مصنوع من الحجر، _%s_ الذي يحمله يبدو حقيقيا.
actors.mobs.statue.discover_hint=تستطيع إيجاد هذا العدو في أي مكان في السراديب.
actors.mobs.succubus.desc=السوكوبوس مخلوقات متحوّلة الشكل تتلاعب بعقول فريستها. هذه اتخذت شكل بشرية قوطية شاحبة، ربما لجذب سحرة الأقزام؟\n\nالسوكوبوس قد يسحر عدوهم مؤقتا عندما يهاجمون، يجعل عدوهم غير قادر على مهاجمتهم مباشرة. عندما تهاجم السوكوبوس عدوا مسحورا، ستسرق بعضا من جوهر حياته.
actors.mobs.swarm.desc=سرب الذباب المميت يطن بغضب. كل هجوم غير سحري سيقسمه إلى سربين أصغر لكن خطيرين بالتساوي.
actors.mobs.tengu.notice_gotcha=أمسكتك، يا %s!
actors.mobs.tengu.interesting=لنجعل هذا مثيرا...
actors.mobs.tengu.notice_have=أمسك بك الآن، يا %s!
actors.mobs.tengu.defeated=حر أخيرا...
actors.mobs.tengu.rankings_desc=أُسقط على يد سجان السلاسل
actors.mobs.tengu$bombability$bombblob.desc=سحابة دخان فائق الحرارة تتموج هنا. احذر، إنها على وشك الانفجار!
actors.mobs.tengu$bombability$bombitem.cant_pickup=إنها عالقة في الأرض، لا تستطيع تحريكها!
actors.mobs.tengu$bombability$bombitem.desc=سجان السلاسل رمى قنبلة دخان غريبة المظهر هنا، تتموج تدخينا ساخنا سميكا. إنها تصدر صوت دق بصوت عالٍ، كأنها تُعد تنازليا إلى انفجار!\n\nالقنبلة رسّت نفسها في الأرض، لذلك لا تستطيع التقاطها.
actors.mobs.tengu$chainability.yell_wind=لا مكان للهرب يا %s.
actors.mobs.tengu$chainability.telegraph=سجّان السلاسل يلفّ سلسلة حول قبضته!
actors.mobs.tengu$chainability.telegraph_teaching=سجّان السلاسل يلفّ سلسلة — اخرج من مداه!
actors.mobs.tengu$chainability.teaching_hint=السلسلة تُمسك بك حيث تقف. اقطع خط نظره، أو اقترب منه.
actors.mobs.tengu$chainability.snapped=السلسلة تضرب الهواء.
actors.mobs.tengu$chainability.no_anchor=السلسلة لا تجد ما تتعلّق به — أنت مرتفع عن الأرض!
actors.mobs.tengu$fireability$fireblob.desc=سجان السلاسل رمى مسحوقا ناعما يبدو أنه يشتعل في بخار هنا، إنه على وشك الاشتعال!
actors.mobs.tengu$shockerability$shockerblob.desc=طاقة كهربائية تبنى هنا، أي شيء يقف على هذا المربع سيُصعق في الدور التالي!
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=إنها تطلق كهرباء كثيرة جدا، لا تستطيع إمساكها!
actors.mobs.tengu$shockerability$shockeritem.desc=سجان السلاسل رمى آلة غريبة هنا، تبدو مصنوعة من قطع AE-100. الآلة تقوس الكهرباء باستمرار حولها، لكنها تبدو تسير في نمط قابل للتنبؤ.\n\nمع كل الكهرباء المقوسة حولها، لا توجد طريقة تستطيع بها التقاط هذه.
actors.mobs.thief.stole=اللص سرق %s منك!
actors.mobs.thief.carries=\n\nاللص يحمل _%s._ مسروقة بوضوح.
actors.mobs.thief.escapes=اللص يهرب بـ %s خاصتك!
actors.mobs.thief.desc=بينما هؤلاء النزلاء يتجولون أحرارا من زنزاناتهم، هذا المكان ما زال سجنهم. مع الوقت، أخذ هذا المكان عقولهم وحريتهم معا. منذ فترة طويلة، نسي هؤلاء اللصوص وقطاع الطرق المجانين من هم ولماذا يسرقون.\n\nهؤلاء الأعداء أكثر احتمالا أن يسرقوا ويهربوا مما أن يقاتلوا. تأكد من إبقائهم في نظرك، وإلا قد لا ترى غرضك المسروق أبدا من جديد.
actors.mobs.tormentedspirit.desc=الأرواح المعذّبة أرواح حسنة الطباع بخلاف ذلك أُصيبت بلعنة. طالما هم ملعونون سيهاجمون تماما كروح خبيثة، وأقوى أيضا!\n\n قد يكون من الممكن تطهير اللعنة باستعمال الغرض الصحيح أثناء وجودك بجانب الروح. إن رُفعت اللعنة ستكون الروح ممتنة بالتأكيد...
actors.mobs.tormentedspirit.thank_you=شكرا لك...
actors.mobs.npcs.vaultlaser.ondeath=قُتلت بشعاع التفكك...
actors.mobs.npcs.vaultlaser.desc=هؤلاء الحراس يطلقون أشعة سحر التفكك على فواصل منتظمة أو شبه عشوائية. الأشعة تبدو خطيرة جدا، لكنها تبدو دائما تذهب إلى نفس المكان على الأقل. لا يبدو أن هناك أي طريقة لمقاومة أشعة التفكك، لذلك _ستضطر إلى تجنبها بطريقة ما_.
actors.mobs.npcs.vaultsentry.ondeath=صاعقة البرق قتلتك...
actors.mobs.npcs.vaultsentry.desc=هؤلاء الحراس يمسحون المنطقة في نمط معين مسبقا. يبدون خطرين جدا، بالتأكيد ستُصعق إن كشفك المسح. النمط يمكن تجنبه غالبا، لكن الحراس يجب أن يروك بصريا أيضا لكشفك، لذلك _أي شيء يحجب الرؤية فعال ضدهم_.
actors.mobs.npcs.vaulttokendoor.def_verb=سدّ
actors.mobs.npcs.vaulttokendoor.desc=هذا الباب الذي يبدو غير مقفل لن يتحرك، وعنده آلية غير عادية على سطحه. هناك عشر فجوات تبدو وكأن غرضا مسطحا على شكل ماسة سيدخل فيها.
actors.mobs.npcs.vaulttokendoor.no_tokens=_ربما شيئا تستطيع إيجاده في الخزنة قد يدخل هنا؟_
actors.mobs.npcs.vaulttokendoor.too_few_tokens=_رموز الأقزام الخاصة بك تدخل في الفجوات بشكل مثالي،_ لكن ليس عندك ما يكفي منها.
actors.mobs.npcs.vaulttokendoor.enough_tokens=_عندك رموز أقزام كافية لملء كل فجوة،_ هل تريد وضعها في الباب؟
actors.mobs.npcs.vaulttokendoor.open=افتح الباب
actors.mobs.npcs.vaulttokendoor.not_yet=ليس بعد
actors.mobs.npcs.vaulttokendoor.unlocked=الرموز تبدو تندمج في الباب وتسمع نقرة مميزة لقفل يُفتح.
actors.mobs.npcs.vaultmirror.def_verb=سدّ
actors.mobs.npcs.vaultmirror.desc=هذه المرآة الكبيرة منقوشة برونات قزمية متوهجة متنوعة، تطن بهدوء لكنها لا تبدو أنها تعكس أي شيء فعليا.
actors.mobs.npcs.vaultmirror.approach=أمامك تقف مرآة كبيرة برونات متوهجة رقيقة محفورة في إطارها الذهبي الفاخر. سطح المرآة أسود كالفحم، حتى تقترب. بينما تنحني نحو المرآة تومض الرونات بلمعان ويظهر مشهد مألوف بشكل صادم خلف الزجاج.
actors.mobs.npcs.vaultmirror.scene_warrior=ترى _ختمك الشمعي_ الأحمر، مقطعا إلى نصفين ومدفونا جزئيا في الثلج. المشهد يشبه ذكرى تقريبا، لكن التفاصيل مختلفة. لم تستطع أبدا تحمل رمي الختم بعيدا، الاحتفاظ به شعر كجزء من عقابك. قضيت أيضا وقتا طويلا في النظر إليه، والكسر عند زاوية مختلفة قليلا.
actors.mobs.npcs.vaultmirror.scene_mage=ترى _عصاك السحرية_ ترتكز على طاولة في مكتب. المشهد يشبه ذكرى تقريبا، لكن التفاصيل مختلفة. هذا كان مكتبك العام في معهد السحرة الجنوبي؛ مكان مرئي جدا أن تحتفظ بالعصا فيه. المكتب يبدو معيشا أكثر مما يجب أن يكون أيضا، لم تهتم أبدا بالعمل الحقيقي هناك.
actors.mobs.npcs.vaultmirror.scene_rogue=ترى _عباءة الظلال،_ ترتكز بلطف على حامل في مخزن الأسلحة الملكي. المشهد يشبه ذكرى تقريبا، لكن التفاصيل مختلفة. مخزن الأسلحة هادئ وساكن، والحارس في الخدمة يمسح بهدوء عبر الغرفة بنظرة لطيفة في عينيه. هناك وخزة ذنب مألوفة بينما تراه يقف بسلام وغير متضرر.
actors.mobs.npcs.vaultmirror.scene_huntress=ترى _قوس روحك_ موضوعا على حجر دائري مسطح كبير محاط بغابة كثيفة. المشهد يشبه ذكرى تقريبا، لكن التفاصيل مختلفة. الفسحة الصغيرة حول الحجر هادئة وفارغة، على عكس الاحتفال تماما عندما أُعطيت قوسك. في الحقيقة، لا تستطيع الإحساس بأي شيء من الطبيعة المحيطة على الإطلاق.
actors.mobs.npcs.vaultmirror.scene_duelist=ترى شخصية طويلة مرتدية درع الحرس الملكي تقف أمامك: والدك الراحل. المشهد يشبه ذكرى تقريبا، لكن التفاصيل مختلفة. النظرة اللطيفة في عينيه تماما كما تتذكر، لكن وجهه مُنهك بسنوات لم يعشها أبدا. يمد _سيفه العظيم المسحور_ لك لتأخذه.
actors.mobs.npcs.vaultmirror.scene_cleric=ترى صندوق ذخائر مفتوحا في كنيسة مضاءة بلمعان، يحتوي على _مخطوط الفجر._ المشهد يشبه ذكرى تقريبا، لكن التفاصيل مختلفة. لم تخرج صندوق الذخائر من المخزن أبدا، فقط المخطوط نفسه. الطاقات المضيئة المنبعثة من المخطوط تبدو غير عادية أيضا، كأنها توجه طاقة من مصدر مختلف.
actors.mobs.npcs.vaultmirror.scene_final=تلاحظ أن سطح المرآة الزجاجي اختفى تماما، لا شيء يمنعك من الوصول إلى الداخل وأخذ الغرض.
actors.mobs.npcs.vaultmirror.take=خذ الغرض
actors.mobs.npcs.vaultmirror.scene_take=بينما تصل إلى الداخل وأخذ الغرض المشهد لم يتغير، كأن الغرض يوجد في مكانين في وقت واحد.\n\nالصورة في المرآة تتلاشى، والغرض في يدك يبدو ينبض بلطف بنفس الإيقاع كالرونات حول المرآة.\n\nلست متأكدا حقا مما حدث للتو لكن وجود الغرض يبدو مرتبط بالمرآة، ربما لن تستطيع إخراجه من الخزنة.
actors.mobs.npcs.vaultmirror.scene_nothing=تقترب من المرآة من جديد لكن لا شيء يحدث. سطحها ناعم وصلب، بالكاد تستطيع رؤية انعكاس أطراف أصابعك بينما تلمس الزجاج.
actors.mobs.warlock.bolt_kill=صاعقة الظل قتلتك...
actors.mobs.warlock.desc=بينما تحولت اهتمامات الأقزام من الهندسة إلى الفنون الغامضة، صعدت سحرة الظلام إلى السلطة في المدينة. بدأوا بالسحر العنصري، لكنهم سرعان ما انتقلوا إلى استحضار الوحوش وسحر الأموات. أقوى هؤلاء السحرة استولى على عرش المدينة القزمية، وسُمح لرفاقه بالاستمرار في ممارسة سحرهم المظلم، طالما استسلموا بإرادتهم الحرة له.\n\nهؤلاء السحرة يمتلكون سحرا تخريبيا قويا، وقادرون على إعاقة سحر الترقية المطبق على معداتك مؤقتا. كلما كان غرض مرقّى أكثر، كان أثره أقوى.
actors.mobs.wraith.desc=الروح الخبيثة روح منتقمة لآثم، قبره أو مدفنه اقلقه أحد. لكونها كيانا غير مادي، من الصعب إصابتها بسلاح عادي جدا.
actors.mobs.wraith.discover_hint=تستطيع إيجاد هذا العدو في أي مكان في السراديب.
actors.mobs.yogdzewa.notice=أنا. أراك.
actors.mobs.yogdzewa.darkness=الظلام يقترب أكثر...
actors.mobs.yogdzewa.hope=أملك. سراب!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=التهمه الظلام المختوم
actors.mobs.yogdzewa.desc_spawners=تستطيع الشعور بموجات طاقة مظلمة تشع إلى العين من الطوابق أعلاه. شيء تركته حيا هناك فوق لا بد أنه يوجه القوة إلى الظلام المختوم من جديد. _الظلام سيستعمل هذه الطاقة لاستدعاء أتباع أقوى!_
actors.mobs.yogdzewa$larva.rankings_desc=التهمه الظلام المختوم
actors.mobs.yogdzewa$larva.desc=هذه اليرقات الصغيرة من الظلام المختوم أتباع بسيطة سهلة الإنتاج. بينما ضعيفة فرديا، تُستدعى بسرعة وتستطيع أن تصبح ساحقة بأعداد كبيرة.
actors.mobs.yogdzewa$yogripper.rankings_desc=التهمه الظلام المختوم
actors.mobs.yogdzewa$yogeye.rankings_desc=التهمه الظلام المختوم
actors.mobs.yogdzewa$yogscorpio.rankings_desc=التهمه الظلام المختوم
actors.mobs.yogfist.invuln_warn=القبضة محصنة بينما قريبة من العين!
actors.mobs.yogfist.rankings_desc=التهمه الظلام المختوم
actors.mobs.yogfist.desc=هذه القبضة جانب من قوة الظلام المختوم. القبضات مرتبطة بقوة الظلام المختوم، وستُحمى من كل الضرر عندما تكون قريبة من العين.
actors.mobs.yogfist$burningfist.desc=هذه القبضة مكوّنة من سحر ناري فوضوي. بينما تتحرك ستُشعل باستمرار التضاريس حولها ملتهبة. قادرة أيضا على إطلاق انفجارات قوة نارية، تنشر الألسنة حيث تصطدم.\n\nقدرة القبضة على نشر الألسنة تُقمع عندما تكون قرب الماء، لكن حرارتها عظيمة جدا بحيث أن أي ماء حولها سيتبخر بعد فترة قصيرة!
actors.mobs.yogfist$soiledfist.desc=هذه القبضة مكوّنة من سحر ترابي فوضوي. بينما تتحرك ستجعل باستمرار النباتات تنبت حولها. تستطيع أيضا إطلاق انفجارات ترابية مركزة ستشرك هدفها في كروم وجذور سريعة النمو!\n\nالقبضة تستمد القوة من هذه الحياة النباتية، وستقاوم الضرر بناء على كمية النباتات العالية أو المخددة القريبة منها!
actors.mobs.yogfist$rottingfist.desc=هذه القبضة مكوّنة من فساد حي. إنها كتلة شاهقة من لحم متعفن يستطيع نشر ناز كاوٍ في الاشتباك وغاز سام عن بعد. أسوأ من ذلك، كتلة القبضة العظيمة تجعلها تنزف بدل أن تتلقى ضررا مباشرة.\n\nالماء يمكن أن تُستعمل لغسل الناز، لكن القبضة قادرة أيضا على امتصاص الماء لشفاء نفسها! بالإضافة إلى ذلك، إضرار القبضة أثناء نزيفها سيجعل النزيف يتجدد، لكن لا يتكدس!
actors.mobs.yogfist$rustedfist.desc=هذه القبضة مكوّنة من معدن حي. إنها كتلة شاهقة من معدن متحول عندها هجمات اشتباك قوية، وتستطيع شل أهدافها عن بعد. بسبب كتلتها الهائلة، القبضة ستتلقى أي ضرر موجه لها مع الوقت، بدل فورا.\n\nالقبضة غير مرنة مع ذلك، ولا تستطيع التحرك إلى ممرات ضيقة. بالإضافة إلى ذلك، بينما قد تتلقى الضرر ببطء، الضرر المؤجل سيستمر في الازدياد إن ضُربت القبضة مرات متعددة.
actors.mobs.yogfist$brightfist.name=قبضة لامعة
actors.mobs.yogfist$brightfist.teleport=القبضة تنتقل آنيا بعيدا في ومضة ضوء تعميك بشكل خطير!
actors.mobs.yogfist$brightfist.desc=هذه القبضة مكوّنة من طاقة ضوء نقية. قادرة على إطلاق أشعة ضوء حارق قوية كل دور! هذه الأشعة ستعميك مؤقتا بالإضافة إلى إلحاق ضرر ثقيل. القبضة قادرة أيضا على إغراق الساحة وجيزة في ضوء معمٍ للهروب!\n\nالقبضة ليس عندها قدرات خاصة تستطيع استعمالها في مدى الاشتباك مع ذلك.
actors.mobs.yogfist$darkfist.name=قبضة مظلمة
actors.mobs.yogfist$darkfist.teleport=القبضة تنتقل آنيا بعيدا في انفجار ظلام يطفئ مصدر ضوئك!
actors.mobs.yogfist$darkfist.desc=هذه القبضة مكوّنة من طاقة مظلمة نقية. قادرة على إطلاق انفجارات سحر مظلم قوية كل دور! هذه الانفجارات ستضعف مصدر ضوئك بالإضافة إلى إلحاق ضرر ثقيل. القبضة قادرة أيضا على إغراق الساحة وجيزة في ظلام للهروب!\n\nالقبضة ليس عندها قدرات خاصة تستطيع استعمالها في مدى الاشتباك مع ذلك.
