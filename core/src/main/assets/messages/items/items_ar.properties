items.kindofweapon.which_equip_msg=أي خانة سلاح ترغب في تجهيز هذا الغرض فيها؟\n\nالنصلان التوأم تهاجم مباشرة بسلاحها الأساسي، لكنها تستطيع استعمال قدرة أي من السلاحين. كلا السلاحين يتقاسمان نفس عدد الشحنات.\n\nالنصلان التوأم تستطيع أيضا تبديل سلاحيها الأساسي والثانوي فورا.
