items.wands.cursedwand.transmogrify_other=غرضك يتحول إلى شيء مختلف!
items.wands.cursedwand.disguise=مظهرك يتغير أمام عينيك!
items.wands.cursedwand.supernova=كرة طاقة متوهجة تبدأ بالنمو. ربما عليك الهرب!
items.wands.cursedwand.supernova_positive=كرة طاقة متوهجة تبدأ بالنمو، لكنها آمنة بطريقة ما.
items.wands.cursedwand.sinkhole=الأرض تبدأ بالانهيار من حولك!
items.wands.cursedwand.sinkhole_positive=الأرض تبدأ بالانهيار، لكنها تبدو صلبة بما يكفي تحتك.
items.wands.cursedwand.gravity=الجاذبية تبدأ فجأة بالجذب في اتجاهات عشوائية!
items.wands.cursedwand.gravity_positive=الجاذبية تبدأ فجأة بالجذب في اتجاهات عشوائية، لكن هذا لا يبدو أنه يؤثر فيك.
items.wands.cursedwand.gravity_end=فوضى الجاذبية انتهت.
