items.artifacts.skeletonkey.locked_with_key=ذلك الباب أقفله مفتاح هيكلك.
items.artifacts.skeletonkey.force_lock=القفل ضعف بدون مفتاح هيكلك. تنجح في فتحه بالقوة.
items.artifacts.skeletonkey.discard=تتخلص من مفاتيحك الزائدة.
items.artifacts.skeletonkey.levelup=مفتاح هيكلك ينمو أقوى!
items.artifacts.skeletonkey.desc=مفتاح مهم المظهر برأس على شكل جمجمة. أسنانه تبدو مختلفة كل مرة تنظر إليها.
items.artifacts.skeletonkey.desc_worn=هذا المفتاح السحري يبدو أنه يكسب قوة بينما تستعمله بدل مفاتيح السراديب العادية. يمكن إدخاله في أي قفل تقريبا من أقفال السراديب لفتحهم أو غلقهم، بما فيه الأبواب التي لم تُقفل من قبل أبدًا.\n\nالمفتاح يمكن استعماله حتى على مساحة فارغة في اتجاه أساسي أو قطري لـ 'إقفال' الهواء أمامك، يخلق حائطا صلبا بعرض 3 مربعات يدوم 10 أدوار. الإقفال سيدفع الأعداء بعيدا إن كانت هناك مساحة لفعل ذلك.
items.artifacts.skeletonkey.desc_cursed=المفتاح الملعون يبدو أنه يتجنب بحيوية الدخول في أي قفل، ويصعّب عليك حتى (لكن ليس مستحيلا) استعمال مفاتيحك الأخرى.
items.artifacts.skeletonkey$keywall.desc=حائط سحري مؤقت وضعه مفتاح الهيكل هنا.
items.artifacts.talismanofforesight.name=طلسم التنبؤ
items.artifacts.talismanofforesight.ac_scry=استبصر
items.artifacts.talismanofforesight.low_charge=الطلسم يتطلب على الأقل شحنا 5% للاستبصار.
items.artifacts.talismanofforesight.prompt=اختر موقعا للمسح.
items.artifacts.talismanofforesight.levelup=طلسمك ينمو أقوى!
items.artifacts.talismanofforesight.full_charge=طلسمك مشحون بالكامل!
items.artifacts.talismanofforesight.desc=حجر ناعم بنقوش غريبة عليه. تشعر وكأنه يراقب كل شيء حولك، يبقي عينا لأي شيء مخبأ.
items.artifacts.talismanofforesight.desc_worn=عندما تمسك الطلسم تشعر وكأن حواسك مرتفعة. الطلسم يبني الشحن ببطء مع مرور الوقت وعندما تكتشف الأبواب المخبأة أو الفخاخ.\n\nالطلسم يستطيع إنفاق شحنه لـ 'يستبصر' في شكل مخروطي، يكشف كل المربعات والأسرار في المنطقة الممسوحة، وسيمنحك رؤية الأعداء والأغراض لفترة قصيرة.
items.artifacts.talismanofforesight.desc_cursed=الطلسم الملعون يحدق بشكل مكثف فيك، يخفت حواسك.
items.artifacts.talismanofforesight$foresight.name=تنبؤ
items.artifacts.talismanofforesight$foresight.uneasy=تشعر بعدم الارتياح.
items.artifacts.talismanofforesight$foresight.desc=تشعر بعصبية كبيرة، كأن هناك خطرا قريبا غير مرئي.
items.artifacts.timekeepershourglass.name=ساعة حارس الزمن الرملية
items.artifacts.timekeepershourglass.ac_activate=فعّل
items.artifacts.timekeepershourglass.deactivate=تعطّل تجميد الزمن.
items.artifacts.timekeepershourglass.no_charge=ساعتك الرملية لم تُعاد شحنها كفاية لتكون قابلة للاستعمال بعد.
items.artifacts.timekeepershourglass.cursed=لا تستطيع استعمال ساعة رملية ملعونة.
items.artifacts.timekeepershourglass.onstasis=العالم يبدو يتحول حولك في لحظة.
items.artifacts.timekeepershourglass.onfreeze=كل شيء حولك يتجمد فجأة.
