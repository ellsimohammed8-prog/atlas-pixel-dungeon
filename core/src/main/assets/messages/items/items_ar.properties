items.scrolls.scroll.naudiz=مخطوطة NAUDIZ
items.scrolls.scroll.berkanan=مخطوطة BERKANAN
items.scrolls.scroll.odal=مخطوطة ODAL
items.scrolls.scroll.tiwaz=مخطوطة TIWAZ
items.scrolls.scroll.unknown_desc=رونية سحرية غير قابلة للفك مكتوبة على هذه القطعة. من يعلم ماذا ستفعل عند قراءتها بصوت عالٍ؟
items.scrolls.scroll.blinded=لا تستطيع قراءة مخطوطة بينما أنت معمى.
items.scrolls.scroll.no_magic=لا تستطيع قراءة مخطوطة بينما أنت محصن سحريا.
items.scrolls.scroll.cursed=كتاب تعويذاتك الملعون يمنعك من استدعاء سحر هذه المخطوطة! مخطوطة إزالة لعنة قد تكون قوية بما يكفي للعمل رغم ذلك...
items.scrolls.scroll$placeholder.name=مخطوطة
items.scrolls.inventoryscroll.warning=هل تريد حقا إلغاء استعمال هذه المخطوطة؟ المخطوطة لم تكن معروفة من قبل، لذا ستُستهلك على أي حال.
items.scrolls.inventoryscroll.yes=نعم، أنا متأكد
items.scrolls.inventoryscroll.no=لا، غيرت رأيي
items.scrolls.scrollofidentify.name=مخطوطة التعريف
items.scrolls.scrollofidentify.inv_title=عرّف غرضا
items.scrolls.scrollofidentify.it_is=غرضك قد تم تعريفه: %s.
items.scrolls.scrollofidentify.desc=هذه المخطوطة تكشف بشكل دائم كل أسرار غرض واحد.
items.scrolls.scrolloflullaby.name=مخطوطة تهويدة
items.scrolls.scrolloflullaby.sooth=المخطوطة تنطق لحنا مهدئا. تشعر بنعاس شديد.
items.scrolls.scrolloflullaby.desc=قراءة هذه المخطوطة تبث لحنا مهدئا سيرقد كل من يسمعه في نوم سحري عميق. للقارئ وحلفائه النوم استرجاعي.
items.scrolls.scrollofmagicmapping.name=مخطوطة رسم خريطة سحري
items.scrolls.scrollofmagicmapping.layout=أنت الآن مدرك بتخطيط المستوى.
items.scrolls.scrollofmagicmapping.desc=عندما تُقرأ هذه المخطوطة، صورة واضحة البلورية ستُحفر في ذاكرتك، تنبيهك إلى تخطيط المستوى الدقيق وتكشف كل الأسرار المخبأة. مواقع الأغراض والمخلوقات ستبقى مجهولة.
items.scrolls.scrollofmirrorimage.name=مخطوطة صورة مرآة
items.scrolls.scrollofmirrorimage.copies=المخطوطة تشكل صور مرآة لك.
items.scrolls.scrollofmirrorimage.no_copies=المخطوطة تحاول خلق صور مرآة لك، لكن ليس لديهم مكان للذهاب.
items.scrolls.scrollofmirrorimage.desc=التعويذة على هذه المخطوطة ستخلق توأمين وهميين للقارئ. صور المرآة هذه تعمل كنسخ أضعف من القارئ، وستطارد أعدائهم. ليس عندهم متانة مع ذلك، وستتلاشى عند تلقي الضرر.
items.scrolls.scrollofretribution.name=مخطوطة قصاص
items.scrolls.scrollofretribution.blast=طاقة سحرية قوية تندفع من المخطوطة!
items.scrolls.scrollofretribution.desc=هذه المخطوطة تحتوي على طاقة مدمرة توجه معاناة القارئ إلى الخارج في انفجار قوة. كلما كان القارئ أضعف، كان الضرر الذي يسببه أكبر. عند صحة منخفضة جدا هذه المخطوطة تستطيع قتل معظم الأعداء فورا.\n\nاستعمال المخطوطة يأخذ حصيلة على المستعمل مع ذلك، يعميهم ويضعفهم.
items.scrolls.scrollofrage.name=مخطوطة غضب
items.scrolls.scrollofrage.roar=المخطوطة تبث هديرا مغضبا يرن عبر السراديب!
items.scrolls.scrollofrage.desc=عند القراءة بصوت عالٍ، هذه المخطوطة ستطلق هديرا عظيما يجذب كل الأعداء إلى القارئ، ويغضب القريبين منهم.
items.scrolls.scrollofrecharging.name=مخطوطة إعادة شحن
items.scrolls.scrollofrecharging.surge=موجة طاقة تجري عبر جسدك، تنشط عصيك!
items.scrolls.scrollofrecharging.desc=القوة السحرية الخام المقيدة في هذه القطعة ستشحن كل عصي المستعمل مع الوقت عند إطلاقها.
items.scrolls.scrollofremovecurse.name=مخطوطة إزالة لعنة
items.scrolls.scrollofremovecurse.inv_title=طهّر غرضا
items.scrolls.scrollofremovecurse.cleansed=غرضك يتوهج بضوء تطهير، وطاقة خبيثة تتبدد!
items.scrolls.scrollofremovecurse.not_cleansed=غرضك يتوهج بضوء تطهير، لكن لا شيء يحدث.
items.scrolls.scrollofremovecurse.spirit=مخطوطتك تحرر الروح المعذّبة!
items.scrolls.scrollofremovecurse.desc=التعويذة على هذه المخطوطة ستزيل فورا أي لعنات من سلاح واحد، أو خاتم، أو عصا، أو درع، أو أثر.
items.scrolls.scrollofteleportation.name=مخطوطة نقل آني
items.scrolls.scrollofteleportation.tele=في غمضة عين نُقلت آنيا إلى موقع آخر في المستوى.
items.scrolls.scrollofteleportation.no_tele=سحر النقل الآني يفشل.
items.scrolls.scrollofteleportation.cant_reach=لا تستطيع النقل الآني إلى هناك.
items.scrolls.scrollofteleportation.prompt=اختر موقعا للنقل الآني
items.scrolls.scrollofteleportation.desc=التعويذة على هذه القطعة تنقل القارئ فورا إلى موقع مختلف في مستوى السراديب. المخطوطة تعطي الأولوية للمناطق التي لم يذهب إليها القارئ من قبل، مع أنها غير قادرة على النقل الآني عبر الأبواب المقفولة أو المتاريس. يمكنها، مع ذلك، أن تكشف الأبواب المخبأة التي تؤدي إلى مناطق جديدة.
items.scrolls.scrollofterror.name=مخطوطة رعب
items.scrolls.scrollofterror.none=المخطوطة تبث ومضة ضوء أحمر لامعة.
items.scrolls.scrollofterror.one=المخطوطة تبث ومضة ضوء أحمر لامعة و%s يهرب!
items.scrolls.scrollofterror.many=المخطوطة تبث ومضة ضوء أحمر لامعة والوحوش تهرب!
items.scrolls.scrollofterror.desc=عند القراءة، هذه المخطوطة ستبث ومضة ضوء أحمر ستُغرق كل الأعداء في مجال رؤيتك بالرعب، وسيستديرون ويهربون. مهاجمة عدو هارب ستقصّر الأثر.
items.scrolls.scrolloftransmutation.name=مخطوطة تحويل
items.scrolls.scrolloftransmutation.inv_title=حوّل غرضا
items.scrolls.scrolloftransmutation.nothing=لا شيء مثير يحدث.
items.scrolls.scrolloftransmutation.morph=غرضك يتحول إلى شيء مختلف!
items.scrolls.scrolloftransmutation.desc=هذه المخطوطة تحتوي على سحر تحويل قوي. عند استعمالها على غرض مؤهل ستحوله إلى غرض مختلف من نفس النوع. السحر سيحفظ حتى الترقيات والمسحورات والرموز. المخطوطات والجرعات ستُحوّل إلى ما يعادلها الغريب، والعكس صحيح.
items.scrolls.scrollofupgrade.name=مخطوطة ترقية
items.scrolls.scrollofupgrade.inv_title=رقِّ غرضا
items.scrolls.scrollofupgrade.weaken_curse=مخطوطة الترقية تضعف اللعنة على غرضك.
items.scrolls.scrollofupgrade.remove_curse=مخطوطة الترقية تطهر اللعنة على غرضك!
items.scrolls.scrollofupgrade.desc=هذه المخطوطة سترقي غرضا واحدا أو مجموعة أسلحة مرماة. العصي ستزيد في القوة وعدد الشحنات، الأسلحة والدروع ستسبب وتسد ضررا أكبر، مجموعات الأسلحة المرماة ستُصلح بالكامل وتصبح أكثر متانة، وآثار الخواتم ستتكثف.\n\nيمكنها حتى أن تضعف أو أحيانا تبدد اللعنات بالكامل، مع أنها ليست بقوة مخطوطة إزالة لعنة. للأسف، سحر الترقية يمكن أن يمسح أيضا المسحورات أو الرموز على معدات مستوى أعلى.
items.scrolls.exotic.exoticscroll.kaunan=مخطوطة غريبة KAUNAN
items.scrolls.exotic.exoticscroll.sowilo=مخطوطة غريبة SOWILO
items.scrolls.exotic.exoticscroll.laguz=مخطوطة غريبة LAGUZ
items.scrolls.exotic.exoticscroll.yngvi=مخطوطة غريبة YNGVI
items.scrolls.exotic.exoticscroll.gyfu=مخطوطة غريبة GYFU
items.scrolls.exotic.exoticscroll.raido=مخطوطة غريبة RAIDO
items.scrolls.exotic.exoticscroll.isaz=مخطوطة غريبة ISAZ
items.scrolls.exotic.exoticscroll.mannaz=مخطوطة غريبة MANNAZ
items.scrolls.exotic.exoticscroll.naudiz=مخطوطة غريبة NAUDIZ
items.scrolls.exotic.exoticscroll.berkanan=مخطوطة غريبة BERKANAN
items.scrolls.exotic.exoticscroll.odal=مخطوطة غريبة ODAL
items.scrolls.exotic.exoticscroll.tiwaz=مخطوطة غريبة TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=رونية سحرية متوهجة غير قابلة للفك مكتوب على هذه القطعة السوداء. يبدو غريبة على هذه الأرض، من يعلم ماذا ستفعل عند قراءتها بصوت عالٍ؟
items.scrolls.exotic.exoticscroll.discover_hint=تستطيع صنع هذا الغرض عبر الكيمياء.
items.scrolls.exotic.scrollofsirenssong.name=مخطوطة أغنية السيرين
items.scrolls.exotic.scrollofsirenssong.prompt=اختر هدفا
items.scrolls.exotic.scrollofsirenssong.no_target=المخطوطة تُفعّل دون هدف.
items.scrolls.exotic.scrollofsirenssong.cancel=يجب أن تختار هدفا.
items.scrolls.exotic.scrollofsirenssong.desc=قراءة هذه المخطوطة تبث لحنا جذابا سيأسر عدوا مستهدفا، يحوله إلى حليف بشكل دائم! الأعداء الآخرون الذين يسمعونه سيُسحرون مؤقتا.\n\nالأعداء الأقوياء بشكل خاص يمكنهم مقاومة أثر الأسر، وسيُسحرون بدل ذلك.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=مأسور
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=هذا المخلوق تم سحره بسحر مخطوطة أغنية السيرين.\n\nالشخصية المأسورة حليفك بشكل دائم، وستقاتل أي أعداء تواجهم.
items.scrolls.exotic.scrollofantimagic.name=مخطوطة مضاد السحر
items.scrolls.exotic.scrollofantimagic.desc=التعويذة على هذه المخطوطة ستحيطك بهالة سحرية تمنع مؤقتا كل الآثار السحرية، الضارة أو المفيدة. هذا يشمل معظم آثار الأغراض السحرية مثل العصي والمخطوطات والخواتم والآثار والمسحورات واللعنات. قدرات درع البطل قوية بما يكفي للعمل بغض النظر مع ذلك.
items.scrolls.exotic.scrollofchallenge.name=مخطوطة تحدي
items.scrolls.exotic.scrollofchallenge.desc=عند القراءة بصوت عالٍ، هذه المخطوطة ستطلق هديرا عظيما يجذب الأعداء إلى المستعمل بينما في نفس الوقت يخلق ساحة صغيرة حولهم.\n\nطالما يبقى القارئ في هذه الساحة سيأخذ ضررا أقل بنسبة 33% من جميع المصادر (هذا يطبق قبل أشكال أخرى من تخفيض الضرر)، ولن يفقدوا الإشباع.\n\nحجم الساحة سيتناسب مع حجم المنطقة التي يوجد فيها القارئ. سيكون صغير بشكل خاص في بعض مناطق الزعماء.
items.scrolls.exotic.scrollofchallenge$challengearena.name=ساحة التحدي
items.scrolls.exotic.scrollofchallenge$challengearena.desc=ساحة سحرية ظهرت حولك، تدل عليها ضباب أحمر متموج.\n\nبينما تقف في الضباب، جوعك لن يزداد وستأخذ ضررا أقل بنسبة 33%% من جميع المصادر. إن كان عندك أي مصادر أخرى لتخفيض الضرر (مثل الدرع)، ستطبق بعد تخفيض 33%%.\n\nالأدوار المتبقية: %d.
items.scrolls.exotic.scrollofdivination.name=مخطوطة تنبؤ
items.scrolls.exotic.scrollofdivination.nothing_left=لا يوجد شيء متبقي للتعريف!
items.scrolls.exotic.scrollofdivination.desc=هذه المخطوطة ستعرّف عشوائيا أربعة أنواع من الأغراض التي لا تعرفها حاليا. الأنواع المعرفة يمكن أن تكون لون جرعة، أو رونية مخطوطة، أو جوهرة خاتم. الأغراض المعرفة لن تكون بالضرورة تلك التي تحملها.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=مخطوطة تنبؤك حددت الأغراض التالية:
items.scrolls.exotic.scrollofdread.name=مخطوطة ذعر
items.scrolls.exotic.scrollofdread.desc=عند القراءة، هذه المخطوطة ستبث ومضة ضوء أحمر ستغرس رعبا لا يُصدق في كل الأعداء في مجال رؤيتك. عظيم جدا هذا الأثر بحيث أنهم سيحاولون بسرعة الهرب من السراديب برمتها، ولن يُرى أبدا من جديد!\n\nتماما كما مع الرعب، هذا الأثر يمكن أن ينتهي مع الوقت، أو إن هوجم العدو.\n\nالأعداء ذوو الإرادة القوية، مثل الزعماء، سيُصابون بالرعب العادي بدل ذلك.
items.scrolls.exotic.scrollofenchantment.name=مخطوطة سحر
items.scrolls.exotic.scrollofenchantment.inv_title=اسحر غرضا
items.scrolls.exotic.scrollofenchantment.weapon=اختر مسحورة لتطبيقها على سلاحك.
items.scrolls.exotic.scrollofenchantment.armor=اختر رمزا لتطبيقه على درعك.
items.scrolls.exotic.scrollofenchantment.cancel=ألغِ
items.scrolls.exotic.scrollofenchantment.cancel_warn=الإلغاء سيستهلك مخطوطة سحرك أيضا، هل أنت متأكد؟
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=نعم، أنا متأكد
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=لا، غيرت رأيي
items.scrolls.exotic.scrollofenchantment.desc=هذه المخطوطة ستشبع سلاحا أو درعا بطاقة سحرية قوية. القارئ عنده حتى درجة من التحكم في أي سحر يُشبع.
items.scrolls.exotic.scrollofforesight.name=مخطوطة تنبؤ
items.scrolls.exotic.scrollofforesight.desc=بعد قراءة هذه المخطوطة، تفاصيل التضاريس القريبة ستُغذى باستمرار إلى عقل القارئ بوضوح بلوري. هذا الأثر يدوم لفترة طويلة من الوقت، وسيكشف كل الأبواب المخبأة أو الفخاخ، يجعل البحث غير ضروري.
items.scrolls.exotic.scrollofmetamorphosis.name=مخطوطة تحول
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=اختر موهبة للتحول.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=اختر موهبة جديدة لاستبدال موهبتك المحولة.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=الإلغاء سيستهلك مخطوطة تحولك أيضا، هل أنت متأكد؟
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=حوّل موهبة
items.scrolls.exotic.scrollofmetamorphosis.desc=هذه المخطوطة تحتوي على سحر تحويل قوي، سيطبق على الملقي بدل غرض. سحر هذه المخطوطة سيتيح لك اختيار موهبة واحدة، واستبدالها بواحدة من خمس مواهب من نفس المرتبة من فئات أبطال مختلفة!\n\nهذا الأثر يمكن أن يطبق فقط على مواهب الفئة، لا على المواهب المكتسبة من الفئات الفرعية أو قدرات الدرع. المواهب التي لا تستطيع استعمالها لن تكون خياراً.
items.scrolls.exotic.scrollofmysticalenergy.name=مخطوطة طاقة غامضة
items.scrolls.exotic.scrollofmysticalenergy.desc=القوة السحرية الخام المقيدة في هذه القطعة ستقوم، عند إطلاقها، بشحن آثار المستعمل المجهزة مع الوقت.
items.scrolls.exotic.scrollofpassage.name=مخطوطة مرور
items.scrolls.exotic.scrollofpassage.desc=التعويذة على هذه القطعة تنقل القارئ فورا إلى أقرب منطقة في الطابق الأول أعلاهم. مفيدة جدًا للوصول بسرعة إلى متجر.
items.scrolls.exotic.scrollofprismaticimage.name=مخطوطة صورة موشورية
items.scrolls.exotic.scrollofprismaticimage.desc=التعويذة على هذه المخطوطة ستخلق توأما وهميا ملونا للقارئ. صورة الموشور هذه تعمل كنسخة أضعف من القارئ، بدفاع مماثل لكن صحة وضرر أقل.\n\nصورة الموشور ستظهر نفسها عندما يوجد أعداء، وستحاول الدفاع عن القارئ.\n\nإن وجدت صورة موشورية أصلا، استعمال هذه المخطوطة سيشفيها بالكامل.
items.scrolls.exotic.scrollofpsionicblast.name=مخطوطة انفجار نفسي
items.scrolls.exotic.scrollofpsionicblast.ondeath=الانفجار النفسي يمزق عقلك إربا...
items.scrolls.exotic.scrollofpsionicblast.desc=هذه المخطوطة تحتوي على طاقة مدمرة لا تُصدق يمكن توجيهها لتدمير عقول جميع المخلوقات المرئية.\n\nهناك ارتداد كبير مع ذلك، والقارئ سيتعرض أيضا للضرر والعمى والضعف. كلما أصابت المخطوطة أهدافا أكثر، كان الضرر الذاتي أقل.
items.spells.alchemize.name=تحويل كيميائي
items.spells.alchemize.prompt=حوّل غرضا كيميائيا
items.spells.alchemize.desc=هذه التعويذة تحتوي على قوى تحويلية مشابهة لتلك الموجودة في قدر كيمياء. كل إلقاء يتيح للمستعمل أن يحوّل غرضا (أو كومة أغراض) إلى ذهب أو طاقة كيميائية. تحويل الجرعات أو المخطوطات إلى طاقة سيعرّفهم حتى!\n\nبضعة استعمالات للتحويل الكيميائي تُباع من المتاجر، لكن الكثير أكثر يمكن صنعه باستعمال الكيمياء بجمع بذرة، وحجر روني، وقليل من الطاقة الكيميائية.
items.spells.alchemize$wndalchemizeitem.sell=حوّل إلى %d ذهب
items.spells.alchemize$wndalchemizeitem.sell_1=حوّل 1 إلى %d ذهب
items.spells.alchemize$wndalchemizeitem.sell_all=حوّل الكل إلى %d ذهب
items.spells.alchemize$wndalchemizeitem.energize=حوّل إلى %d طاقة
items.spells.alchemize$wndalchemizeitem.energize_1=حوّل 1 إلى %d طاقة
items.spells.alchemize$wndalchemizeitem.energize_all=حوّل الكل إلى %d طاقة
items.spells.beaconofreturning.name=منارة العودة
items.spells.beaconofreturning.preventing=هالة سحر قوي لهذا المكان تمنعك من استعمال التعويذة!
items.spells.beaconofreturning.creatures=هالة نفسية للمخلوقات المجاورة لا تسمح لك بالنقل الآني في هذه اللحظة.
items.spells.beaconofreturning.set=المنارة تم تعيينها في موقعك الحالي.
items.spells.beaconofreturning.wnd_body=التعيين سيتجاوز الموقع الذي عينت فيه المنارة سابقا.\n\nالعودة ستعود إلى آخر موقع معين لك وتستهلك استعمالا واحدا للتعويذة.
items.spells.beaconofreturning.wnd_set=عيّن
items.spells.beaconofreturning.wnd_return=ارجع
items.spells.beaconofreturning.desc_set=هذه المنارة عُيّنت في مكان ما في الطابق %d.
items.spells.beaconofreturning.desc=هذه التعويذة المعقدة تمنح المستعمل القدرة على العودة إلى موقع معين، بغض النظر عن المسافة. التعويذة ستُستهلك فقط بالعودة، يمكن تعيينها مرات كثيرة كما تشاء، لكنها ستتذكر فقط آخر موقع عُيّنت فيه.
items.spells.curseinfusion.name=حقن لعنة
items.spells.curseinfusion.inv_title=العن غرضا
items.spells.curseinfusion.desc=هذه التعويذة تشبع قطعة معدات بنفس السحر الخبيث القوي الحاضر داخل الـ AE-300. الغرض الذي تُستعمل عليه سيُلعن فورا، وأي مسحورة أو رمز قد كان عنده سيُستبدل.\n\nفي حال الأسلحة والدروع والعصي، الغرض سيكسب ترقيات بالإضافة إلى كونه ملعونا. ترقيات حقن اللعنة لا تتراكم، والترقيات تضيع إن أصبح الغرض غير ملعون.\n\nحقن لعنة متعددة يمكن أيضا استعمالها لتغيير اللعنة على سلاح أو درع.
items.spells.spell.ac_cast=ألقِ
items.spells.spell.no_magic=لا تستطيع إلقاء تعويذات بينما أنت محصن سحريا.
items.spells.spell.discover_hint=تستطيع صنع هذا الغرض عبر الكيمياء.
items.spells.magicalinfusion.name=حقن سحري
items.spells.magicalinfusion.inv_title=اشبع غرضا
items.spells.magicalinfusion.infuse=غرضك مشبع بطاقة غامضة!
items.spells.magicalinfusion.desc=هذه التعويذة تمتلك نفس القوة السحرية كمخطوطة ترقية، لكن في شكل أكثر استقرارا.\n\nبالإضافة إلى ترقية غرض كالمعتاد لن تمسح أبدا مسحورة، أو رمزا، أو لعنة.
items.spells.magicalporter.name=حامل سحري
items.spells.magicalporter.inv_title=انقل غرضا
items.spells.magicalporter.nowhere=لا يوجد مكان لك لنقل غرض إليه.
items.spells.magicalporter.desc=هذه التعويذة ستنقل سحريا أي غرض تُلقي عليه. على عكس منارة تاجر مع ذلك، الأغراض ستُنقل إلى مدخل الطابق الزعيم التالي.
items.spells.phaseshift.name=إزاحة الطور
items.spells.phaseshift.no_target=لا يوجد شيء للنقل الآني إلى هناك.
items.spells.phaseshift.desc=هذه التعويذة الفوضوية ستنقل آنيا أي شخصية تُصوب نحوها إلى موقع عشوائي في الطابق الحالي، وتصعقها لفترة كبيرة من الوقت. الأعداء الأقوياء سيستطيعون مقاومة أثر الصعق. هذه التعويذة يمكن توجيهها إلى هدف أو على المستعملين أنفسهم.
items.spells.reclaimtrap.name=استعادة فخ
items.spells.reclaimtrap.no_trap=لا يوجد فخ هناك.
items.spells.reclaimtrap.desc_trap=التعويذة جاهزة حاليا لإطلاق _%s._
items.spells.reclaimtrap.desc=هذه التعويذة تحتوي على بقايا الطاقة الميكانيكية للـ AE-300. عند إلقائها على فخ نشط، قوة الفخ ستصبح مرتبطة بك، يتيح لك استعمال التعويذة من جديد لطرد هذه القوة وإطلاق أثر الفخ في أي موقع يعجبك.\n\nمع ذلك، بعض الفخاخ قد لا تعمل في كل الأماكن، وفخ واحد فقط يمكن تخزينه في كل مرة.
items.spells.recycle.name=إعادة تدوير
items.spells.recycle.inv_title=دوّر غرضا
items.spells.recycle.recycled=غرضك تم تدويره إلى: %s.
items.spells.recycle.desc=هذه التعويذة تحتوي على شكل أقل من سحر التحويل. بينما لن تعمل على المعدات، التعويذة ستحوّل مخطوطة، أو جرعة، أو بذرة، أو حجرا رونيا، أو سهما ذو رأس إلى غرض عشوائي من نفس النوع.
items.spells.summonelemental.name=استدعاء عنصر
items.spells.summonelemental.ac_imbue=اشبع
items.spells.summonelemental.imbue_prompt=اشبع غرضا
items.spells.summonelemental.desc=هذه التعويذة توجه طاقة الجمر العنصري المستعمل لصنعها، وستتيح لك أن تستدعي عنصرا ودودا للقتال معك! عنصر واحد فقط يمكن استدعاؤه في كل مرة، لكن التعويذة يمكن إعادة إلقائها لإعادة العنصر إليك دون تكلفة.
items.spells.summonelemental.desc_newborn=التعويذة حاليا غير مشبعة، وستستدعي _عنصرا مولودا جديدا_ دون هجوم بعيد. تستطيع أن تشبع جرعة معروفة من اللهب السائل، أو جرعة الصقيع، أو مخطوطة إعادة الشحن، أو مخطوطة التحويل لتشغيل التعويذة، ما يجعل الاستدعاءات المستقبلية عناصر كاملة القوة!
items.spells.summonelemental.desc_fire=التعويذة حاليا ساخنة عند اللمس، ستستدعي _عنصر نار._ تستطيع أن تشبع غرضا مختلفا، لكن التعويذة ستفقد إشباعها الحالي.
items.spells.summonelemental.desc_frost=التعويذة حاليا باردة عند اللمس، ستستدعي _عنصر صقيع._ تستطيع أن تشبع غرضا مختلفا، لكن التعويذة ستفقد إشباعها الحالي.
items.spells.summonelemental.desc_shock=التعويذة حاليا تشع طاقة إستاتيكية، ستستدعي _عنصر صدمة._ تستطيع أن تشبع غرضا مختلفا، لكن التعويذة ستفقد إشباعها الحالي.
items.spells.summonelemental.desc_chaos=التعويذة حاليا تشع طاقة فوضوية، ستستدعي _عنصر فوضى._ تستطيع أن تشبع غرضا مختلفا، لكن التعويذة ستفقد إشباعها الحالي.
items.spells.targetedspell.prompt=اختر هدفا
items.spells.targetedspell.inv_title=اشبع غرضا
items.spells.telekineticgrab.name=مسك حركي عن بعد
items.spells.telekineticgrab.cant_grab=لا تستطيع إمساك ذلك.
items.spells.telekineticgrab.no_target=لا يوجد شيء للإمساك به هناك.
items.spells.telekineticgrab.desc=هذه التعويذة تتيح للملقي أن يمسك عن بعد بكل الأغراض في موقع، أو كل الأسلحة المرماة العالقة بعدو!\n\nلا يمكن استعمالها لإمساك أغراض يملكها شخص آخر، أو لإمساك الحاويات مثل الصناديق.
items.spells.unstablespell.name=تعويذة غير مستقرة
items.spells.unstablespell.desc=بلورة مربعة سوداء صغيرة برموز رونية متغيرة على كل من أسطحها.\n\nعند التفعيل، ستطلق أثر مخطوطة عشوائية. أثر المخطوطة سيكون دائما مركزا على القتال إن كان هناك أعداء في مجال رؤيتك، وسيكون دائما مركزا على غير القتال بخلاف ذلك.
items.spells.wildenergy.name=طاقة برية
items.spells.wildenergy.desc=هذه التعويذة تحتوي على بعض من الطاقة الملعونة التي شغّلت الـ AE-300. عند الإلقاء، ستعيد شحن عصيك وآثارك الملبوسة، بينما أيضا تطلق أثر عصا ملعونة عشوائي. تستطيع اختيار اتجاه لهذا السحر الملعون لينطلق فيه، مع ذلك.
items.stones.inventorystone.ac_use=استعمل
items.stones.runestone$placeholder.name=حجر روني
items.stones.runestone.discover_hint=تستطيع إيجاد هذا الغرض عشوائيا في السراديب، أو صنعه عبر الكيمياء.
items.stones.stoneofaggression.name=حجر العدوان
items.stones.stoneofaggression.desc=عندما يُرمى هذا الحجر على حليف أو عدو، كل الأعداء القريبين سيفضلون مهاجمة تلك الشخصية لفترة قصيرة.\n\nالأعداء الزعماء لا يمكن استهدافهم بهذا الأثر مباشرة، لكنه يعمل على أتباعهم.
items.stones.stoneofaggression$aggression.name=مستهدف
items.stones.stoneofaggression$aggression.desc=سحر متلاعب يجعل كل الأعداء القريبين يفضلون مهاجمة هذه الشخصية.\n\nالأدوار المتبقية: %s.
items.stones.stoneofaugmentation.name=حجر التعزيز
items.stones.stoneofaugmentation.inv_title=عزز غرضا
items.stones.stoneofaugmentation.desc=هذا الحجر الروني يمتلك سحرا قويا يستطيع تعزيز المعدات لتعزيز خاصية واحدة بتكلفة أخرى.\n\nاستعماله على سلاح سيتيح لك تعزيز إما السرعة أو الضرر. الأسلحة المرماة ستكسب أو تخسر أيضا متانة بما يتناسب مع سرعتها.\n\nاستعماله على درع سيتيح لك تعزيز إما الدفاع أو المراوغة.
items.stones.stoneofaugmentation.discover_hint=تستطيع شراء هذا الغرض في متجر، أو صنعه عبر الكيمياء.
items.stones.stoneofaugmentation$wndaugment.choice=تعزيز خاصية واحدة سيخفّض الأخرى. أي خاصية ترغب في تعزيزها؟
items.stones.stoneofaugmentation$wndaugment.already=هذا الغرض معزّز أصلا، تستطيع تبديل التعزيز أو إزالته.
items.stones.stoneofaugmentation$wndaugment.speed=+سرعة -ضرر
items.stones.stoneofaugmentation$wndaugment.damage=+ضرر -سرعة
items.stones.stoneofaugmentation$wndaugment.evasion=+مراوغة -دفاع
items.stones.stoneofaugmentation$wndaugment.defense=+دفاع -مراوغة
items.stones.stoneofaugmentation$wndaugment.none=أزل التعزيز
items.stones.stoneofaugmentation$wndaugment.cancel=لا عليك
items.stones.stoneofblast.name=حجر انفجار
items.stones.stoneofblast.desc=هذا الحجر الروني سينفجر فورا في الموقع الذي يُرمى إليه. تماما كالقنبلة، الانفجار سيسبب ضررا لأي شيء قريب.
items.stones.stoneofblink.name=حجر الخطف
items.stones.stoneofblink.desc=هذا الحجر الروني سينقل المستعمل آنيا إلى الموقع الذي يُرمى إليه.
items.stones.stoneofclairvoyance.name=حجر الاستبصار
items.stones.stoneofclairvoyance.desc=هذا الحجر سيكشف فورا كل المربعات في منطقة واسعة جدا حول مكان رميه. أثره سيصل حتى عبر الحيطان.
items.stones.stoneofdeepsleep.name=حجر نوم عميق
items.stones.stoneofdeepsleep.desc=عندما يُرمى هذا الحجر على عدو، سيضعهم في نوم سحري عميق. الأعداء النائمون سحريا سينامون إلى الأبد حتى يُقْلَقوا.
items.stones.stoneofdetectmagic.name=حجر كشف السحر
items.stones.stoneofdetectmagic.inv_title=اكشف غرضا
items.stones.stoneofdetectmagic.detected_none=لا تكشف أي سحر يؤثر في هذا الغرض.
items.stones.stoneofdetectmagic.detected_both=تكشف كلي من السحر الإيجابي والخبيث يأثّر في هذا الغرض!
items.stones.stoneofdetectmagic.detected_good=تكشف سحرا إيجابيا يؤثر في هذا الغرض!
items.stones.stoneofdetectmagic.detected_bad=تكشف سحرا خبيثا يؤثر في هذا الغرض!
items.stones.stoneofdetectmagic.desc=هذا الحجر الروني قادر على كشف السحر المؤثر في غرض. استعمال هذا الحجر على غرض غير معرّف سيخبرك إن كان متأثرا بلعنة خبيثة وما إذا كان متأثرا بسحر إيجابي مثل مسحورة أو ترقيات.
items.stones.stoneofdisarming.name=حجر نزع السلاح
items.stones.stoneofdisarming.desc=هذا الحجر الروني يحمل سحرا يمكن أن يعطل الفخاخ الخبيثة المخبأة عبر السراديب. سينزع سلاح 9 فخاخ حول المنطقة التي يُرمى إليها.
items.stones.stoneofenchantment.name=حجر السحر
items.stones.stoneofenchantment.inv_title=اسحر غرضا
items.stones.stoneofenchantment.weapon=سلاحك يتوهج في الظلام!
items.stones.stoneofenchantment.armor=درعك يتوهج في الظلام!
items.stones.stoneofenchantment.desc=هذا الحجر الروني يمتلك سحر ساحر. على عكس مخطوطة الترقية، لن يزيد القوة المباشرة لغرض، لكنه سيشبع بدل ذلك سلاحا أو درعا بمسحورة، يمنحهم قوة جديدة.
items.stones.stoneoffear.name=حجر الخوف
items.stones.stoneoffear.desc=عندما يُرمى هذا الحجر على شخصية سيُغرقون بالرعب، وسيستديرون ويهربون. مهاجمة شخصية هاربة ستقصر الأثر.
items.stones.stoneofflock.name=حجر القطيع
items.stones.stoneofflock.desc=هذا الحجر الروني يستدعي خرافا سحرية لفترة قصيرة حول الموقع الذي يُرمى إليه.
items.stones.stoneofintuition.name=حجر الحدس
items.stones.stoneofintuition.inv_title=اختر غرضا
items.stones.stoneofintuition.desc=هذا الحجر الروني يحمل نسخة أضعف من السحر الموجود في مخطوطات التعريف. بدل التعريف المباشر لغرض، سيعمل على حدسك، يتيح لك محاولة تعريف نوع جرعة، أو مخطوطة، أو خاتم عبر التخمين.
items.stones.stoneofintuition.break_info=تستطيع استعمال أحجار الحدس مرتين قبل أن ينكسر واحد، _استعمالك التالي لن يستهلك حجرا_.
items.stones.stoneofintuition.break_warn=لقّد استعملت حجر حدس سابقا، لذا _استعمالك التالي سيستهلك حجرا_.
items.stones.stoneofintuition$wndguess.text=خمّن ما هو نوع الغرض غير المعرّف. إن خمنت بشكل صحيح، فسيتم تعريف النوع!
items.stones.stoneofintuition$wndguess.correct=صحيح. نوع الغرض تم تعريفه!
items.stones.stoneofintuition$wndguess.incorrect=تخمينك كان غير صحيح.
items.stones.stoneofintuition$wndguess.break=حجر حدسك يتناثر إلى غبار...
items.stones.stoneofshock.name=حجر الصدمة
items.stones.stoneofshock.desc=هذا الحجر الروني يطلق انفجار طاقة كهربائية تصعق وجيزة كل الأهداف القريبة، وتمنح الرامي شحنة عصا لكل هدف يُصاب.
items.trinkets.chaoticcenser.name=مبخرة فوضوية
items.trinkets.chaoticcenser.spew=مبخرتك على وشك البصق: %s.
items.trinkets.chaoticcenser.desc=بعد بعض الوقت في قدر الكيمياء هذه المبخرة التي تحرق البخور تبدو أنها تنتج دخانا من تلقاء نفسها! هذه الغازات تتعاظم وستبصق من المبخرة نحو الأعداء على فواصل شبه عشوائية. يبدو قادرة على إنتاج أنواع مختلفة من الغازات، لكنك ستحصل على لحظة تحذير قبل تفعيل المبخرة مباشرة.
items.trinkets.chaoticcenser.typical_stats_desc=عادة هذه الحلية ستستحدث غازا ضارا قرب عدو كل _%d_ أدوار تقريبا. الغازات ستظهر فقط عندما يوجد أعداء. عند مستويات أعلى هذه الغازات أكثر احتمالا أن تكون غريبة وقوية.
items.trinkets.chaoticcenser.stats_desc=عند مستواها الحالي، هذه الحلية ستستحدث غازا ضارا قرب عدو كل _%d_ أدوار تقريبا. الغازات ستظهر فقط عندما يوجد أعداء. عند مستويات أعلى هذه الغازات أكثر احتمالا أن تكون غريبة وقوية.
items.trinkets.crackedspyglass.name=منظار متشقق
items.trinkets.crackedspyglass.desc=هذا التلسكوب المحمول باليد سيكون عرضا لصنعة عظيمة ودقيقة، لولا الشق على عدسته الأمامية. المنظار يبدو أنه يساعدك بكشف أغراض جديدة في السراديب، لكن بسبب عيبه الأغراض المكشوفة صعبة الرؤية جدا!
items.trinkets.crackedspyglass.typical_stats_desc=عادة هذه الحلية عندها _%1$s%% فرصة_ أن تخلق غرضا مخبأ إضافيا على كل طابق غير زعيم.
items.trinkets.crackedspyglass.stats_desc=عند مستواها الحالي، هذه الحلية عندها _%1$s%% فرصة_ أن تخلق غرضا مخبأ إضافيا على كل طابق غير زعيم.
items.trinkets.crackedspyglass.stats_desc_upgraded=عند مستواها الحالي، هذه الحلية عندها _فرصة 100%%_ أن تخلق غرضا مخبأ إضافيا على كل طابق غير زعيم، و_%1$s%% فرصة_ أن تخلق غرضا مخبأ إضافيا ثانيا.
items.trinkets.dimensionalsundial.name=ساعة شمسية بعدية
items.trinkets.dimensionalsundial.warning=ساعتك الشمسية لا تلقي ظلا، تشعر بعدم الارتياح.
items.trinkets.dimensionalsundial.desc=هذه الساعة الشمسية الصغيرة المحمولة باليد بطريقة ما قادرة على إلقاء ظل في أعماق السراديب، حتى إن لم تكن تمسكها مستوية. والأغرب من ذلك، أن موقع الظل يبدو لا علاقة له بشمس هذا العالم. عندما لا يُلقى ظل، الساعة الشمسية يبدو أنها تجذب الخطر.
items.trinkets.dimensionalsundial.typical_stats_desc=عادة هذه الحلية ستخفّض معدل استحداث الأعداء بمقدار _%1$d%%_ أثناء النهار في الحياة الواقعية (8 صباحا-8 مساء)، وتزيد معدل استحداث الأعداء بمقدار _%2$d%%_ في الليل (8 مساء-8 صباحا).
items.trinkets.dimensionalsundial.stats_desc=عند مستواها الحالي، هذه الحلية ستخفّض معدل استحداث الأعداء بمقدار _%1$d%%_ أثناء النهار في الحياة الواقعية (8 صباحا-8 مساء)، وتزيد معدل استحداث الأعداء بمقدار _%2$d%%_ في الليل (8 مساء-8 صباحا).
items.trinkets.exoticcrystals.name=بلورات غريبة
items.trinkets.exoticcrystals.desc=هذه البلورات الوردية الصغيرة عندها نفس الشكل كبلورات الطاقة الكيميائية. بينما لا يمكن استعمالها للطاقة مباشرة، يبدو أنها تؤثر بطريقة ما في الجرعات والمخطوطات التي تجدها.
items.trinkets.exoticcrystals.typical_stats_desc=عادة هذه الحلية ستستبدل _%s%%_ من إسقاطات الجرعات أو المخطوطات بما يعادلها الغريب. هذا لا يؤثر في جرعة القوة، أو مخطوطات الترقية، أو الأغراض التي تُستحدث لمساعدة في حل غرف الخطر.
items.trinkets.exoticcrystals.stats_desc=عند مستواها الحالي هذه الحلية ستستبدل _%s%%_ من إسقاطات الجرعات أو المخطوطات بما يعادلها الغريب. هذا لا يؤثر في جرعة القوة، أو مخطوطات الترقية، أو الأغراض التي تُستحدث لمساعدة في حل غرف الخطر.
items.trinkets.eyeofnewt.name=عين سمندل
items.trinkets.eyeofnewt.desc=هذه العين الذهبية والسوداء لسمندل هي مكون شائع، الآن محوّلة إلى حلية. العين يبدو أنها تخفّض رؤيتك في مقابل السماح لك برؤية الأشياء بطرق أخرى.
items.trinkets.eyeofnewt.typical_stats_desc=عادة هذه الحلية ستخفّض مدى رؤيتك بمقدار _%1$s%%_، لكنها ستمنحك أيضا رؤية عقلية للأعداء داخل _%2$d_ من المربعات.
items.trinkets.eyeofnewt.stats_desc=عند مستواها الحالي هذه الحلية ستخفّض مدى رؤيتك بمقدار _%1$s%%_، لكنها ستمنحك أيضا رؤية عقلية للأعداء داخل _%2$d_ من المربعات.
items.trinkets.ferrettuft.name=خصلة فراء نمس
items.trinkets.ferrettuft.desc=خصلة من فراء نمس أبيض حريري، ممسوكة معًا بشريط أخضر ليموني مربوط في عقدة. النمسات معروفة بخفتها، وشقاوتها، وانعدام نزاهتها. بعض من تلك القوة يبدو أنه يشع من الحلية، معززا مراوغة أي شيء قريب.
items.trinkets.ferrettuft.typical_stats_desc=عادة هذه الحلية ستزيد مراوغة كل الشخصيات بمقدار _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=عند مستواها الحالي هذه الحلية ستزيد مراوغة كل الشخصيات بمقدار _%1$s%%_.
items.trinkets.mimictooth.name=سن ميميك
items.trinkets.mimictooth.desc=هذا السن الكبير الحاد لا بد أنه اقتُلع من ميميك تعيس جدا. يبدو أنه يؤثر في ميميكات السراديب، يجعلها أكثر تواترا وخطورة.
items.trinkets.mimictooth.typical_stats_desc=عادة هذه الحلية ستجعل كل أنواع الميميك _%1$sx_ أكثر شيوعا وأصعب بكثير في الكشف، لكنها ستزيد أيضا كمية الغنائم التي تسقطها. كل طابق في السراديب سيكون عنده أيضا _%2$s%% فرصة_ أن يحتوي على ميميك أبنوسي خفي إضافي.
items.trinkets.mimictooth.stats_desc=عند مستواها الحالي هذه الحلية ستجعل كل أنواع الميميك _%1$sx_ أكثر شيوعا وأصعب بكثير في الكشف، لكنها ستزيد أيضا كمية الغنائم التي تسقطها. كل طابق في السراديب سيكون عنده أيضا _%2$s%% فرصة_ أن يحتوي على ميميك أبنوسي خفي إضافي.
items.trinkets.mossyclump.name=كتلة طحلب
items.trinkets.mossyclump.desc=هذه الكتلة من الطحلب المبلل يبدو أنها تحتفظ برطوبتها مهما عصرتها بقوة. يبدو أنها مرتبطة سحريا بالسراديب نفسها، تجعل العشب والماء أكثر احتمالا للظهور.
items.trinkets.mossyclump.typical_stats_desc=عادة هذه الحلية ستجعل _%d%%_ من الطوابق غير ذات الموضوع تصبح مملوءة إما بالماء أو العشب بدل ذلك.\n\nهذه الحلية تكلف كمية أكبر من الطاقة لترقيتها.
items.trinkets.mossyclump.stats_desc=عند مستواها الحالي هذه الحلية ستجعل _%d%%_ من الطوابق غير ذات الموضوع تصبح مملوءة إما بالماء أو العشب بدل ذلك.\n\nهذه الحلية تكلف كمية أكبر من الطاقة لترقيتها.
items.trinkets.parchmentscrap.name=قصاصة رق
items.trinkets.parchmentscrap.desc=هذه القصاصة الصغيرة من الرق يبدو أنها جاءت من مخطوطة. لقد احتفظت ببعض سحرها، ويبدو أنها تؤثر في الأسلحة والدروع الموجودة في السراديب.
items.trinkets.parchmentscrap.typical_stats_desc=عادة هذه الحلية ستجعل المسحورات والرموز _%dx_ أكثر شيوعا، واللعنات على الأسلحة والدروع _%sx_ أكثر شيوعا. اللعنات على العصي، أو الخواتم، أو الآثار غير متأثرة.\n\nهذه الحلية تكلف كمية أكبر من الطاقة لترقيتها.
items.trinkets.parchmentscrap.stats_desc=عند مستواها الحالي هذه الحلية ستجعل المسحورات والرموز _%dx_ أكثر شيوعا، واللعنات على الأسلحة والدروع _%sx_ أكثر شيوعا. اللعنات على العصي، أو الخواتم، أو الآثار غير متأثرة.\n\nهذه الحلية تكلف كمية أكبر من الطاقة لترقيتها.
items.trinkets.petrifiedseed.name=بذرة متحجرة
items.trinkets.petrifiedseed.desc=هذه البذرة تم تحجيرها، إما بعمليات جيولوجية بطيئة أو بالسحر. البذرة يبدو أنها تؤثر سحريا في نباتات السراديب، تستبدل أحيانا بذور النباتات بأحجار رونية.
items.trinkets.petrifiedseed.typical_stats_desc=عادة هذه الحلية ستجعل العشب المداس يسقط أحجارا رونية بدل البذور _%1$s%%_ من الوقت، وستجعل أيضا العشب العالي يسقط أغراضا _%2$s%%_ أكثر في أغلب الأحيان.
items.trinkets.petrifiedseed.stats_desc=عند مستواها الحالي هذه الحلية ستجعل العشب المداس يسقط أحجارا رونية بدل البذور _%1$s%%_ من الوقت، وستجعل أيضا العشب العالي يسقط أغراضا _%2$s%%_ أكثر في أغلب الأحيان.
items.trinkets.ratskull.name=جمجمة جرذ
items.trinkets.ratskull.desc=هذه الحلية المروعة ليست أكبر بكثير من جمجمة جرذ عادي، وهي بطريقة ما ندرة هنا في هذه السراديب. تأثير الجمجمة السحري يبدو أنه يجذب سكان السراديب الأكثر ندرة، يجعلهم يظهرون أكثر بكثير.
items.trinkets.ratskull.typical_stats_desc=عادة هذه الحلية ستجعل الأعداء الغريبين النادرين _%dx_ أكثر احتمالا للظهور. الجمجمة نصف فعاليتها فقط في جذب الميميكات البلورية والتماثيل المدرعة، مع ذلك.
items.trinkets.ratskull.stats_desc=عند مستواها الحالي هذه الحلية ستجعل الأعداء الغريبين النادرين _%dx_ أكثر احتمالا للظهور. الجمجمة نصف فعاليتها فقط في جذب الميميكات البلورية والتماثيل المدرعة، مع ذلك.
items.trinkets.saltcube.name=مكعب ملح
items.trinkets.saltcube.desc=بلورة الملح الكبيرة هذه قُطعت إلى شكل مكعب شبه مثالي، وبطريقة ما تمكنت من سحب نصف الماء من قدر الكيمياء بدل أن تذوب. يبدو أنها تجفف سحريا وتحفظ الطعام الذي تأكله، تمدد الإشباع الذي تحصل عليه، لكنها تخفّض أيضا استعادة صحتك عندما لا تكون جائعا.
items.trinkets.saltcube.typical_stats_desc=عادة هذه الحلية ستزيد مقدار الوقت قبل أن تجوع بمقدار _%1$s%%_، لكنها ستخفّض أيضا معدل تجدد صحتك بمقدار _%2$s%%_ ما لم يكن الطابق مقفلا.
items.trinkets.saltcube.stats_desc=عند مستواها الحالي هذه الحلية ستزيد مقدار الوقت قبل أن تجوع بمقدار _%1$s%%_، لكنها ستخفّض أيضا معدل تجدد صحتك بمقدار _%2$s%%_ ما لم يكن الطابق مقفلا.
items.trinkets.shardofoblivion.name=شظية النسيان
items.trinkets.shardofoblivion.desc=بعد الغليان في قدر الكيمياء، هذه الشظية الصغيرة من المعدن الملعون تغيرت لتصبح مصنوعة من... لا شيء؟ الضوء يبدو أنه ينحني حولها، وتطفو في مكانها عندما لا تمسكها. الشظية يبدو أنها تسحب سحريا القوة من جهلك، لذا من الأفضل ربما ألا تفكر فيها كثيرا.
items.trinkets.shardofoblivion.typical_stats_desc=عادة هذه الحلية ستزيد معدل إسقاط الأعداء للغنائم بمقدار 20%% لكل قطعة معدات غير معرّفة جهّزتها أو استعملتها مؤخرا، حتى حد أقصى _%d غرض(أغراض)_. الشظية ستمنعك أيضا من تعريف المعدات، لكن يمكن استعمالها لتعريف الأغراض الجاهزة لذلك يدويًا.
items.trinkets.shardofoblivion.stats_desc=عند مستواها الحالي هذه الحلية ستزيد معدل إسقاط الأعداء للغنائم بمقدار 20%% لكل قطعة معدات غير معرّفة جهّزتها أو استعملتها مؤخرا، حتى حد أقصى _%d غرض(أغراض)_. الشظية ستمنعك أيضا من تعريف المعدات، لكن يمكن استعمالها لتعريف الأغراض الجاهزة لذلك يدويًا.
items.trinkets.shardofoblivion.ac_identify=عرّف
items.trinkets.shardofoblivion.identify_prompt=عرّف غرضا
items.trinkets.shardofoblivion.identify_ready=غرض جاهز للتعريف: %s. استعمل شظية النسيان عليه لتعريفه.
items.trinkets.shardofoblivion.identify_ready_worn=أغراضك الملبوسة الآن كلها جاهزة للتعريف. استعمل شظية النسيان على الأغراض لتعريفها.
items.trinkets.shardofoblivion.identify_not_yet=ذلك الغرض ليس جاهزا للتعريف بعد.
items.trinkets.shardofoblivion.identify=لقد عرّفت الغرض!
items.trinkets.shardofoblivion$wandusetracker.name=عصا غير معرّفة استُعملت
items.trinkets.shardofoblivion$wandusetracker.desc=لقد استعملت مؤخرا عصا غير معرّفة، وهي تحتسب كقطعة واحدة من المعدات غير المعرّفة المستعملة لشظية النسيان لفترة قصيرة.\n\nالأدوار المتبقية: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=سلاح مرماي غير معرّف استُعمل
items.trinkets.shardofoblivion$thrownusetracker.desc=لقد استعملت مؤخرا سلاحا مرميا غير معرّف، وهو يحتسب كقطعة واحدة من المعدات غير المعرّفة المستعملة لشظية النسيان لفترة قصيرة.\n\nالأدوار المتبقية: %s.
items.trinkets.thirteenleafclover.name=برسيم ثلاث عشرة ورقة
items.trinkets.thirteenleafclover.desc=بطريقة ما الغليان في قدر الكيمياء جعل هذا البرسيم ينمو عنقودا من الأوراق الإضافية! ليس واضحا حقا ما إذا كانت هذه الحلية محظوظة أو منحوسة، ربما هذه الحلية ستجعل حظك أكثر فوضوية؟
items.trinkets.thirteenleafclover.typical_stats_desc=عادة هذه الحلية ستجعلك تسبب ضررا أقصى _%1$d%%_ من الوقت، وضررا أدنى _%2$d%%_ من الوقت.
items.trinkets.thirteenleafclover.stats_desc=عند مستواها الحالي هذه الحلية ستجعلك تسبب ضررا أقصى _%1$d%%_ من الوقت، وضررا أدنى _%2$d%%_ من الوقت.
items.trinkets.trapmechanism.name=آلية فخ
items.trinkets.trapmechanism.desc=الآلية الأساسية لإحدى فخاخ الجحور في السراديب، نُحتت بعناية من الأرضية حتى يمكن حملها. يبدو أنها مرتبطة سحريا بالسراديب نفسها، تجعل التضاريس الخطرة أكثر شيوعا لكنها تزيد أيضا ميلك نحوها.
items.trinkets.trapmechanism.typical_stats_desc=عادة هذه الحلية ستجعل _%1$d%%_ من الطوابق غير ذات الموضوع تصبح مملوءة إما بالفخاخ أو الهاويات بدل ذلك. بالإضافة إلى ذلك، _%2$d%%_ من فخاخ السراديب المخبأة ستكون بدل ذلك مرئية.
items.trinkets.trapmechanism.stats_desc=عند مستواها الحالي هذه الحلية ستجعل _%1$d%%_ من الطوابق غير ذات الموضوع تصبح مملوءة إما بالفخاخ أو الهاويات بدل ذلك. بالإضافة إلى ذلك، _%2$d%%_ من فخاخ السراديب المخبأة ستكون بدل ذلك مرئية.
items.trinkets.vialofblood.name=قارورة دم
items.trinkets.vialofblood.desc=هذه القارورة الرفيعة تحتوي على دم أحد سكان السراديب، يتحرك ببطء بينما تدوّر القارورة. يبدو أنها تعزز سحريا آثار الشفاء الأقوى، لكنها تؤخرها أيضا.
items.trinkets.vialofblood.typical_stats_desc=عادة هذه الحلية ستزيد الصحة الإجمالية التي تكسبها من شرب جرعات الشفاء، أو قِرَب الماء، أو آبار الصحة بمقدار _%1$s%%_. مع ذلك، هذه آثار الشفاء ستحدث أيضا ببطء أكثر، تجدد كحد أقصى _%2$s_ نقطة صحة في الدور (وهذا يتدرج مع مستوى البطل).
items.trinkets.vialofblood.stats_desc=عند مستواها الحالي هذه الحلية ستزيد الصحة الإجمالية التي تكسبها من شرب جرعات الشفاء، أو قِرَب الماء، أو آبار الصحة بمقدار _%1$s%%_. مع ذلك، هذه آثار الشفاء ستحدث أيضا ببطء أكثر، تجدد كحد أقصى _%2$s_ نقطة صحة في الدور (وهذا يتدرج مع مستوى البطل).
items.trinkets.wondrousresin.name=راتنج عجيب
items.trinkets.wondrousresin.desc=هذا الراتنج الأزرق اللامع يبدو أن عنده جوهر سحر عصا ملعونة مقطر. سحر قدر الكيمياء يبدو أنه ثبّته إلى حد ما، وهو الآن يؤثر في عصيك.
items.trinkets.wondrousresin.typical_stats_desc=عادة هذه الحلية ستجبر آثار العصا الملعونة لتصبح محايدة أو إيجابية _%1$s%%_ من الوقت، وستجعل العصي غير الملعونة تطلق صعقة ملعونة محايدة أو إيجابية إضافية _%2$s%%_ من الوقت.\n\nهذه الحلية تكلف كمية أكبر من الطاقة لترقيتها.
items.trinkets.wondrousresin.stats_desc=عند مستواها الحالي هذه الحلية ستجبر آثار العصا الملعونة لتصبح محايدة أو إيجابية _%1$s%%_ من الوقت، وستجعل العصي غير الملعونة تطلق صعقة ملعونة محايدة أو إيجابية إضافية _%2$s%%_ من الوقت.\n\nهذه الحلية تكلف كمية أكبر من الطاقة لترقيتها.
items.trinkets.trinketcatalyst.name=محفز سحري
items.trinkets.trinketcatalyst.window_title=اصنع حلية
items.trinkets.trinketcatalyst.window_text=الماء يبدأ بالتوهج بينما تضيف المحفز. هناك بضعة أغراض قريبة يمكن أن تشبعها بالطاقة لتحويلها إلى حلية سحرية.
items.trinkets.trinketcatalyst.desc=هذه الكرة من الغبار الذهبي السحري تلمع في ظلام السراديب. هذا المحفز يمكن استعماله في قدر كيمياء مع قليل من الطاقة الكيميائية لإنتاج غرض حلية فريد.\n\nالحلي توفر آثارا مختلفة متنوعة تغيّر قليلا السراديب أو سكانها. الحلي يمكن ترقيتها بمزيد من الطاقة لجعل أثرها أكثر قوة، أو إسقاطها للتخلي عن الأثر تمامًا.
items.trinkets.trinketcatalyst$randomtrinket.name=حلية عشوائية
items.trinkets.trinketcatalyst$randomtrinket.desc=غرض قريب عالق داخل كيس لا تستطيع فتحه.\n\nعملية الكيمياء ستذيب الكيس بعيدا، لكنك لن تعرف أي حلية ستحصل حتى تفعلها!
items.trinkets.trinket.discover_hint=هذا الغرض عنده فرصة أن يكون خيارا كلما صنعت حلية عبر الكيمياء.
items.trinkets.trinket$placeholder.name=حلية
