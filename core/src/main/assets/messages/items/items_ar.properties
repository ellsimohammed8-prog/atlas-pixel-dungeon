items.weapon.missiles.darts.adrenalinedart.desc=هذه الأسهم مروّسة بمركب أساسه عشبة خاطفة سيعزز سرعة الحركة والهجوم للحلفاء، أو يخفّض وجيزة سرعة حركة الأعداء. السهم نفسه ما زال ضارا للأعداء، لكنه لن يضر الحلفاء.
items.weapon.missiles.darts.blindingdart.name=سهم معمٍ
items.weapon.missiles.darts.blindingdart.desc=هذه الأسهم مروّسة بمركب أساسه عشبة العمى سيعمي هدفهم لفترة قصيرة. لا يربكون مع ذلك، لذا العدو سيعرف ما زال حيث رآك آخر مرة.
items.weapon.missiles.darts.chillingdart.name=سهم مبرد
items.weapon.missiles.darts.chillingdart.desc=هذه الأسهم مروّسة بمركب أساسه جليدية سيبرّد بشكل كبير هدفهم.
items.weapon.missiles.darts.cleansingdart.name=سهم تطهير
items.weapon.missiles.darts.cleansingdart.desc=هذه الأسهم مروّسة بمركب أساسه ملك الحكيم سيجعل الحلفاء محصنين مؤقتا ضد كل الآثار السلبية، أو سيطهّر الآثار الإيجابية من الأعداء. الأعداء قد ينسون حتى وجيزة أنهم يهاجمون أو يهربون منك. السهم نفسه ما زال ضارا للأعداء، لكنه لن يضر الحلفاء.
items.weapon.missiles.darts.dart.name=سهم
items.weapon.missiles.darts.dart.ac_tip=روّس
items.weapon.missiles.darts.dart.prompt=اختر بذرة
items.weapon.missiles.darts.dart.tip_title=روّس الأسهم
items.weapon.missiles.darts.dart.tip_desc=بذرة يمكن دمجها مع سهم أو سهمين لترويسمها. كل نوع بذرة ينتج نوعه الخاص من الأسهم المروّسة، بأثر فريد لاستعمال واحد.\n\nترويس سهم بهذه البذور سينتج _%s._
items.weapon.missiles.darts.dart.tip_all=روّس %1$d أسهم بـ%2$d بذور
items.weapon.missiles.darts.dart.tip_two=روّس سهمين ببذرة واحدة
items.weapon.missiles.darts.dart.tip_one=روّس سهما واحدا ببذرة واحدة
items.weapon.missiles.darts.dart.tip_cancel=ألغِ
items.weapon.missiles.darts.dart.desc=هذه الأعمدة البسيطة من الخشب ذو الرأس الشوكي موزونة للطيران باستقامة ولسع فريستها بنفخة من المعصم. يمكن ترويسمها ببذور لكسب آثار إضافية عند الرمي.
items.weapon.missiles.darts.dart.unlimited_uses=بسبب بنائهم البسيط الأسهم ستدوم بفعالية للأبد.
items.weapon.missiles.darts.displacingdart.name=سهم مزحزح
items.weapon.missiles.darts.displacingdart.desc=هذه الأسهم مروّسة بمركب أساسه ورقة الخفوت ستنقل آنيا هدفهم مسافة قصيرة بعيدا.
items.weapon.missiles.darts.healingdart.name=سهم شفاء
items.weapon.missiles.darts.healingdart.desc=هذه الأسهم مروّسة بمركب أساسه عشب الشمس يمنح دفعة شفاء لهدفهم. السهم نفسه ما زال ضارا للأعداء، لكنه لن يضر الحلفاء.
items.weapon.missiles.darts.holydart.name=سهم مقدس
items.weapon.missiles.darts.holydart.desc=هذه الأسهم مروّسة بمركب أساسه زهرة النجوم يشبع طاقة مقدسة في هدفهم. الحلفاء والأعداء العاديون سيصبحون مباركين، لكن الأعداء الأموات الأحياء أو الشيطانيون سيأخذون ضررا ثقيلا. السهم نفسه ما زال ضارا للأعداء، لكنه لن يضر الحلفاء.
items.weapon.missiles.darts.incendiarydart.name=سهم حارق
items.weapon.missiles.darts.incendiarydart.desc=هذه الأسهم مروّسة بمركب أساسه زهرة النار ستنفجر بنيران باهرة عند الاصطدام.
items.weapon.missiles.darts.paralyticdart.name=سهم شللي
items.weapon.missiles.darts.paralyticdart.desc=هذه الأسهم مروّسة بمركب أساسه جذر التراب سيشلّ هدفهم لفترة قصيرة.
items.weapon.missiles.darts.poisondart.name=سهم سام
items.weapon.missiles.darts.poisondart.desc=هذه الأسهم مروّسة بمركب أساسه طحلب الحزن سيسمّم هدفهم.
items.weapon.missiles.darts.rotdart.name=سهم تعفّن
items.weapon.missiles.darts.rotdart.desc=هذه الأسهم الشريرة مروّسة بمركب حمضي أساسه توت التعفن، سيأكل بقوة عبر أي شيء يتصل به السهم. الأعداء الأقوياء سيقاومون أغلب الأثر، لكن التآكل قوي بما يكفي لقتل أغلب الأعداء العاديين بسهولة. هذه تدوم أطول من الأسهم المروّسة الأخرى، لكن متانتها لا يمكن تعزيزها.
items.weapon.missiles.darts.rotdart.discover_hint=تستطيع إنشاء هذا الغرض باستعمال بذرة من مهمة معينة.
items.weapon.missiles.darts.shockingdart.name=سهم صاعق
items.weapon.missiles.darts.shockingdart.desc=هذه الأسهم مروّسة بمركب أساسه كرمة العاصفة ستوصل صدمة موجعة لهدفهم.
items.weapon.missiles.darts.tippeddart.ac_clean=نظّف
